- id: L-536
  learning: "A line that PRINTS a direction is a decision site, even though it only prints. T-2713 replaced sort -V with git ancestry at three sites that ACT on a version relation, and its guard test scans for the old comparator — but fw upgrade's header never compared at all (an equality test with a directional label on its else-branch), so it had no old comparator to find and was never classified as a site. It rendered 'behind' for every mismatch, including ones the guard was refusing, and reached the operator first and louder than the guard. When replacing an untrustworthy comparison, enumerate the sites that REPORT the answer, not only those that branch on it."
