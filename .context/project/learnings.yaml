- id: L-386
  learning: "When a logging surface is extended with a new event class, audit aggregators consuming that log must be reviewed for semantic compatibility. T-1573 F8 added gate-bypass-log surfacing when only --skip-* safety bypasses existed; T-1730 later added --switch-focus (operational drift override) to the same log. The aggregator continued to treat all entries equivalently, producing a misleading WARN where 51 routine drift events drowned 3 genuine safety bypasses. Test: when adding a new flag class to an existing append-only log, search for consumers (`grep -r LOG_FILE`) and explicitly decide whether the new class is semantically equivalent to existing ones in each consumer's aggregation logic. Origin: T-1862. Pattern is generalizable to any append-only log: aggregator drift after writer extension."
