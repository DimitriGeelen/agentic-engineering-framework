- id: L-558
  learning: "Identity keys must not be carried by a property the system itself moves. 832 keyed a baseline on task-file relpath; work-completed moves files active/ -> completed/, so completing a grandfathered task made its carrier look brand new and the guard fired at the exact tasks waiting on the ruling it exists to enable. Their generalisable finding, which we have not applied either: all ten of their teeth legs mutated file CONTENT and none MOVED a file — thorough on the axis they were thinking about, blind to the operation the framework performs on every object it owns. We have the identical active/->completed/ move in three places and have never put a lifecycle move in a test harness. Same root shape as the exporter work: attribution carried by a mutable position."
