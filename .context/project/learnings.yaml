- id: L-516
  learning: "Validate a detection model BEFORE building the rule on it — the more precise model is not automatically the correct one. T-2684: band-reconstruction (cumulative lane heights) named the exact offending nodes, versus a coarser origin-free span-ordering check. Cross-checking both across 11 live maps showed the band model needs a band origin the map does not store; anchoring it at the topmost node produced 7 phantom mismatches on a map that is clean. Shipped the coarser sound check. Generalisable: when a candidate check requires a value the artifact does not carry, any default you pick is a guess, and a rule that reports precise-but-wrong is worse than one reporting a coarser truth — precise-and-wrong is exactly what gets past reviewers."
