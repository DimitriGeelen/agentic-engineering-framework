- id: L-518
  learning: "When a peer project reports a defect class in THEIR code, sweep OUR equivalent surface instead of assuming immunity. 832's T-311 reported that preserving doc comments put prose into exported bytes and broke two of their harnesses by counting element names quoted inside doc blocks, with false-GREEN as the dangerous half. Sweeping our side found BPMN checks immune (they parse structure, never regex document text) but 2 of 4 conformance vocabulary rails exposed one layer over — they regex our own SOURCE with no comment stripping, and comment-only injection admits phantom enum tokens ('maybe' into inception-flow, '3' into audit-cron). The separating property is regex shape: rails anchored on structural literals are prose-immune, rails matching loose word patterns are not. OBS-103. A peer's bug report is a free test case for your own analogous surface — the class travels even when the code does not."
