- id: L-564
  learning: "A fixture-only test suite can only catch bugs someone already imagined. T-2898's first fix passed all 7 fixture legs and was still wrong; the generative leg — enumerating the config lists at run time and probing each entry alone — is what failed it and exposed the more general form (a noun hiding inside a SECOND qualifier occurrence). When the logic is driven by a list, the test must enumerate the list, not sample it."
