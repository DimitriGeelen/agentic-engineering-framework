- id: L-002
  learning: "YAML safe_load parses date-like strings as datetime.date, not datetime.datetime. When doing datetime arithmetic, always coerce date to datetime via datetime.combine(d, time.min, tzinfo=utc) before subtraction. This pattern recurs anywhere YAML frontmatter dates are used with datetime.datetime.now()."
