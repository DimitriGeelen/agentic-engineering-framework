  learning: "Two templates rendering the 'same' panel (cockpit.html primary dashboard vs index.html fallback) silently diverged on data sourcing, producing grep-invisible render bugs: T-2021 (traceability rendered as raw dict — scan shape changed under a scalar-era template) and T-2022 (Knowledge always 0L/0P/0D — cockpit read health.knowledge, a key fw scan never writes, while index.html sourced the real helpers). Both passed element-presence greps (the <span>s render — just with wrong/zero data); only eyes-on caught them. Fix: when two templates render the same conceptual panel, source from shared helpers and pin the RENDERED values in a unit test (assert the percentage/non-zero count, not the element). Element-presence checks are forbidden as the sole UI check (T-1575) precisely for this class."
