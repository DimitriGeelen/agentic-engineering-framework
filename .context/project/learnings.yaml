- id: L-613
  learning: "Verification-block commands run under pipefail, so a pipeline is only safe when the producer's exit code is meaningless. Two shapes bit in one session: (1) 'bin/fw doctor | grep -q X' exits 141 — grep -q closes the pipe on first match and SIGPIPEs the producer, so it fails precisely when the check SUCCEEDS early (T-3045 A5); (2) 'bin/fw write-set check A B --json | python3 -c ...' exits 2 because the producer exits 2 on purpose (undecidable) and pipefail propagates it even though the parse printed ok (T-3039). Both look correct when run by hand in an interactive shell without pipefail, which is why they reach the gate rather than being caught while writing. Rule: in ## Verification, capture then parse — out=$(cmd 2>&1 || true); printf '%s' \"$out\" | parser — the same shape CLAUDE.md already prescribes for the cron drift check. Use a bare pipeline only when the producer cannot exit non-zero for a reason you care about."
  source: P-011
  task: T-3039
  date: 2026-08-16
  context: Added via context agent
- id: L-614
  learning: "AN INCEPTION'S CENSUS IS A SNAPSHOT, AND THE BUILD SLICE INHERITS IT AS FACT. T-3044 counted 35,125 messages / 16 msg_types; re-measuring at build time (T-3046, same archive, 4 hours later) found 47,879 / 79 — 27% and 5x off, and the origin-case bug report was under a type name the census never listed. Nothing was wrong with the census when written; archives grow. The failure is that the build slice's coverage check was originally specified against the census's declared list, which you can satisfy by editing a constant. Fix: coverage assertions must replay the live source (assert_table_complete() reads the archive), never a hand-copied list. Re-measure any inception number you are about to write an AC against."
  source: P-001
  task: T-3046
  date: 2026-08-16
  context: Added via context agent
- id: L-615
  learning: "When a bug report names one instance of a code shape, grep the shape across the file before fixing — the sibling occurrence may be the same code asking the OPPOSITE question, and therefore failing in the opposite direction. T-3053: 'grep -oE T-[0-9]+ | head -1' was a false FAIL at the commit-traceability site (any ref resolving should suffice) and a false GREEN at the practice-origin site (every ref must resolve). Fixing only the reported one would have left the more dangerous half in place, under a reassuring PASS line."
  source: P-001
