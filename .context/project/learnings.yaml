- id: L-517
  learning: "Closed-interval containment silently admits boundary cases: a geometric check written as 'lo <= y <= hi' lets a point on a shared boundary satisfy BOTH adjacent regions, so it passes the exact defect a stricter ordering check catches. T-2687 found this in the band-feasibility check — aef-session-lifecycle's only 'feasible' origin put the band boundary exactly on y=100 where all three contested nodes sat. The claim 'this check is strictly stronger' had already been written into T-2686's Decisions and sent to a peer project before measurement falsified it. Rule: when a region-containment check spans adjacent regions that share a boundary, half-open ([lo, hi)) is almost always the correct semantics because it matches what a reader sees; and never claim one check subsumes another without running BOTH over the whole corpus."
