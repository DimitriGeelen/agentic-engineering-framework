  learning: "When adding a new state classification that propagates across N UI surfaces (T-1576/T-1577/T-1578 NO-REC distinction across review-queue / handover / approvals / cockpit / review pages): each surface keeps its own decision (verdict-driven badge color vs state-driven banner) but draws from a shared parser (extract_recommendation/extract_recommendation_state). Wire the helper into shared/, expose state alongside verdict, then update each surface in a separate task — visual continuity (same cyan #0e7490) ties them together. Multi-surface arcs benefit from one task per surface (T-1576/77/78) rather than one omnibus task: each surface has its own gate, its own evidence, its own visual verification (Playwright per L-310)."
