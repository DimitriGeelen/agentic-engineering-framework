  date: 2026-08-12
  context: Added via context agent
- id: L-588
  learning: "A gate's remediation text is part of its predicate. G-020 counted AC checkboxes without stripping HTML comments while the G-067 gate 56 lines up in the same file did strip them, so the shipped template's two commented REVIEW/REVIEWER examples counted as real ACs, and following the block message's own instruction (delete the placeholders) left a build task with ZERO acceptance criteria cleared to write source. When adding or auditing a counting gate, count the SHIPPED TEMPLATE, not a task: the template is the input every new task starts from and the one input nobody tests. Corollary: comment-stripping is correct when the span is discarded (counting prose) and a defect when the span is executed (P-011 handing lines to eval, T-2921) — same regex, opposite correctness."
  source: P-001
  task: T-2944
  date: 2026-08-12
  context: Added via context agent
- id: L-589
  learning: "A structural proxy plus an inference is not a measurement, and the inference is where it breaks. T-2943 counted 71 build tasks lacking a ## Recommendation heading (sound) and concluded all 70 refuse fw task review (wrong by 14x — the gate only fires on the partial-complete transition). The number went to a peer before the method did. 832 made the identical error in the same window, inside the instrument built to quantify the defect, and a third predicate of mine produced a third number. Rule: when the question is 'what does the gate do', run the gate; if that is too slow, copy its predicate VERBATIM and falsify the copy against the real command on a sample including every predicted positive. My 17-task falsification found one disagreement that turned out to be a different gate firing first — which I would not have known from the copy alone."
  source: P-011
  task: T-2947
  date: 2026-08-12
  context: Added via context agent
- id: L-590
  learning: "Comment-stripping is direction-dependent, and 'immune' is not the same as 'correct'. lib/review.sh's Human-AC counter skipped commented example ACs because its globs are column-0-anchored and the template's examples happen to be indented 7 spaces — correct answer, unrelated reason, and de-indenting them (pure formatting) would have made every fresh build task read as partial-complete 0/2. Strip where the span is DISCARDED as prose (G-067, G-020/T-2944, T-2948); never where it is handed to eval (T-2921/P-011). When a guard is right, ask WHY it is right — if the answer is a property nothing records as load-bearing, that is a landmine, not a pass."
  source: P-011
  task: T-2948
  date: 2026-08-12
  context: Added via context agent
- id: L-591
  learning: "A gate that silently shrinks its own input population is more dangerous than one that errors on it. P-011's comment-stripper corrupted commands carrying HTML comment delimiters as argument text (loud, noticed, reported as T-2921) and ALSO deleted every command between a mid-line opener and the next closer below it (quiet, never noticed). Measured: a 3-command block whose middle member was a failing assertion reported 'Running 2 verification command(s) / 2/2 passed' and closed clean. When a checker reports N/N over a population it computed itself, that count is an assertion too — test it, not just the verdict. Sibling to the port-3000 false-green class (371 instances) and to 832's G-034 (verdict over an empty population)."
  source: P-011
  task: T-2921
  date: 2026-08-12
  context: Added via context agent
- id: L-592
  learning: "When the SUBJECT of a claim is an instrument, the claim must be produced by running that instrument — never by reasoning about it from a neighbouring tool. Nearly shipped a register entry asserting an agent-side grep divergence would not reproduce here 'because the files are tracked', derived from git ls-files + git check-ignore. It reproduced: ugrep applies ignore PATTERNS with no knowledge of git's index, so tracked-but-pattern-matched files are invisible agent-side while check-ignore reports them safe — and the effective ignore set depends on the SEARCH ROOT, so the same file flips visibility on cd. git check-ignore answers 'does git ignore this', not 'does an in-scope ignore pattern match this', and answers reassuringly for exactly the at-risk files."
  source: G-019
  task: T-2951
  date: 2026-08-12
  context: Added via context agent
- id: L-593
  learning: "Fix-one-of-N is the likelier failure mode on a duplicated rule, precisely because it feels finished. T-2948 made review.sh's Human-AC counter comment-aware — one of FOUR sites reading the same section — producing a green suite, a clean commit, and a lesson confidently sent to a peer. The unfixed sibling (check-human-ac-tick) was then handed back by that peer as their OBS-037. A blanket replace at least announces itself in the diff; fixing one site is invisible. Remedy: when fixing a rule that could be duplicated, run the census FIRST and attach it to the task, so the register shows N sites even when you only fix one (one bug, one task)."
  source: P-001
  task: T-2954
  date: 2026-08-12
  context: Added via context agent
- id: L-594
  learning: "A defect encoded in a PASSING test cannot be found by scanning — the suite defends it. check-human-ac-tick's direction symmetry survived because human_ac_tick_guard.bats leg 2 asserted 'unticks also block' as intended behaviour. The bug was not unnoticed; it was ratified. When a gate's enforcement direction is asymmetric in policy (only the human may TICK), check that the test names the direction rather than 'any toggle'."
  source: P-001
  task: T-2954
  date: 2026-08-12
  context: Added via context agent
- id: L-595
  learning: "Recursive-verification-leg self-contamination is fixed by scoping to the population's artefact type, NOT by an exclusion list. A denylist acquires a new entry every time you write about the subject, and each is discovered only after it has skewed a published number — measured 3 carriers in one class across 3 rounds: .git/ (the commit message), docs/reports/ (the report), .tasks/ (the leg's own text quoting the string it greps for). Scoping the leg to *.bpmn (what the corpus is made of) is invariant under writing about it."
  source: P-011
  task: T-2957
  date: 2026-08-12
  context: Added via context agent
- id: L-596
  learning: "Published a count that conflated the population with prose quoting it (25 'corpus maps' = 23 .bpmn maps + 2 .md files that mention the string), one section after correcting a peer for the identical phantom-vs-fabrication conflation. The discipline was applied to the number challenged, not to the number volunteered — an unchallenged figure in your own report gets no denominator scrutiny unless you give it some deliberately."
  source: P-011
  task: T-2957
  date: 2026-08-12
  context: Added via context agent
- id: L-597
  learning: "A gate that names a remedy in its block message must be tested for that remedy's REACHABILITY in the shape agents actually type — not merely for the rule the gate enforces. T-2987: check-active-task blocked on stale focus and said 'run fw work-on T-XXX'; the bootstrap exemption honours that, but is guarded by has_bash_write_pattern, which classifies the WHOLE command line while the exemption covers ONE command in it. So redirecting the recommended command's own output voided the exemption and returned a byte-identical message, with nothing indicating the shape was the cause — an infinite retype loop for the agent. The behaviour was already known and pinned: test_check_active_task_bootstrap.bats case 9 is literally named 'write-pattern wins: bootstrap command with a redirect falls through to block', and passed throughout. Coverage of the RULE was mistaken for coverage of the INTERACTION. Test shape: assert both directions — the blocked form stays blocked (permissions unchanged) AND the message explains why the advertised remedy did not apply. Sibling to L-399/T-1890 (bypass-contract parity: advertised contract fails at the real call site) and L-547/T-2834 (fast-path exemption must classify the whole command)."
  source: P-002
  task: T-2987
  date: 2026-08-14
  context: Added via context agent
- id: L-598
  learning: "Positional token readers in command classifiers lose to an open-ended set of prefixes, and each loss is found in production by a blocked agent. Third incident of one class in agents/context/lib/safe-commands.sh, whose _fw_single_command_is_safe reads awk-$1 for the base command and awk-$2 for the sub-verb: T-1908 taught it about env-var prefixes (FW_X=1 fw ...), T-2834/L-547 taught it that a compound command is not its first token, T-2988 taught it about shell grouping punctuation ((fw doctor), { fw doctor; }, (bin/fw doctor) where the CLOSING paren fuses to the sub-verb). Structural tell for why it hid: sed 's|.*/||' in the base extraction eats a leading paren as a side effect whenever a path follows it, so bin/fw ... classified correctly by accident inside the framework repo while bare fw ... from a consumer shim did not — the defect was least visible from the repo where it would have been caught, and 129 assertions across 7 suites stayed green. When fixing this class, test the GROUPED/PREFIXED form of an already-covered safe command, and always pair it with negative controls proving the strip cannot launder an unsafe command (write patterns must keep being judged against the ORIGINAL unstripped line). Bash gotcha found while fixing it: never write ${cmd%[)};]} — a } inside a bracket expression closes the parameter expansion early and APPENDS the remainder to the value, growing the string every pass and hanging any convergence loop. Use case arms, which need no escaping and can only shrink."
  source: P-002
  task: T-2988
  date: 2026-08-14
  context: Added via context agent
- id: L-599
  learning: "Do not pin a rule's test to a LIVE defect — the test then fails the moment someone fixes the defect, which punishes the repair and looks like the fixer broke something. T-2989 found two corpus tests red from T-2984 earlier the same day: test_live_corpus_current_findings (a baseline pin listing the exact standing findings, not re-derived after the corpus changed) and test_fires_on_the_live_session_lifecycle_spill (asserted the live map HAS a 6px lane spill — the very spill T-2984 repaired). The second is the instructive one: the property being asserted is about the RULE (per-type occupancy correctly catches a 6px gateway-driven spill that a height-only table would miss), not about the corpus, so it belongs on a fixture. Fixed by reproducing the pre-repair geometry as a synthetic map plus a SEPARATE live assertion that the real map is now clean — fixture proves the rule works, live test proves the corpus is clean, and neither breaks when the other changes. Second half of the lesson: a baseline pin that enumerates current findings must be re-derived in the SAME task that changes the thing it counts. The census docstring in test_corpus_lint.py already warned about this exact lapse citing a prior occurrence at a25497afe, and it recurred anyway — so prefer pinning the CLEAN state (assert findings == []) over enumerating known-bad entries: an empty pin turns every future finding into a signal and cannot go stale."
  source: P-011
  task: T-2989
  date: 2026-08-14
  context: Added via context agent
- id: L-600
  learning: "A gate that EXECUTES text from a task file is an execution surface, and must validate the text is a command before running it. P-011 evals each line of ## Verification; nothing checked parseability first, so a multi-line 'python3 -c' block had its PYTHON BODY eval'd as bash — and 'import yaml,sys' is a valid bash line that runs ImageMagick's screenshot tool, writing multi-MB PostScript into the repo root (cwd=PROJECT_ROOT). 56MB across four incidents over three months (T-2990/T-2991). Two properties made it survive: (1) the gate's FAIL output is indistinguishable from an ordinary broken verification command, so the agent repairs the block within minutes and the offending state never persists — 0 of 2118 stored blocks are unparseable today, the evidence deletes itself; (2) the side effect is silent and lands where nothing watches. Generalise: wherever a framework component evals task-authored strings, ask what happens to the LINES THAT ARE NOT COMMANDS, and whether their side effects land anywhere anyone looks. Fix shape: bash -n preflight refusing the whole block, at every execution site in the same commit (L-399)."
  source: P-001
  task: T-2991
  date: 2026-08-14
  context: Added via context agent
- id: L-601
  learning: "In a document agents copy from, ORDER IS SEMANTICS: an appended correction corrects nothing for a reader who stops at the first labelled answer. The task template's SIGPIPE block accreted chronologically — L-387 labelled capture-then-grep 'Safe pattern', T-2743 later found it inverts above the 65536-byte pipe buffer and appended that 20 lines below the label it retracts. Every edit was individually correct; the block was collectively misleading. T-2996's repair copied the first form and P-011 refused it with rc=141. Prevention: pin ORDER and LABELLING in a lint (tests/lint/template-sigpipe-hint-ordering.bats), not content — appending stays legal, re-promoting the bounded form goes red. Generalises to any accreting doc block: when you append a correction, check whether the thing you corrected is still the first thing read."
  source: P-011
  task: T-3000
  date: 2026-08-14
  context: Added via context agent
- id: L-602
  learning: "Sending is verified; ARRIVAL AT A SHARED SURFACE is not. A session can post to a peer rail, record every send as successful, and reach nobody — while the peer records its own sends and no replies. Both ledgers stay clean, so the failure defeats a coordination directive while appearing to satisfy it. Origin T-3001: 832-workflow-designer reported 10 unanswered messages on dm:0e7ee6cad65137fc:6a646ce8b1bc6560, a topic this session's fingerprint is not a party to; their offsets 612-630 did not exist in our coordinate space (~11838). Before treating a channel as coordination, measure membership: 'termlink agent identity' for your fingerprint, 'agent info' for the topic's Senders list, 'agent dms' for which pair-topics you are actually in. All one command away; nothing asks for them. Registered OBS-248."
  source: P-002
  task: T-3001
  date: 2026-08-14
  context: Added via context agent
- id: L-603
  learning: "PUBLISH ENOUGH STATE THAT SOMEONE WITH NO STAKE IN YOUR CONCLUSION CAN CONTRADICT IT. Session 2026-08-14 with 832-workflow-designer: four defects found, four times the owner's own instruments read green, and every one was found by the OTHER party — my seed assertion (they caught it), their six-message misattribution (I caught it), my corpus gap measured wrong (they caught it), their DI-trailer sequencing question (answered only because I could read my own tree). 832's sharpening, adopted: the mechanism is not care or collaboration. Neither party re-reads its own output usefully; both re-read the other's adversarially by default, because the reader has no stake in the prior conclusion. So the transferable act is publishing checkable state — my identity card (fingerprint + pubkey), their corpus counts — neither of which was sent as an invitation to check. Corollary tells: a term chosen to match everything is a term whose matching behaviour you have stopped thinking about (fw corpus explain --search e, OBS-249); and 'pinned' means different things per gate — a one-shot completion gate goes stale silently, a re-running gate like CTL-013 goes red spuriously, and neither is pinned as the word implies."
  source: P-002
  task: T-3003
  date: 2026-08-14
  context: Added via context agent
- id: L-604
  learning: "A concurrency guarantee that lives in the caller is not a guarantee. T-3014's AC4 specified 'flock, as the other audit crons do' — so the protection was written into the cron line, which serialises cron against cron and nothing else. The first real run was destroyed by a non-cron actor within 25 minutes. When an AC names the mechanism (flock) rather than the property (two runs cannot corrupt each other), it licenses putting the mechanism where it does not hold. Write the property; let the implementation own it internally."
  source: P-001
  task: T-3014
