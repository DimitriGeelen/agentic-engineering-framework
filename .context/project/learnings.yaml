  learning: "When a PreToolUse hook introduces a bypass contract (e.g. 'append --flag' to override a block), the downstream consumers of every command pattern the hook gates must accept the flag as a silent no-op. Otherwise the hook recommendation produces 'Unknown option' from the consumer's parser, and agents work around via direct-invoke (a path the hook's regex doesn't match) — silently circumventing the gate with no audit trail. Worse: --flag mechanism fundamentally cannot cover patterns that route to external tools (e.g. 'git commit', which rejects unknown flags). For universal coverage, pair --flag with a FW_X=1 env-var prefix: flag covers fw commands whose parsers are under our control, env var covers everything else. End-to-end bats test must exercise the full path (hook allow → consumer accepts → log written) for each mechanism, on each gated pattern. Origin: T-1890 — focus-drift gate (T-1730) shipped flag contract on hook side only; update-task.sh + lib/{learning,pattern,decision}.sh + git all rejected --switch-focus until T-1890 fixed all four consumers and added env-var path."
