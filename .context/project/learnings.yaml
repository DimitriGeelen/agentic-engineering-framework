- id: L-418
  learning: "Observability tools that consume cron-fire evidence must respect crontab's LOCAL-time interpretation, not assume UTC. A constant named CRON_HOUR_UTC=5 paired with a UTC-based window check silently mis-classes every real cron row on non-UTC hosts as 'manual', producing structural blindness indistinguishable from 'feature broken'. Test rule: any tool whose output depends on TZ must have at least one regression test that pins a non-UTC TZ and asserts the direction of conversion."
