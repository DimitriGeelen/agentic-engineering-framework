- id: L-580
  learning: "A TEST FIXTURE THAT ESCAPES ITS SANDBOX PASSES ALL ITS LEGS WHILE DOING SO — twice in one session, both undetected by every assertion in the suite. (1) The T-2922 integration suite exported FRAMEWORK_ROOT without pinning PROJECT_ROOT; 'fw inception start' allocated from the REAL repo's sequence and filed a live T-2928 task into .tasks/active/. All 9 legs green. Found only because the leaked task later tripped an unrelated focus gate. (2) The T-2928 suite set PROJECT_ROOT and called the 'fw' wrapper — which resolves the project from the WORKING DIRECTORY and ignores that variable — so every write leg addressed this repo's live inbox. Nothing was corrupted, but ONLY because the target id was already dismissed there and the refusal path declined to write. That is luck, not containment. Two rules: (a) assert containment explicitly — count the artefacts in the real tree before and after, and refuse to run rather than proceed if the fixture leaked; a suite that pollutes the space it guards is worse than one that does not run; (b) know which layer honours your scoping variable. 'fw' resolves from cwd; the agent scripts it routes to (agents/observe/observe.sh) honour PROJECT_ROOT. Driving the inner script is both more contained and still the real producer, not a re-typed copy."
