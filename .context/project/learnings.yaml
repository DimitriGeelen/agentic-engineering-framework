  learning: "Cross-surface count divergence (CLI vs cockpit vs Watchtower /approvals) often resolves to two paired bugs: a parser bug producing noise, plus a compensating downstream filter that hides the noise. Removing only the parser bug exposes the filter; removing only the filter re-exposes the noise. Diagnostic pattern: when CLI and cockpit show different task counts, compute the symmetric difference (set in CLI not cockpit AND set in cockpit not CLI) — non-empty in both directions reveals two distinct bugs at once, not a single asymmetric error. Applies anywhere two parsers/scanners look at the same source: keep the canonical parser the single source of truth, never paper over with downstream filters."
