  context: Added via context agent
- id: L-616
  learning: "A broken mutant is indistinguishable from a detected mutation — both are red. Any mutation test needs a paired positive control asserting the mutant still PASSES a case the fix did not change. T-3053: a mutated audit.sh dropped in /tmp lost FRAMEWORK_ROOT (derived from dirname $0), ran with an empty TASKS_DIR and reported every ref unresolvable, so the mutation test passed for a reason unrelated to the mutation. Install mutants in a shadow root, and add the sanity test."
  source: P-001
