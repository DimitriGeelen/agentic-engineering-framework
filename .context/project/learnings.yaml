- id: L-523
  learning: "L-519 recurrence (5th and 6th instances, both self-inflicted in one task): a text-matching guard cannot tell a structure from prose describing that structure. The secret scan tripped on lib/url-credentials.sh's own doc comment illustrating the credential form, and the regression guard tripped on a bin/fw COMMENT naming the very call it bans. Correct repairs are (a) reword the prose, and (b) strip comment lines before matching — NOT allowlist the file, which is the repair that rebuilds the blind spot the guard exists to prevent. Any structural grep-guard over source should exclude comments, and should carry a negative control proving it goes red when the banned construct is actually reintroduced."
