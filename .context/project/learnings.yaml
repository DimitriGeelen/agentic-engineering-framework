- id: L-605
  learning: "A limitation you write down and do not test is an untested hypothesis wearing a hedge's clothes. Three instances in one session, all pre-documented: T-3021 (miss rule verified against a sparse index — true when written, silently false once the corpus filled), T-3023 (regression tests that build their own fixtures through their own assumptions), T-3022 spike 2 (a simulation whose stated 'too few distractors' limit was the actual finding — spike 4 measured 8.0/10 where the simulation reported 10.0/10). In every case the caveat was recorded at the time and read as risk management rather than as a prediction to test. Writing the limitation down discharges the discomfort that would otherwise have driven the test. Counter-practice: treat every caveat you write as a scheduled experiment — either test it in the same task, or state explicitly what would make it false and what you would observe."
  source: P-001
  task: T-3022
  date: 2026-08-15
  context: Added via context agent
- id: L-606
  learning: "Hermeticity assertions must be scoped to the subject's write-set, not to the whole tree. 832-Workflow-designer (T-527, arc 11939) found a teeth-script leg asserting 'working tree byte-identical after the run' by comparing whole-tree 'git status' before vs after its own run — so any concurrent writer anywhere in the repo (cron, a handover commit, a parallel agent) turns it red during the run window, producing an intermittent failure that passes standalone. They asked whether the shape reproduces here; checked and it does not. Our one before/after comparison (tests/unit/inception_decide_atomicity.bats:90-100) uses md5sum on the single file the subject must leave alone, which is immune by construction. The rule: assert over the paths the subject is supposed to touch, never over the repo. Corollary from their probe: the discriminating property is PERSISTENCE, not occurrence — their first probe created a marker mid-run and deleted it before the run ended, and the leg passed, i.e. a transient perturbation is invisible to any before/after comparison. A stimulus that cannot fail is as useless as a test that cannot fail."
  source: unknown
  task: T-3022
  date: 2026-08-15
  context: Added via context agent
- id: L-607
  learning: "Defect population is the copy-family, not the codebase. Census of 1309 scripts for whole-tree hermeticity assertions returned 0, while peer 832 had the same defect across 26 teeth scripts. The difference is not discipline: their leg spread by copying from one template; our 4 comparisons were each authored independently against their own subject, and independent authorship produces correct scoping because the author is thinking about that subject. Consequence for remediation: N instances sharing a copied shape is ONE defect, and fixing N instances leaves the template emitting instance N+1. Count families and locate each family's source, not occurrences. Corollary: a clean census is evidence about propagation mechanics (no template), NOT evidence that review works."
  source: P-001
  task: T-3022
  date: 2026-08-15
  context: Added via context agent
- id: L-608
  learning: "Time-series measurements over git history must pin the ref to the branch that actually carries the history. Measuring indexed-corpus growth via 'git rev-list --before=DATE master' reported a flat tail (77.4/86.3/86.4 MB over three months) implying growth had stopped; master was 122 commits stale because the session runs on a staging branch. Re-run against HEAD showed +62% in the final month. The failure is silent and directional: the question asked was 'how fast does the corpus grow', the question answered was 'how fast does the ref I picked grow', and a flat result is exactly the shape that terminates an investigation. Rule: for any historical series, assert the endpoint matches current reality (e.g. final datapoint == working-tree measurement) before interpreting the trend."
  source: P-001
  task: T-3022
  date: 2026-08-15
  context: Added via context agent
- id: L-609
  learning: "A broken measure agrees with a correct one on well-behaved inputs and diverges only on the interesting case, which is how it earns trust. Scored section similarity as 100 - 100*difflines/seclines; diff emits both < and > lines when content is REPLACED, so the count exceeds section length and the metric returns negative values. It matched the correct metric (unchanged-lines over max(len_a,len_b)) to within one point on 8 of 9 sampled pairs and only misbehaved on the single pair that actually churned — the one pair whose value carried information. Generalisation: validating an instrument against typical inputs selects for instruments that are wrong precisely where measurement matters. Validate against the extreme case, and treat any similarity metric that can leave [0,100] as disproven rather than noisy."
  source: P-001
  task: T-3022
  date: 2026-08-15
  context: Added via context agent
- id: L-610
  learning: "A retry loop around a failing command converts a loud red signal into a silent hang. My push 'kept timing out' for an entire session; it was never a lock — the pre-push audit was FAILING (config-registry parity RED, my own change) and saying so in plain text on every attempt. The loop discarded stdout and slept. Rule: before wrapping any command in retry, read one full failure output. Retry is only correct for a contended resource, and only after the error text has been shown to name contention."
  source: P-001
  task: T-3024
  date: 2026-08-15
  context: Added via context agent
- id: L-611
  learning: "pgrep -f 'audit.sh' is a host-wide guard, not a project-scoped one. On a multi-project host it matches other projects' vendored cron audits (/opt/002-Claude-Partner-Network was spawning them continuously), so the guard never clears and a wait-loop built on it never runs. The framework already publishes the correct guard and the pre-push hook names it: the lock file .context/locks/audit.lock, which is per-project by construction. Prefer a published lock file over a process-name match whenever one exists."
  source: P-001
  task: T-3024
  date: 2026-08-15
  context: Added via context agent
- id: L-612
  learning: "A single-arm evaluation cannot detect a confidently-wrong answer; it can only detect a missing one. In the T-3025 IW-2 probe the digest arm answered 'T-2977 is in progress' with high confidence and sound reasoning from the evidence it had. Nothing in that answer looks like an error. It became legible only against the full-document arm, which said the opposite. Design consequence: when evaluating a lossy transform, always run the unmodified input through the same instrument — the control is not a formality, it is the only thing that makes plausible errors visible. Same class as 832's polarity argument (errors survive by looking reasonable) and L-609 (a metric that agrees on 8 of 9 easy inputs)."
