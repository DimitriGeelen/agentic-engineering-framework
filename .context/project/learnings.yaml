  context: Added directly via Edit (focus-drift gate blocked add-learning command after T-1767 completion)
  application: "All cron-touching tasks must verify against /etc/cron.d/, not the repo file. Future structural fix: T-1768 — drift detection between registry/generated/deployed. T-1942 strengthening (2026-05-19): the three-step sync registry → generated → deployed has THREE distinct drift classes, not two. T-1771 wired the generated→deployed check inside `fw audit` (registry→deployed coverage via comparing source ↔ /etc/cron.d/). But registry→generated was not covered: if cron-registry.yaml is edited and `fw cron generate` is never run, the deployed file matches the (stale) generated file and doctor reports 'in sync' while the new registry entry is invisible to the OS scheduler. T-1935 origin (3+ days silent drift before T-1941 fix). Rule: a sync-chain with N transitions has N drift classes; auditing only the endpoints (registry vs deployed) misses middle-link drift. T-1942 closed the gap by re-running the generate logic in dry-run mode inside doctor and content-diffing against the on-disk source (bin/fw:1696-1768, tests/unit/test_cron_registry_generated_drift.bats)."

- id: L-365
  learning: "Cron 'deployed' is not 'executable' when cwd assumptions are violated. T-1720: `fw reviewer audit` cron had been deployed at /etc/cron.d/ for weeks but produced no output for 9 days because the generator emitted `PROJECT_ROOT=\"...\" \"/path/to/fw\" reviewer audit` without `cd \"$PROJECT_ROOT\"`. Cron's default cwd is HOME (/root); `fw reviewer audit` internally invokes `python3 -m lib.reviewer.audit` which uses cwd-rooted module discovery → ModuleNotFoundError → silent exit 1. `2>/dev/null` swallowed the only signal. Asymmetry was specifically against fw-rooted subcommands depending on Python module imports — non-fw cron commands had cd already (else branch). Sister to L-364 (wired ≠ deployed): three distinct axes now known on the cron pipeline — registry→generated, generated→deployed, deployed→executable. Verification of cron-touching tasks must now include exec-time check: `env -i HOME=/root PATH=... PROJECT_ROOT=... bash -c 'cd \"$PROJECT_ROOT\" && \"$PROJECT_ROOT/bin/fw\" <subcmd>' && echo PASS`. Generator fixed T-1720 (bin/fw:2867-2884) — fw-branch now emits cd; all cron lines now pipe stderr to `logger -t agentic-cron` for syslog discoverability."
  source: P-002
  task: T-1720
  date: 2026-05-06
  context: "9-day silent non-firing of reviewer-audit cron discovered while verifying §ACD safety-net coverage on orchestrator-rethink arc. Same family pattern as T-1767/L-364."
  application: "When emitting commands for non-interactive contexts (cron, systemd, dispatch), the generator must establish cwd explicitly — env vars alone are not sufficient for Python module imports. Stderr must NEVER be silently swallowed; pipe to logger or a discoverable log file. Verification of any cron-touching change must include an env-i exec test, not just a grep of the generated text."
- id: L-366
  learning: "Inline D3/Canvas init that reads clientWidth/clientHeight synchronously at script parse can return 0 in Chromium when stylesheets/fonts are still loading. Cached into const → degenerate viewBox/coordinate system → empty render that 'works after refresh'. Fix pattern: read into let with sensible fallback defaults, defer initial render to requestAnimationFrame, attach ResizeObserver for ongoing layout shifts. Element-presence grep cannot detect this — needs Playwright assertion on viewBox numerics or rendered node count. Origin: T-1770 in web/templates/fabric_explorer.html — symptom (b) container visible, no nodes; refresh fixes."
