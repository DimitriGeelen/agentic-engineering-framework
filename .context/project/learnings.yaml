- id: L-559
  learning: "A framework that generates projects must apply its own protections at the site of GENERATION, not the site of DISCOVERY. AEF's .gitignore has carried .context/working/.fw-secret-key since before the key existed, so AEF was never exposed — but neither gitignore the framework WRITES for consumers (lib/init.sh:266 for the consumer's .context/working/, bin/fw:534 for the vendored copy) carried it, so every project fw init created published its Watchtower signing key on first commit of .context/working/. The general form was already recorded as L-015 (T-1323: 'vendored copies need their own .gitignore') and the fix that shipped with it closed exactly the one instance in hand (__pycache__). The learning generalised; the remedy did not — and in the register those two look identical afterwards. When a learning names a CLASS, the closing task must enumerate the class's members, not fix the member that produced it."
