  context: Added via context agent
- id: L-584
  learning: "DEFERRING A BUG AS 'LATENT' IS A CLAIM ABOUT DATA THE SESSION IS ABOUT TO WRITE TO (T-2932). Four sites counted inbox observations with grep -c 'status: pending'. Measured at task start: grep 117 == parse 117, exactly right, because no observation's TEXT contained the string. So two of them were deferred as latent and filed as OBS-233 under one-bug-one-task. OBS-233's own text quotes 'status: pending' — it is the sentence describing the risk. Filing it pushed grep to 119 against a true 118 and turned the guard red inside the hour. The observation describing the latent case is what made it live. THE GENERAL SHAPE: a latency assessment is only valid over a corpus the session does not mutate. Task files, observations, learnings, handovers, commit messages and test fixtures are all corpora we write to constantly, and text ABOUT a string-matching bug reliably contains the string. So for any defect whose trigger is 'some content somewhere contains X', check whether describing it produces X — because the ticket, the RCA and the test comment all will. RELATED BUT DISTINCT FROM L-533: L-533 says a sibling sweep needs an enumerating guard rather than a memory of which sites were converted. That held here too and earned its keep twice over — the guard found a FOURTH site (observe.sh do_triage) in a file where two conversions had just been made by hand, one function below where I had been reading, and it was the worst of the four because 'Nothing to triage — inbox is clean' asserts the queue is empty rather than merely reporting a number. An explicit list of the known sites would have gone green. THE NEW PART is the interaction: L-533 tells you to enumerate; this says your enumeration's TRIAGE (live vs latent) has a shelf life measured in minutes when the corpus is your own working memory. Practical rule: if you are about to write 'latent, filed not fixed', grep the text you are about to file for the trigger first."
  source: P-001
