- id: L-374
  learning: "URL-prefix sniff regexes that decide between \"treat-as-URL\" and \"shorthand-rewrite\" must include the full scheme set used by tests (https, ssh, git, AND file). Symptom of incomplete whitelist: file:// falls through to shorthand-rewrite path, producing nonsense like https://github.com/file:///tmp/x.git. Detection is silent in unit tests that only assert \"URL is preserved\" — only a live-clone test catches it because the malformed URL fails the clone step. Defense: live-clone test with file:// upstream is the canonical regression check for any URL-resolution code path. Origin T-1634 (under T-1542 arc): live-clone bats test caught file:// missing from ^(https?|ssh|git)://|^git@ regex; fix was adding file to the alternation. Generalised lesson: when sniffing input-type by prefix, enumerate the test-fixture schemes too, not just the production ones."
