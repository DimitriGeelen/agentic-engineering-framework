- id: L-375
  learning: "Vendored-cwd-trap: when a script is invoked from inside .agentic-framework/ (the consumer-vendored copy of the framework), FRAMEWORK_ROOT path-resolution canonicalises to the vendored copy, not the source-of-truth. All path-relative operations (read templates, write outputs, locate sibling scripts) target the vendored shadow instead of the consumer project root. Specific high-blast-radius case: fw upgrade. When run from inside .agentic-framework/, the upgrade operation targets the vendored copy as both source AND target — write conflicts, partial state, session-fatal mid-stream. Structural prevention (T-1542 arc, T-1822 + T-1634): detect bare-from-consumer (FRAMEWORK_ROOT canonicalises to $target_dir/.agentic-framework) and either error with 3-path remediation OR auto-clone upstream to tempdir and exec there. Generalised lesson: any script that resolves \"where am I\" from $0 / script_dir must detect when \"where I am\" equals \"what I am being asked to operate on\" and route differently. Class: cwd-trap / self-target. Test pattern: bats fixture with proj/.agentic-framework/ (own .git) + invoke from inside, assert the script either rejects with actionable error or routes to upstream."
