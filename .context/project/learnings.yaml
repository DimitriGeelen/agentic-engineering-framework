- id: L-408
  learning: "NEVER edit bin/fw heredoc/command-substitution constructs without bash -n verification BEFORE the next tool call. Pattern: editing `var=$(python3 - <<'PY' ... PY)` blocks in bin/fw and getting the closing `)` or `||echo SKIP` clause wrong creates a self-locking failure mode — bin/fw is the entry point for ALL PreToolUse hooks (check-active-task, check-arc-id, check-human-ac-tick, check-project-boundary, budget-gate, etc.), so a syntax error in bin/fw makes every subsequent tool call (Edit, Bash, Write) get rejected by PreToolUse with `bin/fw: line N: syntax error`. The agent cannot escape this without human shell-rescue (`git checkout bin/fw`). Incident count: 3× in 2026-05 (origin sessions: T-1942 segment alone produced 2 instances within minutes). Rule: (a) prefer extracting heredoc Python to a small lib/ helper file BEFORE editing if 3+ lines, (b) if heredoc must be edited inline, the ONLY safe pattern is `var=$(python3 - args 2>/dev/null <<'PY' || echo __SKIP__\\n...\\nPY\\n)` with the closing `)` on its OWN LINE after `PY`, (c) IMMEDIATELY after such an edit run `bash -n bin/fw` as the very next tool call — do NOT chain further edits or Bash calls until syntax is green. The cosmetic 'unterminated here-document' warning bash emits for THIS pattern is benign (heredoc completes at runtime); chasing the warning by reordering `<<TAG` and `2>/dev/null` is what bit me — the reorder lost the closing `)`. Live with the warning. Cosmetic noise vs lockup is not a fair trade. Origin: 3 prior incidents in this codebase; T-1942 produced 2 of them in one segment (one when adding the dry-run block, one when 'fixing' the warning)."
  source: P-002
  task: T-1942
  date: 2026-05-19
  context: "User intervention: 'done, this is the 3rd time !!! learn from it' after manual `git checkout bin/fw` rescue. Self-locking failure: edit→PreToolUse hook runs bin/fw→bin/fw syntax error→Edit/Bash/Write all rejected→stuck until human shells in."
  application: "Mandatory: after any Edit/Write touching bin/fw, the NEXT tool call MUST be `bash -n bin/fw` (Bash). Never chain a second bin/fw edit, Bash invocation, or any other tool BEFORE syntax-verify lands green. Stop editing for cosmetic warnings on heredoc blocks — the cost of one ugly stderr line is nothing vs lockup. T-1944 (2026-05-20) closed the L-332/L-408 prevention loop end-to-end for the cron-drift case by extracting both inline heredocs (bin/fw + agents/audit/audit.sh) to lib/cron_dry_run.py. Net result: cosmetic warning eliminated, single source of truth for the generation algorithm, both bash dispatchers parse-clean. See task T-1944."
  related: [L-332]
  reinforcement_of: L-332
  reinforcement_note: "L-408 is the 3rd-incident reinforcement of L-332 (T-1629, 2026-05-01) — not a new failure class. L-332 already prescribed `any Python helper >10 lines goes in lib/*.py and is invoked as python3 $FW_LIB_DIR/helper.py — the bash side stays parse-safe`. T-1942 (origin of L-408) introduced the heredocs *anyway* because the related-knowledge surface wasn't consulted at task-create time. Class-tag is rule-not-consulted-at-task-create, not new-failure-mode. T-1944 (2026-05-20) closed the loop."

- id: L-409
  learning: "[REVIEWER] AC prefix is NECESSARY-BUT-NOT-SUFFICIENT for ACs whose Expected clause includes prose-quality vocabulary (reads clearly, tone matches, unambiguous, actionable, intuitive, reads accurately). The reviewer agent (lib/reviewer/static_scan.py) has exactly 9 detectors — tautology, empty-body, swallowed-errors, output-spoofing, empty-output-success, skip-as-pass, mock-only-integration, human-ac-mechanical-signal, ac-verify-mismatch. ZERO of them evaluate natural-language prose quality. When an author files a prose-clarity AC as [REVIEWER] hoping `fw reviewer T-XXX` substitutes for human reading, the scanner SILENTLY IGNORES that AC (no detector fires on it) and reports findings on OTHER ACs structural issues. Overall verdict can be CONCERN-on-AC#3 while AC#1 (the prose one) gets no signal at all — the human reads the verdict, sees `Overall: CONCERN, Needs Human: no`, and either dismisses the unrelated finding or fixes it without ever evaluating the prose AC. This is a false-success class (worse than acknowledged failure per design-dialogue antifragility principle). Detection: if a Human AC has [REVIEWER] prefix AND its Expected clause contains any of {reads clearly, reads cleanly, reads accurately, tone, unambiguous, actionable, intuitive, layout reads clean, visual rhythm, fits the page flow, strikes the right tone}, the prefix should be [REVIEW] (genuine prose judgment) or kept as [REVIEWER] only if paired with an explicit second [REVIEW] AC covering the prose dimension. Origin: T-1811 — explicitly [REVIEWER]-tagged Human AC 'Updated CLAUDE.md section reads clearly' gets no reviewer attention; reviewer reports CONCERN on Agent AC#3 structural mismatch instead. T-1947 (2026-05-20) ships a static-scan detector (detect_reviewer_prose_mismatch) that catches the prefix↔Expected vocabulary clash and emits per-AC CONCERN."
  source: P-001
  task: T-1947
  date: 2026-05-20
  context: "User questioned the implicit assumption 'reviewer can shortcut prose review' on the T-1811 [REVIEWER] AC. Investigation showed scanner has no prose-quality detector and stays silent on prose ACs while reporting on other ACs — looks identical to success at the verdict surface."
  application: "Static-scan detector ships in lib/reviewer/static_scan.py (detect_reviewer_prose_mismatch). Updated CLAUDE.md §AC Classification Guidance §[REVIEWER] section adds the necessary-but-not-sufficient rule with the prose-vocabulary list."
  related: [L-401, L-403]

- id: L-410
  learning: "Reading-time claims about CLAUDE.md edits should be grounded in measurement, not handwaved. Median edit size matters: at 1086 lines / 80KB / 73 sections / ~1.3 edits-per-day cadence, a 5-line edit ≈ 50 words ≈ 12 seconds at 250wpm; a 17-line edit ≈ 170 words ≈ 40 seconds; a 37-line section-addition ≈ 370 words ≈ 90 seconds. 'Skim in seconds' is true ONLY for the median typo / one-line clarification class (60%+ of edits). Substantive section additions (>20 lines) cost minutes. The justification for 'human review is cheap relative to building an LLM-backed prose-quality detector' holds for the median case but does not hold for the long tail. When using cost framing to dismiss a build-vs-buy decision, cite the measured distribution (small edits dominate, but large edits exist and cost minutes each) rather than the optimistic tail estimate."
  source: P-002
  task: T-1947
  date: 2026-05-20
  context: "User challenge: 'systematia[lly] justify the claim humans skim CLAUDE.md edits in seconds'. I had made this claim as a throwaway aside to dismiss path (b) (build LLM-backed prose detector) in the T-1811 elaboration. The user's pushback exposed it as an unsubstantiated quantitative claim used to anchor a build-vs-buy decision."
  application: "Epistemic hygiene: when a cost/benefit framing uses a quantitative anchor ('seconds', 'minutes', 'cheap', 'overkill'), the anchor must be either (a) measurable from observable artefacts (file size, edit-cadence, etc.) or (b) explicitly tagged as estimate-not-data. T-1947 retracted 'seconds' and replaced with 'median edit ≈ 12-40 seconds, long tail ≈ minutes per section addition' — defensible because it derives from `wc -l CLAUDE.md` and `git log --shortstat`."

- id: L-411
  learning: "Idempotent crons create an observability blindspot: a gauge that counts emissions (dispatch rows, log entries, output files) cannot distinguish 'cron fired and skipped everything legitimately' from 'cron broken / not firing'. Both look identical at the emission surface. Fix pattern: read the cron's persistent state file (LATEST yaml, last-run marker, generated-timestamp field) as alternate fire evidence — the state file is rewritten regardless of whether work was done. Idempotency-saturation by manual verification runs is a common cause: the human runs the cron's command repeatedly during testing, then the cron correctly no-ops for the idempotency window, and the gauge silently reports zero firings the whole time. This is structurally identical to G-064's signature (substrate exists, observability surface lies)."
  source: P-001
  task: T-1952
  date: 2026-05-20
  context: "T-1952 fix: tools/g064-readiness.py reported cron_firings=0 even though syslog showed daily v0.5 fires. Root cause: gauge counted dispatch.jsonl rows only; idempotency-saturated cron correctly emits zero rows. The escalation-scan-v0.5 LATEST yaml's `generated` timestamp is rewritten on every fire and is the missing signal."
  application: "When designing a gauge for an idempotent autonomous process: identify the state file the process always rewrites (regardless of work done), and read its mtime/internal-timestamp as fire evidence. Don't conflate 'did the cron fire' with 'did the cron emit downstream artifacts'. Two questions, two surfaces. Also: idempotency-saturation by manual testing is a real failure mode for G-064-class autonomous-workload measurement — recommend explicit 'do not run X manually during verification windows' guidance in the cron's docs/yaml description."
  related: [L-364]

- id: L-412
  learning: "Filed bugs can be symptoms of an upstream perf/timeout issue rather than data bugs. Before writing code to 'fix' a 'data not appearing' bug, verify the upstream non-data path first (page load timing, cache state, network). The fastest diagnostic is a Playwright/headless-browser screenshot after the upstream fix lands — if the screenshot shows the data, the original bug was a perf-confusion artefact, not a data bug. Closing the symptom-task as resolved-by-upstream with the screenshot as evidence is honest, fast, and avoids speculative feature-build (the ?mode=proposed URL filter in T-1955's ACs would have been a no-op until confirmed scores exist)."
  source: P-002
  task: T-1955
  date: 2026-05-20
  context: "T-1955 was filed during human BVP arc review as '/bvp?mode=proposed renders 0 of 88 scored tasks'. Investigation after T-1954 (perf cache) landed: /bvp already ships 94 proposed task points and they render as outlined dots across all four quadrants — verified via Playwright screenshot. The original symptom was the 17.9s perf timeout, not a missing-data bug. Closing T-1955 as resolved-by-T-1954 with screenshot evidence saved ~3-4 hours of speculative ?mode= filter implementation that would have been a no-op for the current 0-confirmed corpus."
  application: "When a 'data not showing' bug is filed adjacent to a known perf issue, run the screenshot check before writing AC pseudocode. Don't pre-commit to a feature scope based on the bug's original framing — the framing may have been driven by the perf symptom. Capture honest N/A markers for ACs that no longer apply, with brief explanation. The pattern is: investigate → write evidence → reframe ACs honestly → close-as-resolved-by-upstream. Distinct from 'just close it' because the [REVIEW] Human AC asks the filer to confirm the resolution actually matches what they see."
  related: [L-411]
- id: L-413
  learning: "Duplicate ## Evolution section pattern: arc-tagged build tasks left an empty '## Evolution' header from the template stub above the filled '## Evolution\\n### YYYY-MM-DD - ...' section. The Evolution completion gate (T-1718) reads the first occurrence and refuses with empty-section. Fix: scrub the duplicate template header (replace 'empty stub + commented template + filled real' with just 'filled real'). Hit 4 times in single batch: T-1937, T-1938, T-1940, T-1941. Detector: grep -c '^## Evolution' on .tasks/active/T-19[0-9]*.md should equal 1 not 2."
