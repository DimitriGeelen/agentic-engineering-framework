- id: L-387
  learning: "When a Verification command in a task's ## Verification block is pipefail-sensitive (left-side of `cmd | grep -q ...`), early grep match closes the pipe and produces SIGPIPE exit 141 from the upstream command. The verification gate sees the pipeline as failed even though the match succeeded. Pattern: capture output to a variable first (`out=$(cmd 2>&1); echo \"$out\" | grep -q PATTERN`). Origin: T-1862 verification commands needed rework after first attempt exited 141 under pipefail."
  source: P-011
  task: T-1862
  date: 2026-05-15
  context: Discovered while running T-1862 completion gate.
  application: |
    Distinguish short-circuit grep from read-all grep when writing Verification:
      UNSAFE (short-circuits, closes pipe → SIGPIPE 141 on upstream under pipefail):
        cmd | grep -q PATTERN
        cmd | grep PATTERN > /dev/null
        cmd | head -1   (any reader that exits early)
      SAFE (reads all stdin, never closes early):
        cmd | grep -c PATTERN          # counts -> reads all
        cmd | wc -l                    # counts -> reads all
        cmd | awk '/PATTERN/{f=1} END{exit !f}'   # END block -> reads all
      DEFENSIVE (always works, recommended for Verification block):
        out=$(cmd 2>&1); [[ "$out" == *PATTERN* ]]   # bash substring, no pipe
        out=$(cmd 2>&1); echo "$out" | grep -q PATTERN   # decoupled stdin
    The distinction: anything that EXITS on first match closes its stdin while
    the upstream is still writing. The mitigation in the learning above
    (capture to variable first) works because it decouples cmd from grep -
    cmd finishes writing to $() before grep ever sees the data. Same effect
    via tempfile: cmd > /tmp/.out 2>&1 && grep -q PATTERN /tmp/.out.
    Follow-up captured during S-2026-0521-resume (originally flagged at S-2026-0521-1952).
