  learning: "Enforcement-baseline-drift class: editing .claude/settings.json (adding/removing/reorganising hooks) changes the canonical hash that bin/fw enforcement baseline pins. Until T-1888 no PostToolUse nudge fired on the edit; the hook-author task shipped, the next fw doctor run reported FAIL ('Enforcement baseline CHANGED'), and the FAIL accumulated silently until somebody noticed. Origin: three legitimate hook additions T-1849 (check-arc-id), T-1730 (focus-drift-gate), T-1731 (check-human-ac-tick) all shipped without refreshing the baseline — fw doctor sat in FAIL across multiple sessions until T-1886 cleaned up. PREVENTION DEPLOYED (T-1887 Candidate A + T-1888 Candidate B): (A) task template default.md carries an L-291-style hint instructing the agent to add `bin/fw enforcement baseline` to ## Verification when editing .claude/settings.json — the completion gate then runs it, the baseline refresh becomes task evidence, fw doctor stays green; (B) PostToolUse hook `agents/context/check-settings-edit.sh` (matcher: Write|Edit) fires an advisory L-398 reminder with the same instruction whenever .claude/settings.json is written/edited, covering the case where the agent didn't read the template. Candidate C (pre-push block on baseline drift) remains reserved — not needed unless A+B prove insufficient in the wild. Asymmetry note: L-291 and L-387 each ship with template-hint-only; deploying B for L-398 reflects the higher base rate (3 silent hooks across 5 weeks vs L-291's single 5-day origin)."
