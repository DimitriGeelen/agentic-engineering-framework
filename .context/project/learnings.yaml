- id: L-566
  learning: "A mutation/reciprocal test leg must hold ONLY what the change is not supposed to alter. Anything the change legitimately improves belongs in its own leg — otherwise reverting the fix turns the improved case red and the mutation check reports its own success as collateral damage. Origin: 832 rail-507 §5(b) — their masking fix closed a false positive AND a miss (a separator-free real secret their whole-part noun matching had walked past); the miss-closing case sat inside their reciprocal leg, so the mutation check read 'the fix broke more than the rule under test' when nothing was broken. Applied here as leg (h) of secret_scan_span_rule.bats, which skips containment pairs by construction because those ARE the delta."
