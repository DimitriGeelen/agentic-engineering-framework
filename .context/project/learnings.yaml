- id: L-329
  learning: "When the trust decision is already made upstream (e.g., someone with root authority rewrote a config file to a new endpoint), do NOT file a Tier-2 human-owned task to ask permission to act on that decision. Operational housekeeping that acknowledges an already-made authorised change (TOFU clear after hub migration, cache invalidation after config edit) is agent work, not security gate. Reflexively human-gating every operation with security-shaped vocabulary (tofu/secret/auth) bottlenecks routine cleanup. Witness: T-1623 — agent filed Watchtower approval for termlink tofu clear; user pushed back with 'WHY DO I (HUMAN) NEED TO DO THIS?'; agent ran the clear in 2 seconds. The legitimate Tier-2 boundary is when the trust decision itself needs to be made, not when it needs to be propagated."
