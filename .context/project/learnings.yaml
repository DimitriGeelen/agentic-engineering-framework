  context: Added via context agent
- id: L-587
  learning: "A running server is a third deployment surface: source can be fixed, the process still runs the deleted code. fw doctor's Watchtower check asserted liveness+identity and was read as currency for six days, while five web/ commits sat inert — including two human-owned tasks queued for [REVIEW] in the very server that was not running them. When three instruments agree a tree is clean and a fourth refuses it, the fourth is reading a tree the others cannot see."
  source: P-001
