- id: L-390
  learning: "Tasks moved to .tasks/completed/ via git mv (without fw task update --status work-completed) leave frontmatter desynced (status=started-work + date_finished=null). Detective: CTL-012 catches unchecked-AC consequence but NOT the bare metadata desync. Pattern: when scaffolding a follow-up task's commit that also renames the parent into completed/, the commit ships the file move but skips the fw-task-update side effects (status, date_finished, last_update). Class is structural — git-mv is a normal git operation that bypasses the framework's state machine. Prevention paths: (a) add audit check 'completed-dir task has status != work-completed' as DESYNC WARN; (b) pre-commit hook that warns when staging a rename into .tasks/completed/ without an accompanying status update in the same commit. 8 evidence cases: T-1501, T-1845, T-1846, T-1847, T-1858, T-1860, T-1861, T-1862 — all moved across two recent multi-task commits (c15b9b81, f30cf038, plus older T-1501). PREVENTION DEPLOYED (T-1870, expanded T-1882 + T-1883 + T-1884): CTL-028 / completed_dir_status_consistency in agents/audit/audit.sh emits one WARN per desynced task at audit time. T-1870 placed CTL-028 in the oe-daily section (07:00 cron), giving a detection window up to 24h post-ship — proven inadequate by T-1846, which sat drifted for 2 days (renamed by commit c15b9b81 on 2026-05-15, caught by oe-daily cron on 2026-05-16 but ignored, manually spotted 2026-05-17). T-1882 promoted CTL-028 to fire on (compliance || oe-daily) and physically relocated the block out of the oe-daily `if` wrapper — pre-push audit (which includes compliance) now catches drift BEFORE push. T-1883 applied the same promotion to CTL-012 (the AC-side symmetric twin of CTL-028 — same scan path, same drift class on different dimension). Both checks now fire together at pre-push. Pinned by tests/unit/audit_ctl028_completed_status_consistency.bats (8 cases) + tests/unit/audit_ctl012_compliance_section.bats (5 cases), 13 audit-promotion tests total, each suite includes a negative gate-granularity test that --section structure alone does NOT fire the check. Generalised meta-lesson: detective-only audit checks placed in slow-cadence sections (daily, weekly) create proportional detection-window gaps; the check should live in the highest-frequency section appropriate to its detection class (pre-push for ship-blockers; structural-30m for hour-scale; oe-daily for day-scale). Pattern now demonstrated on three checks across two detection classes (corpus-scan: CTL-028 status + CTL-012 AC; framework-source-grep: CTL-026 sovereignty gate via T-1884) — strong evidence the meta-lesson generalises across detection-class lines, not just within one family. T-1884 specifically demonstrates that the detection-window proportionality applies to framework-source presence checks, where the very commit being pushed can regress the gate itself; arguably the *most severe* form of the gap, because the regression and the slow-cadence detection arrive together. Pinned by tests/unit/audit_ctl026_compliance_section.bats (4 cases, same gate-granularity structure as the prior two suites). After T-1884 the L-390 sweep is exhausted on this family — CTL-027 (inception template completeness via per-task scan of active/) remains a candidate but its detection class is *active corpus* rather than completed-or-source-regression, so promotion is a different judgement call (in-progress inception drift is not ship-blocking the way a missing sovereignty gate or a desynced completed task is). Path (b) — staging-time pre-commit hook — remains a future enhancement; CTL-028/CTL-012 are detective (post-fact at section runtime), not preventive (pre-commit)."
