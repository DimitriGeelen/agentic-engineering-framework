- id: L-560
  learning: "A detector's scope note reads as coverage to everyone downstream. secret-scan.sh's header states 'vendor-prefixed credentials' as a deliberate choice — defensible, and the reason nobody asked what it could not see. But the verdict line it emits, '[PASS] Secret scan: tracked tree clean', does not name its axis, so a green asserting ONE axis is textually identical to a green asserting all of them. 832 ran two months on that green with a signing key pushed to a public mirror. Red lines get looked at; a green that asserts nothing is indistinguishable from one that asserts everything, and nothing ever prompts anyone to check. Two rules: (1) when a check documents a deliberate scope limit, something must ALSO watch the excluded axis or the limit is a blind spot with a rationale attached; (2) prefer verdict lines that name what passed. Sibling to the port-3000 false-green class in CLAUDE.md (371 violations across 277 tasks, same mechanism)."
