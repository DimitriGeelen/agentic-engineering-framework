- id: L-570
  learning: "CORRECTS L-569's false universal. Measured 2026-08-09: 'termlink channel post' DOES sign with whatever key TERMLINK_IDENTITY_FILE names — probe key 22b8cb92cc2606de landed as sender_id on topic aef-t2904-idprobe offset 0, from a session whose host identity is d1993c2c3ec44c94. The env precedence is TERMLINK_IDENTITY_FILE > TERMLINK_AGENT_ID > TERMLINK_IDENTITY_DIR > shared host default (PL-236 / termlink T-2324), documented only under 'termlink agent identity --resolve --help'. Two operational consequences. (1) A project CAN hold its own signing identity and stop being indistinguishable from co-resident agents on a collapsed-identity host, without touching host config — which is what D-377 total-isolation wants anyway. (2) TERMLINK_IDENTITY_FILE AUTO-CREATES the keypair at the named path if absent (chmod 600, verified), so probing TERMLINK_AGENT_ID=<guess> to discover an existing agent key would MINT keys under the shared host identity dir instead of reading it — never probe identity by guessing agent ids on a shared host; point IDENTITY_FILE at a scratch path you own. The methodological shape, and the reason this is filed rather than quietly fixed: L-569 was written after probing every flag on the 'channel post' subcommand and concluding 'structurally cannot'. The probe enumerated the wrong dimension — flags, not env — which is the same N-tuple ceiling 832 reported at rail 507 §6, one layer up: a probe is only as general as the SURFACE it enumerates, and 'I tested every X' is not evidence about Y."
  source: P-011
  task: T-2904
  date: 2026-08-09
  context: Added via context agent
- id: L-571
  learning: "ID allocators that scan a corpus with a regex have a fourth failure leg beyond L-506's three: silent empty-scan fallback. When the scan matches zero rows, max-over-nothing returns the seed, so 'my pattern does not understand this file' and 'the corpus is empty' are the same observable event — the allocator returns 1 with full confidence and reissues a live id. Origin T-2902: a yaml.dump(sort_keys=True) rewrite moved 'id:' off the list-item line, learnings.yaml grew 24 duplicate ids in one week, and the same shape then broke three more sites over four months (T-1369 learning.sh, T-2672/832-T-295 resolve.sh x2, T-2906 status.sh reporting 'Learnings: 0' against 608 entries for 119 days). Each was fixed by widening the regex, which is why it kept recurring. Fix is a parser with no pattern to widen, plus a degraded path that REFUSES rather than seeding. Test discipline: the load-bearing leg runs the OLD pattern against the SAME fixture and asserts it finds nothing — without it the suite only proves the new code works on shapes it already knows."
  source: P-001
  task: T-2902
  date: 2026-08-10
  context: Added via context agent
- id: L-572
  learning: "A gate governs a SURFACE, not a capability. T-2904/T-2905 put identity and label gates in 'fw rail post' and the class was reported closed; the MCP channel_post tool reached the same topic with neither gate in scope. Measured 2026-08-10: MCP signs the project key (0e7ee6ca), shell signs the substrate key (d1993c2c) — so the gated surface was the one that COULD NOT sign correctly, and two prior posts used a Tier-2 bypass that was never necessary. L-399 already says a bypass contract must be honoured by every command pattern a gate covers; it was cited in the same session that shipped the one-leg gate, because the rule is stated over COMMANDS and the miss was a whole surface nobody enumerated. Author-time test before claiming a class is closed: list every surface that can reach the effect, then post/act from each one and observe — do not reason about a surface you have not exercised. Found only because the peer project declared the same asymmetry on their side first; a clean-looking report from them would have left ours broken."
  source: L-399
  task: T-2908
  date: 2026-08-10
  context: Added via context agent
- id: L-573
  learning: "A gate can be green, tested, and structurally unreachable at the same time: check WHERE it is registered against WHERE the thing it guards exists. check-onboarding-gate (T-2815, arc-017's whole mechanic) is registered in the framework repo, which has 0 onboarding tasks, and absent from every consumer, which has 6. Its 38 test legs are green because they all execute in-repo. 'The suite passes' and 'the gate is deployed where it matters' are independent facts that look identical from inside the repo. Generalises past hooks: any artefact whose install site and target site differ (hooks, cron entries, vendored templates, MCP manifests) can pass every test at the install site while being absent at the target. The cheap check is one line — compare the consumer's registration surface against the producer's, keyed on NAME not count."
  source: P-001
  task: T-2911
  date: 2026-08-10
  context: Added via context agent
- id: L-574
  learning: "A commit record that misattributes is worse than one that is absent: dispatch-spawned workers inherit the repo git identity, so an autonomous 923-line source commit is byte-identical to an operator's hand-typed one (author==committer==the human). A missing T-XXX is rejected at the commit-msg hook; a falsely-attributed commit passes every check and reads as normal history forever. Two full investigations concluded 'a second operator session is live' because that is exactly what the audit trail said. Check author-class, not just task-reference — P-002 gates the T-XXX and nothing gates the who. Precedent that it is solvable: lib/init.sh:752 already sets GIT_AUTHOR_NAME='fw init' for its own bootstrap commit, and termlink-dispatch <agent@termlink> was in live use until April 2026."
  source: P-002
  task: T-2917
  date: 2026-08-11
  context: Added via context agent
- id: L-575
  learning: "A guard that cannot read its input reports the same thing as a guard that found nothing. Three instances in one fix (T-2916): (1) the stall predicate required task_snapshot, a field its own commit introduced, so coverage was 11/1325 rows = 0.8% and it abstained on everything while printing 'no tasks stalled'; (2) _task_touched_since read last_update off a flattened meta dict that does not carry it, got None, failed open, and reported every task advanced; (3) _git_commit_count_since grepped the whole commit message, so an RCA CITING a stalled task cleared that task from the stalled set — writing about the stall made the stall undetectable. Rule: never print a verdict without its denominator. Every scan-style check must emit evaluated/skipped counts alongside the result, so abstention is legible and cannot be mistaken for success. Corollary for authors: an AC that proves a guard RUNS is not an AC that proves it JUDGES — pin a real verdict on real data, in both directions, or the guard ships inert with green ACs (T-2914 closed 6/6 while inert)."
  source: P-011
