  learning: "Verification commands that pipe long-running output through 'grep -q' can fail with exit 141 (SIGPIPE) under set -o pipefail: grep -q closes stdin on first match, and the upstream command (e.g. 'fw doctor') gets SIGPIPE'd. Recipe: capture output to a temp file first, then grep ('cmd > /tmp/.out 2>&1 && grep -E \"pattern\" /tmp/.out > /dev/null && rm -f /tmp/.out'). Same class as L-302 (pipefail trap on no-match) but the trigger is OPPOSITE — too much output, not too little."
