- id: L-316
  learning: "Standalone HTML templates (those NOT extending base.html) do not inherit base.html's global event handlers or shared affordances — each must replicate them locally. T-1582 origin: review.html (T-1453 deliberately standalone for mobile UX) lacked the htmx-error→toast handler that base.html:407-414 installs for cockpit, so 4xx/5xx responses on /review silently disappeared (T-1574 symptom class). When adding a new global affordance to base.html, audit non-extending templates for the same need. Trigger: any change touching base.html's shared event-handler block. Three standalone templates currently exist (base.html, review.html, _review_error.html) — _review_error.html has no htmx so is fine. Same drift class as L-298/L-309 but at the template-inheritance layer rather than the parser layer."
