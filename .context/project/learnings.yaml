- id: L-429
  learning: "Unbounded Watchtower pages are a recurring class: any page that loops over a growing collection (cards or table rows) with no height bound degrades silently into a 30k-90k px page as data accumulates — usable only until the data grows. Found 4 instances in one session (/approvals 37k, /fabric 33k, /inception 83k, /timeline 90k). Fix by shape: card-list → collapsed <details> overflow (first N inline, rest one click away); table → max-height + overflow-y:auto scroll container with sticky header. Both keep every item in the DOM (reachable) while bounding scrollHeight below the 8000px _safe_shot cap, so full_page screenshots stop wedging. The ux-review sweep (T-2005) is the detector but only covers 5 pages — widen its PAGES list so the recurring detector catches new instances instead of manual probes."
