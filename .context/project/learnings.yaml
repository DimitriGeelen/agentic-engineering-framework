  application: TBD
- id: L-529
  learning: "Lane bands are NOT reconstructible from aef:laneMeta height — the stack has no stored origin, so any absolute band model guesses one and produces phantom findings. Three guesses now measured: T-2684 anchored at the topmost node (7 phantom findings on a clean map), T-2716 anchored at y=0 (9 of 11 store projects flagged, all clean under corpus lint), and 832's renderer actually stacks from POOL_Y + POOL_HEADER (their rail 364, previously-reported not re-measured). The fix is not to obtain the origin — it is to formulate the question so no origin is needed. Our authoritative rules already do: lane-geometry compares lanes AGAINST EACH OTHER and is documented 'deliberately origin-free'; lane-overflow measures drawn extent max(botOf)-min(y) against declared height, a within-lane relative quantity. Both use 832's per-type occupancy from rail 340 (events 54, gateways 66, tasks 64 — a gateway occupies MORE than a task despite the smaller shape, so the lowest node is not the largest-y one) and SKIP rather than default on an unknown type. Before writing any lane geometry check, ask whether the quantity is relative; if the formulation needs an absolute band edge, it is the wrong formulation."
  source: P-001
  task: T-2716
  date: 2026-08-01
  context: Added via context agent
  application: TBD
- id: L-530
  learning: "Teeth prove a guard is IMPLEMENTED, never that it is CORRECT. A teeth test (mutate, assert the mutation landed, confirm red) proves the guard fires; it says nothing about WHAT the guard discriminates. Both can be true at once — the instrument is live AND it measures something other than the property you are about to claim. Worked instance: the 832 fixture pin was given teeth (reverted one host element, confirmed 1 failed + 3 errors, restored) and went red on the SHA, not on the element vocabulary — so it proves byte-stability while being cited for well-formedness, and would go green again on an announced sha for malformed bytes. Four instances of this shape across the AEF/832 arc, four different mechanisms: a negative control that agreed with a wrong rule, a probe that passed for any element name, a polarity probe that passed with the label flipped, and this pin. Rule: after teeth go red, read WHY they went red before banking the green."
  source: P-001
  task: T-2716
  date: 2026-08-01
  context: Added via context agent
  application: TBD
- id: L-531
  learning: "WITNESSES OVER COUNTS: a diagnostic that emits a count collapses exactly the per-item variation that makes an anomaly legible; one that names the items lets a reader spot the outlier without re-running anything. Converged with 832 (rail 375/376) from two independent directions: they had adopted it twice on authoring-ergonomics grounds (T-317 names flow ids rather than counting them; the lane-capacity rule prints WHICH lane and by how much), and AEF hit the DETECTION payoff by accident - the OBS-118 authority message prints per-node owners, and that per-node list turned out to be the only surface on which the T-2717 userTask-in-Framework-lane defect was visible at all (te_scan->human sitting next to five ->agent siblings). A count would have said '6 nodes fell back' and shown nothing. Sibling to L-525 (tool emits the summary, CLEAN rows printed so an ABSENCE is representable) and to L-530 (teeth prove a guard fires, never what it discriminates)."
  source: P-001
