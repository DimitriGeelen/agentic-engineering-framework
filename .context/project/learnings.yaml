- id: L-552
  learning: "Mutation tests need a validity check on the mutant. A mutation that breaks syntax makes the mutant die at parse time, which is indistinguishable from 'the property under test went red' — the test certifies teeth it does not have. Neutralise the target line (replace with ':') rather than delete it, and assert 'bash -n' on the mutant before believing any red. Same family as the vacuous negative control: a control must fail for the RIGHT reason, not merely fail."
