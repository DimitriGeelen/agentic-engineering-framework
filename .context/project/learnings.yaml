  learning: "When extending a state distinction across UI surfaces, the canonical parser must be the single source of truth — local regex duplicates accumulate drift. T-1577 fix swept cockpit's local AC regex (which matched checkboxes inside HTML template comments) for web.blueprints.tasks._parse_acceptance_criteria, eliminating 2-task count divergence vs /approvals. Pattern: when L-298/L-309 'count diverges across surfaces' triggers, look for parallel parsers — one parser is right number; two definitions of the same concept is the structural gap."
