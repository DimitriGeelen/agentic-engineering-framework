- id: L-425
  learning: "Watchtower contextual chrome that must update on navigation (breadcrumbs, pinned-page indicators, section sub-nav) MUST render inside #content, not in base.html. The nav swaps only #content via htmx (hx-target=#content); anything in base.html outside #content (e.g. the ambient strip) goes stale until a full reload. Pattern: a partial included by _wrapper.html for full loads AND prepended in render_page's htmx branch for htmx loads — replaced on every swap, always fresh. Avoids needing htmx hx-swap-oob. Origin: T-2009 (arc-007 S2b breadcrumbs)."
