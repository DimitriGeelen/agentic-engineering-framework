  context: Added via context agent
- id: L-586
  learning: "Inserting a new '## Heading' between '### Agent' and '### Human' silently orphans the Human ACs under the new heading and breaks the AC split that partial-complete detection reads. Done twice in one session, one task apart (T-2935, T-2937) — both times while adding a Decisions block, because the natural place to type it is right after the ACs you just ticked. The template already carries a '## Decisions' section further down; use it. Detection is cheap and should be reflexive after any edit near the AC block: grep -n '^## |^### ' on the task file and confirm '### Human' still sits under '## Acceptance Criteria'. The failure is invisible in the rendered file — the text reads correctly and only the machine-parsed structure is wrong."
