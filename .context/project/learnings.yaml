- id: L-422
  learning: "Post-compaction resume can surface a stale /tmp test-output artifact (e.g. /tmp/full_suite.txt) showing PRE-fix failures as if current. A /tmp file carries no provenance. Before treating it as current state, check its mtime against recent fix-commit timestamps (git log --format='%h %cd' --date=iso); if mtime predates the fixes, it is stale. Always re-run the suite from the committed tree as source of truth. Also confirm deterministic ordering (pip list | grep -i randomly) so a green run is reproducible, not luck."
