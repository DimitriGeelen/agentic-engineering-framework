  learning: "TermLink dispatch timeout: complex Rust coding tasks (modifying multiple crates, writing tests) can exceed the default 600s timeout. Use --timeout 900 for large tasks. If task times out, re-dispatch with simpler scope — split into minimal change + future enhancement."
