- id: L-583
  learning: "Mention-vs-instance, sharpened after three instances in one round (T-2929): the failure is not 'I confused two similar things' — it is 'I ran the CHEAP ADJACENT command and reported the EXPENSIVE answer'. Each of the three false claims I sent 832 was checkable in one command, and in each case the command I actually ran answered a neighbouring question that correlates with the real one most of the time. 'ls tests/fixtures/aef-bpmn/' answers is-there-a-file-at-this-PATH; I reported do-I-have-this-FIXTURE (I did — byte-identical, at another path, pinned by my own T-2706). Reading a peer's rail prose answers what-did-they-say-about-their-register; I reported what-their-register-requires (their bar was count equality; my report said it would close, it would not, and they nearly built a repair for a non-defect on my say-so). Remembering that I meant to file an observation answers what-did-I-intend; I reported what-is-in-the-inbox (nothing was). The reason none of these felt like guessing is that the adjacent command SUCCEEDS and returns well-formed output — the same shape as L-577's success-messages-composed-from-intent, one layer up: here the intent is the reasoning step, not the code. TEST BEFORE REPORTING A FACT ABOUT AN ARTEFACT: name the command whose output IS the claim, not a command whose output would usually accompany it. If the claim is 'X is absent' the command must search for X, not list a container X might be in. STRUCTURAL NOTE: outbound prose (rail posts, chat summaries, peer reports) is the one surface with no gate — task files hit P-010/P-011, commits hit commit-msg, observations at least land on disk where they can be re-read. A wrong claim there propagates to another party and gets acted on before anything can catch it, which is why the discipline has to be at authoring time."
  source: P-001
