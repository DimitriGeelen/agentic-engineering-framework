  context: Added via context agent
- id: L-585
  learning: "A peer's bug report against a VENDORED copy is a report about BYTES, not about whether the defect exists. 832 reported fw note discarding a 1200-char payload; the defect was real and was fixed here four days earlier (T-2867, 26 notes lost). My tree said fixed, theirs said broken, and both were correct about the code they were running. Before fixing OR dismissing a peer report, establish which version they ran — otherwise you write a second guard against a version that no longer exists, or you dismiss a live defect on the strength of your own HEAD. Neither side's register can see this gap: it is not an instrument failure and not a ledger failure, it is a distribution lag."
