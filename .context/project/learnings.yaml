  context: Added via context agent
- id: L-579
  learning: "SUCCESS MESSAGES COMPOSED FROM INTENT RATHER THAN FROM THE ARTEFACT are a distinct silent-failure family, and they cluster in the same file. 832's triage found four in agents/observe/observe.sh + agents/handover/handover.sh in one pass, all sharing one shape: the command succeeds, the output is well-formed, and the file does not get what the operator was told it got. (1) 'note dismiss --reason' echoed the reason and wrote only status — 81 dismissals here, 0 with a reason; (2) handover's observation listing printed '112 pending' above a list of 1; (3) 'note add' stores the literal string 'add' and discards the text; (4) 'note promote' puts the whole 300-700 char body in the task name. The common generator: the confirmation line is built from the PARSED ARGUMENTS, not read back from what was written, so it reports the operator's intent and is indistinguishable from reporting the outcome. Detection rule: any command whose success message interpolates a variable that was parsed from argv rather than re-read from the artefact is a candidate — grep for echo lines referencing a flag's local. Design rule: confirm from the file, not from the flag. Corollary on ratios: 1-of-112 is WORSE than 0-of-112, because a zero can read as 'nothing to show' while a single well-formed row under a large count reads as a section that worked."
  source: P-001
