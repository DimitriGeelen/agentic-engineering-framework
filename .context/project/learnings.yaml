- id: L-537
  learning: "A guard that resolves the consumer's identity INSIDE the source under suspicion cannot convict that source: a stale/foreign framework is precisely the repo that lacks the consumer's commit, so the lookup fails — and 'lookup failed' shared a return value with 'nothing was recorded', whose safe default is proceed. Two states with opposite evidentiary weight must not share one return value; absence-of-evidence and evidence-of-absence need different relations before they can have different defaults. T-2762: consumer downgraded 1.6.295 -> 1.6.121 while the run reported success."
