  learning: "TermLink worker shipping --status work-completed leaves an uncommitted frontmatter delta (status/owner/date_finished) after exiting. Mitigation: dispatch prompts should include 'commit the post-transition frontmatter as the final action' or the parent should sweep and commit. Origin: T-1951 worker, 4 commits + post-transition diff left to parent. T-1985 had same pattern (slice 7 commit + transition diff). Each worker session ends right after fw bus completion-summary; auto-modifications to frontmatter (last_update, post-status sovereignty flip) go uncommitted."
