- id: L-617
  learning: "A tuning threshold is chosen by reading the MARGINAL pair, not the hit rate. T-3056 measured floors 3/4/5 for open-task recall: floor 3 gave a 50% hit rate, which looks healthy until you read what scored exactly 3 — 'systemd template' matched against 'PreToolUse hook'. Floor 4 gave 22% and its marginal pair was T-1773 against T-1774, consecutive slices of one driver. The rate tells you how often the feature fires; only the marginal pair tells you whether firing was any good. Corollary: bound the test on BOTH sides — 0% means the floor is too high and the feature shipped as a silent no-op, near-100% means it is too low and every call gets noise. Neither failure is visible in the code."
  source: P-011
  task: T-3056
  date: 2026-08-17
  context: Added via context agent
- id: L-618
  learning: "Tokenizer and matcher must be the same function, or a comparison silently under-matches. T-3056 tokenized the query with re.findall(r'[a-z0-9]+') — which splits on underscore, yielding 'drift' from 'do_drift' — but searched the haystack with a \\\\b anchor, where underscore IS a word character, so \\\\bdrift never matched inside do_drift. The genuine relative T-1842 scored 2 instead of 3 and fell under the floor. What makes this class dangerous: the TUNING measurement used set intersection on both sides and was perfectly self-consistent, so the defect was invisible to the very experiment run to validate the threshold. Rule: when you compare two texts, extract tokens from both with one shared helper; never let one side be regex-anchored and the other split."
  source: P-011
  task: T-3056
  date: 2026-08-17
  context: Added via context agent
- id: L-619
  learning: "A uniqueness guarantee is only as wide as the set the allocator enumerates, and nothing forces that set to match the set the consumers write into. T-3052: four pickup directories declared together at lib/pickup.sh:23-26; the id allocator's loop listed three. The divergence is invisible at both ends — the constants look complete, the loop looks deliberate. Second half, and the more useful half: five of six sites shared the same unsafe clobbering mv and had never lost anything, not because the move was safe but because the allocator scanned their directories. Sibling safety is not evidence of local safety when the protecting invariant lives in another function. When you find one unsafe idiom, fix the idiom at every site rather than only where it currently fires — otherwise the next omission upstream re-arms all of them at once."
  source: P-002
  task: T-3052
  date: 2026-08-17
  context: Added via context agent
- id: L-620
  learning: "A block message is a UI, and gates are never tested as one. A hook is tested for its verdict — does it exit 2 — and a wrong verdict is loud. An unhelpful MESSAGE still exits 2, so it is invisible to every test, and invisible to the author, who already knows the answer the message omits. B-005 shipped in T-229 and no test read its text for ~15 months; the refusal said 'Changes to hook configuration require human review' and named no mechanism, while fw hook-enable had done exactly that job since T-1189. A consumer project filed the resulting dead end as a missing feature. Two failure directions, both real: under-informing makes people route around the gate, over-claiming makes them trust it past its reach — B-005 did both at once. Rule: when a gate refuses, the message must name the sanctioned route; and when you fix one, pin the text by test, including a check that no bypass env var was smuggled in beside the friendlier wording, because the failure mode of making a gate helpful is making it optional."
  source: P-002
  task: T-3050
  date: 2026-08-17
  context: Added via context agent
- id: L-621
  learning: "A gate that cannot finish inside the window bounding it does not block — it gets killed, and at the caller a killed gate and a refusing gate are usually the same branch. T-3062: pre-push audit grew to 347s against a 60s push timeout; four sessions read 'push failed' and none could tell the difference from 'audit refused'. When you bound a gate with a timeout, the timeout is 'gate cost + network', not a network budget, and the two numbers must be asserted against each other — each was independently plausible, only their relationship was wrong."
  source: P-011
  task: T-3062
  date: 2026-08-17
  context: Added via context agent
- id: L-622
  learning: "When a gate blocks on 'no verdict was produced' (lock contention, timeout, crash), that reasoning must propagate OUTWARD to every caller that can manufacture the condition — not just live inside the gate. T-2930 made audit exit 75 block rather than pass, correctly; the caller wrapping that same audit in 'timeout 60 git push' kept collapsing killed-gate and refused-gate into one branch for months. Ask: who else creates the verdict-less outcome this gate now refuses to treat as a pass?"
  source: P-011
