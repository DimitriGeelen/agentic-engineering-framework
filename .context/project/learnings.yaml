- id: L-522
  learning: "A blanket path allowlist rots the moment that directory gains GENERATED files. '^\\.agentic-framework/' was exempted because vendored files are duplicates scanned at their real source — true for files the vendor step COPIES, false for files it WRITES. '.upstream' exists nowhere else, so 'scanned at its real source' resolved to scanned nowhere. Two independent causes hid OBS-106 and fixing only the pattern still returned exit 0; had I trusted the pattern instead of re-running the scan, the task would have shipped a fix that changed nothing. Rule: exempt by enumeration, not by directory prefix, so a NEW entry is scanned until someone deliberately exempts it."
