- id: L-414
  learning: "AC parser comment-strip swallowed Agent ACs (CORRECTED ROOT CAUSE): bin/fw task update --status work-completed on T-1941 counted 1/1 AC (just the [REVIEW] Human AC) while the file had 7 ticked Agent ACs. Initial hypothesis (parser scopes to last ###-section) was WRONG. Actual root cause: agents/task-create/update-task.sh:check_acceptance_criteria() used 'sed /<!--/,/-->/d' to strip HTML comments. sed's range operator does NOT see the closing pattern on the SAME line as the opening — it waits for the next line containing -->. The template's one-line helper comment directly under ### Agent triggered delete-mode that stayed open until the closing --> of the ### Human multi-line example comment ~40 lines later, swallowing all 7 Agent ACs in between. RESOLVED: T-1967 ships two-step strip (sed -E 's/<!--[^>]*-->//g' first, then range for multi-line) at both call sites + regression test tests/unit/ac_counter_sed_range_one_line_comment.bats (5 tests including a repro). Sibling history: T-1620 fixed the same class in lib/inception.sh and lib/verify-acs.sh using Python re.DOTALL — those were already correct because Python handles same-line. The bug only existed in the sed-based consumer."
  source: P-010
  task: T-1687
  date: 2026-05-20
  context: "Surfaced during BVP arc closure batch (T-1937/T-1938/T-1940/T-1941); root cause diagnosed via reduced repro in tests/unit/ac_counter_sed_range_one_line_comment.bats; structurally resolved in T-1967."
  application: "Single-step sed range strip on HTML comments is unsafe for files where one-line comments precede multi-line ones. When stripping `<!-- ... -->` from any content, prefer Python re.DOTALL OR two-step sed (one-line first, then range). Detector: grep for 'sed.*<!--.*-->' in any code that processes templated task/doc files — review whether one-line vs multi-line ordering can vary."
  related: [L-415]
- id: L-415
  learning: "Hard-coded test-count in task ## Verification commands is brittle across sibling task additions. Pattern: 'grep -c \"17 passed\"' in T-1922 verification; T-1935 later added 26 tests to the same file → grep returned 0 → T-1922 completion gate blocked. Hit twice in one session (T-1922 and T-1923) for the same reason. Sibling tasks routinely add tests to a shared file (test_bvp_estimator.py grew 17 → 28 → 43 across 3 slices); whoever closes the parent task last is the one who pays. Fix pattern: use count-agnostic regex like 'grep -qE \"[0-9]+ passed\" <<<$out && ! grep -qE \"[0-9]+ failed\" <<<$out' — accepts any positive count, refuses any failed count, uses here-string to dodge SIGPIPE under pipefail. Detector: grep -rE '[0-9]+ passed' .tasks/ surfaces remaining instances for cleanup."
