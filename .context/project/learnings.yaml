- id: L-524
  learning: "Producer/consumer split, L-399 family, security variant: the framework ALREADY knew remote-origin URLs carry PATs — lib/consumer-recover.sh both strips URL userinfo and prefers the public 'github' remote over 'origin', with a comment saying so. That knowledge was applied where credentials were DISPLAYED and never where they were WRITTEN, so bin/fw put a live token into a tracked file for 7 weeks. Before writing a new redaction, grep for an existing one: if the codebase already solved the hazard on one side, the task is to share the implementation (one dialect, both callers source it), not to copy it. Also: strip alone would have left a private URL no outside consumer can clone — preferring the public mirror keeps the artefact both credential-free and usable."
