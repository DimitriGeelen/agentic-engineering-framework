- id: L-538
  learning: "An end-to-end test that asserts only on exit status measures the host, not the code. T-2762's first draft passed its 'refuses' test and failed its 'allows' test BEFORE the fix existed, because on that host `fw upgrade` aborts at step 4c (global shim resolving into a stale framework repo) and sets exit 1 either way. Both verdicts were correct-looking and both were about something else. For any e2e test of a guard: control the environment the command reads (HOME, PATH, shim), and assert on the guard's OWN message, not on a non-zero exit that any unrelated failure can supply."
