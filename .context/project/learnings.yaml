- id: L-364
  learning: "Cron 'wired' is not 'deployed'. The chain is registry (.context/cron-registry.yaml) → fw cron generate → .context/cron/agentic-audit.crontab → fw cron install → /etc/cron.d/agentic-audit-<slug>. Skipping any link leaves the daemon blind. T-1767 found 24+ hours of silent non-firing on escalation-scan-v0.5 because someone manually edited the generated crontab file (May 5) without updating the registry — `fw cron install` would have overwritten the manual edit anyway because it regenerates from registry. Verification of cron-touching tasks must include `grep <pattern> /etc/cron.d/<file>`, NOT a grep against the repo file. Same family as G-066 §ACD substrate-vs-deliverable conflation: T-1727 verified the substrate (file artefact contains the line) but never confirmed the deliverable (cron daemon fires the job)."
  source: P-002
