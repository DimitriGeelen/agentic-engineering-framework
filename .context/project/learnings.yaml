- id: L-567
  learning: "A field written with a placeholder at birth destroys the signal it exists to carry: 'nobody filled this in' becomes textually identical to 'someone considered it and this is the answer'. Measured on learnings.yaml application: 572/604 (94.7%) literal 'TBD', 21 (3.48%) genuinely hand-written — 832 independently measured 2.3% on the same field shape in their tree. Four generation sites wrote it, not the two originally named, and the extra one was found only by enumerating rather than assuming the report was complete. Remedy per L-559: stop writing it at the site of GENERATION; absence is the honest signal. Do not rewrite existing rows — what was written is a record."
