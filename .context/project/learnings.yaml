- id: L-392
  learning: "Episodic generator (agents/context/lib/episodic.sh) emitted YAML with unescaped backticks inside double-quoted scalars in four sibling emission sites: decisions, outcomes, challenges, artifacts. Result: yaml.scanner.ScannerError 'found unknown escape character' or 'found character `\\`` that cannot start any token' when downstream consumers tried to load the artefact. Closure flow continued (task moved to completed/, status updated), but the episodic was unreadable — invisible to fw recall / fw timeline. Fixed (T-1871 decisions, T-1873 outcomes/challenges/artifacts): switched to single-quoted YAML scalars with `'→''` escape across all four sites. Uniform escape strategy means the next class of special character can only break in a known, narrow way. Audit revealed 19 pre-existing corpus victims (T-1369 through T-1750); all mass-regenerated against fixed substrate. Prevention: tests/unit/episodic_yaml_decision_escape.bats (9 cases — source-level invariants + 4 hostile-input parse cases); tools/episodic-corpus-check.py (full-corpus parse audit, wired into T-1873 Verification). META-LEARNING: T-1871 fixed only the decisions site even though the same anti-pattern existed at 4 sites — symptom-sized scoping ('this section is broken') vs root-sized scoping ('this escape strategy is broken in this script') is a recurring §ACD failure mode. When the same byte-sequence-handling bug appears once, grep the file for sibling occurrences before scoping the fix."
