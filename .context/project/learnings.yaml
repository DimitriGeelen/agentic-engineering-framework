- id: L-521
  learning: "A detector's INDEXING STRATEGY, not its pattern count, determines what it can never see. The secret-scan catalogue was entirely issuer-indexed (AKIA, ghp_, sk-ant-, xox) and so could not reach credentials identified by POSITION rather than shape: a token in a URL userinfo field carries no issuer marker at all. The catalogue header codified the exclusion as policy ('prefer specific over generic'). When auditing any detector ask what its indexing strategy excludes BY CONSTRUCTION, not merely which patterns are missing — the second question finds gaps, the first finds blind spots."
