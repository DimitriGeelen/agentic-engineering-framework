  learning: "A rule stated only in a code comment is a curation discipline, not a constraint: T-2897 wrote 'a pair that one word can complete is not a pair' and then satisfied it by hand-curating two word lists — it survived one word addition and failed on the next, eight lines below itself (pass inside password). Enforce the rule in code or the next author re-breaks it."
