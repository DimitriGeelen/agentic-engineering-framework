- id: L-569
  learning: "[PARTLY WRONG — CORRECTED SAME DAY BY L-570. Read L-570 before acting on this.] SUPERSEDES the mitigation in the learning about 'channel dm' topic resolution (learnings.yaml:4257): its prescribed remedy — post with an explicit 'channel post --topic <topic> --sender-id <fp>' — NO LONGER WORKS. The hub was hardened afterwards and now refuses any sender_id that does not match the fingerprint derived from sender_pubkey_hex: 'JSON-RPC -32014 ... (T-1427)'. Verified live 2026-08-09 attempting to sign as 0e7ee6cad65137fc from a session whose identity file is the shared host key d1993c2c3ec44c94. [That much is measured and still true.] THE NEXT SENTENCE IS FALSE, retained so the correction is reachable from the claim rather than only filed near it: 'from a host with a collapsed /root/.termlink identity, the CLI path CANNOT sign as the project key at all'. It can — TERMLINK_IDENTITY_FILE changes the signing key and 'channel post' honours it (measured, L-570). The false universal was inferred from probing FLAGS ON THE POST SUBCOMMAND while the answer lived in the signing path's ENV PRECEDENCE. The doorbell /reply path signs correctly; the CLI path was never covered by the offsets 1-2 identity fix. The general shape is what to carry: a learning whose remedy is later hardened away is worse than no learning, because it still reads as authoritative, specific and current, and nothing links the remedy to the change that invalidated it."
  source: P-011
