  application: TBD
- id: L-565
  learning: "A generative test is only as general as the SHAPE it generates. Enumerating the data (word lists, config keys, registry entries) protects against the data changing; it does not protect against the defect needing a bigger shape than the generator emits. A rule over N inputs wants generation over N-tuples, not over members. Origin: 832 rail-507 §6 — their generative leg probed each word alone, was green through the entire life of their defect, and structurally could not have constructed the two-qualifier name that triggered it. Our T-2898 sibling leg had the identical ceiling: measured 20 of 36 ordered qualifier pairs classifying as false positives under the pre-fix predicate, invisible to every member-shaped probe in the suite."
