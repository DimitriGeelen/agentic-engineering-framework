- id: L-515
  learning: "Broad 'except Exception' around a cross-module call converts OUR OWN programming errors into legitimate-looking return values. T-2685: corpus explain caught a TypeError from an arity drift (T-2654 added a param) and rendered it as 'rail unreadable', downgrading the rail-anchor map's authority stage to transitional-subordinate — a value that is CORRECT for most maps, so the wrong answer was indistinguishable from a right one. Undetected for the whole T-2654..T-2685 window despite 3 red tests, because nothing runs a suite at task close unless that task's own Verification block names it. Rule: narrow the catch to the module's declared load-error type, and pin the SWALLOWING property (non-load errors must propagate) rather than the current signature shape — a signature assert only restates today's arity."
