  application: TBD
- id: L-532
  learning: "When sweeping for checks that report about the wrong object, RUN the checks — do not grep them. A grep-based sweep is itself a measurement scoped by whatever line it happens to hit, so it reproduces the defect class it is hunting. Concrete: grep -m1 '^# VERSION=' on agents/git/lib/hooks.sh returns 1.10, but that file embeds four hook scripts each with its own version line (1.10, 1.2, 1.6, 1.5); reading the first match as 'the file's version' produced a false drift report and a false 'this task can never pass' claim, both published to a peer project before any check was executed. Running the eight checks took one command and showed all eight passing. Rule: when a cheap direct oracle exists (execute the assertion), a static proxy is not a shortcut, it is a second instrument that needs its own control."
  source: P-001
  task: T-2719
  date: 2026-08-02
  context: Added via context agent
  application: TBD
- id: L-533
  learning: "Sibling-site sweeps need an enumerating guard, not a memory of which sites were converted. L-392 named the double-quoted-YAML-scalar class in agents/context/lib/episodic.sh; T-1871 fixed one site and T-1873 fixed three more, but the git-timeline site twenty lines below survived eleven weeks because nothing could distinguish 'converted the ones we found' from 'converted all of them'. Two compounding causes: (1) the sweep was by inspection, so its completeness was unrepresentable; (2) the regression test re-typed the writer's sed chain into a local helper instead of running the writer, so it could only ever check sites its author already knew about — it stayed green throughout the corruption. Fix shape: a source-derived predicate over the file's SHAPE with no maintained allowlist (no line may write an interpolated value into a double-quoted YAML scalar), plus end-to-end tests that drive the real producer. When you fix N instances of a class in one file, ask what would fail if there were an N+1th."
  source: P-001
