    unverified, policy unconsulted." Distinct from G-019 (treats symptom-level fixes as complete)
    in that this is about ARC-COMPLETION rather than BUG-COMPLETION — different failure mode,
    same family.

    '
  spec_reference: CLAUDE.md §Post-Fix Root Cause Escalation (G-019), §Verification Before Completion,
    §Inception Discipline; docs/reports/T-1641-orchestrator-arc-reconsideration.md
