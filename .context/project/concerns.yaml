- id: G-091
  type: gap
  title: BPMN compiler calls the frozen standard lane value external a probable typo and emits a task
    the standard says must not exist
  description: 'Inbound field report from 001-CashWeb-Lightspeed-Ecwid-integration (their G-055), reproduced
    independently at HEAD before registration. policy/standards/aef-bpmn-mapping-v1-partI.md is ''Part
    I — Frozen (v1)''; its §3 line 68 ratifies a FOUR-value collapse map for the lane authority-of-record:
    sovereignty→human, initiative→agent, authority→agent, external→no task. tools/bpmn_to_tasks.py encodes
    THREE: AUTHORITY_OWNER (:71) holds sovereignty and initiative, AUTHORITY_NO_OWNER (:83) holds authority,
    and AUTHORITY_DIALECT (:85) is their union. `external` is in neither set, so a conformant external-laned
    diagram falls to the else-branch (:511-521) and is told the ratified value is ''very likely a typo
    or an out-of-band value''. The message is the lesser half. Confirmed on a minimal one-lane fixture
    at HEAD: the node does not merely warn — it falls through to name/type derivation and COMPILES TO
    A TASK WITH owner: agent, the exact inverse of the ratified external→no task. The compiler therefore
    emits an AEF task asserting that an agent performs work which by definition happens outside AEF.'
  spec_reference: policy/standards/aef-bpmn-mapping-v1-partI.md §3 line 68 (Part I — Frozen v1, IW-9/v1.1)
  severity: high
  status: open
  detected_in: T-3172
  observed: '2026-08-26'
  reported_by: 001-CashWeb-Lightspeed-Ecwid-integration (their G-055)
  blast_radius: cross-project
  what_works_now: 'T-2717/OBS-118 already solved this exact shape once, for a sibling value: it split
    the single ''unrecognized'' warning channel in two so that `authority` — a legitimate dialect value
    carrying no owner — stopped being reported as a probable typo, on the L-527 reasoning that a signal
    which always fires stops meaning anything. That fix is sound and stands; `external` was simply not
    carried through the split, so it inherited the accusing branch.'
  what_remains: 'The fix must implement the ratified SEMANTICS, not just soften the wording. `external`
    joins AUTHORITY_DIALECT and additionally suppresses task emission for nodes in that lane — a THIRD
    branch, since AUTHORITY_OWNER and AUTHORITY_NO_OWNER both still emit a task. A message-only change
    would leave the spurious owner:agent task in place, which is the damaging half. Separately, three
    vocabularies now disagree: the frozen standard has 4 values, the pinned reference editor 0.11.0 has
    5 (it adds `none`, which is NOT in the frozen standard — there the EDITOR is the deviant party), the
    compiler has 3. `none` must not be folded into this fix; it is a deviation in the opposite direction.
    Root enabler: §6 asserts the frozen governance meta-key list is machine-checked against the reference
    editor and bridge, but the LANE DIALECT is not covered by that check — which is how a four-value ratified
    map and a three-value implementation coexisted undetected.


    REPRO NARROWED 2026-08-26 by the reporter, confirmed locally: the authority check runs only for task
    nodes (:424 continue past non-TASK_TAGS), so this entry''s repro is specifically a TASK in an external
    lane, not an external lane in general. Both halves of G-091 stand for that case — wrong message AND
    owner: agent instead of no task. The events-only case is silent instead, and is split out as G-093
    / T-3173.


    EDITOR EVIDENCE VERIFIED 2026-08-26, AND ONE PROPOSED SHORTCUT REFUSED. The reporter supplied file-level
    proof of the editor vocabulary after we asked for it. Verified byte-for-byte: vendor/designer/aef-workflow-designer-0.11.0.html,
    966087 bytes, sha256 prefix 4f20b146def45626436e3b3c, lines 1608 / 1906 / 5506 exactly as reported.
    Two corrections follow.


    (i) The premise of our request was wrong. We told them editor 0.11.0 "is not in this repo". It is
    — two identical vendored copies at a pinned sha. This entry''s root enabler ("the lane dialect is
    not covered by the SS6 machine-check against the reference editor") is therefore stronger than written:
    the reference artifact was never unavailable, so the check has been implementable with no new dependency
    the whole time. Carried into G-095.


    (ii) The reporter reads OWNER_FROM_AUTHORITY''s `external: ''''` (:1906) as "the editor already implements
    external -> no task; your compiler is the only one of the three that does not; adopting external:
    '''' is enough." REFUSED on evidence, because adopting it would produce a false green here. The sole
    consumer of ownerFromAuthority is :5790, a read-only property-panel readout rendering "— none —";
    the editor has no task-emission surface at all, so it cannot implement "no task" — there is nothing
    there to suppress. Its comment at :1902-1905 claims the mapping mirrors the standard; the comment
    agrees with the standard, the code implements no-owner. The gap is invisible in the editor precisely
    because nothing downstream of it emits tasks, and load-bearing in our compiler, which does. Mapped
    into our code, "adopt external: ''''" means adding external to AUTHORITY_NO_OWNER — a class that per
    T-2567/T-2717 STILL emits the task and falls back to name/type derivation, i.e. owner: agent. That
    is today''s broken behaviour with a politer message: it satisfies the message half of T-3172 and silently
    fails the load-bearing AC. The third-branch requirement recorded above is what protects this entry
    from that shortcut, and it stands unchanged.


    So there are four semantics in play, not three vocabularies: no-owner-but-task (compiler, `authority`),
    no-owner-in-a-readout (editor, `external`), no-task (the frozen standard, `external`), and unset (editor,
    `none` — now G-095 / T-3176). This entry''s existing instruction that "none must not be folded into
    this fix" is upheld; what changed is that none now has its own home rather than only a warning.'
  related:
