  description: "web/app.py:97 csrf_protect() skips CSRF validation for any request whose path starts with `/api/`. Several /api/ POST endpoints are state-mutating: POST /api/session/init shells to `fw context init` (writes .context/working/), POST /api/healing/<task_id> shells to `fw healing diagnose`, POST/DELETE /api/sessions create/destroy terminal sessions. Confirmed today: `curl -X POST http://localhost:3000/api/session/init` returns 200 with no token. Same-origin form POSTs from a malicious page would succeed. Surfaced by 050 e-agent during a wrong-class-B-CSRF investigation; their re-test correctly identified this as a separate finding (not the original Class B claim, but a real gap)."
