  severity: high
  likelihood: 5
  impact: 3
  score: 15
  ranking: high
  evidence:
  - 'Same-day incident triplet (2026-04-11): (a) ring20-dashboard onboarding — `fw upgrade` was the canonical answer, neither agent nor evaluator knew (G-025); (b) /opt/termlink T-909 — `fw vendor` exists
    at bin/fw:3359 but is not in CLAUDE.md (F4 evidence under G-031); (c) THIS session — agent dispatched 4 TermLink workers in parallel without `--task`, all 4 failed identically with "Missing --task —
    TermLink workers require a task reference for governance (T-652, T-630)". CLAUDE.md Quick Reference table for `fw termlink dispatch` says `--name N --prompt P [--project DIR] [--model M]`. The `--task`
    parameter is REQUIRED but NOT listed. T-652 added the requirement; CLAUDE.md was never updated.'
