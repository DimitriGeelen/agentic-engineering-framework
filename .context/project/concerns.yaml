  - 'T-1673 (completed 2026-05-02): cross-repo fabric cards (absolute paths, T-1652) falsely reported
    as orphan — `[ ! -f "$PROJECT_ROOT/$loc" ]` assumed all locations were PROJECT_ROOT-relative. Same
    conflation, different surface (fabric drift).'
  - 'This-session anchor (2026-05-02): `bin/fw config list` from the framework repo prints "No .framework.yaml
    found at ..." and exits 1 — same error a broken consumer sees. lib/config-file.sh:177-181 hard-fails
