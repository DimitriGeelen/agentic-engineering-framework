- id: G-088
  type: gap
  title: The empty-registry skip makes a check that compared nothing render as a check that found nothing,
    and the remedy it suggests erases the schedule
  description: 'Second-order residue of OBS-249 / T-3070. T-3070 stopped the two cron lanes from both
    WRITING (`fw audit schedule install` now execs `fw cron install` when a registry exists), but shipped
    no transition for projects whose deployed jobs came from the legacy heredoc lane while their .context/cron-registry.yaml
    is still the `jobs: []` that `fw init` seeds. For those projects the delegation makes the outcome
    worse, not better: the legacy command now regenerates from an empty registry.

    Reproduced at HEAD v1.6.78: registry `jobs: []`, deployed target carrying two live job lines. `fw
    cron install` printed the deletion as a diff and replaced both the git-tracked source and the deployed
    target with a six-line header-only file. No refusal, no warning, exit 0.

    Compounding false-green: the T-2844 empty-registry guard in bin/fw do_doctor (bin/fw:3134) and agents/audit/audit.sh
    (audit.sh:2350) skips the drift checks whenever job count is 0, without testing whether the deployed
    target exists. So a project with ten jobs running and 622 cron output files present gets "SKIP Cron
    drift checks skipped — registry declares no jobs (nothing to generate)" and Watchtower /cron renders
    "0 jobs — No jobs in cron registry". The page does not hedge; it asserts absence. That assertion is
    what sent the reporting operator to file a "our cron jobs are not installed" report.

    The dangerous composition: the obvious response to that page is `fw cron install`, the command the
    page itself suggests — which is the command that erases the ten running jobs.

    T-2844 was right that a freshly initialised project has no generated form and should not WARN. It
    is wrong that job count alone settles the question: `jobs: [] AND target exists` is not a fresh init,
    it is an unmigrated project, and those two states are currently indistinguishable to both surfaces.'
  spec_reference: 'CLAUDE.md §Verification Gate (P-011) — Cron-touching tasks: the chain is registry →
    generated → deployed, three transitions, three drift classes'
  severity: high
  status: open
  detected_in: T-3161
