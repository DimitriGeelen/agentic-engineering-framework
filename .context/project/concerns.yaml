- id: G-089
  type: gap
  title: The cron generator masks every job's exit status behind a logger pipeline, removing the only
    machine-readable failure signal
  description: 'Both generators — bin/fw `cron generate` (bin/fw:5265-5270) and lib/cron_dry_run.py:79-83
    — rewrite each command to `<cmd> 2>&1 | logger -t agentic-cron`, replacing any existing `2>/dev/null`.
    A pipeline exits with the status of its LAST component, and `logger` always succeeds.

    Reproduced, not inferred: `false 2>&1 | logger -t probe` -> status 0; `set -o pipefail; false 2>&1
    | logger` -> 1; `false 2>&1 | logger; exit ${PIPESTATUS[0]}` -> 1.

    Consequence: cron still emits "CRON ... exited with status N" for a failing job in the un-piped form,
    but under the generated form it always sees 0. No MAILTO is set, so no mail is generated either. The
    only surviving trace is syslog text under tag agentic-cron, which nothing reads on a schedule. A crashed
    nightly audit is indistinguishable from a successful one at every automated surface.

    This is a partial regression of the intent behind the framework''s own cron drift work: the three-transition
    chain (registry → generated → deployed) is now gated, but the fourth transition the framework already
    names as ungated — deployed → executable, L-365 — is precisely the one this masking hides. Every exec-time
    failure class L-365 describes (cwd, env, missing module) reaches cron as exit 0.'
  spec_reference: L-365 (deployed → executable is a separate state; "wired" is not "deployed", "deployed"
    is not "executable")
  severity: medium
  status: open
  detected_in: T-3162
  observed: '2026-08-26'
  reported_by: 001-CashWeb-Lightspeed-Ecwid-integration (their T-151 / G-052, vendored v1.6.29)
  blast_radius: cross-project
  what_works_now: 'The T-1720 change this stems from is a real gain and must be kept: before it, cron
    lines ended in `2>/dev/null` and stderr was discarded outright. Piping to logger puts it in `journalctl
    -t agentic-cron`, which is recoverable forensics. The reporter states this explicitly and does not
    ask for a revert.'
  what_remains: 'Append `; exit ${PIPESTATUS[0]}` to each generated line, in BOTH generators, so the job
    status survives the pipe. Do not use `SHELL=/bin/bash -o pipefail` in the generated header: cron.d
    treats SHELL as a bare executable path and does not word-split arguments, so that form is not portable
    — the reporter reached the same conclusion from the other direction and preferred the per-line form.
    Parity requirement: bin/fw `cron generate` and lib/cron_dry_run.py must change together or the registry→generated
    drift check will report permanent false drift (they are content-compared).'
  related:
  - T-3162
  - T-1720
  - T-1944
  - L-365
  follow_up_task: T-3162
- id: G-090
  type: gap
  title: fw cron generate/install accept an id-less job that every cron read path requires, installing
    a live schedule with no control surface
  description: 'Inbound field report from 001-CashWeb-Lightspeed-Ecwid-integration (their G-054), reproduced
    independently at HEAD before registration. `fw cron generate` reads every job field through .get()
    with a default (bin/fw:5188-5192: schedule, command, name, status) and never references `id` at all,
    so a job with no id passes generate and install cleanly: exit 0, valid crontab in /etc/cron.d, jobs
    actually running. Every read path treats id as mandatory. `fw cron list` and `fw cron run` interpolate
    j["id"] directly and raise KeyError: ''id''; web/blueprints/cron.py:_find_job (:62-65) matches job.get("id")
    == job_id and never matches None, so the Watchtower pause (:356) and resume (:374) endpoints return
    404. The net state is a schedule that is installed, live and firing, but cannot be listed, run by
    hand, paused or resumed. Reproduced 2026-08-26 in a scratch PROJECT_ROOT: generate exit 0; list exit
    1, emitting its header line ''Cron registry: 1 jobs (1 active, 0 paused)'' and then dying on the very
    job it just counted — the PL-020 shape, a counter reporting work it could not process.'
  spec_reference: CLAUDE.md §Verification Gate (P-011) — Cron-touching tasks (registry → generated → deployed)
  severity: high
  status: open
  detected_in: T-3171
  observed: '2026-08-26'
  reported_by: 001-CashWeb-Lightspeed-Ecwid-integration (their G-054)
  blast_radius: cross-project
  what_works_now: Registries created through the framework's own seeding path carry ids, so the defect
    is invisible to projects that never hand-authored or derived a registry. The reporter hit it while
    migrating from `fw audit schedule` to `fw cron` by deriving a candidate registry from the RUNNING
    crontab — a crontab carries no job ids, so the derived registry had none. A manual checkpoint in their
