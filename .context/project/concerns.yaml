  title: Orchestrator substrate has zero production consumers — arc shipped infrastructure, not behaviour
    change
  description: 'The orchestrator-rethink arc (T-1641 anchor) declares the headline_mechanic "agent dispatches
    a task without specifying a model → orchestrator picks the model based on task_type and historical
    success rates → user observes the routing decision live on /orchestrator and watches per-task-type
    model preferences shift as the route_cache learns" as verified after T-1669 (demo) + T-1678 (still
    firing) + T-1680 (live re-test) + T-1682 (failure path) + T-1681 (observability fix). All five were
    synthetic dispatches invoked manually by an agent during verification work.

    Audit shows: zero cron jobs dispatch through the orchestrator. Zero framework subsystems autonomously
    call `fw termlink dispatch`. The dispatch preamble (`agents/dispatch/preamble.md`) is documentation
    telling agents they CAN use it; nothing in the framework''s everyday workflow actually DOES. The route_cache.json
    on this host has FIVE keys, every single last_used timestamp from today, all of them populated by
    verification sessions, not by real workload. The cache will go cold the moment verification work stops.

    This is the §ACD substrate-vs-deliverable conflation in its cleanest form — the arc shipped a TOOL
    that works when invoked. Nothing INVOKES the tool autonomously. "Preferences shift as the route_cache
    learns" requires an autonomous workload exercising the substrate; there is none.

    The user pattern-matched this immediately on the 2026-05-02 14:48Z message "we again are missing on
    essential". This is the 5th-incident agent self-application failure on this arc (after T-1626, T-1633,
    T-1641 reconsideration, T-1667 RCA, T-1670 4th-incident).

