    '
- id: G-077
  type: gap
  title: Safe-listed interpreter defeats the Bash task gate — writes reach disk with no task and no audit
    trail
  description: '`is_bash_safe_command` safe-lists `python3 -c` behind a TEXTUAL deny-list of write indicators.
    Seven ordinary write idioms match none of it and carry no shell redirect, so both predicates pass
    and check-active-task.sh exits 0 BEFORE the no-active-task check, the task-is-active check, G-020
    and the T-1730 focus-drift gate. Measured against the real hook with current_task: null — pathlib
    write_text/write_bytes, os.replace, subprocess.run, Path.unlink, print(file=open(p,"a")), and subprocess.call(cmd,
    shell=True). Exposure here: 107 subprocess sites, 72 write_text, 36 os.replace. os.replace is our
    OWN documented atomic-write idiom (T-100191/L-493), so this is the shape house style teaches, not
    an exotic bypass.

    Failure direction is the dangerous one: false NEGATIVE. Every gate skipped, nothing written to the
    bypass log, so after the fact it is indistinguishable from compliance.

    BOUND (832 rail 470, verified here): the bypass requires EVERY pipeline segment to be safe-listed,
    not merely python3 and not python3 leading. So the population is smaller than "any command containing
    python3 -c". This does NOT rescue the gate — the widest shapes are already open: bare form ALLOWED,
    `cat f | python3 -c "<write>"` ALLOWED, `cd /tmp && python3 -c "<write>"` ALLOWED. A non-safe-listed
    segment (e.g. termlink) is what blocks the rest, incidentally rather than by design.

    EXTENSION FOUND HERE (not in 832 rail 470): `curl -s http://host | python3 -c "<write>"` is ALLOWED,
    because curl is itself safe-listed. That is remote content reaching the filesystem with no active
    task, no focus check and no bypass-log entry — the sharpest shape in the set, and it follows from
    two independently reasonable allowlist entries composing. The remedy must therefore not be "safe-list
    fewer helper commands": the bare form is the widest case and is open without any helper at all.

    '
  spec_reference: CLAUDE.md §Enforcement Tiers (Tier 0 scope boundary, same family); OBS-184/185
  severity: high
  decision_trigger: An agent is found to have written source files during a no-task, drift, or completed-focus
    state with no corresponding entry in .gate-bypass-log.yaml.
  trigger_check:
    type: manual
    hint: source agents/context/lib/safe-commands.sh; then check that is_bash_safe_command "python3 -c
      \"import os; os.replace(a,b)\"" returns non-zero. Returns 0 (=allowed) while this gap is open.
  status: watching
  created: 2026-08-08
  related_task: T-2876
  what_remains: 'PREVENTION NOT SHIPPED. Closure condition, stated explicitly because the obvious move
    does not satisfy it: ADDING THE SEVEN MEASURED IDIOMS DOES NOT CLOSE THIS. 832 (their G-025) established
    that `subprocess.call(cmd, shell=True)` carries no textual signature at all — the command is in a
    variable — and re-admits every pattern the deny-list denies, including the five os.* names it explicitly
    lists. So one permitted entry grants what the list exists to withhold; enumeration is not a slow fix,
    it is void. Nor does the probe existing close it: a census that reports a known-open gap every run
    is a description, not a prevention. Closes only when a safe-listed interpreter cannot reach the filesystem
    BY CONSTRUCTION. Direction GO-decided under T-2876; scope (python3 alone vs every interpreter) is
    IW-3, open. Cross-registered with 832 G-025. Artifact: docs/reports/T-2876-interpreter-write-gate-bypass.md.

    '
- id: G-078
  type: gap
  title: The task gate blocks the actions its own advice depends on — third instance, still discovered
    one verb at a time
  description: 'Completing a task nulls focus. The framework then PRESCRIBES capture: record the learning,
    note the observation, generate the handover (CLAUDE.md §Session End Protocol, §Bug-Fix Learning Checkpoint).
    Every one of those was refused by the Bash gate in exactly that state, because the safe-list enumerates
    permitted verbs and nobody had added them. There is no honest way to satisfy the gate either: creating
    a task in order to record why the previous one closed is fabrication.

    This is the THIRD instance of one shape, not three bugs. T-2052 — the gate blocked `fw task create`,
    which is what its own block message tells the agent to run. T-2054 — the gate blocked `git commit`,
    which P-009 mandates. T-2878 (this) — the gate blocked the capture verbs. Each was found in the field,
    fixed by appending one more verb to the case statement, and closed. The shape survived all three fixes
    untouched.

    Failure direction: the omission cannot report itself. A blocked capture verb leaves no record of having
    been wanted — refusing `fw note` destroys the very artifact that would have made the refusal visible.
    So the register of instances is not a sample of the problem; it is a sample of the moments an agent
    happened to have enough budget left to complain in prose instead.

    '
  spec_reference: CLAUDE.md §Session End Protocol; §Bug-Fix Learning Checkpoint; §Enforcement Tiers
  severity: medium
  decision_trigger: A fourth verb that the framework prescribes is found to be refused by a framework
    gate in the state that framework prescribes it for.
  trigger_check:
    type: manual
    hint: Enumerate the commands CLAUDE.md instructs the agent to run AFTER --status work-completed, then
      check each against is_bash_safe_command with current_task null. Any that return non-zero are the
      next instance.
  status: watching
  created: 2026-08-08
  related_task: T-2878
  what_remains: 'PREVENTION NOT SHIPPED. Closure condition, stated explicitly because the obvious move
    does not satisfy it: ADDING THE SIX CAPTURE VERBS DOES NOT CLOSE THIS — that is the same fix applied
    for the third time, and it is what left the shape intact after T-2052 and T-2054. The gap is that
    a prescribed-action set and a permitted-command set are maintained in two places by two different
    mechanisms (prose in CLAUDE.md, a case statement in safe-commands.sh) with no check that the second
    covers the first. Closes when that parity is checked rather than remembered — e.g. the prescribed
    set is declared once and the safe-list is derived from it or audited against it. Polarity note: this
    is the ALLOW-list twin of G-077, which is the DENY-list side of the same defect — neither list can
    name every case, both grow only by field discovery, and both are silent when wrong. Sibling on 832
    as their T-390.

    '
- id: G-079
  type: gap
  title: grep-scans over the YAML memory corpus are re-derived per site, so one serialisation change silently
    breaks an unknown number of them — fourth instance
  description: '.context/project/{learnings,patterns,decisions}.yaml are read by hand-written grep patterns
    at many independent sites, each encoding an assumption about how the YAML is serialised. On 2026-04-13
    T-1232''s mining run rewrote learnings.yaml with yaml.dump(sort_keys=True), moving `id:` off the list-item
    line. Every scan keyed on the old shape began matching zero rows. Because max-over-nothing and count-over-nothing
    both return the seed value, each break is silent and looks like a legitimately empty corpus. Four
    sites are known to have broken this way, discovered one at a time over four months, each fixed by
    widening a regex: (1) agents/context/lib/learning.sh — the L- allocator re-minted L-001 over a live
    L-001, 24 duplicate ids, fixed T-1369 by adding the other format; (2,3) agents/healing/lib/resolve.sh
    — FP- and L- allocators blind to column-0 entries, "every run re-minted the same id", fixed T-2672
    / 832 T-295, again by widening; (4) agents/context/lib/status.sh:55 — `fw context status` has reported
    "Learnings: 0" against a 608-entry file for 119 days and is still broken (T-2906). Its sibling counters
    for FP-/SP-/WP-/D- still work only because patterns.yaml and decisions.yaml happened not to be rewritten,
    which is why three of four numbers looked right. The count of four is a lower bound on discovered
    sites, not a measurement of exposed ones. Nobody has enumerated how many grep-scans over these files
    exist.

    '
  spec_reference: CLAUDE.md §Context Integration; §Error Escalation Ladder (Level C vs D)
  severity: medium
  decision_trigger: A fifth site is found broken by the same serialisation assumption, OR a second corpus
    file (patterns.yaml / decisions.yaml) is rewritten by a bulk process and breaks its readers.
  trigger_check:
    type: manual
    hint: 'grep -rn "id: [A-Z]\+-" --include=*.sh --include=*.py bin lib agents web and check each pattern
      against the CURRENT serialisation of the file it scans. Any pattern that returns 0 on a non-empty
      file is a live instance. Cheap version — `fw context status` showing a 0 next to a non-empty file.

      '
  status: watching
  created: 2026-08-10
  related_task: T-2902
  what_remains: 'PREVENTION NOT SHIPPED. Closure condition, stated because the obvious move does not satisfy
    it: FIXING status.sh''s REGEX DOES NOT CLOSE THIS — that is the same fix applied for the fourth time,
    and it is precisely what left the shape intact after T-1369 and T-2672. Widening a pattern makes it
    match today''s two known serialisations; it does not make the site notice when a third arrives. Closes
    when reading the corpus stops being re-derived per site — one parser (or one scan helper) that the
    allocators and counters share — or, weaker but real, when a scan that returns zero rows against a
    non-empty file fails loudly instead of returning the seed. The distinguishing test: after the fix,
    could a NEW serialisation break a site silently? If yes, the gap is open. Class sibling: L-570 (fw_config
    2>/dev/null read identically to "not configured"). Same defect at a different layer — a failed read
    and a true negative are the same observable event.

    '
- id: G-080
  type: gap
  title: the enforcement baseline cannot name what changed, and its own printed remedy launders a deleted
    gate into a green doctor
  description: 'Losing a framework enforcement hook — including check-tier0, the only gate on destructive
    Bash — can end in a state where every surface that watches reports green, with the framework''s own
    printed instructions followed at each step.

    Three defects compose. D1: `fw hook-enable` registers a hook and NOTHING deregisters one, so removal
    is hand-edited JSON against the single file holding check-tier0, check-active-task, budget-gate and
    13 others. D2: detection is one sha256 over the whole hooks blob (bin/fw:2248), so a benign addition
    and a check-tier0 deletion are byte-identical events at the only surface that watches — measured 2026-08-10,
    both print `FAIL Enforcement baseline CHANGED`. D3: that FAIL''s printed next step, `fw enforcement
    baseline` (bin/fw:7748), recomputes unconditionally over whatever is on disk and never diffs against
    the prior baseline, so following the instruction makes the loss permanent and the next doctor run
    OK. A PostToolUse hook (check-settings-edit, T-1886) actively nudges toward that remedy after every
    settings.json edit.

    D3 is why this is a gap and not untidiness: the recovery path erases the witness the detector produced.
    Afterwards the green reading is indistinguishable from a correct one and no artefact records that
    a gate was dropped.

    Origin: 832 rail 517 s5 reported D1 after their probe-hook cleanup removed check-tier0 for two tool
    calls (restored byte-exact, human caught it). D2 and D3 are ours and were not in their report — found
    by checking whether their finding was worse here. It is: their accident was caught in two tool calls;
    ours has a documented, nudged path that would have made it silent.

    '
  status: watching
  created: 2026-08-10
  related_task: T-2909
  what_remains: 'PREVENTION NOT SHIPPED. The fix direction is measured, not guessed: S1 diffed the hook
    set at all 28 revisions of .claude/settings.json and found ZERO legitimate removals in 5 months —
    all 3 apparent removals are renames (T-496) or matcher moves (T-1364, T-1730). So a name-keyed manifest
    beside the hash has zero false positives across the entire recorded history and one true positive,
    on the accident.

    Closure condition, stated because the obvious moves do not satisfy it: ADDING `fw hook-disable` DOES
    NOT CLOSE THIS. That was the reported remedy direction, and S1 shows the verb would have no framework-owned
    work to do ever; shipped without D2/D3 it still lets a by-hand mistake be laundered green. Nor does
    making the baseline check stricter — a stricter blob hash is still one bit.

    Closes when `fw enforcement baseline` CANNOT accept the disappearance of a named framework-owned hook
    without an explicit, logged, per-hook acknowledgement. The distinguishing test: delete check-tier0,
    run the sanctioned remedy exactly as printed, then run doctor. If it reports OK, the gap is open.

    Beware the key. A manifest keyed on (event, matcher, command) — the same tuple hook-enable uses for
    idempotency, and the natural thing to reach for — would have fired on 3 of the 4 largest legitimate
    refactors in this file''s history, been dismissed as noise, and been switched off before catching
    anything. That is not hypothetical: it is exactly how the check-settings-edit nudge came to exist
    (baseline noise -> advice to re-baseline -> D3). Key on hook NAME.

    Class sibling: L-506 / L-570 / T-2902, but a NEW leg. Those are all read failures — a scan that cannot
    see. This is a write failure: the system saw correctly, reported correctly, and was then instructed
    to forget.

    '
- id: G-081
  type: gap
  title: The episodic generator was never tested against an unfilled task template — the state 77% of
    tasks are actually in
  description: 'Episodic decision extraction reads a block-structured document line by line. `agents/context/lib/episodic.sh:147`
    filters the comment DELIMITERS `^<!--` and `^-->` but not the comment INTERIOR, and the task template''s
    `## Decisions` block is exactly such a multi-line comment. Its `### [date] — [topic]` and `- **Chose:**
    [what was decided]` lines survive and reach the handlers at `:342-353`, which cannot tell them from
    real content. Measured here: 2039 of 2649 episodics (77%), 19 of the last 20 by mtime. It fires on
    every task close, so the rate climbs rather than being stable cruft.

    One root cause, three symptoms — and the two unnamed ones are the dangerous half. `:346` runs `sed`
    on a single `$line`, so a decision value wrapping onto continuation lines is cut at the first newline.
    `:147`''s `head -20` drops the tail of a longer section with no note. A phantom entry is visibly junk;
    a truncated rationale reads as complete. Nothing downstream can tell it was clipped.

    Discovery path is the finding. Opened by 050-email-archive 2026-06-09, re-pinged three times over
    two months to framework silence, and independently reproduced by 832-Workflow-designer at 81% including
    three tasks they closed that morning. Two consumer projects read our episodic output more carefully
    than we did, because we generate it and they consume it. This tree''s own 77% was never looked at.

    '
  spec_reference: agents/context/lib/episodic.sh:147, :342-353; .tasks/templates/default.md §Decisions
  severity: high
  decision_trigger: A framework-generated artifact is found to be defective in the state it is MOST COMMONLY
    generated in, by someone outside this project.
  trigger_check:
    type: manual
    hint: For each artifact the framework auto-generates (episodic, handover, component doc), identify
      the modal input state — usually "template section left unfilled" — and check whether any test feeds
      it that state. Absence of such a test is the next instance.
  status: watching
  created: 2026-08-15
  related_task: T-3015
  what_remains: 'The T-3015 fix closes the three symptoms and pins them with discriminating fixtures.
    It does NOT close this gap, which is about the class: no framework generator is tested against its
    modal input. Closure condition, stated because the obvious move does not satisfy it: FIXING THE DECISIONS
    EXTRACTOR DOES NOT CLOSE THIS. Neither does adding a placeholder-regex filter — 832 identified that
    as strictly worse than the leak, because it removes the tell from symptom 1 while symptoms 2 and 3
    keep running, and the output then LOOKS clean. That is the false-green class (sibling to T-3004/T-3012,
    where a freshness clock reset itself and reported 0.0s for a five-month-dead index).

    Closes when every auto-generated artifact has at least one test whose fixture is the unfilled template,
    and the assertion is on ABSENCE of template text rather than presence of expected text. Note the failure
    direction: a generator fed an unfilled template produces plausible-looking output, never an error,
    so this class can only ever be found by looking — which is why it took two external consumers and
    two months.

    Historical episodics are deliberately NOT rewritten. They are the evidence of how far this reached,
    and bulk-rewriting stored memory is an operator decision.

    '
- id: G-082
  type: gap
  title: fw cron generate prints a stale install hint ("fw audit schedule install") that clobbers the
    registry-driven crontab it just wrote
  description: 'fw cron generate correctly writes .context/cron/agentic-audit.crontab from cron-registry.yaml,
    then prints "Install with: fw audit schedule install" (bin/fw line ~4649/4699). That command is the
    pre-T-1114 legacy path (agents/audit/audit.sh:80-131, _cron_generate_source): it unconditionally overwrites
    the same file with its own hardcoded 10-job template, discarding every job the registry produced that
    legacy template does not know about — 14 of 24 active jobs on this project (reviewer-audit-daily,
    corpus-health, the new T-3014 reindex job, mirror sync, liveness, BVP sweeps, escalation scans, pickup,
    release tagging, and the inception-retrofit sweep all vanish).

    T-1114 already built the fix — fw cron install (bin/fw ~4836) — which regenerates from the registry,
    diffs against what is deployed, and installs only the current registry content. The bug is that the
    OLDER command still exists, still runs unprompted whenever anyone follows the printed hint or CLAUDE.md''s
    literal "registry -> generate -> install" phrasing without knowing fw cron install is the correct
    third step, and fw doctor''s own drift check (T-1942/T-1943 content-compare) correctly flags the resulting
    state as WARN — so the mechanism to detect this exists, but nothing stops a reader from causing it
    by following the tool''s own suggestion.

    Hit live during T-3014: ran fw cron generate (correct, 24 jobs) then, per the printed hint, fw audit
    schedule install — which silently reverted the crontab to the legacy 10-job list, and fw doctor immediately
    WARNed "Cron registry edited but not generated". Root cause was the install step, not a missed generate.

    '
  spec_reference: 'bin/fw: cron generate print hint (~line 4699 "Install with: fw audit schedule install");
    agents/audit/audit.sh:80-131 (_cron_generate_source, the clobbering legacy template); bin/fw: cron
    install (~line 4836, T-1114, the correct path)'
  severity: medium
  evidence:
  - 'T-3014 session: fw cron generate -> 24 active jobs written; fw audit schedule install -> file reverted
    to legacy 10-job template; fw doctor WARN "Cron registry edited but not generated" fired immediately
    after'
  - diff of .context/cron/agentic-audit.crontab before/after fw audit schedule install shows the legacy
    _cron_generate_source() header ("Scheduled Audits (T-184 + T-196 + T-602 + T-604)") replacing the
    registry-driven header ("managed by cron-registry.yaml")
  - bin/fw cron generate python heredoc still prints the pre-T-1114 hint text
  trigger: Any operator or agent follows the printed hint, or CLAUDE.md's literal "registry -> generate
    -> install" wording, without independently knowing fw cron install (not fw audit schedule install)
    is the T-1114 fix.
  status: open
  created: 2026-08-15
  related_task: T-3014
  what_remains: 'Two small, independent fixes, neither of which is in T-3014''s scope (one bug = one task):
    (1) change the printed hint in fw cron generate from "fw audit schedule install" to "fw cron install";
    (2) either delete agents/audit/audit.sh''s schedule install subcommand (fully superseded by fw cron
    install) or make _cron_generate_source() defer to the registry-driven fw cron generate when cron-registry.yaml
    has jobs, so the legacy path cannot silently regress a project that has already migrated. Filing a
    build task is the next step, not done here.'
- id: G-083
  type: gap
  title: The autonomous dispatch loop and the interactive session share one working tree, and the only
    thing separating them is a single-slot focus field that the completion path itself nulls
  description: 'resolver-loop.timer fires every 30 minutes and runs `fw resolver loop --dispatch` with
    WorkingDirectory pinned to the canonical MAIN checkout (deploy/resolver-loop.service:39). The worker
    it spawns (agents/termlink/termlink.sh:861, `claude -p`) therefore edits the same files, at the same
    paths, as whatever interactive session is running — with no lock, no worktree, and no record that
    two authors were involved.

    One guard stands between them: lib/resolver.py:1526 excludes the task named in .context/working/focus.yaml.
    Three properties make it thinner than it reads. (1) It is ONE slot; a session holding two tasks in
    flight can protect at most one. (2) The completion path nulls that slot itself — agents/task-create/update-task.sh:2044-2055
    (T-354) sets current_task to null whenever PARTIAL_COMPLETE is false — so the window opens precisely
    during close, reconciliation, and re-open, when the session is most likely to still be editing the
    task. (3) It is evaluated once at pick time and never re-checked, so a 20-minute worker has no relationship
    to focus after its first second.

    Observed live 2026-08-16 08:34-08:41Z: a worker for T-3028 added a 26-line guard to agents/task-create/update-task.sh
    — a completion gate — created a bats suite, edited another task file, deleted four tracked handover
    checkpoints, all uncommitted, all concurrent with an interactive session editing the same gate for
    T-3029. The work happened to be aligned. It was discovered only because the session read a file before
    editing it and did not recognise its own task ID in a comment. Alignment was luck; luck is not a control.
    Had it gone unnoticed the session would have committed another agent unreviewed edit to a completion
    gate under its own authorship.

    This is not "the guard failed" — the guard did what it says. The gap is that write isolation was never
    built, and a pick-time advisory field is carrying load it was not designed for.

    '
  spec_reference: deploy/resolver-loop.service:39 (WorkingDirectory), :55 (ExecStart); deploy/resolver-loop.timer:14
    (OnUnitActiveSec=30min); lib/resolver.py:1523-1544 (_pick_eligibility), :1526 (focus guard), :1571
    (_select_eligible); agents/task-create/update-task.sh:2044-2055 (T-354 focus clear); agents/termlink/termlink.sh:861
    (claude -p spawn); CLAUDE.md §Trunk-Based Session Flow (T-100196) — the worktree primitive that exists
    and that dispatched workers are the one writer class not using
  severity: high
  evidence:
  - 'dispatch_id 9dba824d-b938-4cb0-bc0b-6badeacc72b9, session 2a9815a0-7015-4792-a148-9b8ccb1af3d2, origin
    systemd:unlabeled-unit, task_snapshot {status: started-work, ac_ticked: 8} — .context/dispatches.jsonl'
  - 'journalctl -u resolver-loop.service: tick at 10:33:56 CEST, dispatch envelope stamped 08:34:00.595Z
    four seconds later. Every other tick on 2026-08-16 logged "nothing to do — no eligible tasks"; the
    one that differed differed because focus was null'
  - 'git show 471f054ab:.context/working/focus.yaml has current_task: T-3028 at 10:22:37 — the guard would
    have held had the close not nulled it eleven minutes later'
  - G-004 predicted this scenario in 2026-02 and has sat at status watching ever since, with trigger_check.type
    manual and evidence_collected "0 instances across 41 tasks" (last_reviewed 2026-02-14). Its decision_trigger
    — "first project where two agents need to work on the same task" — fired on 2026-08-16 and nothing
    surfaced it, because a manual trigger-check is a promise to remember
  trigger: Any dispatched worker and any interactive session hold the same task, or write the same file,
    within one 30-minute tick — which now has one confirmed instance rather than zero
  decision_trigger: Any dispatched worker and any interactive session hold the same task, or write the
    same file, within one 30-minute tick — which now has one confirmed instance rather than zero
  status: watching
  created: 2026-08-16
  related_task: T-3030
  related:
  - G-004
  - G-074
  - T-100196
  - T-3028
  - T-3029
  what_remains: 'Not fixed — registered. T-3030 carries the build: decide and implement attribution (worker
    runs in its own worktree via the existing `fw worktree create` + `fw integrate run` path, OR its dispatch
    id is recorded against the files it touched), stop the shared single-slot focus mutation, and pin
    whichever ships with a regression test that exercises the two-writer case rather than asserting a
    config value. Fixing T-3029 (which is done) closes the specific entry path — the false full-completion
    that nulled focus — but leaves all three properties of the guard, and the absence of write isolation,
    exactly as they are.'
  status_note: Filed as `watching`, not `open`, deliberately. `fw gaps` lists only status == watching
    (bin/fw:7178); the 7 entries currently carrying `open` — G-082 among them, filed yesterday — do not
    appear in the register's own primary view at all. Using the accurate-sounding word would have filed
    this gap into the blind spot it describes. The invisibility itself is a separate defect and is captured
    as an observation rather than absorbed here.
- id: G-084
  type: gap
  title: Bash task gate reports "you modified a file" for read-only commands it merely does not recognise
  description: 'The Bash arm of check-active-task.sh asks two questions in order: does the command match
    a write pattern (has_bash_write_pattern), and is its base command on an enumerated allowlist (is_bash_safe_command,
    ~50 names). When the first answers NO and the second answers NO, the command is gated and the agent
    is told it attempted a modification — "Cannot modify files under a completed task" (P-002) or "Build
    tasks require real acceptance criteria before editing source files" (G-020). Measured in one session:
    `sed -n RANGE file`, `timeout 30 termlink agent inbox | head`, and `./agents/context/checkpoint.sh
    status | tail -5` were all blocked this way. None writes; has_bash_write_pattern returns false for
    all three.

    The enumeration itself is load-bearing and must stay — has_bash_write_pattern is a syntactic scan
    and cannot see that `./build.sh` or `python3 deploy.py` writes, the same scope boundary Tier 0 has
    (T-2742). The gap is that (a) the list is grown one entry per incident rather than derived (its own
    comments name eleven such incidents: T-1908, T-2052, T-2054, T-2410, T-2462, T-2834, T-2878, T-2887,
    T-2888, T-2936, T-2988), and T-2888 already established derivation as the fix but applied it only
    to git sub-verbs; and (b) nothing forces the block MESSAGE to distinguish "this writes" from "this
    is unrecognised", so a false positive presents as an accusation with a remedy aimed at a problem the
    agent does not have.

    Why it is a gap and not just a bug: an agent that is told it modified a file when it did not learns
    that the gate''s stated contract is unreliable, and routes around it. That is the T-1890 / L-399 failure
    shape, and it costs the gate its authority on the occasions it is right.

    '
  spec_reference: CLAUDE.md §Enforcement Tiers (Tier 0 scope boundary, T-2742); §Hook Bypass Contract
    Parity (L-399, T-1890)
  severity: medium
  decision_trigger: 'A Bash block message asserts a modification while has_bash_write_pattern returns
    false for the same command string — or an agent is observed working around the gate (direct-invoke,
    re-spelling, --no-verify) after a read-only command was gated.

    '
  trigger_check:
    type: manual
    hint: source agents/context/lib/safe-commands.sh; has_bash_write_pattern "$CMD" || is_bash_safe_command
      "$CMD" — if both are false the block message will be a false accusation.
  status: watching
  detected_in: T-3096
  observed: 2026-08-20
- id: G-085
  type: gap
  title: A committed governance file can lose committed behaviour with no commit, and nothing asks
  description: 'On 2026-08-25 the live PreToolUse gate agents/context/check-active-task.sh was 840 lines
    in the working tree against 1012 at HEAD, uncommitted, having been clean at session start 37 minutes
    earlier. The delta was not an edit: T-3038''s _resolve_focus_file helper and both call sites were
    gone (replaced by a hard-coded FOCUS_FILE, making session-scoped focus inert), T-2987''s ~115-line
    explain-why-the- remedy-did-not-apply block was gone (restoring the identical-message loop it was
    filed to break), and T-3050''s richer B-005 message had reverted to its predecessor. The only genuinely
    NEW content in 186 removed and 14 added lines was one alternative on one case pattern: */.gemini/antigravity-cli/brain/*.
    Concurrent antigravity work had applied its change to an older base and written the result over HEAD''s
    version.

    The gap is not that this happened — concurrent work on a shared checkout will occasionally re-derive
    from a stale base. The gap is that NOTHING ASKED. It surfaced only because `fw vendor self` propagated
    the regressed source into .agentic-framework/ and the pre-push self-vendor gate then refused a push
    to master. That gate answers "does vendored match source?", not "did source regress?" — so detection
    was incidental to a check about a different question. Had the vendored copy not been touched, the
    working tree would have been committed at the next opportunity and three tasks'' worth of governance
    behaviour would have shipped silently, including to consumers.

    Note the asymmetry that makes this invisible: adding a line to a case pattern is a normal, welcome
    edit; losing 186 lines of committed behaviour in the same write is catastrophic. git status renders
    both as a single " M". Every existing check is either about committed state (audit, invariant suite,
    blast radius) or about vendor parity — none reads the uncommitted delta of a governed file and asks
    whether it removes behaviour that a completed task put there.

    Candidate shapes, cheapest first: (a) a doctor/audit WARN when a file under agents/context/, agents/git/
    or lib/ is uncommitted AND its working copy is net-negative by more than N lines against HEAD — cheap,
    no semantics, catches the shape; (b) grep the uncommitted delta for removal of lines carrying a completed
    task id (T-NNNN comments are dense in these files) and name the tasks whose behaviour is being dropped;
    (c) a pre-commit refusal on net-negative governance-file diffs without an explicit --removes-behaviour
    ack. (b) is the one that would have named T-3038 and T-2987 by id.

    '
  spec_reference: CLAUDE.md §Post-Fix Root Cause Escalation (G-019); §Verification Gate (P-011, chain-of-transitions
    reasoning shared with L-364)
  severity: high
  decision_trigger: 'A governed file under agents/ or lib/ is found with an uncommitted working copy that
    is net-negative against HEAD and removes lines bearing a completed task id — or any regression of
    committed behaviour is discovered by a check whose stated question was something else.

    '
  trigger_check:
    type: manual
    hint: 'for f in $(git diff --name-only -- agents/ lib/); do git diff --numstat -- "$f"; done — a large
      deletions:insertions ratio on a governance file is the shape. Then: git diff -- "$f" | grep -E "^-.*T-[0-9]{3,}"
      to name the behaviour being removed.'
  status: watching
  detected_in: T-3133
  observed: 2026-08-25
  blast_radius: cross-project
  related:
  - T-3133
  - T-3038
  - T-2987
  - T-3050
  follow_up_task: T-3133
- id: G-086
  type: gap
  title: Hash-pinned cross-project source packet is transported over an HTML viewer endpoint, so obeying
    the verification contract produces a false VERSION MISMATCH
  description: 'The T-037 source packet (0503-codex-cli-playground → AEF, correlation t037-aef-ingestion)
    declares two documents with expected SHA-256 hashes and the instruction: "If a received document does
    not match its expected hash, stop and return VERSION MISMATCH with the received hash." Both declared
    URLs (http://192.168.10.107:3001/file/docs/architecture/...) returned HTTP 200 and BOTH mismatched:
    architecture received aeb5180a9424af0fa33a6a5647b20789294a6807b621b8cea4b7a5f6d84f3772 against expected
    c9070637...6ac2d, roadmap received 0988d8ac7a6af9009ea1caf1c33a66bb6e6404fd9cf29b2ebc896f558dca8784
    against expected 5be23719...ae5b8.

    The endpoint is a Watchtower HTML *viewer*, not a raw-bytes endpoint. The payload begins <!DOCTYPE
    html> with a csrf-token meta tag, file(1) reports "HTML document", and ?raw=1 does not change the
    behaviour. The bytes hashed were the rendered page, not the document. Reading the authoritative bytes
    from the peer working tree gave an exact match on both documents, so this was never a source revision
    and VERSION MISMATCH was correctly NOT declared.

    The gap is that the failure mode is a FALSE NEGATIVE PRODUCED BY OBEYING THE CONTRACT. A receiver
    with no filesystem reach to the peer project has no way to distinguish "the source was revised" from
    "the transport wrapped it in HTML" — both present identically as a 200 with a wrong hash. Such a receiver
    would have followed the instruction correctly and refused a document that is byte-for-byte correct.
    The hash discipline is sound; the transport silently defeats it. Detection here was incidental to
    this receiver happening to have the peer mounted as an additional working directory.

    Second, separable transfer gap in the same packet: roadmap §4 Arc 0 candidate task 3 requires consolidating
    review findings from four named external reviews (Claude, Z.ai, DeepSeek, Mistral). Those artefacts
    were cited but not transferred, so that candidate task is not startable as written.'
  spec_reference: T-036 prompt artifact §Source packet + §Operator dispatch checklist ("transfer both
    documents or provide the verified URLs")
  severity: medium
  status: open
  detected_in: T-3145
  observed: 2026-08-25
  blast_radius: cross-project
  homed_to: 0503-codex-cli-playground
  home_rationale: Gap homing (T-1333) — the fix is a publishing change in the sending project (raw-bytes
    endpoint or direct file attachment) plus a re-issued source packet. Filing it only there would be
