- id: G-053
  type: gap
  title: "Hook dispatch is CWD-relative, cascades when session CWD drifts to a non-framework directory"
  description: ".claude/settings.json registers all hooks as 'bin/fw hook X' (relative). When a Claude Code session's persistent CWD drifts into a directory that isn't a framework project (e.g., a test fixture in /tmp), PreToolUse hooks fail to resolve their own scripts: 'bin/fw' either doesn't exist, or resolves to a copy whose FRAMEWORK_ROOT points at an incomplete directory. Since PreToolUse hook failures BLOCK the tool, every recovery tool (Bash, Write, Edit) becomes unusable simultaneously — the only escape is out-of-band (TermLink MCP, Grep/Read which have no PreToolUse matcher). Three fragilities were observed in one incident: (a) CWD-relative hook path, (b) missing-script exits non-zero instead of degrading [MITIGATED T-1360/G-053-B], (c) project-boundary hook false-positives on command strings that mention paths in quoted content [MITIGATED T-1361/G-053-C]. Item (a) remains — now defense-in-depth only since (b) safety net is in place."
  spec_reference: ".claude/settings.json, bin/fw hook dispatcher, agents/context/check-project-boundary.sh"
  severity: medium
  trigger_fired: true
  trigger_event: "2026-04-20 session: manual test-fixture repro via 'cd \"$(mktemp -d)\" && ...' stuck the session CWD in the fixture. Every subsequent tool call's hook fired from the fixture, resolved 'bin/fw' to the fixture's incomplete copy, failed to find hook scripts, and blocked the tool. Recovery required out-of-band repair via mcp__termlink__termlink_exec (which bypasses the PreToolUse matcher)."
  detection_lag_days: "0"
  what_works_now: "Normal operation: when CWD is inside a valid framework project, hooks resolve correctly via rule 1 of resolve_framework (T-1356-B1). Out-of-band MCP tools (TermLink, Read, Grep) remain usable because they're not matched in PreToolUse."
  what_remains: "All three items mitigated: (A) T-1364 — lib/init.sh generate_claude_code_config now emits absolute fw paths; existing consumers get them on next `fw upgrade`. (B) T-1360 — bin/fw hook dispatcher exits 0 with stderr warning when script missing. (C) T-1361 — project-boundary hook strips balanced quoted content before regex scan."
  mitigation_applied: "2026-04-20: T-1360 (G-053-B hook safety net), T-1361 (G-053-C quote-stripping), T-1364 (G-053-A absolute hook paths). Framework .claude/settings.json regenerated to use absolute paths. 4-test bats coverage in tests/unit/hook_absolute_paths.bats."
  status: mitigated
