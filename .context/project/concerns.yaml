- id: G-096
  type: gap
  title: The release train has no engine — CLAUDE.md documents a master fast-forward that `fw release
    tag-and-release` does not perform
  description: 'T-3185 established the release-train branch model: `bleeding-edge` authors, `master` is
    the consumer install surface and only ever fast-forwards from `bleeding-edge`, at a release. CLAUDE.md
    SSRelease-Train Branch Model states the mechanism verbatim: "Release: `fw release tag-and-release`
    cuts the tag and fast-forwards `master`."


    It does not. `lib/release.sh` contains ZERO references to `master` — verified by grep, not assumed.
    `release_tag_and_release()` (lib/release.sh:69) does exactly four things: resolve the latest v* tag,
    count commits since, create an annotated tag on whatever HEAD currently is, push that tag to every
    remote, and best-effort `gh release create`. There is no checkout, no merge, no `push origin HEAD:master`,
    no fast-forward of any kind. Master is never touched by the release path.


    The failure mode is a false green of the exact family this session has been closing (T-3187: a guard
    that asserts reconcilability is silent on the branch-identity question it appears to answer). Here
    the command exits 0, prints "Creating annotated tag v1.6.768", pushes it successfully, and reports
    success — while `origin/master` stays exactly where it was. Every observable signal says the release
    happened. The one thing a release is FOR under this model — advancing the consumer install surface
    — is the one thing that silently did not occur. An operator reading CLAUDE.md, running the documented
    command, and seeing it succeed has no surface anywhere that reports the omission.


    Severity is high because the gap is structural, not cosmetic: the release train''s entire value is
    that master lags deliberately and catches up at a release. With no engine, master lags PERMANENTLY.
    The lag stops being a product property and becomes unbounded drift — consumers running `fw upgrade`
    would inherit a snapshot that never advances again, and the longer it holds the more the eventual
    catch-up resembles the big-bang landing the model exists to avoid.'
  spec_reference: CLAUDE.md SSRelease-Train Branch Model (T-3185, keystone) — "The flow" bullet 4
  severity: high
  status: open
  detected_in: T-3190
  observed: '2026-08-27'
  reported_by: self (caught at the moment of first use — the release had not yet been cut)
  blast_radius: every consumer of this framework. master is the documented public mirror (lib/consumer-recover.sh:19)
    and the source `fw upgrade` / `fw vendor` pull from, so a master that never advances freezes the install
    surface for all downstream projects, not just this repo.
  what_works_now: 'Tagging, multi-remote tag push, and GitHub Release creation all work and are unaffected
    — the defect is a missing leg, not a broken one. `fw release status` correctly reports the pending
    delta (currently 146 commits since v1.6.767). The T-2394 master-guard (PROTECT_MASTER=1) is armed
    and correct: it blocks direct AUTHORED commits on master while explicitly allowing fast-forwards (agents/git/lib/master-guard.sh:7),
    which is exactly the transition the release needs — so the engine can be built without touching or
    weakening any gate.'
  what_remains: 'T-3190: add the fast-forward leg to `release_tag_and_release`, and make the release REFUSE
    rather than silently no-op when the fast-forward is not clean (master ahead of bleeding-edge, or the
    two diverged). The refusal matters more than the happy path: a release that cannot advance master
    is the state an operator most needs told about, and it is precisely the state the current code reports
    as success. Ordering constraint: tag must not be pushed before the fast-forward is known to be possible,
    or a failed release leaves a published tag pointing at a commit master never received.'
  related:
  - T-3185
  - T-3187
  - T-3188
  - T-2394
  follow_up_task: T-3190
- id: G-097
  type: gap
  title: termlink inject/pty-inject does not deliver keystrokes into a claude TUI session — the driver
    reports success while doing nothing against its own primary target
  description: 'arc-012''s continuous-run driver (T-3254, agents/context/continuous-driver.sh) exists
    to inject a continuation prompt into a stopped agent session. Its transport is `termlink inject` with
    `termlink pty inject` as fallback -- the exact mechanism CLAUDE.md''s own Cross-Agent Communication
    Protocol names for this shape of message.


    Measured (T-3255, live): spawn a real `claude` session in a fresh TermLink PTY-backed tmux session.
    `termlink inject <session> --enter TEXT` against a plain `bash --norc -i` shell in the SAME kind of
    session delivers correctly (T-3254''s live-fire proved this). Against a `claude` session at its first-run
    trust dialog, `termlink inject` (both text and `-k Enter` key forms) returns success and delivers
    nothing -- the dialog never advances, across 14 ticks. Past the trust dialog, at the real interactive
    prompt, the same call against real text (`echo the word BANANA`) again delivers nothing -- the input
    box stays empty, 0 tokens. `tmux send-keys -l TEXT` + `tmux send-keys Enter`, run directly against
    the identical pane at the identical moment, delivers correctly both times -- Claude receives the text
    and answers it.


    So the defect is isolated to termlink''s inject path against an ink-based raw-mode TUI (Claude Code''s
    own interface), not to PTY sessions in general and not to termlink as a whole -- a plain shell target
    works. And it is not a hang or a visible error: `termlink inject` returns success (exit 0) on every
    one of these silent-delivery calls.


    That combination is the severity. The continuous-driver''s ledger writes `"reason": "injected"` on
    a successful-exit-code call, which is exactly what happened here -- so if continuous mode were armed
    today against a real claude session, the driver would report success every tick, forever, while delivering
    nothing. That is the precise false-green class arc-012 exists to eliminate (T-3167, T-3233, T-3250''s
    E9/E10 findings), now present in the delivery mechanism itself rather than in the bounds-checking
    it was built to harden.'
  spec_reference: CLAUDE.md §Cross-Agent Communication Protocol; agents/context/continuous-driver.sh (T-3254)
  severity: high
  status: open
  detected_in: T-3255
  observed: '2026-09-03'
  reported_by: self (found while building the real-agent live-fire T-3254's own live-fire had substituted
    a shell script for)
  blast_radius: The continuous-driver cron entry (continuous-driver-10m) is installed on this host. Currently
    inert (continuous mode disarmed, no CONTINUOUS_SESSION target) and now additionally PAUSED in the
    cron registry as a direct mitigation. Any future arming against a real claude session, before this
    is fixed, produces silent no-op with a false-positive ledger -- worse than not running at all, since
    it reads as working.
  what_works_now: 'The bounds-checking (six armed conditions), busy observation, ledger, cron wiring,
    and session-resolution ladder (T-3255) are all real and independently tested against a shell-target
    session, which IS a legitimate PTY target for the same transport. The defect is scoped to ONE class
    of target: ink-based raw-mode TUI apps, of which `claude` itself is the one this mechanism cares about
    most.'
  what_remains: 'Homed at TermLink (Gap Homing, T-1333) since the fix belongs in `termlink inject`/`pty
    inject`''s delivery path, not in the framework. Filed as product feedback: T-3256 (this repo, owner:
