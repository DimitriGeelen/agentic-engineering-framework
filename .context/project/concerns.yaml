  title: Episodic auto-generation fires on partial-complete tasks — premature memory of unfinalized work
  description: 'When `update-task.sh --status work-completed` runs against a task with unchecked human ACs, the framework correctly enters partial-complete state: status = work-completed, but the task file
    STAYS in `.tasks/active/` with owner flipped to human, awaiting human finalization. However the auto-trigger for episodic generation fires on the status transition alone, without waiting for the file
    to physically move to `.tasks/completed/`. Result: episodic memory contains a "done" record for tasks the human never finalized. Future agents reading episodic will treat them as completed and accept
    their decisions/learnings as authoritative — even if the human ultimately rejects the work.

    '
  spec_reference: agents/task-create/update-task.sh (episodic auto-trigger), agents/context/context.sh generate-episodic
  severity: high
  likelihood: 4
  impact: 4
  score: 16
  ranking: high
  evidence:
  - '/opt/termlink T-909 transcript (2026-04-11): `fw inception decide T-909 go` printed "Partial-complete: 1 human AC(s) pending verification" AND "Task stays in active/" AND "Episodic generated: /opt/termlink/.context/episodic/T-909.yaml"
    in the same output block. The episodic was written to a task that the framework explicitly said was not finalized.'
  - 'Compounding effect with G-032: G-032 silently force-completes inception tasks → triggers premature episodic via this gap → future agents read "T-XXX done" with unverified ACs → bad memory propagates
    indefinitely.'
  trigger: Any inception decide on a task with unchecked human ACs (which is ~all of them under the G-032 bug). Compounds with G-032 to produce false long-term memory.
  status: resolved
  resolution: 'Fixed in T-1160: PARTIAL_COMPLETE guard at update-task.sh line 838 prevents episodic generation on partial-complete tasks. Verified 2026-04-12.'
  created: 2026-04-11
  last_reviewed: 2026-04-12
  related_task: T-1103
- id: G-035
  type: gap
  title: 'META-GAP: CLAUDE.md Quick Reference + agent memory drift from actual fw command surface — no structural enforcement of doc/help/code parity'
  description: 'Recurring class of bug: framework features (new subcommands, required flags, distribution model changes) get added without updating CLAUDE.md Quick Reference, agent memory, or sometimes
    even `fw help`. Agents read CLAUDE.md as canonical, copy a stale form, and fail at dispatch/invocation time. The framework correctly errors with a clear message, but the agent should not have hit the
    error in the first place — the canonical reference lied to it. The gap is not in the error handling; the gap is in the absence of structural enforcement that CLAUDE.md, `fw help`, `fw <subcommand> --help`,
    and the actual code stay in sync. This subsumes G-025 (fw upgrade not surfaced), G-029 (termlink distribution model not contrasted), G-031 evidence #4 (fw vendor not in CLAUDE.md), AND the new evidence
    below — they are all instances of the same class.

    '
