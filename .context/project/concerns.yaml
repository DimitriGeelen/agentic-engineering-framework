  last_reviewed: 2026-04-20
  related_tasks: [T-1356, T-1360, T-1361, T-1364]

- id: G-054
  type: gap
  title: "Episodic auto-gen silent failure — detector evaded, 4/4 tasks in one session"
  description: "Four tasks (T-1363, T-1364, T-1366, T-1367) transitioned to work-completed via `fw task update --status work-completed` in one session — evidenced by date_finished populated and [task-update-agent] Updates entries. None produced an auto-generated episodic. T-1169's silent-failure detector (update-task.sh:847-853) is designed to print a WARNING when the episodic file doesn't appear after generate-episodic runs; either the warning was printed and overlooked, or the detector itself is not firing. Sandbox reproduction with identical real task file inputs generates the episodic successfully — so the code path works, and the trigger is environmental. Unknown environmental factor."
  spec_reference: "agents/task-create/update-task.sh:837-858, agents/context/lib/episodic.sh:60"
  severity: medium
  trigger_fired: true
  trigger_event: "2026-04-20: handover agent flagged T-1366/T-1367 as missing episodics; checking T-1363/T-1364 revealed they were manually generated in commit 968c5034 (also missing from auto-gen). All 4 tasks in the session failed silently. 2026-04-21: T-1370 close reproduced the failure (5th datapoint in 2 sessions). Manual `./agents/context/context.sh generate-episodic T-1370` succeeded where auto-gen failed — same session, same PROJECT_ROOT, same user. Confirms environmental factor is specific to update-task.sh's invocation context (subshell, trap, set options, stdin redirect, or similar), not PROJECT_ROOT or filesystem state."
  detection_lag_days: "0"
  what_works_now: "Sandbox replays of exact task file content succeed. Manual `fw context generate-episodic T-XXX` succeeds. Auto-gen WARN string is present in source — either never-fired or overlooked in real session output."
  what_remains: "Root cause unknown. Candidates: (1) WARN printed but drowned by long tail output of update-task.sh; (2) context.sh exit code != 0 but episodic file already existed before removal by later step; (3) episodic file created in a different PROJECT_ROOT (different consumer context during completion). Next reproduction attempt should instrument update-task.sh:847 to log context.sh stdout/stderr + exit code to a file regardless of success. Regression test landed at tests/unit/update_task_episodic_gen.bats guards the code-path only."
  mitigation_candidate: "Either (a) make the WARN block completion (convert to hard-fail) or (b) add a tail-of-output summary with WARN counts so silent failures cannot hide in scrollback."
  mitigation_applied: "2026-04-20 (T-1374): Root cause was NOT the detector — it was an earlier abort. Under `set -euo pipefail`, the line `comp_id=$(grep '^${path}=' ... | head -1 | cut -d= -f2-)` would trigger script exit when grep found no match (exit 1 + pipefail → assignment exit 1 → set -e abort → EXIT trap ran keylock_release and quit). The Episodic block at line 843 was never reached, so the T-1169 detector never fired. Fix: `|| true` appended to the grep pipeline (line 775) and to the git-diff-in-for-loop pipeline (line 769, for root-commit edge case). Regression test at tests/unit/update_task_components_lookup.bats; sanity-inverse verified."
  status: mitigated
  created: 2026-04-20
  last_reviewed: 2026-04-20
  related_tasks: [T-1363, T-1364, T-1366, T-1367, T-1368, T-1370, T-1371, T-1372, T-1374, T-1169]

- id: G-055
  type: gap
  title: "Learning ID allocator grep pattern missed legacy indented-format entries"
  description: "`agents/context/lib/learning.sh:50` computed max_id via `grep '^- id: L-'` which only matches the new dash-prefix format. The first 234 legacy entries in learnings.yaml use indented format (`- application: TBD\\n  context: ...\\n  id: L-XXX\\n  learning: ...`) where `id:` is not the first key of the list item. grep missed all 234 legacy entries, so every `fw context add-learning` call issued IDs starting from wherever the dash-prefix section started — every ID in the dash-prefix section (L-001..L-027) collides with an unrelated historical entry of the same ID. Same class as G-052 (task-ID collisions) but the trigger is a grep-pattern bug, not a race."
  spec_reference: "agents/context/lib/learning.sh:48-52"
  severity: low
  trigger_fired: true
  trigger_event: "2026-04-20: noticed L-027 appeared twice in learnings.yaml while investigating T-1368 silent episodic-gen. Expanded grep revealed 234 collision-class duplicates across L-001..L-027."
  detection_lag_days: "0"
  what_works_now: "T-1369: grep pattern changed to `grep -E '^[- ]+id: ${id_prefix}-'` which matches both formats. Bats test tests/unit/add_learning_id_allocator.bats pins the regression (3 cases: legacy-only, dash-only, mixed). Sanity-inverse verified: reverting the fix fails 2 of 3 tests."
  what_remains: "Historical duplicates in learnings.yaml (~234 entries) are not renumbered — cross-references to old L-IDs exist in 20+ artifacts (tasks, handovers, reports). Renumbering risks breaking those references. Decision: accept the duplicates, issue future L-IDs starting from max+1 = L-235 (via fixed allocator). The L-024..L-027 additions from this + prior session collide with old IDs but stand as-is per the same principle (references already landed)."
  mitigation_applied: "2026-04-20: grep pattern expanded to `-E '^[- ]+id: PREFIX-'`. Regression test tests/unit/add_learning_id_allocator.bats. Next add-learning call on framework repo should emit L-235 (next true max+1)."
  status: mitigated
