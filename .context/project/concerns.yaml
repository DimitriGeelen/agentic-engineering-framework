- id: G-023
  type: gap
  title: Consumer project governance decays silently — no detection, no propagation, no audit trail
  description: 'All 7 consumer projects are at v1.2.6 while framework is at v1.3.0. Each is missing 2 hooks (check-project-boundary,
    commit-cadence) and ~180 lines of CLAUDE.md governance rules. fw upgrade exists but: (1) hook detection uses count (expects
    10) not type enumeration — hardcoded count is wrong (init.sh generates 13), (2) fw doctor has no consumer staleness check,
    (3) no upgrade audit trail exists, (4) fw update doesn''t suggest fw upgrade for known consumers. Same class as G-021/G-022:
    silent enforcement disabling. Net effect: consumer agents operate under stale governance rules and missing enforcement
    hooks indefinitely.

    '
  spec_reference: CLAUDE.md §Constitutional Directive D2 (Reliability), lib/upgrade.sh, bin/fw (doctor)
  severity: urgent
  evidence:
  - 'T-614: All 7 consumers at v1.2.6, framework at v1.3.0'
  - 'Hook count: consumers have 11, framework has 13 — 2 missing'
  - 'Missing hooks: check-project-boundary (T-559), commit-cadence (T-591)'
  - upgrade.sh expected_hooks=10 but init.sh generates 13 — count mismatch bug
  - fw doctor has zero consumer-awareness checks
  - No upgrade timestamp in .framework.yaml
  - CLAUDE.md in consumers is 180 lines behind (missing T-609, TermLink, updated budgets)
  - Bash tool not task-gated (check-active-task matches Write|Edit only) — bypass vector
  fleet_impact:
  - /opt/openclaw-evaluation — 2 days stale, 11/13 hooks
  - /opt/3021-Bilderkarte-tool-llm — 13 days stale, 11/13 hooks
  - /opt/termlink — 17 days stale, 11/13 hooks
  - /opt/050-email-archive — 7 days stale, 11/13 hooks
  - /opt/150-skills-manager — 2 days stale, 11/13 hooks
  - /opt/001-sprechloop — 36 days stale, 11/13 hooks
  - /opt/995_2021-kosten — 9 days stale, 11/13 hooks
  remediation:
  - 'T-615: Fix hook count bug in upgrade.sh (enumerate by type, not count)'
  - 'T-616: Add consumer staleness check to fw doctor'
  - 'T-617: Upgrade audit trail in .framework.yaml and .context'
  - 'T-618: Fleet-wide consumer upgrade (all 7 projects)'
  - 'T-619: Inception — Bash task gate with bootstrap allowlist'
  status: mitigated
  created: 2026-03-25
  last_reviewed: 2026-03-25
  related_task: T-614
  mitigation: 'T-657 (2026-03-28): All 7 consumer projects upgraded v1.3.0→v1.4.73. fw doctor now detects and reports stale
    consumers. Structural: fw upgrade exists, fw doctor warns, upgrade trail logged to .context/audits/upgrades.yaml. T-857
    (2026-04-04): fw upgrade now syncs lib/*.sh, 9 agent directories, and VERSION file to consumer vendored dirs. T-859: VERSION
    file sync prevents stale version detection after upgrade. All 9 consumers upgraded 2026-04-05. Gap remaining: no automated
    trigger for upgrades — relies on human running fw doctor.'
- id: G-024
  type: gap
  title: fw upgrade does not sync web/blueprints/ — consumer web code can drift silently
  description: 'fw upgrade syncs lib/*.sh, agents/, bin/fw, CLAUDE.md, and VERSION but not web/blueprints/ or web/templates/.
    Consumers that were initialized at a point in time retain their original blueprint files forever. Low impact today because
    consumers typically do not run their own Watchtower (it runs from the framework repo or in LXC 170), but the drift exists
    and will bite if any consumer starts running its own Watchtower against the framework''s local tooling.

