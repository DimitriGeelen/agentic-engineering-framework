  description: '`agents/context/check-project-boundary.sh` (PreToolUse on Bash) detects `cd /outside/...`
    and blocks it. It does NOT match commands whose *arguments* point outside PROJECT_ROOT — e.g. `du
    /root/x`, `find /root/x`, `grep -r ... /root/x`, `cat /root/x/file`.

    The mechanical enforcement surface is therefore narrower than the policy it claims to enforce ("no
    cross-project work without TermLink"). Read-side cross-boundary access has been undetected for as
    long as the hook has existed.

    Compounding factor: existing path-isolation memories (`feedback_no_cross_repo_edits.md`, `feedback_path_isolation_cross_machine_prompts.md`)
    are framed around edits/writes/cross-machine prompts. None say "even du/grep/cat outside pwd is a
