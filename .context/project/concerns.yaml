  - 'T-1868 (completed 2026-05-15): agents/context/revisit-due-scan.sh used fixed-depth `../../..` PROJECT_ROOT
    walk-up — vendored-shape only; silently exited 0 in framework-repo for 14 days. Fix: marker walk-up
