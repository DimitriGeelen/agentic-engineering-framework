- id: G-093
  type: gap
  title: BPMN lane-authority validation is scoped to task-bearing lanes, so a genuine typo on an events-only
    lane compiles with zero warnings
  description: 'Inbound CORRECTION from 001-CashWeb-Lightspeed-Ecwid-integration (2026-08-26, follow-up
    to their G-055 / our G-091). They narrowed their own repro and explicitly withdrew a prediction: an
    external lane containing only events does NOT trip our dialect warning. Verifying the narrowed form
    at HEAD confirmed their retraction and surfaced a distinct defect they did not claim.


    tools/bpmn_to_tasks.py collects lane-authority folds INSIDE the task-node loop. The loop `continue`s
    at :424 on every node whose tag is not in TASK_TAGS (:51 = userTask/serviceTask/scriptTask); unknown_auth
    is populated at :481, downstream of that guard; the dialect WARNs at :501-521 iterate unknown_auth
    alone. A lane whose flowNodeRefs are all events or gateways therefore never reaches the check, and
    its <aef:laneMeta authority> is never read or validated at all. lane_auth is built at :403 by _lane_authority
    (:254) but nothing outside the task loop consults it for validation.


    Measured at HEAD on a two-lane fixture whose second lane holds two intermediateCatchEvents and nothing
    else: authority="external" -> rc 0, zero warnings. Same fixture, authority="overlrd" (an unambiguous
    misspelling, present in no vocabulary anywhere) -> rc 0, zero warnings. The typo-suspecting else-branch
    that exists precisely to catch that value is unreachable. Adding one serviceTask to the same lane
    makes both cases warn immediately.


    Distinct from G-091, which concerns WHICH values the dialect contains (three encoded vs four ratified).
    This concerns WHETHER the dialect is consulted, and is the more dangerous of the two because it is
    silent by construction: a diagram author gets no signal that the compiler never read their authority
    choice. Same class as T-2552 and T-2557 (semantics dropped without a surface) except that what is
    dropped here is the validation, not the semantics.'
  spec_reference: policy/standards/aef-bpmn-mapping-v1-partI.md §3 line 68 (frozen v1 collapse map); CLAUDE.md
    §Error Escalation Ladder (Level C)
  severity: medium
  status: open
  detected_in: T-3173
  observed: '2026-08-26'
  reported_by: 001-CashWeb-Lightspeed-Ecwid-integration (narrowed repro; the defect itself found locally
    while verifying their correction)
  blast_radius: every BPMN diagram with a lane that carries no task nodes — error-path lanes, external-actor
    lanes, event-only boundary lanes
  what_works_now: Nothing. There is no warning, no non-zero exit, and no other surface. The compiler is
    correct by accident for external->no task (a lane with no task nodes emits no tasks either way), which
