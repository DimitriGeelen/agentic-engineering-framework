  what_remains: 'HYPOTHESIS, not yet evidenced across the corpus: in both instances the schema is implicit
    — it exists only as the union of what the readers happen to dereference. Where it IS written down
    (G-091 has a frozen standard) the implementation was never machine-checked against it. Where it is
