  - G-093
  - OBS-118
  - T-2567
  - T-2717
  - T-3172
  - T-3173
  follow_up_task: T-3172
- id: G-092
  type: gap
  title: Write paths do not validate against the schema their own read paths enforce — two instances in
    two subsystems on one day
  description: 'Named as a class by 001-CashWeb-Lightspeed-Ecwid-integration in the same 2026-08-26 field
    report that carried G-090 and G-091, with an explicit request that it be examined as a pattern rather
    than only as two tickets. The shared shape: the producer accepts input that its own consumers require
    or reject. In G-090 the writer tolerates a field three readers treat as mandatory. In G-091 the compiler
    rejects a value its own governing frozen standard ratifies. Both fail late and quietly relative to
    the write that caused them — the cron case installs a live but uncontrollable schedule, the BPMN case
