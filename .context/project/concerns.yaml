- id: G-007
  type: gap
  title: Budget gate non-functional for shared-tooling projects
  description: 'budget-gate.sh, pre-compact.sh, and post-compact-resume.sh all used FRAMEWORK_ROOT for project-specific paths (.context/, .tasks/, JSONL transcripts). In shared-tooling mode (PROJECT_ROOT
    != FRAMEWORK_ROOT), this caused: (1) transcript discovery read the wrong project''s tokens, (2) pre-compact reset the framework''s counter instead of the project''s, (3) post-compact resume injected
    framework context into project sessions, (4) stale critical status failed open on 4/5 tool calls. Net effect: budget monitoring was non-functional for sprechloop despite hooks being wired. Contributed
    to the 14-compaction cascade (L-050).

    '
  spec_reference: CLAUDE.md §Context Budget Management (P-009)
  severity: high
  evidence_collected: 'T-148 investigation: sprechloop had no .budget-status file. Manual test of budget-gate.sh with PROJECT_ROOT=/opt/001-sprechloop returned 124K tokens — from the framework''s active
    session, not sprechloop''s (which had no active session). 3 scripts affected: budget-gate.sh (transcript discovery + stale fail-open), pre-compact.sh (FRAMEWORK_ROOT reset), post-compact-resume.sh (FRAMEWORK_ROOT
    for all project reads). Audit of remaining agent scripts confirmed these were the only 3 affected — other scripts already use PROJECT_ROOT correctly.

    '
  resolution: 'T-149 fixed all 4 bugs: (1) transcript discovery scoped to project''s Claude Code directory via path encoding, (2) pre-compact.sh uses PROJECT_ROOT for counter/status reset, (3) stale critical
    status still blocks (no fail-open at critical level), (4) post-compact-resume.sh uses PROJECT_ROOT for handover/tasks/git reads. Audit confirmed no remaining FRAMEWORK_ROOT misuse in other agent scripts.

    '
  status: closed
  created: 2026-02-18
  last_reviewed: 2026-02-18
  closed_date: 2026-02-18
- id: G-008
  type: gap
  title: Sub-agent dispatch protocol has no structural enforcement
  description: 'CLAUDE.md §Sub-Agent Dispatch Protocol defines clear rules: investigators must keep returns under 2K tokens, prompts must include output format and write-to-file instructions, background
    agents should write to disk not return content. But nothing enforces this — an agent can launch 4 background Explore agents with "return a summary" prompts, call TaskOutput on all 4, and flood the context
    with 4×30K chars of raw JSONL transcript. This caused a 12-minute hang and effective session crash during T-158.

    '
  spec_reference: CLAUDE.md §Sub-Agent Dispatch Protocol
  severity: medium
  evidence_collected: 'T-158 (2026-02-18): 4 background Explore agents launched with prompts saying "Return structured summary. Keep under 2K tokens." TaskOutput returned raw JSONL transcripts at 30,156
    chars each (120K total). Model produced 0 output tokens after ingesting this, then emitted stop_sequence with no content. Session effectively crashed for 12m40s. Root cause: (1) prompts didn''t include
    write-to-file instructions per template rule, (2) TaskOutput returns raw transcript not agent final answer, (3) no hook or gate prevents this.

    T-170 (2026-02-18): Third instance — Playwright browser_navigate and browser_snapshot return full accessibility tree for all 168 kanban tasks (~30-50K tokens per call). 5+ calls in one session consumed
    150K+ tokens, causing repeated compactions (15 emergency handovers in 24h). Same root cause: uncontrolled context intake from tool results. Mitigation: use browser_run_code for navigation, browser_take_screenshot
    for visuals, never browser_snapshot on pages with large DOM.

    '
  resolution: 'T-225 built PostToolUse hook (check-dispatch.sh) on Task|TaskOutput. Warns at 5K chars, critical at 20K chars. Combined with the dispatch preamble (T-217) and MEMORY.md rules, provides layered
    enforcement: documentation (CLAUDE.md), prompt injection (preamble.md), runtime guard (check-dispatch.sh). Remaining items (PreToolUse parallel count, prompt linter) are lower priority — can be added
    if incidents recur.

    '
  status: closed
  closed_date: 2026-02-20
  created: 2026-02-18
  last_reviewed: 2026-02-20
