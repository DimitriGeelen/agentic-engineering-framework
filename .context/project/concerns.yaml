  created: 2026-07-01
  last_reviewed: 2026-07-01
  related_task: T-2825
  fixed_in: T-2825
  fixed_date: 2026-08-06
  resolution: 'Shipped as the `fw worktree remove` wrapper mechanism (lib/worktree.sh:

    do_worktree_remove, wired at `fw worktree remove <name> [--force]`), the

    first of the two proposed mechanisms. For each configured remote it checks

    whether the worktree''s branch tip is fully caught up (`git rev-list --count

