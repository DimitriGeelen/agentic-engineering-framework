- id: G-056
  type: gap
  title: "fw upgrade does not propagate lib/init.sh template changes to existing consumer .claude/commands/resume.md"
  description: "`lib/upgrade.sh:694-709` detects existing `.claude/commands/resume.md` and prints `OK resume.md exists` without comparing the consumer's copy against the current template output. When the framework fixes the template (e.g., T-1378 B1 replaced the `:3000` hardcode), existing consumers stay on the old text indefinitely. The only refresh path is `fw init --force`, which is destructive to consumer customizations. Discovered during T-1382 audit: /003-NTB-ATC-Plugin and /opt/002-Claude-Partner-Network both still teach `curl -sf http://localhost:3000/` in their resume command 1 day after T-1378 shipped. T-1376's 'recurrence prevention' thesis only holds for new consumer inits until upgrade propagates template deltas."
  spec_reference: "lib/upgrade.sh:694-709"
  severity: medium
  trigger_fired: true
  trigger_event: "2026-04-22: T-1382 audit of consumer projects after T-1378/T-1380 ship found resume.md stale in both audited consumers."
  detection_lag_days: "1"
  what_works_now: "Vendored `.agentic-framework/*` snapshots ARE refreshed by `fw upgrade` (confirmed for lib/init.sh, lib/templates/claude-project.md, agents/monitor/liveness-check.sh). The gap is specific to files that upgrade writes once at init then skips: resume.md, CLAUDE.md governance sections already have a drift-refresh mechanism (lib/upgrade.sh:130+), but command files do not."
  mitigation_applied: "2026-04-22 (T-1383): Extracted resume.md heredoc from lib/init.sh into shared template at lib/templates/resume-md.md. lib/init.sh now prefers the template file (falls back to inline heredoc if missing). lib/upgrade.sh step 7 now diffs consumer's resume.md vs. the template; on drift, writes .bak and refreshes."
  prevention: "2026-04-22 (T-1386): 3 bats regression tests in tests/unit/lib_upgrade.bats pin the invariant — drift triggers UPDATE + .bak, matching file reports OK with no .bak, missing file CREATE from template. Sanity-inverse verified: reverting T-1383 fails all 3 tests; restoring passes. Prevention (not just mitigation) exists per G-019."
  resolution: "2026-04-22 (T-1385, T-1386): Fix deployed, tested on real consumers via dry-run (both /003-NTB-ATC-Plugin and /opt/002-Claude-Partner-Network show WOULD UPDATE), invariant protected by bats."
  what_remains: "Optional generalization: the same drift-refresh pattern could cover other `.claude/commands/*.md` files beyond resume.md (none exist today). Not urgent."
