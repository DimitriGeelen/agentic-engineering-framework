- id: G-087
  type: gap
  title: A --dry-run flag routes through the writing generator, so the cautious path is the one that mutates
    git-tracked state
  description: '`fw cron install --dry-run` (bin/fw:5487-5522) computes its diff by invoking `"$0" cron
    generate` as step 1 — the same code path the non-dry-run form uses — which writes $PROJECT_ROOT/.context/cron/agentic-audit.crontab.
    Only step 3 is guarded by the dry-run flag. The command then prints "(dry-run — no changes made)"
    over a file it just rewrote.

    Reproduced at HEAD v1.6.78 in a sandbox project root (/tmp/cronprobe): source file 135 bytes / md5
    69313a83 before, 389 bytes / md5 4d9e0f04 after, with the "no changes made" line present in the same
    output. Not version-specific — the reporter hit it on vendored v1.6.29, and the shape is unchanged
    on trunk.

    In the reporting project the write truncated a 3875-byte crontab source carrying ten running jobs
    to 450 bytes (39 lines deleted). Recovered with `git checkout HEAD --` and verified byte-identical
    to /etc/cron.d/; no job missed a cycle. The recovery depended entirely on the file being git-tracked.

    The gap is not the write itself but WHICH path carries it: --dry-run is the flag an operator chooses
    precisely because they do not yet know what the command will do, so a writing --dry-run punishes the
    cautious choice specifically. On a path outside git this is silent, unrecoverable data loss with a
    success message on top.

    A correct comparand already exists and is already used by both drift checks: lib/cron_dry_run.py emits
    the same generated text to stdout and never writes.'
  spec_reference: CLAUDE.md §Enforcement Tiers (Tier 0 sees the command string and nothing else — a destructive
    effect reached through a script is outside the gate)
  severity: high
  status: open
  detected_in: T-3160
  observed: '2026-08-26'
  reported_by: 001-CashWeb-Lightspeed-Ecwid-integration (their T-151 / G-050, vendored v1.6.29)
  blast_radius: cross-project
  what_works_now: The write is idempotent when registry and generated form are already in sync, which
    is the state most framework-repo sessions are in — this is why it went unnoticed here. lib/cron_dry_run.py
    already implements the non-writing generator that the fix needs.
  what_remains: 'Route the dry-run diff through lib/cron_dry_run.py (or a temp path) so no --dry-run branch
    reaches a writing generator. Generalise: audit every fw subcommand advertising --dry-run for a write
    reached before the flag is honoured (fw vendor, fw upgrade, fw harvest, fw triage route, fw integrate
    run, fw task archive-eligible, fw mcp reap all advertise one). A dry-run that writes is a false-green
    with the same signature as the port-3000 class: the output asserts safety it did not verify.'
