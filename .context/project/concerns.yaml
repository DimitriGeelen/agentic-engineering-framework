- id: G-049
  type: gap
  title: "_derive_version walks up to consumer git tags in vendored mode — fw version reports wrong tag (e.g. 0.12.1191 instead of 1.5.744)"
  description: "bin/fw:16-38 _derive_version() runs `git -C \"$fw_dir\" describe --tags` where $fw_dir is `<consumer>/.agentic-framework/`. In vendored mode that directory has no .git of its own, so git walks UP to the consumer repo's .git and returns the consumer's most recent tag. fw version then reports the consumer's tag instead of the vendored framework's version. The VERSION file (correctly stamped by pre-push) is the canonical source for vendored installs — _derive_version should prefer it over git describe when $fw_dir/.git is absent. Surfaced by 050 e-agent post-upgrade to v1.5.744: VERSION says 1.5.744, fw version reports 0.12.1191 (the consumer's tag)."
  spec_reference: "bin/fw:14-38 _derive_version, T-1253 VERSION stamping (pre-push hook)"
  severity: medium
  trigger_fired: true
  trigger_event: "2026-04-19: 050 e-agent confirmed 'fw version' reports 0.12.1191 immediately after fw upgrade --source set VERSION to 1.5.744"
  detection_lag_days: "0"
  what_works_now: "Framework-repo (non-vendored) installs: _derive_version finds the framework's own .git and returns correct tag. VERSION file fallback works when there is no .git anywhere up the tree."
  what_remains: "Vendored installs (.agentic-framework inside a git-tracked consumer): git -C walks up, finds consumer .git, returns wrong tag. Mitigation: add `[ -d $fw_dir/.git ] || [ -f $fw_dir/.git ]` guard around git describe; fall through to VERSION file when absent. ~3-line change."
  mitigation_candidate: "Edit bin/fw _derive_version: only invoke git describe when $fw_dir has its own .git (file or dir); else read VERSION. Bats coverage: vendored test fixture confirms VERSION wins over containing repo's tag."
  mitigation_applied: "2026-04-19 T-1336: added `[ -d $fw_dir/.git ] || [ -f $fw_dir/.git ]` guard around git describe in bin/fw:_derive_version. Reproduced bug in sandbox (consumer repo tagged v0.12.1191 → pre-fix walked up and returned consumer tag). Framework-repo mode version preserved (fw v1.5.20)."
  status: mitigated
