- id: G-094
  type: gap
  title: Partial-complete revokes a task's authority to commit its own closure artefacts, and the block
    message's only remedy is not an executable transition
  description: 'Inbound field report from 001-CashWeb-Lightspeed-Ecwid-integration (their G-053, three
    incidents in one day: T-154, T-012, T-156), reproduced independently at HEAD before registration.


    `fw task update T-XXX --status work-completed` with an unchecked Human AC produces partial-complete:
    status work-completed, owner human, file still in .tasks/active/. That transition writes closure artefacts
    (.context/project/decisions.yaml, .context/working/feedback-stream.yaml, the task file). From that
    moment agents/context/check-active-task.sh :750 refuses any non-exempt Bash command while focus is
    on that task — including the git commit that would land those artefacts. Reproduced verbatim in a
    scratch PROJECT_ROOT: `git commit -m "T-900: close artefacts"` -> exit 2, "BLOCKED: Task T-900 has
    status ''work-completed''.", "Policy: P-002 (Cannot modify files under a completed task)".


    The remedy the block message prints does not exist. It offers `fw work-on T-XXX (resume another task)`,
    but status-transitions.yaml gives work-completed NO outgoing transition — it is terminal in the table
    — so `fw work-on` on the task itself exits 1 with "Invalid transition ''work-completed'' -> ''started-work''"
    and refuses to set focus. The only remaining exit is attributing the commit to a DIFFERENT task, which
    destroys exactly the traceability P-002 exists to protect. 001-CashWeb did this three times today.


    Three findings beyond their report, measured locally:

    (1) The gate already implements the scoping boundary they proposed as a caveat, but on one side only.
    Write/Edit to .context/*, .tasks/*, .claude/* is exempted at :441 and exits 0 under partial-complete;
    only source writes are blocked. Bash carries no file_path, so git commit falls through to the status
    gate. Same task, same state, opposite answers depending on the tool. The fix is parity, not new policy.

    (2) The work-completed) branch at :750 is unreachable for genuinely-archived tasks — those fail the
    find_task_file lookup at :715 and exit at :718 with a different message. So :750 fires ONLY for partial-complete,
    and its message is the only advice the framework gives for a state that is by construction unfinished.
    The code comment at :731 already names the state.

    (3) There is no graduated bypass. The sibling focus-drift gate offers --switch-focus and FW_SWITCH_FOCUS=1,
    both Tier-2 logged (T-1730/T-1890); this branch offers none. The only escape is FW_SAFE_MODE=1, which
    disables the entire task gate.


    Prevalence: they report 19 partial-complete tasks. Our own repo has 243 of 409 active tasks (59%)
    in this state. This is the majority state of our task set, not an edge case.'
  spec_reference: P-002 (Structural Enforcement); L-399 / T-1890 (bypass-contract parity — a remedy a
    hook prints must be executable as printed); CLAUDE.md §Agent/Human AC Split (partial-complete)
  severity: high
  status: open
  detected_in: T-3174
  observed: '2026-08-26'
  reported_by: 001-CashWeb-Lightspeed-Ecwid-integration (their G-053)
  blast_radius: every partial-complete task in every project — 59% of this repo's active set; the failure
    is silent in the record, since the mis-attributed commits look ordinary
  what_works_now: 'Nothing structural. The workaround in the field is to attribute the commit to another
    task, which is the damage rather than the mitigation: the commit message says one task id, the change
    belongs to another, and no surface flags the mismatch. Write/Edit on governance paths does work, which
    is why the state is survivable at all and also why the asymmetry went unnoticed.'
  what_remains: 'T-3174 implements direction (a) scoped: teach the gate to distinguish partial-complete
    from archived, and under partial-complete allow Bash commands that write only governance paths — parity
    with the :441 Write/Edit exemption — while source writes stay blocked. Direction (c) (write artefacts
    before the status flips) was measured to be a no-op: those artefacts are written in-process by update-task.sh
    and the PreToolUse hook gates tool calls, not a script''s own writes; what is blocked is the later
    commit and any later correction, neither of which (c) reaches. Direction (b) (add work-completed ->
    started-work) would make the printed remedy true but lets a reviewed task be reopened silently; not
    chosen, and if the message keeps naming a transition then either the transition or the message has
    to change. Open sub-question: whether the residual escape should be an env-var bypass per T-1890 leg
    3 (git rejects unknown flags) with Tier-2 logging, or whether the scoped allowance removes the need
    for one.'
