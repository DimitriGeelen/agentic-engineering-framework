- id: G-063
  type: gap
  title: Project-shape conflation — framework code assumes consumer shape, silently fails in framework-repo
    / fresh-init / vendored-skewed states
  description: 'Recurring failure pattern: framework code (lib/config-file.sh, lib/init.sh, lib/upgrade.sh,
    lib/upstream.sh, lib/setup.sh, lib/update.sh, lib/validate-init.sh, lib/version.sh) assumes ONE project
    shape — initialized consumer with .framework.yaml + .agentic-framework/ — and silently degrades when
    invoked from any of the three other shapes: framework-repo (no .framework.yaml expected), consumer-uninitialized
    (bare dir, fw init not yet run), consumer-vendored-skewed (.framework.yaml present, vendored shim
    out of sync with framework version). Each instance has been fixed in isolation; the class continues
    to ship.'
  spec_reference: CLAUDE.md §Copy-Pasteable Commands (T-1257), docs/reports/T-1675-project-shape-resilience-umbrella.md
  severity: high
  likelihood: 4
  impact: 3
  score: 12
  ranking: high
  evidence:
  - 'T-1257 (completed): agents told consumers to run `bin/fw` (framework-repo path) instead of `.agentic-framework/bin/fw`
    — same conflation surfaced in agent-output layer. Required CLAUDE.md §Copy-Pasteable Commands documentation
    patch.'
  - 'T-1542 (active): `fw upgrade` from inside a consumer crashes at step 4b/9 — bare-from-consumer case
    unhandled by the upgrade flow.'
  - 'T-1634 (captured): `fw upgrade no-args` should read upstream URL from .framework.yaml + git-fetch
    instead of relying on local source path; same path-resolution gap.'
