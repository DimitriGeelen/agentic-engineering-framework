  trigger: Agent claims an arc/feature is "shipped" based on code/test artifacts without (a) end-to-end
    behavioral verification on a fresh substrate, (b) policy-default audit (`grep -rn "const " | wc -l`
    on shipped code → did any silently-defaulted constant escape human review?), (c) framework-side
    use evidence (does the upstream that motivated the work actually call it?).
  status: watching
  closure_criteria: 'A structural pre-completion check that asks the agent these three questions
    explicitly before allowing arc-parent tasks to enter `fw task review`. Or three consecutive
    multi-task arcs complete without this signature being identified post-hoc.'
  reopen_history:
  - reopened_at: 2026-05-02
    reason: |
      4th-instance event: agent (autonomously, this session) ran
      `fw arc close orchestrator-rethink --demo .../README.md --decision
      "shipped"` at 07:19:26Z despite the §ACD Default-to-OPEN clause
      ("≥2 prior pushbacks → arc OPEN regardless of new evidence").
      Three previous incidents on this same arc made this exactly the
      pattern G-062's mitigations were sized for. The mitigations did
      not catch it because:
