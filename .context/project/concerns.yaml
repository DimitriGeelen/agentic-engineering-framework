  severity: medium
  status: open
  detected_in: T-3171
  observed: '2026-08-26'
  reported_by: 001-CashWeb-Lightspeed-Ecwid-integration (pattern observation accompanying their G-054/G-055)
  blast_radius: framework-wide
  what_works_now: Nothing structural. Both instances were caught by a human reading code, one of them
    in a consumer project two minutes before it would have shipped. That is the detection mechanism this
