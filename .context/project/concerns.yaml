  reported_by: 001-CashWeb-Lightspeed-Ecwid-integration (their T-151 / G-051, vendored v1.6.29)
  blast_radius: cross-project
  what_works_now: T-3070 removed the dual-WRITER collision for projects that did migrate, and its regression
