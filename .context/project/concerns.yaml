- id: G-071
  type: gap
  title: Deterministic tier has no graduation tripwire — components ship with frozen world-assumptions
    and fail silently (exit 0), starving the stage-4 exception manager
  description: "The framework's maturity ladder moves work from stochastic (agent\ninitiative) to deterministic\
    \ (scripts, gates, cron). The terminal\nstage inverts roles: the framework does the work, the agent\
    \ becomes\nan out-of-band monitor and exception manager. That inversion assumes\nthe deterministic\
    \ tier FAILS LOUDLY. Nothing enforces this.\n\nA deterministic component encodes a world-assumption\
