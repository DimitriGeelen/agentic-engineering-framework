  description: "web/templates/inception_detail.html:306-326 renders the decision form only when `dec == 'pending' and task._location == 'active'`. Once `fw inception decide` records a decision, the form element disappears and only the read-only Decision Record card remains. web/blueprints/inception.py:393 `record_decision` has no counterpart to revoke or overwrite. A human who realises the decision was wrong, based on stale evidence, or superseded by new scoping has no UI path to change it — the only recovery today is to hand-edit the task markdown and strip the `## Decisions` block so the form re-renders. This (a) bypasses the inception-decide pipeline (rationale capture, timestamp, Updates log entry), (b) breaks audit, (c) is the exact agent-workaround-worse-than-bug pattern flagged by G-019. The framework positions humans as sovereign ('can override anything'), but the UI removes the override path after first use."
