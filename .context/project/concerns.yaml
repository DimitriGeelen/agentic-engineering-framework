  type: gap
  title: "Task-ID race inside single pickup_process run — N envelopes in one cron fire all get the same T-ID"
  description: "Observed 2026-04-20: a single pickup_process run drained 7 envelopes from .context/pickup/inbox/ and created 7 auto-inception tasks — all assigned T-1345. Files: T-1345-pickup-codify-rpc-resilience-..., T-1345-pickup-fw-fabric-drift-..., T-1345-pickup-vendored-agentic-framework-..., T-1345-pickup-watchtower-csrf-403-..., T-1345-pickup-watchtower-fabric-crashes-..., T-1345-pickup-watchtower-flask-secretkey-..., T-1345-pickup-watchtower-loadlatestaudit-.... G-051's flock protects against CONCURRENT pickup-process invocations, but within a SINGLE invocation that calls fw task create in a loop, the ID allocator reads the same next-ID value for each call (no increment committed to disk between sibling calls). Same structural class as T-1279 (race between fw work-on / task-create) but in a different caller surface."
