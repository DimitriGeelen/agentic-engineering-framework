- id: G-050
  type: gap
  title: do_vendor rsync excludes pycache from transfer but does not delete pre-existing pyc files in
    target — vendored trees retain stale .pyc after upgrade
  description: 'bin/fw:247 do_vendor uses `rsync -a --delete --exclude=__pycache__ --exclude=*.pyc ...`.
    The semantics of rsync''s `--exclude` is: do not transfer matching files. Combined with `--delete`,
    files in dest that match the exclude pattern are NOT removed (excluded files are ''protected'' from
    deletion). Result: a vendored .agentic-framework that previously contained pyc/__pycache__ still contains
    them after `fw upgrade --source ...` because rsync excludes them from cleanup. The fallback cp path
    (bin/fw:251-253) does cleanup correctly via `find ... -delete`; the rsync path does not. T-1323 added
    a .gitignore to keep them out of git, but the files themselves linger. 050 e-agent observed 114 MB
    vendored install including pyc files post-upgrade. Fix: add `--delete-excluded` to rsync flags OR
    mirror the find-cleanup post-rsync.'
  spec_reference: bin/fw:228-262 do_vendor rsync path, bin/fw:251-253 cp fallback cleanup, T-1323 .gitignore,
    P-038
  severity: low
  trigger_fired: true
  trigger_event: '2026-04-19: 050 e-agent observed 114 MB vendored install with __pycache__/.pyc files
    post-upgrade to v1.5.744'
  detection_lag_days: '0'
  what_works_now: Future pyc generation is .gitignore'd (T-1323). cp fallback path cleans correctly. Fresh
    vendored installs (target empty) have no pyc since they're never copied in.
  what_remains: 'Existing vendored installs with pre-existing pyc retain them across upgrades — wasted
    disk + audit noise potential. Mitigation: add --delete-excluded to rsync_args in do_vendor.'
  mitigation_candidate: 'Single-line fix: `rsync -a --delete --delete-excluded ...` in bin/fw:247. Bats:
    vendor with pre-seeded pyc in target, run upgrade, assert pyc removed.'
  mitigation_applied: '2026-04-19 T-1335: --delete-excluded flag added to do_vendor rsync call in bin/fw:247.
