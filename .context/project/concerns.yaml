  - 'No structural enforcement: no test asserts CLAUDE.md Quick Reference matches `fw help`. No `fw doctor` check for doc/help parity. No CI step that regenerates CLAUDE.md from canonical source. The Quick
    Reference is a hand-maintained snapshot that decays whenever a new feature ships without a doc-update step.'
