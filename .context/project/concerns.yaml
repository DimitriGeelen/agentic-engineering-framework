- id: G-062
  type: gap
  title: "Framework-blindness pattern — 'shipped' declared before fresh-substrate behavioral verification (mitigated 2026-05-01: all three mechanisms shipped — T-1655 text + T-1656 audit detective + T-1657 review-gate preventive)"
  description: 'Recurring failure signature observed in three independent arcs over five weeks:
    the agent declares an arc "shipped" / "GO awaiting review" based on (a) `cargo check` /
    `cargo test --lib` passing, (b) line-number trace through the integration code path,
