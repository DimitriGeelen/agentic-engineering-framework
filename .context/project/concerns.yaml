- id: G-069
  type: gap
  title: "Framework-repo PROJECT_ROOT discovery walks past framework into fs root"
  description: |
    web/shared._discover_project_root(start) walks ancestors looking for
    .framework.yaml (the consumer marker). When run from inside the framework
    repo itself (starting Watchtower from the framework cwd without
    PROJECT_ROOT env), the walk does NOT stop at the framework root — it
    climbs all the way to /. On this host a stray /.framework.yaml
    (version: 1.5.0, dated 2026-05-01) at filesystem root caused discovery
    to return / instead of the framework dir.

    Caught while wiring Watchtower /escalation-drift v0.5 panel for T-1727.
    The watchtower process started without PROJECT_ROOT env and resolved
    PROJECT_ROOT to /. All Watchtower routes serving project-relative
    content (LATEST.yaml, tasks/, focus.yaml) returned empty/missing —
    silent degradation, no error log.

    The /.framework.yaml is itself an artifact of some earlier experiment
    (whose? uncertain — file is dated 2026-05-01) and should be removed,
    but the discovery walk is the structural flaw: a framework process
    running from the framework root should resolve PROJECT_ROOT to the
    framework root, not climb past it.
  spec_reference: "web/shared.py:_discover_project_root, _resolve_project_root"
  severity: medium
  trigger_fired: true
  trigger_event: |
    2026-05-05 — Watchtower restart during T-1727 build returned
    /escalation-drift empty page because PROJECT_ROOT resolved to /,
    masking 170-row v0.5 LATEST.yaml. Workaround: explicit PROJECT_ROOT
    env on launch.
  resolution_path: |
    1. Delete /.framework.yaml (immediate; filesystem pollution).
    2. Harden _discover_project_root: when start is inside FRAMEWORK_ROOT,
       refuse to walk past FRAMEWORK_ROOT — fall through to FRAMEWORK_ROOT
       fallback explicitly.
    3. fw doctor host-level check: warn if /.framework.yaml exists.
    4. Regression test pinning that web.shared.PROJECT_ROOT resolves
       to FRAMEWORK_ROOT when env unset and cwd=FRAMEWORK_ROOT.
  status: resolved
  created: 2026-05-05
  last_reviewed: 2026-05-05
  resolved: 2026-05-05
  resolved_by: T-1747
  related_task: T-1727
  related_tasks_extra: [T-1310, T-1747]
  resolution_notes: |
    All 4 resolution_path steps shipped in T-1747 (commit b948687aa):
      1. /.framework.yaml deleted (verified `! test -f /.framework.yaml`).
      2. web/shared._discover_project_root bounded — refuses to walk past
         FRAMEWORK_ROOT when start is inside it.
      3. fw doctor Check 2c added — host-hygiene WARN if /.framework.yaml
         appears at filesystem root.
      4. tests/unit/test_project_root_discovery.py — 7 regression cases
         (bound, consumer use case, resolve fallback, direct G-069 replay).
    Prevention: future stray markers are caught by `fw doctor` (loud WARN),
    and refactors reintroducing the unbounded climb fail the regression test.
    Learning: L-357 captures the bounded-walk principle for future routines.

- id: G-070
  type: gap
  title: "Fabric drift resolver flags data-artifact edges as 'stale'"
  description: |
    `fw fabric drift` reports 20 stale edges, all targeting runtime data
    artifacts that legitimately have no fabric card:
      - .context/handovers/LATEST.md (symlink to the current handover)
      - .tasks/active/, .tasks/completed/ (directories)
      - .context/bus/blobs/ (blob staging dir)
      - .context/working/{stop-guard.log,focus.yaml,*.cursor,*.log} (state)
      - prompts/ (directory)
      - subagent-returns.jsonl (runtime ledger)

    The resolver treats "target has no fabric card registered" identically
    to "target file does not exist" — both emit `unresolved`. Result: every
    `fw fabric drift` and `fw audit` invocation reports 20 stale edges
    that are actually correct dependencies. Real drift (a card pointing at
    a deleted source file) is drowned in this noise.

    Verified by spot-check: `ls -la .context/handovers/LATEST.md` shows
    a real symlink, `ls -ld .tasks/active/ prompts/ .context/bus/blobs/`
    confirms all four are real directories. The fabric system simply
    doesn't model "this dependency targets a data/runtime artifact, not
    a coded component."

    Discovered 2026-05-28 during arc-007 wrap-up triage (S-2026-0528-0118)
    while looking for bounded HV/LC autonomous work. The 20 stale-edge
    signal had been WARN-noise in audit reports for an unknown duration.
  spec_reference: "agents/audit/audit.sh (fabric drift section); fabric resolver in lib/ or agents/fabric/"
  severity: low
  trigger_fired: true
  trigger_event: |
    2026-05-28 — agent triaging audit WARNs for bounded fixes ran
    `fw fabric drift` and found 20 stale edges, ALL on data/runtime
    artifacts. Filed when no real drift was distinguishable in the noise.
  resolution_path: |
    1. Resolver should distinguish two failure modes:
       (a) target file/dir EXISTS on disk but no card registered → silent
           (or annotate "data-artifact dependency", not "stale").
       (b) target file/dir does NOT exist on disk → STALE (real drift).
    2. Optionally: support `type: reads_data` / `type: reads_runtime`
       on fabric edges to opt out of card-resolution explicitly. Cards
       declaring data-artifact deps would self-document the intent.
    3. Regression test: card with `depends_on: .tasks/active/` (real dir,
       no card) → silent in `fw fabric drift`. Card with
       `depends_on: nonexistent/path.sh` → stale WARN.
  status: watching
  created: 2026-05-28
  last_reviewed: 2026-05-28
  related_task: T-1062
