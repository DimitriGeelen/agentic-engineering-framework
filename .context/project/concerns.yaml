    and L-300 (advisory-text-fails-to-fix-recurring-patterns), but on the
    human's CONTROL surface rather than the agent's. Worse blind spot:
    silent failure on a human-driven action is more damaging than silent
    failure on an autonomous one — humans assume success and move on.

    Three RCs, all in T-1745 RCA (`docs/reports/T-1745-rca-watchtower-decision-silent-failure.md`):
      - RC1: validator regex too strict on inner emphasis (`**Recommendation:** **GO**`)
      - RC2: `_decision_recorded_in_task` matched placeholder comment text → false-positive primary_landed
      - RC3: template only renders `?error=`, ignores `?warning=` (RC2 routes via warning)

    T-1746 fixes all three RCs with surgical edits + integration test pinning
    all three layers. But the META-pattern — no e2e contract test pinning
    "user submits → decision persists OR user sees error" — is what allowed
    three independent code paths to drift together unchecked.
  spec_reference: "CLAUDE.md §Presenting Work for Human Review (T-679); CLAUDE.md §Authority Model"
  severity: high
  trigger_fired: true
  trigger_event: |
    T-1744 GO submitted 2026-05-05 12:48:09 via Watchtower. Recorded zero times across
