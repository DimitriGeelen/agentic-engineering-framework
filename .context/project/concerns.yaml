- id: G-021
  type: gap
  title: Path isolation failure — hardcoded absolute paths in committed files disable all enforcement on clone/move
  description: 'fw init bakes machine-specific absolute paths into 3 committed files: (1) .claude/settings.json — 12 hook
    commands with hardcoded FRAMEWORK_ROOT and PROJECT_ROOT, (2) .framework.yaml — framework_path field, (3) CLAUDE.md — __FRAMEWORK_ROOT__
    template substitution. When a project is cloned to a different machine, moved, or the framework is reinstalled to a different
    path, ALL hooks silently fail. Claude Code does not error on missing hook commands — it skips them. This means every enforcement
    gate (task gate, tier 0, budget gate, plan mode block, error watchdog, dispatch guard, pre-compact handover, post-compact
    resume) is silently disabled. The framework''s entire value proposition — structural enforcement over agent discipline
    — becomes a facade.

    '
  spec_reference: CLAUDE.md §Enforcement Tiers, Constitutional Directive D4 (Portability)
  severity: urgent
  evidence:
  - Termlink project (.claude/settings.json) contains /Users/dimidev32/.agentic-framework paths — breaks on any other machine
  - Framework's own settings.json contains /opt/999-Agentic-Engineering-Framework — breaks on clone
  - G-007 was the same class (FRAMEWORK_ROOT vs PROJECT_ROOT in 3 scripts) — fixed symptom, not root cause
  - fw doctor does not validate hook paths exist
  - fw upgrade step [5/8] counts hooks (10/10 present) but does not validate paths — false green
  - fw self-test runs on same machine as init — paths always match — false confidence
  - fw audit does not check for machine-specific paths in committed files
  contamination_points:
  - lib/init.sh:499-608 — heredoc with variable expansion (not quoted) bakes $dir and $FRAMEWORK_ROOT
  - 'lib/init.sh:179 — framework_path: $FRAMEWORK_ROOT in .framework.yaml'
  - lib/init.sh:440 — sed s|__FRAMEWORK_ROOT__|$FRAMEWORK_ROOT|g in CLAUDE.md template
  what_is_broken:
  - Every consumer project on a different machine has zero enforcement
  - Every clone of any framework-initialized project has zero enforcement
  - fw doctor gives false health (doesn't check hook paths)
  - fw upgrade gives false green (counts hooks, doesn't validate paths)
  - fw self-test gives false confidence (same-machine testing)
  related_to: G-007 (same root cause class, fixed only for 3 budget scripts)
  status: resolved
  resolution: 'All 3 contamination points fixed upstream: (1) init.sh uses quoted heredoc with portable .agentic-framework/bin/fw
    paths (T-496), (2) framework_path removed from .framework.yaml (T-498), (3) __FRAMEWORK_ROOT__ sed substitution removed
    (T-572). fw doctor now validates hook paths (check 6). Dead sed line cleaned up T-572.

    '
  created: 2026-03-14
  last_reviewed: 2026-03-24
  resolved_date: 2026-03-24
  related_task: T-572
- id: G-022
  type: gap
  title: Multi-project cron collision — fw audit schedule install overwrites single /etc/cron.d/agentic-audit
  description: 'Hardcoded cron filename means only one project per machine gets scheduled audits. Last to install wins, all
    others silently lose cron. Same class as G-021 (silent enforcement disabling). Discovered when 150-skills-manager overwrote
    framework repo''s cron without warning.

    '
  spec_reference: CLAUDE.md §Constitutional Directive D2 (Reliability), agents/audit/audit.sh:25
  severity: urgent
  evidence:
  - audit.sh:25 — CRON_FILE='/etc/cron.d/agentic-audit' hardcoded
  - 150-skills-manager agent overwrote framework cron, dismissed with 'for now this is fine'
  - No overwrite warning, no collision detection
  - fw doctor does not check cron ownership
  status: closed
  resolution: 'T-602: project-specific cron filenames (basename slug). T-604: cron definitions moved to PROJECT_ROOT/.context/cron/
    as git-tracked source of truth with copy-on-change, drift detection, and sudo degradation.

    '
  created: 2026-03-24
  last_reviewed: 2026-03-24
  related_task: T-601
