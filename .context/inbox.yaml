- id: OBS-306
  text: "CORRECTION TO OBS-305 AND OBS-304 — THE AUDIT IS NOT SLOW, IT IS BLOCKED. Both prior entries attributed the pileup to audit RUNTIME. Measured 2026-08-16: PID 250439 had 4:59 elapsed against 00:00:02 of CPU time, its child 251163 had 00:00:00, both in state S. A process consuming 2 CPU-seconds in 5 minutes is not computing, it is waiting. pstree shows the mechanism: audit.sh(250439) forks audit.sh(251163)---sleep(251165), i.e. a lock-acquisition backoff loop, alongside audit.sh(801408)---timeout---bash doing the actual work. 250439 sits in wchan pipe_read; 251163 in do_wait on its sleep child. So the audits are queued on each other's lock in a sleep/retry loop while still holding the lock file open (fuser lists them), which is why the pre-push gate's exit-75 contention branch fires every time. This inverts the fix direction: making the audit FASTER would not help, because it is not spending time computing. The candidate fixes in OBS-305 that remain valid are the cron overlap guard (skip the run entirely when the lock is held, rather than queueing behind it) and a bounded lock wait; 'optimise audit runtime' is the wrong lead and should not be pursued on this evidence. Also revisit whether audit.sh re-invoking itself as a child with identical --section args is intended — a parent that both holds the lock and spawns a child waiting for it is a self-deadlock shape."
  captured: 2026-08-16T20:05:37Z
  context_task: T-3046
