- id: OBS-177
  text: 'T-2825 worktree-remove guard ships a false-positive that makes --force routine. lib/worktree.sh
    compares only against the SAME-NAMED remote branch (origin/<branch>..<branch>). Under the T-100196
    flow, work FF-lands onto master and the per-branch remote ref is stale or absent, so the predicate
    reports unlanded work that is fully landed. Measured live: t100199-close refused with ''REFUSED --
    branch has commits not on any remote / 31 commit(s)'', while git rev-list --count origin/master..t100199-close
    = 0 AND git log t100199-close --not --remotes = 0. The message''s own claim (''not on any remote'')
    is false; the check never consults any remote but one. Exit code is correct (1) on both paths, so
    the refusal is real, not cosmetic. Effect: every worktree whose work landed on master is permanently
    unremovable except via --force, which reinstates the exact bypass habit the guard exists to prevent.
    Correct predicate is reachability from ANY remote ref (git log <branch> --not --remotes), or content
    comparison per T-100142 fw worktree gc, which was written this way precisely because re-derivation
    defeats naive ref comparison. Guard is otherwise sound: refuses correctly on the genuinely-stranded
    worktrees, message is clear and names both remedies.'
