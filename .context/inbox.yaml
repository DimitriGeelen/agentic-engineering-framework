  urgent: true
- id: OBS-309
  text: "CORRECTION TO OBS-307: 'NEVER REAPED' WAS TOO STRONG. OBS-307 claimed the hung audit.sh processes spawned by the pre-push hook are never reaped. Measured afterwards: pgrep -c audit.sh reached 0 with no intervention, so they ARE reaped — consistent with the 600s AUDIT_TIMEOUT watchdog in agents/audit/audit.sh:374 rather than with never. The accurate claim is that they persist for up to AUDIT_TIMEOUT (default 600s) while holding the lock, which is long enough that a push-retry loop tightens faster than the holders drain, and that is why retrying degraded rather than recovered. The rest of OBS-307 stands: parentage was verified (ppid = .git/hooks/pre-push), and retrying does manufacture holders. Also correcting the sequence: after the holders drained, a push attempt failed with exit 2 'audit has FAILURES' — a DIFFERENT block from exit 75 contention — so the gate is not only a contention problem and the audit's actual findings still need reading once the lock behaves."
