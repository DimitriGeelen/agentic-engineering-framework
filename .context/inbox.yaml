- id: OBS-035
  text: 'T-2091 RCA prevention follow-up: structural detector for active↔completed task-id collisions.
    Three prongs surfaced: (1) PreToolUse hook on Write|Edit to .tasks/active/T-*.md that checks .tasks/completed/T-NNNN-*.md
