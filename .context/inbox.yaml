- id: OBS-236
  text: 'Agent-side grep is a Claude Code shim routing to ugrep 7.5.0; every gate/hook/script gets /usr/bin/grep.
    TWO divergences, both false-absence: (1) regex semantics — mid-pattern $ anchors under ugrep, literal
    under GNU (832 rail 570/571); (2) FILE SET — gitignored files silently dropped from recursive agent
    sweeps. Measured here: grep -rl agent = 2 files, /usr/bin/grep -rl = 4, same dir. ''I swept and found
    nothing'' is the sentence this corrupts. Sibling to G-034 (verdict over empty population) and G-035
    (instrument with no live caller): instrument and subject are different programs. Confirmed identical
    shim in 832''s tree. CORRECTED 2026-08-12 (832 rail 573, reproduced here before accepting): (a) ATTRIBUTION
    — I originally named the flag set ''--ignore-files --hidden -I --exclude-dir=.git'' as the cause.
    Wrong. --ignore-files is the whole effect; --hidden REDUCES the divergence by making ugrep read dotfiles
    GNU -r already reads. Matters because ''hidden files, so .context/ is at risk'' is the wrong model
    — .context/working/ is at risk where it is GITIGNORED, not where it is dot-prefixed. (b) BOUND — the
    divergence is RECURSION-ONLY. Verified on a 4-file fixture: `grep -rl` diverges 2 vs 4; `grep -l PATTERN
    namedfile` and `grep -l PATTERN *.glob` agree exactly, because --ignore-files filters traversal, not
    arguments (the shell expands globs before grep sees them). So the re-measure action is NOT ''every
    baseline authored by grep'' — it is only baselines authored by `grep -r`. A baseline from `grep -c
    PATTERN somefile` needs no re-measure at all. This makes the action finite. (c) REPRODUCED HERE, and
    the mechanism is NOT the one either of us assumed. Sweep of .context/working/ for the focused task
    id: agent 1 file, gate 3. I first wrote that it would NOT reproduce because our focus.yaml/session.yaml
    are TRACKED (git ls-files confirms; git check-ignore reports them NOT ignored) — and that reasoning
    was wrong in both directions. Two distinct mechanisms, verified: (i) INDEX-BLINDNESS — ugrep applies
    ignore-file PATTERNS textually and knows nothing of git''s index. Git does not ignore a file it already
    tracks; ugrep does not care. .context/working/.gitignore lists `focus.yaml` and `session.yaml`, so
    both are invisible agent-side while `git check-ignore` says they are not ignored. ''Is it gitignored?''
    is therefore the WRONG predicate — ''does any in-scope ignore pattern match it?'' is the right one,
    and the two disagree exactly on tracked-but-pattern-matched files, which is the class holding our
    working memory. (ii) ROOT-DEPENDENCE — the effective ignore set depends on where the sweep STARTS.
    Ignore files at or below the search root apply; ones above it do not. Measured: .new-file-counter
    (listed in the ROOT .gitignore) is VISIBLE to an agent sweep rooted at .context/working/ and INVISIBLE
    to one rooted at the repo root. So two agent-side sweeps for the same string, differing only in start
    directory, disagree with each other. Consequence: neither ''it is tracked'' nor ''git check-ignore
    says no'' licenses trusting an agent-side recursive sweep, and an instance count is not transferable
    between trees OR between search roots within one tree.'
