- id: OBS-124
  text: "No framework surface asks whether a validation check is CAPABLE of passing, so a check whose green state is unreachable reads as a persistent-but-tolerated failure indefinitely. Isolated from T-2724 rather than folded into it (same principle 832 and this project applied to OBS-119/OBS-120: folding is how the second finding disappears into the first). T-2724's concrete instance: lib/validate-init.sh's hookpaths-6vc and func-paths checks could NEVER pass for the settings.json that fw init itself generates, because the validator compared an unexpanded ${CLAUDE_PROJECT_DIR} literal against the filesystem. Every fw init since that hook form was adopted printed 'Validation: 2 error(s)' and 'Init completed with validation errors'. In the occupancy/capability vocabulary ratified with 832 at rail 378 this is a CAPABILITY zero presenting as an OCCUPANCY zero - a check that cannot pass looks identical to one that merely has not passed yet, and 'it always says that' survives as the explanation precisely because nothing can distinguish them from outside. Two properties made it durable: (a) firing on 100% of runs carries zero information, so the signal self-cancels and gets read as decoration - which is also how a LATER genuine failure would have been ignored; (b) fw init exits 0 while printing 'completed with validation errors', so no downstream gate could act on it even in principle. Candidate detections, none implemented: a self-test that runs each validate-init check against the artefact fw init produces and FAILS if any check cannot reach pass on the framework's own output (the strongest form - it makes the framework's generated config the oracle for its own validators); a doctor rail flagging any check with a 100% failure rate across recorded runs; a general audit question 'which of our checks have never once passed, and is that occupancy or capability'. Note the same question applies to the inverse and 832 has the sibling case - their SKIPPED_NO_AUTHORITY=0 was deliberately recorded as an occupancy zero to stop a later reader promoting it to 'cannot happen'."
