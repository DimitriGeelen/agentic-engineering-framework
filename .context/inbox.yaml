- id: OBS-198
  text: 'T-2870: third member of the L-387 pipefail family, not covered by the two hints in the task template.
    diff exits 1 to mean FILES DIFFER — which is often the exact outcome a verification line is asserting
    — so ''diff a b | grep -q PAT'' fails under set -eo pipefail precisely when it succeeds. Not SIGPIPE
    (hint 1) and not a test-runner exit code (hint 2): it is an INFORMATIONAL non-zero producer, where
    non-zero is a result value rather than an error. Same shape applies to grep itself (1 = no match),
    cmp, and git diff --exit-code. Fix is the same capture-first idiom but for a different reason: delta=$(diff
    a b || true); echo "$delta" | grep -q PAT. Caught by rehearsing under ''bash -c set -eo pipefail''
    before hitting the gate, per T-2743 — by hand it returned 0.'
