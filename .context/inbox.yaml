- id: OBS-305
  text: "PRE-PUSH AUDIT GATE CAN DEADLOCK AGAINST CRON AUDIT PILEUP, WITH NO TIER-2 ESCAPE. The gate (T-2930/OBS-221, agents/git/lib/hooks.sh:915) correctly BLOCKS on exit 75 (lock contention) rather than false-passing — that reasoning is sound and should stay. What has gone stale is its premise: the block message says 'usually the daily cron audit — it finishes within a minute or two'. Observed 2026-08-16: THREE concurrent 999-framework audits (PIDs 250439, 251163, 365610) all running 'audit.sh --section structure,compliance,quality,discovery --cron', ages 3:45/3:45/2:47, plus 2 more from 050-email-archive — 5-7 audit.sh across the host. structural-30m fires every 30 min; if a run exceeds that, runs stack and the lock is effectively never free. The pre-push gate runs '--section structure', the SAME section the cron holds, so it contends every time. Net effect: 5 commits could not be pushed for 15+ min, and the ONLY documented escape is Tier 0 'git push --no-verify'. A gate whose wait-it-out advice no longer holds and whose only bypass is Tier 0 pushes agents toward Tier 0 for a routine push. Sibling to OBS-304 (full audit >10 min, no partial output) — same root (audit runtime), different consequence (there: unusable as an AC; here: push path unreliable). Candidate fixes: cron overlap guard (skip if lock held), a Tier-2 env bypass for contention-only exit 75 distinct from the Tier-0 --no-verify, or bounded lock wait in the gate itself."
