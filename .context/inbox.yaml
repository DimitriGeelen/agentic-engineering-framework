  text: "tests/unit/audit.bats asserts [ \"$status\" -le 1 ] on audit.sh runs. That conflates exit 2 (audit ran, found FAILs) with exit 75 (audit COULD NOT RUN - another audit holds the lock, T-2930). Under any concurrency - the unit suite's own audit tests, a concurrent push's pre-push gate, the daily cron - 9 tests in that file go RED for a reason unrelated to the code under test. Observed live 2026-08-25 during T-3129: 9/14 unit-suite failures were this, while a direct probe of 'audit.sh --section structure' with no lock held exited 1 (pass). This is the false-RED mirror of the false-GREEN family (T-1828/T-3125/T-3126/T-3129): the assertion cannot distinguish 'looked and found a problem' from 'could not look'. Consequence is broader than the 9 tests - it makes every AC6-style 'no new failures in fw test unit' claim non-deterministic, so agents learn to discount suite RED. Suggested fix: assert exit != 75 explicitly and skip/retry rather than fail, so contention reports as contention."
