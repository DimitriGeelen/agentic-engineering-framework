- id: OBS-137
  text: 'L-387''s capture-first pattern is only SIGPIPE-safe below the pipe buffer. The task template
    (.tasks/templates/default.md) prescribes ''out=$(cmd 2>&1); echo "$out" | grep -q PATTERN'' as THE
    safe form for ## Verification, and T-2090 hardened it to single-pipe-only. Both are correct for small
    captures and WRONG for large ones: if the capture exceeds the 65536-byte pipe buffer and grep -q matches
    early, echo blocks on the full pipe, grep -q exits, echo takes SIGPIPE, pipeline exits 141 under pipefail.
    Measured under T-2741: curl of a Watchtower page = 146366 bytes, rc=141 on 3/3 runs, deterministic
    not racy. The safe form for large captures is a file: ''cmd -o /tmp/.out && grep -q PATTERN /tmp/.out''
    - which also keeps the producing command''s exit code in the verdict instead of discarding it. Affects
    any Verification line that curls a rendered HTML page (Watchtower routes are 50-200KB). SECOND finding,
    methodological: dry-running a verification line in an interactive shell does NOT rehearse the gate,
    because the interactive shell has no ''set -eo pipefail'' - the identical line returned 0 by hand
    and 141 under the gate. Rehearse with: bash -c ''set -eo pipefail; <line>''. Suggest a template hint
    next to the existing L-387/T-2090 hints.'
  captured: 2026-08-02 22:36:04+00:00
  context_task: T-2741
  tags: []
  status: pending
  promoted_to: null
- id: OBS-138
  text: 'Tier 0 enforcement is string-level only and this is nowhere documented, so its silence reads
    as coverage. agents/context/check-tier0.sh:40 extracts tool_input.command from the PreToolUse JSON
    and pattern-matches THAT STRING; it never opens a file the command references. So ''bash some-script.sh''
    is opaque to the gate no matter what the script does - a recursive delete inside the script is invisible.
    VERIFIED in our code, not inherited: line 40 is the only input, and the only file reads in the hook
    are lib/ sources. Reported by 832 (rail 404) after it cost them their working tree: a mutated build
    script ran rm -rf "$OUT" with the var pointing at their repo root, taking .git/.tasks/.context/.agentic-framework
