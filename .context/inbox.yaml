- id: OBS-184
  text: 'check-active-task.sh:95 exits 0 on is_bash_safe_command, which derives the command base with
    awk first-word. Its own comment asserted ''for compound commands, the first word is still the primary
    command'' -- false for A-and-B chains. So when the first word was allowlisted and no write pattern
    was present, the hook returned BEFORE the no-active-task check, the task-is-active check, the G-020
    readiness gate and the T-1730 focus-drift gate: everything after the chain operator was unexamined.
    Measured in a sandbox PROJECT_ROOT: with focus on task A, bare ''git commit -m B:x'' blocks but ''echo
    hi && git commit -m B:x'' was ALLOWED; bare ''fw task update B --status work-completed'' blocks but
    ''ls && fw task update B --status work-completed'' was ALLOWED. With NO active task, ''echo hi &&
    bash deploy.sh'' and ''ls && python3 mutate.py'' were ALLOWED -- the allowlist admits bash only with
    -n and python3 only with -c without write indicators, and the chain form defeats both conditions.
    Arbitrary script execution is the sharp end, since Tier 0 is documented as matching the command string
    only and never inspecting the contents of a file that command runs. NOTE a claim withdrawn before
    the fix landed: an earlier draft said ''echo hi && rm -rf DIR'' was allowed with no active task. WRONG
    -- inferred from a probe whose sandbox still had an active anchor task, so the observed allow meant
    ''a task was active''. Re-measured with current_task null (probe6.sh): rm BLOCKS in both bare and
    chained form, because has_bash_write_pattern runs before the allowlist and greps the whole string.
    That near-miss is why the fast path reads as string-aware when it is only word-aware. Chains with
    a write pattern still blocked, and bases not on the allowlist (true, pwd;) still blocked. SCOPE BOUND,
    measured not assumed: Tier 0 is a separate hook matching the whole string, so ''echo hi && git push
    --force'' and ''echo hi && git reset --hard'' remained blocked -- this was a task-gate/focus-gate
    bypass, NOT a destructive-action bypass. L-433 (T-2054) already warned that allowlisting a verb short-circuits
    later gates, but as guidance about WHICH verbs to add, so it was read every time the case list grew
    and never against the extraction feeding it. FIXED in T-2834: is_bash_safe_command now splits on unquoted
    chain operators and requires every segment safe; tests/unit/safe_commands_chain.bats (21 tests, 9
    red against the pre-fix file under mutation).'
