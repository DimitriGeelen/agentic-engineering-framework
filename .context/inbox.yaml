  text: "Pre-push audit lock routinely blocks pushes, and callers mask it. Four blocked pushes across two sessions today: the S-2026-0827-0859 handover push, the v1.6.768 release tag push (which then created a GitHub Release for a tag origin lacked - T-3193), and two T-3188 closure pushes. The gate is correct to refuse when no verdict was produced, but the cron audit holds .context/locks/audit.lock often enough that 'push, get blocked, hand-retry' is the normal path rather than the exception. Compounding it: every caller that pipes the push (git push ... | tail, fw release ... | tail) reads the pipeline's 0 and reports success. Candidates: have the pre-push hook WAIT briefly on the lock instead of failing immediately; or have it distinguish 'audit could not run' from 'audit failed' at the exit-code level so callers can retry automatically."
