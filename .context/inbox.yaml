  text: "Watchtower's live access log is written to a DELETED inode - every documented 'check the watchtower log' path silently reads a stale file that structurally cannot contain the answer. Measured 2026-08-02: the running server (pid 2567301, started Jul 29 13:31) holds fd 1 and 2 open on .context/working/watchtower.log marked (deleted) in /proc/PID/fd; a DIFFERENT file of the same name was created on disk Aug 2 02:38 and nothing writes to it. On-disk tail stops at 31/Jul 11:04 while the server has served requests continuously since. Discovered while trying to answer 'did the operator approve these drivers or did an automated process' - the on-disk log returned zero hits for 02/Aug and would have supported the WRONG conclusion; the true record (operator GET then two 302 POSTs) was only recoverable via tail -c N /proc/2567301/fd/1. Impact is broader than one lookup: the standing guidance feedback_check_watchtower_log_before_assuming_automation directs agents to this exact file, so the instruction now reliably produces a confident wrong answer. Same dominant class as OBS-121 and F-10 - a check reporting successfully about the wrong object. Note the failure is SILENT in both directions: the on-disk file exists, is readable, is recent enough to look plausible, and grep returns exit 1 (no match) which reads as 'the event did not happen' rather than 'this file cannot answer'. Cause is probably a log rotation or a fw serve restart path that recreates the file without SIGHUP/reopen or without restarting the server. Fix wants either reopen-on-rotate, or a startup assertion that fd 1 resolves to the path it claims, plus a doctor check comparing /proc/PID/fd/1 against .context/working/watchtower.log inode."
