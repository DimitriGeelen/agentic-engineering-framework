    strings without escape sanitization — backslash-anything (\s, \`, \'') breaks YAML parse. Recurrence:
    L-294, D-036 (T-1540), D-038 (T-1541) — three hand-fixes in 3 days, same class. Real fix: route auto-captured
    strings through yaml.safe_dump (or wrap in ''|'' literal block), or strip/escape backslashes before
