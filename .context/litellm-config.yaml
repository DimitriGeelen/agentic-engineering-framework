model_list:
  # T-1700 RCA 2026-05-03: qwen3:14b passes API-direct tool-use but
  # describes-instead-of-calls when faced with claude -p's wide tool prompt.
  # 0/10 real tool_use events. Pivoting primary alias to gpt-oss:20b for
  # comparison run. qwen3:14b kept under -qwen3 alias for opt-in regression tests.
  - model_name: claude-3-5-sonnet-20241022
    litellm_params:
      model: ollama_chat/gpt-oss:20b
      api_base: http://192.168.10.107:11434

  - model_name: claude-3-5-sonnet
    litellm_params:
      model: ollama_chat/gpt-oss:20b
      api_base: http://192.168.10.107:11434

  - model_name: claude-3-5-sonnet-qwen3
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: http://192.168.10.107:11434

  # T-1703: probe candidates — already loaded on .107, untested.
  # gemma4 8B Q4 (8.9GB), qwen3.5 9.7B Q4 (6.1GB). Both fit 16GB.
  - model_name: claude-3-5-sonnet-gemma4
    litellm_params:
      model: ollama_chat/gemma4:latest
      api_base: http://192.168.10.107:11434

  - model_name: claude-3-5-sonnet-qwen35
    litellm_params:
      model: ollama_chat/qwen3.5:latest
      api_base: http://192.168.10.107:11434

  # T-1704: function-calling-tuned candidates. T-1703 disproved that catalogue
  # restriction rescues generalist 8-10B models — they emit prose/code-blocks
  # instead of tool_use JSON. hermes3:8b (Nous Research) is explicitly trained
  # on function-calling datasets and emits tool_use format reliably in public
  # benchmarks. ~4.66GB Q4, fits 16GB easily.
  - model_name: claude-3-5-sonnet-hermes3
    litellm_params:
      model: ollama_chat/hermes3:8b
      api_base: http://192.168.10.107:11434

  - model_name: claude-3-5-haiku-20241022
    litellm_params:
      model: ollama_chat/gemma4:latest
      api_base: http://192.168.10.107:11434

  # claude -p uses haiku-4-5 for sub-tasks (compaction, sub-agent prompts).
  # Map to gemma4 — fast, no thinking-mode token waste.
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: ollama_chat/gemma4:latest
      api_base: http://192.168.10.107:11434

  - model_name: claude-haiku-4-5
    litellm_params:
      model: ollama_chat/gemma4:latest
      api_base: http://192.168.10.107:11434

  # claude -p also pings opus-4-7 for some calls (likely the model probe).
  # Map to qwen3:14b for parity with sonnet.
  - model_name: claude-opus-4-7
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: http://192.168.10.107:11434

  - model_name: claude-opus-4-7-20250101
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: http://192.168.10.107:11434

  - model_name: claude-sonnet-coder
    litellm_params:
      model: ollama_chat/krith/qwen2.5-coder-32b-instruct:IQ2_M
      api_base: http://192.168.10.107:11434

  # ── Raw-name passthrough aliases (T-2417) ──────────────────────────────────
  # `lib/ask.py` selects models by their raw ollama name (from .context/settings.yaml:
  # primary_model: qwen3:14b, fallback_model: dolphin-llama3:8b). The claude-*
  # impersonation aliases above are for `claude -p`; fw ask needs its native
  # names to resolve through the proxy without a 400. These two map the raw
  # names back to the same ollama backend, each with an openrouter fallback below.
  - model_name: qwen3:14b
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: http://192.168.10.107:11434

  - model_name: dolphin-llama3:8b
    litellm_params:
      model: ollama_chat/dolphin-llama3:8b
      api_base: http://192.168.10.107:11434

  # ── OpenRouter fallback siblings (T-2416 / T-2417) ─────────────────────────
  # INERT until the operator sets OPENROUTER_API_KEY (env, or Watchtower
  # Settings/Secrets → web/llm auto-registers OpenRouterProvider). litellm reads
  # the key lazily via os.environ at request time — with no key, the primary
  # ollama route still serves; only the *fallback* leg is dead. Do NOT hard-code
  # a key here. Each sibling mirrors a primary alias and is wired as that
  # alias's fallback under litellm_settings.fallbacks below.
  - model_name: claude-3-5-sonnet-20241022-openrouter
    litellm_params:
      model: openrouter/anthropic/claude-3.5-sonnet
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: claude-3-5-sonnet-openrouter
    litellm_params:
      model: openrouter/anthropic/claude-3.5-sonnet
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: claude-3-5-sonnet-qwen3-openrouter
    litellm_params:
      model: openrouter/anthropic/claude-3.5-sonnet
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: claude-3-5-sonnet-gemma4-openrouter
    litellm_params:
      model: openrouter/anthropic/claude-3.5-haiku
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: claude-3-5-sonnet-qwen35-openrouter
    litellm_params:
      model: openrouter/anthropic/claude-3.5-sonnet
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: claude-3-5-sonnet-hermes3-openrouter
    litellm_params:
      model: openrouter/anthropic/claude-3.5-haiku
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: claude-3-5-haiku-20241022-openrouter
    litellm_params:
      model: openrouter/anthropic/claude-3.5-haiku
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: claude-haiku-4-5-20251001-openrouter
    litellm_params:
      model: openrouter/anthropic/claude-3.5-haiku
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: claude-haiku-4-5-openrouter
    litellm_params:
      model: openrouter/anthropic/claude-3.5-haiku
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: claude-opus-4-7-openrouter
    litellm_params:
      model: openrouter/anthropic/claude-3.5-sonnet
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: claude-opus-4-7-20250101-openrouter
    litellm_params:
      model: openrouter/anthropic/claude-3.5-sonnet
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: claude-sonnet-coder-openrouter
    litellm_params:
      model: openrouter/qwen/qwen-2.5-coder-32b-instruct
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: qwen3:14b-openrouter
    litellm_params:
      model: openrouter/anthropic/claude-3.5-sonnet
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: dolphin-llama3:8b-openrouter
    litellm_params:
      model: openrouter/anthropic/claude-3.5-haiku
      api_key: "os.environ/OPENROUTER_API_KEY"

litellm_settings:
  drop_params: true
  set_verbose: false
  # T-2417: ollama-primary → openrouter-fallback. When a primary ollama alias
  # errors (ollama down, model not loaded, timeout), litellm retries the request
  # against the mapped -openrouter sibling. Inert until OPENROUTER_API_KEY is set
  # (the fallback request then 401s and litellm surfaces the original error —
  # same as no-fallback today). Each key MUST exist as a model_name above.
  fallbacks:
    - claude-3-5-sonnet-20241022: ["claude-3-5-sonnet-20241022-openrouter"]
    - claude-3-5-sonnet: ["claude-3-5-sonnet-openrouter"]
    - claude-3-5-sonnet-qwen3: ["claude-3-5-sonnet-qwen3-openrouter"]
    - claude-3-5-sonnet-gemma4: ["claude-3-5-sonnet-gemma4-openrouter"]
    - claude-3-5-sonnet-qwen35: ["claude-3-5-sonnet-qwen35-openrouter"]
    - claude-3-5-sonnet-hermes3: ["claude-3-5-sonnet-hermes3-openrouter"]
    - claude-3-5-haiku-20241022: ["claude-3-5-haiku-20241022-openrouter"]
    - claude-haiku-4-5-20251001: ["claude-haiku-4-5-20251001-openrouter"]
    - claude-haiku-4-5: ["claude-haiku-4-5-openrouter"]
    - claude-opus-4-7: ["claude-opus-4-7-openrouter"]
    - claude-opus-4-7-20250101: ["claude-opus-4-7-20250101-openrouter"]
    - claude-sonnet-coder: ["claude-sonnet-coder-openrouter"]
    - qwen3:14b: ["qwen3:14b-openrouter"]
    - dolphin-llama3:8b: ["dolphin-llama3:8b-openrouter"]

general_settings:
  master_key: sk-litellm-local-dev
