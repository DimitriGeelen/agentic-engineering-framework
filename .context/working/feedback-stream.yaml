payload:
  observation: |
    fw reviewer re-scan on T-1517 nuked a legitimate status-update entry
    that had been appended below the prior ## Reviewer Verdict block.
    The verdict-replacement appears to span from '## Reviewer Verdict' to
    EOF rather than to the next '## ' header. This corrupts the audit trail
    (status-update entries) when the reviewer is re-run on a task that has
    had Updates appended after the first scan.
  reproduction: |
    1. fw reviewer T-XXX (writes verdict at end-of-file)
    2. update-task.sh on the same task → appends ## Updates entry below verdict
    3. fw reviewer T-XXX again → verdict block rewritten, entries below LOST
  evidence: |
    git diff before revert showed the status-update block (timestamp,
    --status work-completed, reason text) being removed when only the
    verdict timestamp + scan_id changed.
  suggested_fix: |
    Bound the verdict-block replacement to the next '## ' or '### 2026-' /
    similar update entry, OR enforce that the verdict block is always
    the LAST block and disallow updates after it.
