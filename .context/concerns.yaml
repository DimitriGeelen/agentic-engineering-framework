- id: OBS-248
  type: process
  severity: medium
  surface: cross-session peer coordination (TermLink rails / SendMessage) — no delivery or membership
    verification
  detected_in: T-3001 (832-workflow-designer reported ten unanswered messages; investigation
    found no shared rail existed)
  symptom: A session can believe it is coordinating with a peer while reaching nobody, and nothing
    on either side goes red. This session posted to a rail and recorded sends with no failures;
    the peer sent ten messages to a DM topic this session's fingerprint is not a party to, and
    recorded sends with no replies. Both ledgers stayed clean for the duration. The operator's
    standing directive was explicitly to communicate often with that peer, so the failure DEFEATED
    a directive while APPEARING to comply with it — the agent reported coordination in good
    faith.
  root_cause: 'CORRECTED (T-3002, peer-supplied mechanism, re-measured here). The original entry
    described a membership/addressing fault: ''nothing checks that the topic written to is one
    both parties can read''. Both halves of that were wrong. Reads are NOT membership-gated
