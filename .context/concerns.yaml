- id: OBS-186
  type: tooling
  severity: high
  surface: lib/peer.py::poll_once (T-1818 v2 peer-consult subscriber substrate)
  detected_in: T-1820 (2026-08-11 live joint smoke rerun)
  symptom: fw peer subscribe --once always polls cleanly (exit 0, cursor written) but never
    observes a live inbox.queued event, across every TermLink version tested (0.9.1701 through
    0.11.720) and after TermLink fixed two independent emit-site bugs (T-1637, T-2363) explicitly
    to unblock this smoke.
  root_cause: 'poll_once() calls ''termlink event poll <session> --topic inbox.queued --since
    <cursor>'' -- a per-SESSION event bus read. But inbox.queued (and its dm-rail sibling dm.queued,
    T-2323) are injected into the hub-level EventAggregator under a synthetic session_id=''hub''
    (crates/termlink-hub, router::aggregator(), T-1645), a broadcast-only channel with no --since
    cursor. Per-session poll structurally cannot reach it: confirmed live by polling both the
    addressee session and an unrelated ready session immediately after a proven emit (both returned
    count=0), while ''termlink event watch --hub --topic inbox.queued'' observed the identical
    emit instantly. Independently, the DM rail (T-2323) fires under topic ''dm.queued'', not
    ''inbox.queued'' -- so .context/peer-consult-prompts.yaml''s dm:design-*/dm:escalate-*/dm:triage-
    channel-prefix routing (built for DM-addressed consults) can never be reached via the topic
    the subscriber polls, even once the poll-primitive defect is fixed.'
  prevention: 'Two independent framework-side fixes needed, both scoped in T-2918: (1) lib/peer.py
    must consume the hub aggregator (event watch --hub or an equivalent cursor-capable read)
    instead of per-session poll; (2) decide whether inbox: and dm: are one trigger rail or two
    (subscribe both topics, or align TermLink''s dm-rail topic name). Three months of investigation
    (T-1820 -> T-2409 -> TermLink T-2363) correctly fixed real TermLink-side bugs but never
    reached this framework-side defect because every rerun re-tested only the emit side, not
    whether the framework''s own poll call could reach a hub-injected event at all.'
  blast_radius: scoped
  observed: 2026-08-11
  status: open
  related:
  - T-1820
  - T-1821
  - T-1818
  - T-1819
