# Split-root blindspot class: framework-owned assets resolved via PROJECT_ROOT.
# Invisible in this repo (roots coincide); breaks/degrades shared-tooling
# consumers. 2nd shared-mode blindspot in a month (832: G-011 then G-004).
- id: OBS-097
  type: tooling
  severity: high
  surface: "web/blueprints/{review,approvals,orchestrator}.py sys.path resolution of framework lib/ via PROJECT_ROOT; class-wide: any PROJECT_ROOT resolution of framework-owned assets"
  detected_in: T-2645 (832 rail 253, their T-270/G-004)
  symptom: "In split-root consumers every /review/T-XXX page 500s with ModuleNotFoundError: dispatch_pause — the operator's entire review queue dead while every partial-complete Human AC points at those URLs. Siblings found in same sweep: approvals.py (identical insert, masked by try/except → paused-dispatch surface silently dead) and orchestrator.py (workflow-coverage panel silently 'unavailable')."
