    a `git -C <sibling-worktree>` redirect and concluded the guard is pure Claude Code harness
    behavior outside framework control: "Cannot narrow (not ours)". That conclusion was
    incomplete, not wrong about the guard itself, but silent on a second, distinct guard: the one
    that force-isolates a *background* session into a worktree in the first place. CashWeb found
    `.claude/settings.json` `{"worktree": {"bgIsolation": "none"}}` disables that second guard,
