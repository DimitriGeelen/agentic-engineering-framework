  surface: lib/review.sh:~150 (emit_review Human-AC counter, T-2948)
  detected_in: T-2954 (found while collapsing the Python copies of the same rule)
  symptom: The counter's comment tracker opens a comment span on `<!--` appearing ANYWHERE in
