- id: OBS-085
  type: bug
  severity: medium
  surface: lib/bvp.sh:836-869, agents/termlink/bvp-estimator/estimator.py:2389/2596/2724/2751
    (PyYAML fallback); lib/integrate.py (fixed)
  detected_in: T-2473 union-resolver validation
  symptom: PyYAML's implicit timestamp resolver parses an unquoted ISO `2026-06-02T00:00:00Z`
    to a Python datetime on safe_load and re-emits it as `2026-06-02 00:00:00+00:00` on safe_dump
    — different text. Any code that safe_load -> safe_dump's task `.md` frontmatter (unquoted
    `last_update:`/`created:`/`date_finished:`) or decisions.yaml silently rewrites the timestamp
    format, churning frontmatter and breaking `...Z`-expecting readers/greps.
  root_cause: PyYAML SafeLoader has an implicit `tag:yaml.org,2002:timestamp` resolver that
    auto-types unquoted ISO datetimes. BVP confirm + the BVP estimator round-trip frontmatter
    via a ruamel-preferred path with a `yaml.safe_load` -> `yaml.safe_dump` FALLBACK; the fallback
    corrupts. ruamel round-trip (load+dump) preserves the original string, so the corruption
    is MASKED on any host where ruamel.yaml is installed (present 0.19.1 on the framework host)
    — latent, not currently firing here. lib/integrate.py's union resolver used plain PyYAML
    with no ruamel guard, so its path corrupted on ALL hosts (which is how the class was caught).
  prevention: 'ALL legs FIXED. integrate.py leg in T-2473 (custom SafeLoader with the timestamp
    resolver stripped -> `_str_loader`, round-trips timestamps as strings; pinned by tests/unit/t2473_union_resolve.bats
    field-merge case asserting `...Z` survives). bvp.sh + estimator.py latent fallback legs
    CLOSED in T-2477: ported the resolver-stripped loader (`_str_safe_load`) into the PyYAML
    fallback in BOTH lib/bvp.sh (PYEOF block) and estimator.py (4 frontmatter sites) — the fallback
    is now correct regardless of whether ruamel is installed, removing the env-presence dependency
    per the Portability directive. Pinned by tests/unit/t2477_bvp_yaml_timestamp_fallback.bats
    (3 tests: estimator helper preserves Z with ruamel forced absent; a control asserting plain
    safe_load WOULD corrupt so the test is meaningful; and an end-to-end `fw bvp confirm` proving
    Z survives the rewritten frontmatter). Learning L-495 captured.'
  blast_radius: cross-cutting
  observed: 2026-06-24
  status: resolved
  related:
