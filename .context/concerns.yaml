
# T-2421 sibling observation — emit_review human-AC counter false-enters when
# task title/description contains literal "### Human" string.
- id: OBS-079
  type: bug
  severity: low
  surface: lib/review.sh:emit_review
  detected_in: T-2421 smoke against T-2420
  symptom: "CLI `fw task review T-XXX` emit_review counter false-entered human-mode on tasks whose `name:`/`description:` frontmatter contained literal `### Human` string, causing the partial-complete Recommendation gate to mis-fire (could either falsely-block or silently allow depending on AC layout). NOT a Watchtower bug — web/blueprints/tasks.py:_parse_acceptance_criteria was always correctly anchored on `## Acceptance Criteria`; the symptom was the CLI counter only."
  root_cause: "Bash while-loop AC counter (lib/review.sh:122-136 pre-T-2422) matched `### Human` anywhere in the file via `grep -q '### Human'` — no `^` anchor, no `in_ac` precondition. Frontmatter line `name: \"PreToolUse hook: detect ### Human outside ## Acceptance Criteria\"` flipped `in_human=true` on line 3, then broke at the very next `^## ` heading (`## Context`). Loop exited before reaching the real AC block, so `human_total=0`. Counter diverged from update-task.sh's `sed -n '/^## Acceptance Criteria/,/^## /p'` discipline."
  prevention: "T-2422: anchored counter on `^## Acceptance Criteria` first (in_ac state); only matches `^### Human` start-of-line within the AC block; bats `tests/unit/emit_review_ac_counter.bats` (6/6) pins the class — title containing `### Human` must not flip the counter; prose containing `### Human` must not flip the counter."
  blast_radius: scoped
  observed: 2026-06-16
  fixed_in: T-2422
  fixed_date: 2026-06-16

# T-2500 RCA — systemic self-vendor drift generates 70% commit overhead
- id: OBS-080
  type: structural-gap
  severity: medium
  surface: .git/hooks/post-commit (missing auto-sync)
  detected_in: T-2500 RCA (S-2026-0702-1113 6th recurrence in 2 weeks)
  symptom: "Push fails with 'Self-vendor: would sync N file(s)' error every 2-3 commits. Requires manual `fw vendor self && git add .agentic-framework/ && git commit -m 'refresh vendored'` before push succeeds. Pattern: 66 vendor sync commits in last 30 days (70% of all commits are just 'refresh vendored copies'). Generates 2.4× commit overhead (66 syncs / 28 substantive commits)."
  root_cause: "Framework self-vendors (bin/, lib/, agents/, web/ → .agentic-framework/) but post-commit hook does NOT auto-sync. T-2240 added pre-push CHECK (blocks push on drift) but did NOT add post-commit AUTO-SYNC (prevention). Design explicitly chose 'block and remind' over 'auto-fix', creating a MANUAL PROCEDURE that gets forgotten. Agent memory doesn't persist across compaction; operator discipline fails after 20+ reminders."
  prevention: "T-2501 (proposed): Add post-commit auto-sync. When commit touches vendored paths (bin/, lib/, agents/, web/), run `fw vendor self` immediately and amend commit to include vendored changes. Makes sync STRUCTURAL (automatic), not PROCEDURAL (manual step). Alternative: pre-commit check (too late - commit already made) or better agent memory (insufficient - doesn't survive compaction)."
  blast_radius: framework-wide (affects every framework developer)
  observed: 2026-07-02
