
# T-2834 — the Bash task gate's fast path judges a chain by its first word only,
# so every gate below it can be skipped by prefixing an allowlisted command.
# Registered BEFORE the fix per CLAUDE.md §"register first, fix second".
- id: OBS-184
  type: bug
  severity: high
  surface: "agents/context/lib/safe-commands.sh:36 (is_bash_safe_command base extraction); consumed by agents/context/check-active-task.sh:95"
  detected_in: T-2833 probe harness (measuring OBS-180, whose stated mechanism did not reproduce)
  symptom: "A Bash command whose FIRST word is on the safe-command allowlist skips every gate that follows, however unsafe the rest of the chain is. Measured in a sandbox PROJECT_ROOT: with focus on task A, bare `git commit -m 'B: x'` blocks but `echo hi && git commit -m 'B: x'` is ALLOWED; bare `fw task update B --status work-completed` blocks but `ls && fw task update B --status work-completed` is ALLOWED. With NO active task, `echo hi && bash deploy.sh` and `ls && python3 mutate.py` are ALLOWED — the allowlist deliberately admits `bash` only with `-n` and `python3` only with `-c` and no write indicators, and the chain form defeats both conditions. Arbitrary script execution is the sharp end, because Tier 0 is documented (CLAUDE.md) as matching the command string only and never inspecting the contents of a file that command runs. The gates skipped are the no-active-task check, the task-is-active check, the G-020 build-readiness gate and the T-1730 focus-drift gate."
  correction: "An earlier draft of this entry claimed `echo hi && rm -rf <dir>` is allowed with no active task. That is WRONG and was withdrawn before the fix landed. It was inferred from a probe run whose sandbox still had an active anchor task from the previous probe — so the observed `allow` meant 'a task was active', not 'the gate was bypassed'. Re-measured with `current_task: null` (scratchpad/obs180/probe6.sh): both bare and chained `rm` BLOCK, because has_bash_write_pattern runs before the allowlist and greps the WHOLE string. Recorded rather than silently edited: the near-miss is the reason the fast path reads as string-aware when it is only word-aware."
  root_cause: "is_bash_safe_command derives the command base with `awk '{print $1}'` and its own comment asserts the assumption out loud — 'For compound commands, the first word is still the primary command' (safe-commands.sh:34). That is false for `A && B`, `A; B`, `A || B`. check-active-task.sh:95 treats a safe verdict as terminal and exits 0 at line 97, so nothing downstream ever sees segment B. The reason this survived is that the fast path was designed as a READ-ONLY exemption and reviewed as one: has_bash_write_pattern runs first and DOES scan the whole string, so the obvious chain (`echo x > file`) is caught, and that near-miss makes the path look string-aware when it is only word-aware."
  prevention: "PENDING — T-2834. Fix must classify every segment of a chain, not the first word. Both directions need pinning: chained-unsafe must block, and chained-ALL-safe (`ls && git status`, `cd /x && fw doctor`) must keep passing, since that shape is used constantly and a naive fix would deny service."
  blast_radius: cross-cutting
  observed: 2026-08-06
  status: open
  scope_bound: "Measured, not assumed: Tier 0 is a SEPARATE hook that pattern-matches the whole command string. `echo hi && git push --force` and `echo hi && git reset --hard` remain blocked by check-tier0.sh (scratchpad/obs180/probe5.sh). This is a task-gate and focus-gate bypass, NOT a destructive-action bypass."
  related:
  - T-2834
  - T-2833
  - T-2054   # L-433 warned that allowlisting a verb short-circuits later gates — but about WHICH verbs, never the base extraction
  - OBS-180  # the observation whose unreproduced mechanism led here
  - OBS-182

# T-2421 sibling observation — emit_review human-AC counter false-enters when
# task title/description contains literal "### Human" string.
- id: OBS-079
  type: bug
  severity: low
  surface: lib/review.sh:emit_review
  detected_in: T-2421 smoke against T-2420
  symptom: "CLI `fw task review T-XXX` emit_review counter false-entered human-mode on tasks whose `name:`/`description:` frontmatter contained literal `### Human` string, causing the partial-complete Recommendation gate to mis-fire (could either falsely-block or silently allow depending on AC layout). NOT a Watchtower bug — web/blueprints/tasks.py:_parse_acceptance_criteria was always correctly anchored on `## Acceptance Criteria`; the symptom was the CLI counter only."
  root_cause: "Bash while-loop AC counter (lib/review.sh:122-136 pre-T-2422) matched `### Human` anywhere in the file via `grep -q '### Human'` — no `^` anchor, no `in_ac` precondition. Frontmatter line `name: \"PreToolUse hook: detect ### Human outside ## Acceptance Criteria\"` flipped `in_human=true` on line 3, then broke at the very next `^## ` heading (`## Context`). Loop exited before reaching the real AC block, so `human_total=0`. Counter diverged from update-task.sh's `sed -n '/^## Acceptance Criteria/,/^## /p'` discipline."
  prevention: "T-2422: anchored counter on `^## Acceptance Criteria` first (in_ac state); only matches `^### Human` start-of-line within the AC block; bats `tests/unit/emit_review_ac_counter.bats` (6/6) pins the class — title containing `### Human` must not flip the counter; prose containing `### Human` must not flip the counter."
  blast_radius: scoped
  observed: 2026-06-16
  fixed_in: T-2422
  fixed_date: 2026-06-16

# T-2476 — surfaced while building T-2473 (integrate union resolver). Registered
# late (governance miss: T-2473 folded the integrate.py leg of this flaw into a
# feature task instead of registering it first). This entry remediates that.
- id: OBS-085
  type: bug
  severity: medium
  surface: "lib/bvp.sh:836-869, agents/termlink/bvp-estimator/estimator.py:2389/2596/2724/2751 (PyYAML fallback); lib/integrate.py (fixed)"
  detected_in: T-2473 union-resolver validation
  symptom: "PyYAML's implicit timestamp resolver parses an unquoted ISO `2026-06-02T00:00:00Z` to a Python datetime on safe_load and re-emits it as `2026-06-02 00:00:00+00:00` on safe_dump — different text. Any code that safe_load -> safe_dump's task `.md` frontmatter (unquoted `last_update:`/`created:`/`date_finished:`) or decisions.yaml silently rewrites the timestamp format, churning frontmatter and breaking `...Z`-expecting readers/greps."
  root_cause: "PyYAML SafeLoader has an implicit `tag:yaml.org,2002:timestamp` resolver that auto-types unquoted ISO datetimes. BVP confirm + the BVP estimator round-trip frontmatter via a ruamel-preferred path with a `yaml.safe_load` -> `yaml.safe_dump` FALLBACK; the fallback corrupts. ruamel round-trip (load+dump) preserves the original string, so the corruption is MASKED on any host where ruamel.yaml is installed (present 0.19.1 on the framework host) — latent, not currently firing here. lib/integrate.py's union resolver used plain PyYAML with no ruamel guard, so its path corrupted on ALL hosts (which is how the class was caught)."
  prevention: "ALL legs FIXED. integrate.py leg in T-2473 (custom SafeLoader with the timestamp resolver stripped -> `_str_loader`, round-trips timestamps as strings; pinned by tests/unit/t2473_union_resolve.bats field-merge case asserting `...Z` survives). bvp.sh + estimator.py latent fallback legs CLOSED in T-2477: ported the resolver-stripped loader (`_str_safe_load`) into the PyYAML fallback in BOTH lib/bvp.sh (PYEOF block) and estimator.py (4 frontmatter sites) — the fallback is now correct regardless of whether ruamel is installed, removing the env-presence dependency per the Portability directive. Pinned by tests/unit/t2477_bvp_yaml_timestamp_fallback.bats (3 tests: estimator helper preserves Z with ruamel forced absent; a control asserting plain safe_load WOULD corrupt so the test is meaningful; and an end-to-end `fw bvp confirm` proving Z survives the rewritten frontmatter). Learning L-495 captured."
  blast_radius: cross-cutting
  observed: 2026-06-24
  status: resolved
  related: [T-2473, T-2476, T-2477]

# T-2481 — zone-3 go-live friction. `fw integrate run` makes worktree->master
# smooth (quiesce regenerable transients, FF/union-merge, restore) but offers
# NOTHING for the third zone: going live on MAIN's busy checkout. The operator's
# `git merge` aborted on uncommitted real-state transients + an untracked vendored
# file. The land tool's own smoothness does not extend to the host it reports on.
- id: OBS-086
  type: gap
  severity: medium
  surface: "lib/integrate.py (cmd_run hybrid-landing) — zone-3 reported but not actioned"
  detected_in: T-2481 (operator go-live merge aborted)
  symptom: "After `fw integrate run master --push` lands zone 1 (origin/master) and reports zone 3 (MAIN host on a different branch, hooks run MAIN's bin/fw), the operator's manual `cd MAIN && git merge <branch>` aborts: 16 tracked regenerable/real-state transients have local edits and 1 untracked vendored `.agentic-framework/lib/integrate.py` would be overwritten. Go-live is the one merge-back step the arc never made smooth."
  root_cause: "Zone 3 is the MAIN checkout, on a divergent session branch (t2417-fw-sessions) with CONTINUOUS hook/cron/watchtower writes + accumulating real-state (feedback-stream, gate-bypass-log, decisions, inbox, metrics-history). Two distinct failure modes, both proven LIVE (T-2482 script `--apply`): (1) MERGE MODEL IS WRONG — the script committed MAIN's transients as a checkpoint then merged origin/master, which guaranteed a content conflict on EVERY transient both sides touched (18 files, not the 1 the dry-run predicted — `merge-tree` compared pre-checkpoint HEAD, but the real merge runs post-checkpoint). Worse, the whitelist `take-theirs` would have DROPPED MAIN-side appends on accumulators (feedback-stream/gate-bypass-log/decisions/inbox) that need UNION, not theirs. (2) WRITER RACE — a concurrent git process grabbed `.git/index.lock` mid-resolution and the script crashed half-merged. A busy checkout is never quiescent, so any multi-step git mutation races."
  prevention: "CORRECT PATTERN (proven LIVE, T-2481 go-live succeeded this way): do NOT merge two divergent busy checkouts. Going live = making MAIN's CODE match master; the data must stay MAIN's. Surgical sync: `git checkout origin/master -- lib agents bin && git commit` (T-XXX) — brings master's code, touches ZERO `.context/` data, no conflicts, no accumulator loss, no writer race (single quick index op). Verified: MAIN went live (b2cdff6fe) with union resolver + reanchor + timestamp fixes, 30 `.context/` files preserved untouched. FOLLOW-UP: rewrite `bin/integrate-go-live.sh` (T-2482) around code-only checkout (drop the commit-then-merge + whitelist model entirely); then promote to `fw integrate go-live`. The current T-2482 script is a FLAWED prototype — DO NOT USE as-is (it merges, which is the wrong model)."
  blast_radius: scoped
  observed: 2026-06-24
  status: watching
  related: [T-2481, T-2482, T-2474]

# T-2484 Spike 2 — keystone bug: the orchestrator dispatch CLI is unrunnable.
# Found while proving the dispatch spine works (it does — one real dispatch landed
# with zero new code). The reason it had NEVER dispatched is this perms bug.
- id: OBS-087
  type: bug
  severity: high
  surface: "bin/fw (exec \"$FW_LIB_DIR/<x>.sh\" dispatch, lines ~4773/4780); lib/resolver.sh, lib/outcome.sh, lib/pause.sh (committed mode 100644)"
  detected_in: T-2484 Spike 2 (one real dispatch)
  symptom: "`fw resolver run` and `fw outcome backprop` (the two verbs needed to drive + capture a dispatch) fail with `Permission denied`. The orchestrator dispatch substrate is fully implemented but was unrunnable from the CLI for its entire existence — `fw orchestrator status` showed 'no dispatches captured yet' because no one could invoke it (it only runs via `python3 lib/*.py` directly, which no caller does)."
  root_cause: "bin/fw routes these verbs via `exec \"$FW_LIB_DIR/<x>.sh\"`, which requires the target to be executable. lib/resolver.sh, lib/outcome.sh (and lib/pause.sh) are committed at git mode 100644 (verified: `git ls-files -s` — NOT a worktree perms glitch). lib/ask.sh is the only exec-style verb committed 100755, which is why it is the lone survivor. Verbs invoked via `bash \"$FW_LIB_DIR/...\"` or sourced (e.g. inception) are unaffected, which masked the bug for the more commonly-used verbs."
  prevention: "FIX (T-2484 GO slice 1, one bug = one task): either `git update-index --chmod=+x` the exec-style lib/*.sh, OR change bin/fw to `bash \"$FW_LIB_DIR/...\"` (more robust — survives future mode loss). PIN with a test asserting every `exec \"$FW_LIB_DIR/*.sh\"` target in bin/fw is executable (closes the class, not just resolver/outcome). G-019 question — why was the framework blind? No gate checks that exec-routed lib scripts keep their +x bit; the verbs were never exercised end-to-end so the breakage never surfaced. The regression test IS the structural prevention."
  blast_radius: cross-cutting
  observed: 2026-06-24
  status: resolved
  fixed_in: T-2486
  fixed_date: 2026-06-24
  related: [T-2484, T-2485, T-2486]

# T-2488 — second keystone-class bug found the moment the orchestrator dispatch
# spine actually ran live. The first real worker (T-2487) failed "Prompt is too
# long" because it inherited the parent .mcp.json (~175K tokens of MCP schemas).
# Sibling to OBS-087/PL-014: a zero-usage feature's most basic failure mode sat
# undetected the whole time it couldn't run.
- id: OBS-088
  type: bug
  severity: high
  surface: "agents/termlink/termlink.sh:846 (claude -p assembly); .context/project/workflows/default.yaml; lib/{resolver,spawn,termlink_worker}.py"
  detected_in: T-2487 (first real fw resolver dispatch) → RCA/fix T-2488
  symptom: "A resolver-dispatched TermLink worker's `claude -p` died with `result: 'Prompt is too long'`, `is_error: true`, `terminal_reason: blocking_limit` on a TRIVIAL task (install litellm + curl). The assembled prompt was a clean 4925 chars — the blow-up was entirely tool-schema injection."
  root_cause: "The default workflow passed no `--strict-mcp-config`, so the worker's `claude -p` inherited the parent worktree `.mcp.json` (5 servers: termlink ~300 tools, skills ~150, playwright, fw, context7). Their schemas injected ~175,817 tokens into iteration-0 system prompt (terminal cache_creation 224,865 > 200K contextWindow). `--tools`/`--allowed-tools` (which the workflow DID set) gate which tools the model may CALL, not which MCP servers connect/inject — only `--strict-mcp-config` (T-2284 lever) stops the inheritance. The substrate had never run end-to-end before (OBS-087 made it unrunnable), so no dispatched worker had ever started with the inherited catalogue — the foot-gun was invisible because the gun had never fired."
  prevention: "FIXED in T-2488. (1) Resolver envelope defaults strict-mcp ON: `workflow.get('strict_mcp_config', True)` in lib/resolver.py; default.yaml declares `strict_mcp_config: true` explicitly. Plumbed end-to-end resolver→spawn→TermLinkWorker(`--strict-mcp-config`)→cmd_dispatch sentinel→run.sh→claude -p. Lean is the default; MCP is opt-in (`strict_mcp_config: false` + `mcp_config: <path>`). (2) tests/unit/t2488_strict_mcp_lean_worker.bats (3/3) pins the class at workflow/envelope/worker joins. (3) Verified live: re-dispatch of probe T-2485 dropped cache_creation 224,865 → 48,516, cost $1.35 → $0.29, is_error False. G-019 answer: the blindness was 'feature never exercised end-to-end' — the regression test + lean default are the structural prevention."
  blast_radius: cross-cutting
  observed: 2026-06-24
  status: resolved
  fixed_in: T-2488
  fixed_date: 2026-06-24
  related: [T-2484, T-2487, T-2488, T-2284]

# T-2490 — third "authored-ahead-of-use" bug surfaced by the litellm lane going
# live. fw doctor's litellm reachability check curled the wrong (auth-required)
# endpoint → false WARN even when the proxy was healthy.
- id: OBS-089
  type: bug
  severity: low
  surface: "bin/fw:1663 (do_doctor litellm reachability check, T-1700)"
  detected_in: T-2490 (litellm lane durability follow-up)
  symptom: "`fw doctor` emitted a host WARN 'litellm-proxy not reachable on http://localhost:4000' even when the proxy was fully up and serving completions."
  root_cause: "The check ran `curl -sf --max-time 2 http://localhost:4000/health`. litellm serves /health as an AUTH-REQUIRED endpoint → HTTP 401 without a key. `curl -f` treats 4xx as failure (non-zero exit), so the WARN branch fired regardless of proxy health. The unauthenticated liveness probe is /health/liveliness (200). The check was authored against an assumed endpoint and never run against a live litellm (the lane only came up in T-2487) — a health check never exercised against a healthy target shipped a guaranteed false-negative. Same authored-ahead-of-use class as OBS-087/OBS-088/PL-014."
  prevention: "FIXED in T-2490: endpoint → /health/liveliness; port via FW_LITELLM_PORT (default 4000). tests/unit/t2490_litellm_doctor.bats pins it structurally (check targets /health/liveliness, not bare /health) + functionally (stub mirrors litellm auth: /health=401, /health/liveliness=200; -sf distinguishes). systemd unit deploy/litellm-proxy.service (Restart=on-failure) closes the persistence leg and probes the same correct endpoint in ExecStartPost."
  blast_radius: scoped
  observed: 2026-06-24
  status: resolved
  fixed_in: T-2490
  fixed_date: 2026-06-24
  related: [T-1700, T-2487, T-2490]

# OBS-087 SIBLING in an uncovered surface. OBS-087's prevention test pinned the
# exec bit on `exec "$FW_LIB_DIR/*.sh"` ROUTED verbs (lib/*.sh) — it never covered
# STANDALONE bin/*.sh scripts. So three runnable bin scripts kept shipping 100644.
- id: OBS-090
  type: bug
  severity: medium
  surface: "bin/integrate-go-live.sh, bin/hook-enable.sh, bin/migrate-horizon-null-completed.sh (committed mode 100644)"
  detected_in: T-2497 follow-up (operator ran the documented MAIN go-live command)
  symptom: "`bin/integrate-go-live.sh --apply` fails with `Permission denied` on a clean checkout (the host MAIN go-live step). Two sibling bin scripts (hook-enable, migrate-horizon-null-completed) carried the same defect, latent."
  root_cause: "Same git-mode-not-set class as OBS-087: a runnable script (has a `#!` shebang) tracked at git mode 100644 fails the moment a caller invokes it directly on a checkout that lacks a stray local exec bit. OBS-087 was fixed for `lib/*.sh` exec-routed verbs and its regression test asserted those targets only — `bin/*.sh` standalone scripts were outside the test's scope, so the class re-surfaced in a sibling surface. The dev checkout had a local +x bit masking it; the operator's MAIN checkout did not."
  prevention: "FIXED in T-2498: `git update-index --chmod=+x` on all three; regression guard tests/unit/t2498_bin_scripts_executable.bats asserts EVERY tracked `bin/*.sh` with a `#!` shebang is mode 100755 — closes the bin surface the way T-2486 closed the lib-routed surface. The two guards together cover both invocation shapes (routed exec + standalone)."
  blast_radius: scoped
  observed: 2026-06-25
  status: resolved
  fixed_in: T-2498
  fixed_date: 2026-06-25
  related: [OBS-087, T-2486, T-2483, T-2497, T-2498]

# Self-introduced structural contradiction: a new CLAUDE.md keystone (T-100196)
# was authored instructing an action that a pre-existing live pre-commit gate
# (T-2394 master-guard) structurally blocks. Born already-contradicting — the
# inverse of the L-405 advisory-decay class.
- id: OBS-091
  type: design
  severity: medium
  surface: "CLAUDE.md §Trunk-Based Session Flow (T-100196) vs agents/git/lib/master-guard.sh (T-2394, PROTECT_MASTER=1)"
  detected_in: T-100201 (this session's GO-commit cascade)
  symptom: "CLAUDE.md §Trunk-Based instructs 'the persistent session runs on master; governance commits go straight to master', but PROTECT_MASTER=1 (T-2394 master-guard) structurally BLOCKS any direct authored commit on master. Live 2026-07-05: operator's GO commit refused with 'master is merge-only', triggering a six-command workaround cascade + a manual FF push."
  root_cause: "The T-100196 keystone was authored and landed into CLAUDE.md without cross-checking it against the already-active structural gates it collides with. T-2394 (structural) and T-100196 (advisory prose) are mutually exclusive on the 'how does the session reach master' axis; nothing forced reconciliation. No gate — nor checklist step — validates a new CLAUDE.md keystone against the set of live PreToolUse/pre-commit hooks."
  prevention: "INTERIM (T-100201): correction callout added to §Trunk-Based naming the conflict + interim safe rule (worktree→FF, no direct master commit while PROTECT_MASTER=1; structural gate wins per Instruction Precedence + L-405). Mechanism reconciliation (scope the guard / bypass in fw sync / exempt the persistent session) is an OPEN operator Level-D decision — Human [REVIEW] AC on T-100201. DURABLE candidate (out of T-100201 scope): doctor/reviewer detector that flags CLAUDE.md guidance instructing an action a live hook blocks."
  blast_radius: scoped
  observed: 2026-07-05
  status: open
  related: [T-100196, T-2394, T-100201, L-405, L-300]

