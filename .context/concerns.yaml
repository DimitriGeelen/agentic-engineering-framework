    (/root/.local/share/claude/versions/2.1.245), confirming the key is real and harness-
    recognized, not a CashWeb-local artifact. Applying the fix here then hit a second, narrower
    gap: B-005''s governed route (`fw hook-enable`) only covers the `hooks` object — there is no
    CLI for adding a sibling top-level key like `worktree`, and B-005 has no bypass env var (by
    design — hook/settings config is sovereignty-gated), so the edit could not be completed
    agent-side at all.'
  root_cause: 'T-2993''s scope was the guard it was actually blocked by (cross-worktree git
    redirect refusal) — it never needed to ask "what forces a session into a worktree in the
    first place", so it never found the earlier, disable-able guard. Separately, B-005 (T-229)
    was designed around one threat model (hand-edited hook entries silently disabling
    enforcement) and its CLI companion (`fw hook-enable`, T-3050) was scoped to match that model
    exactly — neither anticipated a legitimate non-hook settings.json key an agent would need to
    add on a human''s behalf.'
