  - T-2476
  - T-2477
- id: OBS-086
  type: gap
  severity: medium
  surface: lib/integrate.py (cmd_run hybrid-landing) — zone-3 reported but not actioned
  detected_in: T-2481 (operator go-live merge aborted)
  symptom: 'After `fw integrate run master --push` lands zone 1 (origin/master) and reports
    zone 3 (MAIN host on a different branch, hooks run MAIN''s bin/fw), the operator''s manual
    `cd MAIN && git merge <branch>` aborts: 16 tracked regenerable/real-state transients have
    local edits and 1 untracked vendored `.agentic-framework/lib/integrate.py` would be overwritten.
    Go-live is the one merge-back step the arc never made smooth.'
  root_cause: 'Zone 3 is the MAIN checkout, on a divergent session branch (t2417-fw-sessions)
    with CONTINUOUS hook/cron/watchtower writes + accumulating real-state (feedback-stream,
    gate-bypass-log, decisions, inbox, metrics-history). Two distinct failure modes, both proven
    LIVE (T-2482 script `--apply`): (1) MERGE MODEL IS WRONG — the script committed MAIN''s
    transients as a checkpoint then merged origin/master, which guaranteed a content conflict
    on EVERY transient both sides touched (18 files, not the 1 the dry-run predicted — `merge-tree`
    compared pre-checkpoint HEAD, but the real merge runs post-checkpoint). Worse, the whitelist
    `take-theirs` would have DROPPED MAIN-side appends on accumulators (feedback-stream/gate-bypass-log/decisions/inbox)
    that need UNION, not theirs. (2) WRITER RACE — a concurrent git process grabbed `.git/index.lock`
    mid-resolution and the script crashed half-merged. A busy checkout is never quiescent, so
    any multi-step git mutation races.'
  prevention: 'CORRECT PATTERN (proven LIVE, T-2481 go-live succeeded this way): do NOT merge
    two divergent busy checkouts. Going live = making MAIN''s CODE match master; the data must
    stay MAIN''s. Surgical sync: `git checkout origin/master -- lib agents bin && git commit`
    (T-XXX) — brings master''s code, touches ZERO `.context/` data, no conflicts, no accumulator
    loss, no writer race (single quick index op). Verified: MAIN went live (b2cdff6fe) with
    union resolver + reanchor + timestamp fixes, 30 `.context/` files preserved untouched. FOLLOW-UP:
    rewrite `bin/integrate-go-live.sh` (T-2482) around code-only checkout (drop the commit-then-merge
    + whitelist model entirely); then promote to `fw integrate go-live`. The current T-2482
    script is a FLAWED prototype — DO NOT USE as-is (it merges, which is the wrong model).'
  blast_radius: scoped
  observed: 2026-06-24
  status: watching
  related:
  - T-2481
  - T-2482
  - T-2474
- id: OBS-087
  type: bug
  severity: high
  surface: bin/fw (exec "$FW_LIB_DIR/<x>.sh" dispatch, lines ~4773/4780); lib/resolver.sh, lib/outcome.sh,
    lib/pause.sh (committed mode 100644)
  detected_in: T-2484 Spike 2 (one real dispatch)
  symptom: '`fw resolver run` and `fw outcome backprop` (the two verbs needed to drive + capture
    a dispatch) fail with `Permission denied`. The orchestrator dispatch substrate is fully
    implemented but was unrunnable from the CLI for its entire existence — `fw orchestrator
    status` showed ''no dispatches captured yet'' because no one could invoke it (it only runs
    via `python3 lib/*.py` directly, which no caller does).'
  root_cause: 'bin/fw routes these verbs via `exec "$FW_LIB_DIR/<x>.sh"`, which requires the
    target to be executable. lib/resolver.sh, lib/outcome.sh (and lib/pause.sh) are committed
    at git mode 100644 (verified: `git ls-files -s` — NOT a worktree perms glitch). lib/ask.sh
    is the only exec-style verb committed 100755, which is why it is the lone survivor. Verbs
    invoked via `bash "$FW_LIB_DIR/..."` or sourced (e.g. inception) are unaffected, which masked
    the bug for the more commonly-used verbs.'
  prevention: 'FIX (T-2484 GO slice 1, one bug = one task): either `git update-index --chmod=+x`
    the exec-style lib/*.sh, OR change bin/fw to `bash "$FW_LIB_DIR/..."` (more robust — survives
    future mode loss). PIN with a test asserting every `exec "$FW_LIB_DIR/*.sh"` target in bin/fw
    is executable (closes the class, not just resolver/outcome). G-019 question — why was the
    framework blind? No gate checks that exec-routed lib scripts keep their +x bit; the verbs
    were never exercised end-to-end so the breakage never surfaced. The regression test IS the
    structural prevention.'
  blast_radius: cross-cutting
  observed: 2026-06-24
  status: resolved
  fixed_in: T-2486
  fixed_date: 2026-06-24
  related:
  - T-2484
