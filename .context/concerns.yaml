    sites onto it. review.sh is bash with an inline streaming loop, so it did not come along.
    Wrong in the conservative direction — it UNDER-counts, so a task reads as having fewer Human
    ACs than it does, which cannot fabricate a completion.
  prevention: 'NOT YET BUILT. The rule now has one canonical implementation (lib/comment_strip.py,
