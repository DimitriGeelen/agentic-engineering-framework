payload:
  summary: "fw task update partial-complete recheck does not honor --skip-acceptance-criteria"
  severity: medium
  category: gate-bypass-gap

  what_happens: |
    When a task is already at `status: work-completed` but stuck in `active/`
    with unchecked Human ACs (the partial-complete state), running
    `fw task update <id> --status work-completed --skip-acceptance-criteria`
    enters a "Re-checking partial-complete status" branch in update-task.sh
    that re-checks ACs and refuses archival ("Still N/M ACs unchecked —
    task stays in active/. Check human ACs in the task file, then re-run
    this command."). The skip flag is honored on the initial captured/
    started-work → work-completed transition, but NOT on the partial-
    complete recheck.

  expected: |
    --skip-acceptance-criteria should bypass the AC check on BOTH branches
    (initial transition AND partial-complete recheck), since the auth
    semantic is "human explicitly authorized closure regardless of AC
    state". The flag is the marker of authorization; the file state is the
    artifact.

  workaround_used: |
    Today (2026-04-27): Dimitri authorized batched closure of 20 tasks
    (Groups A+B). Initial run with all skip flags returned rc=0 but tasks
    stayed in active/. Workaround: ticked Human AC boxes in each file via
    direct python rewrite, then re-ran update — succeeded.

    This undermines the auth-flag pattern: authorization should be an
    attribute of the human's chat instruction, not of the file state.

  repro_steps: |
    1. Have a task at status=work-completed, owner=human, with ≥1 unchecked
       Human AC (the partial-complete state — happens whenever Agent ACs
       are done but Human ACs are unchecked).
    2. Run: `fw task update T-XXX --status work-completed \
              --skip-acceptance-criteria --skip-sovereignty \
              --skip-verification --skip-human-ownership`
    3. Observe: rc=0, but task NOT moved to completed/.
    4. Observe stdout includes: "Still N/M ACs unchecked — task stays
       in active/. Check human ACs in the task file, then re-run this
       command."

  proposed_fixes:
    - "Audit update-task.sh: in the partial-complete recheck branch, gate the AC re-check on the absence of --skip-acceptance-criteria (mirror the initial-transition branch logic)."
    - "Add a --force-archive flag specifically for the partial-complete state, requiring --reason."
    - "If the bypass behavior is intentional (e.g. extra friction for already-completed tasks), document it in --help and CLAUDE.md so agents don't trip over it."

  evidence:
    - "Today's session: closed 20 tasks via this exact workaround. Bypass log .context/working/.gate-bypass-log.yaml records all 20."
    - "Concern C-018 in .context/project/concerns.yaml lines 951-980 has full forensics."
    - "fw task update help output (head -40) confirms --skip-acceptance-criteria is documented as 'Bypass AC gate (P-010)' but its scope on the partial-complete branch is unclear."

  related:
