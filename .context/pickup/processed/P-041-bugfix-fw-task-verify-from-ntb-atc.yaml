payload:
  summary: "fw task verify T-XXX silently exits 1 on every task — BRE backtick metachar in pattern strips entire verification block"

  detail: |
    ## Symptom
    `fw task verify T-XXX` returns exit 1 with NO stdout/stderr output for every
    task in the project, regardless of whether the task has a populated
    `## Verification` block. The user (and agent) get a non-zero return with
    no diagnostic, so the verify command is effectively unusable as a manual
    pre-completion check.

    Discovered 2026-04-27 in 003-NTB-ATC-Plugin during T-213 (fixture pull).
    Verification block had 8 valid commands, all of which pass when run
    directly. `fw task verify T-213` silently returned exit 1.

    ## Root cause
    `.agentic-framework/bin/fw:1890-1894` extracts the verification block:

        verification=$(sed -n '/^## Verification/,/^##/p' "$task_file" | \
                      grep -v "^##" | \
                      grep -v '^\`\`\`' | \
                      grep -v "^#" | \
                      grep -v "^$")

    The second filter, `grep -v '^\`\`\`'`, has a fatal regex issue.

    GNU grep's BRE engine treats `\`` as the **start-of-buffer anchor**
    (mirror of `\'` for end-of-buffer; equivalent to PCRE `\A`/`\Z`). With
    that interpretation, the pattern `^\`\`\`` reduces to:

      - `^`     start of line (matches every line start)
      - `\``    start of buffer (zero-width assertion)
      - `\``    start of buffer (zero-width assertion)
      - `\``    start of buffer (zero-width assertion)

    Empirically, GNU grep 3.11 evaluates this such that EVERY line matches.
    Net effect: `grep -v` strips ALL lines.

    Because the script runs under `set -euo pipefail`:
      1. The grep returns exit 1 (no lines selected after -v)
      2. `pipefail` propagates the 1 up the pipeline
      3. `set -e` aborts the command-substitution
      4. `verification=` is left empty, but the script has already aborted

    The verify code path's "if [ -z "$verification" ]; then echo 'No
    verification commands found'; exit 0; fi" branch is never reached
    because set -e killed the script first.

    ## Repro (5-second)

        printf 'foo\nbar\nbaz\n' | grep -v '^\`\`\`'; echo "exit=$?"

    Expected: prints foo/bar/baz, exit=0
    Actual:   prints nothing,        exit=1

    Confirmed on:
      - GNU grep 3.11 (Ubuntu 24.04 noble)

    ## Why the completion gate is unaffected
    `update-task.sh:197` uses a different (correct) pattern:

        verify_cmds=$(echo "$verify_section" | grep -vE '^\s*$|^\s*#|^\s*\`\`\`' || true)

    Three differences:
      1. `-E` (ERE) — backtick has no special meaning in ERE
      2. Raw backticks (no backslash escape) — pattern matches literal three backticks
      3. `|| true` — guards against pipefail+set-e abort even if grep exits 1

    Any of these alone would have prevented the bug. All three together
    is robust. The verify-T-XXX path got none of them.

    That asymmetry is why `fw task update --status work-completed`
    correctly runs verification commands, while `fw task verify T-XXX`
    silently fails with no diagnostic — the SAME extraction problem
    handled in TWO different implementations.

    ## Class — sibling of T-203
    Same failure shape as the framework-side bug being tracked under
    T-203 (project-side, captured via T-199 GO): `fw task review` exits 1
    silently when a task is missing `## Recommendation`. Both are
    "silent-exit-1 in the verify family of fw subcommands". Both bypass
    the script's own intended diagnostic branches due to set -euo pipefail
    catching an upstream failure. A single sweep across the verify/review
    surface for "set -e + grep-in-command-substitution" patterns would
    fix both at once.

    ## Proposed fix (minimal — one line)
    Replace line 1892 of `.agentic-framework/bin/fw`:

      OLD:  grep -v '^\`\`\`' | \
      NEW:  grep -vE '^\s*\`\`\`' | \

    Or align with `update-task.sh` and collapse all four greps into one:

      verification=$(sed -n '/^## Verification/,/^##/p' "$task_file" | \
                    grep -vE '^##|^\`\`\`|^\s*#|^\s*$' || true)

    The `|| true` is recommended regardless — guards future regex tweaks.

    ## Proposed fix (broader — same audit)
    Sweep `.agentic-framework/bin/fw` and `agents/*/*.sh` for the pattern:

      var=$(... | grep -v ... | grep -v ...)

    under `set -e + pipefail` without a `|| true`. Each occurrence is a
    silent-exit-1 hazard. T-203 will land a related fix for `fw task
    review`'s `emit_review`; this should be coordinated.

    ## Local remediation (already applied)
    None — the project agent worked around by completing T-213 via
    `fw task update --status work-completed` (which uses the correct
    completion-gate path) instead of `fw task verify` first. No project-
    local patch to `.agentic-framework/`.

    ## Acceptance for upstream fix
    - Fix line 1892 in `bin/fw` (or refactor to reuse update-task.sh's pattern)
    - Add a regression test: a task with valid `## Verification` block makes
      `fw task verify T-XXX` exit 0 with PASS lines printed
    - Add a regression test: a task with NO `## Verification` block makes
      `fw task verify T-XXX` print "No verification commands found" and exit 0
    - Coordinate with T-203 fix for `fw task review` — same class

