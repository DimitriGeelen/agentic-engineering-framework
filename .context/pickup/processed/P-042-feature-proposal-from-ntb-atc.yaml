    - "Removing the CLI form — it remains the fallback for headless / no-Watchtower environments."

  acceptance_criteria:
    - "agents/inception/AGENT.md (or equivalent) no longer emits `--rationale` in any decide-step copy-paste block"
    - "The decide-step block leads with a Watchtower URL line; the CLI line is presented as fallback"
    - "The agent's copy-paste output reads the project's `.context/working/watchtower.url` triple-file when emitting the URL (or falls back to localhost:3000 only if the triple-file is absent)"
    - "WATCHTOWER_URL prefix is auto-added to the CLI form when the project port differs from :3000"

