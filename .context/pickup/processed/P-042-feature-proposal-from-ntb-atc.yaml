payload:
  summary: "Update agents/inception/AGENT.md copy-paste guidance for review-first Watchtower decide flow + project-port awareness"

  motivation: >
    T-199 Path B (project-side, T-201) just landed in NTB-ATC's CLAUDE.md:
    inception decide is now review-first via Watchtower at
    http://localhost:3039/inception/<task-id>, with the CLI as fallback.
    The project ships its own Watchtower instance on a non-default port
    (:3039) because :3000 is taken by termlink's watchtower; the URL is
    discoverable via the triple-file `.context/working/watchtower.{pid,
    port,url}`.

    The framework's `agents/inception/AGENT.md` (or equivalent guidance
    document) still emits agent-side copy-pasteable commands shaped around
    the legacy `fw inception decide T-XXX go --rationale "..."` form.
    Three problems with that:

    1. CLI-first instead of review-first: the human can act in the
       browser but the agent still tells them to open a terminal.
    2. Hard-codes :3000 (or no URL) instead of reading the project's
       `.context/working/watchtower.url` triple-file.
    3. `--rationale` flag is now redundant — the Watchtower form captures
       the rationale through its native textarea.

  scope:
    - "Audit agents/inception/AGENT.md (or whichever inception-discipline doc is shipped with the framework) for copy-paste guidance covering the decide step."
    - "Replace the `fw inception decide T-XXX go --rationale '...'` snippet with: (a) a Watchtower URL (read from `.context/working/watchtower.url` if present, else fall back to `http://localhost:3000/inception/T-XXX`); (b) a CLI fallback line without `--rationale` (rationale captured via Watchtower form)."
    - "If the agent emits commands while WATCHTOWER_URL is unset and the project's triple-file shows :3039 (or any non-default port), prepend `WATCHTOWER_URL=http://localhost:<port>` to the CLI fallback (workaround for T-141 silent-degrade until P-013 lands)."
    - "Update any inline examples or check-lists in the same document that reference the deprecated form."

  out_of_scope:
