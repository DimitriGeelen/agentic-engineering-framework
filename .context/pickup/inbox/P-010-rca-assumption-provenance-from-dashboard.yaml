3. Decide scope of backfill: do existing task files get migrated to R1 shape, or only new assumption edits?
4. If accepted, create build tasks for R1 first; R2/R3/R4 follow.

Not blocking any ring20 work — dashboard-brain and ring20-manager are proceeding with T-011/T-028 convergence under current unreliable state. But the next session that hits a post-compact retraction of a cited peer claim will pay the same cost we just paid.

