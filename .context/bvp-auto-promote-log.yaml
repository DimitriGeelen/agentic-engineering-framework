# Auto-promote log — Business Value Points (BVP)
#
# Append-only audit trail of every auto-promotion event AND every
# enable/disable event. Written by `fw bvp auto-promote` (T-1931 + T-1932).
#
# Three event types share the entries: list, distinguished by `event:`:
#
#   event: promotion       (T-1931) — a captured → started-work promotion
#                                    fired. R4 metadata mandatory.
#   event: enable          (T-1932) — auto_promote.enabled flipped true.
#                                    Carries rationale + actor.
#   event: disable         (T-1932) — auto_promote.enabled flipped false.
#                                    Always safe; no rationale required.
#
# R4 detection mandate (event: promotion): each entry must let a forensic
# reader reconstruct the cost formula's reasoning without re-running the
# math. Required fields: task_id, ts, bvp_norm, cost, cost_components.*
# (blast_radius, tier, effort, source), thresholds_at_decision.*, mechanism.
#
# Reversibility: every promotion is captured-style; the human can revert
# via `fw task update T-XXX --status captured` if undesired. The log entry
# remains as the historical record of the decision (D-immutable).

