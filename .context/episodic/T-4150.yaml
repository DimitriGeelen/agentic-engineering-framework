# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-13 — tokeniser instead of three more regexes'
    chose: 'a single character-level scanner (`_scan`) following bash''s rules for single/double quotes, backslash and line continuation, `#` at a word start (after a blank or `;&|()<>`), heredoc delimiters (quote removal; any quoting = quoted heredoc; `<<-` tab stripping; exact terminator match), `<<<`. `strip_heredocs` and `strip_comments` keep their names and the T-2923 order but both take `_scan`''s reading; `classify()` asks `shell_syntax_refusal()` first.'
    rationale: 'each bypass was a place where two strippers read the text differently. Patching each case leaves the next differential; one reader removes the class for the shapes it covers.'
    alternatives_rejected: ['`shlex` (does not know heredocs or bash comments rules after metacharacters); calling `bash -n` (parses but does not expose its reading, and spawns a shell inside a gate). - **Guarantees now:** within the text of the command, every place bash would run a command is either an ordinary segment judged on its verb or refused — process substitution, `$(…)`/backticks (anywhere outside comments and quoted heredoc bodies), an expansion in an unquoted heredoc body (terminated or not), and any text whose reading is uncertain (unterminated quote, `$''…''`, `${…}` holding a quote/backtick/`$(`, `$[…]`, a heredoc delimiter with `$`/backtick or none). - **Does NOT guarantee:** anything inside a script or file the command runs, or a command built at run time from pieces the text does not contain — the same scope boundary as Tier 0 (CLAUDE.md T-2742). Variables already in the environment are not modelled (an unquoted-body `$VAR` is admitted). The wrap-up verbs themselves (`git commit` hooks, `fw` subcommands) run code by design.']

