# Decisions (from task file Decisions section)
decisions:
  - decision: "2026-05-06 — Override Pico per-prose-context, not globally"
    chose: "Targeted CSS overrides on `.rec-rationale code, .rec-evidence code, .ac-detail code, article code, td code, li code` etc., plus `pre > code` re-assertion of inline-block. Apply in `base.html` (covers most surfaces) and `review.html` (standalone)."
    rationale: "A bare `code { display: inline }` global override would risk breaking any consumer that legitimately wants inline-block (badges, kbd-key indicators, fixed-width labels). Targeting prose contexts limits blast radius. The `pre > code` re-assertion ensures Pygments output is unaffected."
    alternatives_rejected: ["Replacing Pico CSS — too disruptive. Stripping `<code>` tags at the linker layer — would lose semantic and visual styling. Setting `word-break: break-all` everywhere — too aggressive (mid-character breaks in non-path text are ugly)."]
  - decision: "2026-05-06 — `overflow-wrap: anywhere` over `word-break: break-all`"
    chose: "`overflow-wrap: anywhere; word-break: normal` on prose `<code>`."
    rationale: "`overflow-wrap: anywhere` is the modern standard, only triggers when the line CAN'T fit the token (preserves natural breaks). `word-break: break-all` triggers preemptively, producing ugly mid-character breaks in regular text."
    alternatives_rejected: ["`word-break: break-word` — non-standard alias, behaves differently across engines."]

