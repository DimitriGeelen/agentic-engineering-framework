# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-24 — how to make the vendor copy content-aware'
    chose: 'rsync `-rlpgoD --checksum` (that is, `-a` minus `-t`), plus a staged, `cmp -s`-gated sync for the cp fallback.'
    rationale: '`--checksum` alone is not enough. With `-t`, rsync still sets an identical file''s mtime to the source''s, and that is the false signal itself. Dropping `-t` means unchanged files are never touched and changed files get mtime = now, which is the truthful input for the mtime-based staleness check. It also fixes the false "current" where an old source mtime was copied onto a changed file. Checksumming the ~10 MB tree adds well under a second.'
    alternatives_rejected: ['hashing content at Watchtower start in `lib/watchtower-staleness.sh`: out of scope, since the task fixes the copy and the check''s mtime bias is deliberate (T-2938). `--size-only`: misses same-size edits.']

