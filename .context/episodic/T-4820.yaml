# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-27 — Which focus file a linked worktree uses'
    chose: 'A worktree''s own `.context/working/focus.yaml` when it exists (T-2463 unchanged). When it does not exist, the main checkout''s file, resolved in the one shared resolver `lib/paths.sh:fw_focus_file` that both the gate and `fw context focus` call. The gate reads `session.yaml` from the directory the focus came from, so the stamp check compares like with like. `fw context init` in such a worktree leaves an existing main focus untouched rather than creating a fork or resetting it. The fallback applies only to the tree''s own `.context`: a sandboxed `CONTEXT_DIR` (T-3141) is never redirected, and session-scoped focus (T-3038) is unchanged.'
    rationale: 'T-3098 already decided that governance state belongs to the main checkout and refuses creating it in a worktree. Reading main''s file is the only choice that agrees with that refusal. With one resolver, the reader and the writer cannot diverge whichever way `PROJECT_ROOT` was resolved: `fw_focus_file(<worktree>)` and `fw_focus_file(<main>)` name the same file.'
    alternatives_rejected: ['(a) Let the worktree create its own focus by exempting focus.yaml from T-3098. That forks tracked governance state, which is exactly the G-083 stranding class T-3098 exists for. (b) Always use main''s focus, even when the worktree has one. That would break T-2463''s per-worktree focus and its pinned tests.']

