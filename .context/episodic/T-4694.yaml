# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-23 — where a later commit naming a closed task gets counted'
    chose: 'option (b) without the backfill job. Post-commit does not rewrite an episodic that is tracked and identical to HEAD unless pre-commit predicted it for this commit. The footprint is frozen as committed at close. Later commits naming the task (bookkeeping, residual fixes) are not counted.'
    rationale: 'after a commit exists, rewriting a tracked clean file can only leave the tree dirty. Avoiding that would mean amending, which is ruled out. The close commit is still counted, because pre-commit predicts it. An untracked or already-modified episodic is still refreshed, since writing it does not change whether the tree is clean.'
    alternatives_rejected: ['(a)/(c), predicting from the message in pre-commit. Measured on this host: while pre-commit runs, `.git/COMMIT_EDITMSG` still holds the previous commit''s message, and git builds the tree before prepare-commit-msg/commit-msg run, so changes staged from commit-msg never reach the commit. The only other source is the parent process''s command line (`/proc/$PPID/cmdline`). That works only for `-m`, misses `-F` and editor commits, and is not portable. A committing backfill job was not built: it would add commits whose only purpose is counting post-close commits. Each of those would name the task again. It can be filed separately if anyone needs that count.']

