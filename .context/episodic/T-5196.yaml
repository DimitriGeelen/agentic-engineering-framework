# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-11-17 — independent review of the batch reader (AMBER) and what changed'
  - decision: '2026-11-17 — the on-disk memo is reverted; one `git cat-file --batch` reader instead'
    chose: 'revert ee89a5c73 (commit 95e10c8d2) and take the reviewer''s cheaper design. The measured gain came mostly from 1,900 process spawns (~17 s), and one long-lived `git cat-file --batch` reader removes those with no disk store and no stale-answer class.'
    alternatives_rejected: ['keeping the blob store with dedup and a 32 MiB cap. It is still a second copy of git''s own object store, with its own invalidation rules to get right. - The 160 MB `.context/working/git-object-memo.db` is no longer read by anything. Removing it is left to the operator.']
  - decision: '2026-11-16 — what may be served from the persistent memo (superseded 2026-11-17, reverted)'
    chose: 'only `show <40-hex>:<path>` and `ls-tree [-r] [--name-only] <40-hex> -- <paths>` (lower-case full id, plain repo-relative paths, no pathspec magic, no other flags). Every key also carries a context hash: memo format version, the output text encoding, `.git/config` contents and the stats of the global/system git config files, and every replace ref (loose and packed, name → target). The memo is not used at all when the state token cannot be taken, refs move while the context is read, or a `GIT_*` variable outside a harmless list (author/committer identity, editor, pager, ssh, askpass) is set.'
    rationale: 'an object id fixes the object, not the answer: this repo has 2,970 replace refs on commits, and a replace ref changes what `<sha>:<path>` resolves to (test `test_replace_ref_changes_the_answer`). Config (`core.useReplaceRefs`, `core.quotePath`) and env (`GIT_NO_REPLACE_OBJECTS`, `GIT_DIR`, pathspec env) can change it too. Folding them into the key makes old entries unreachable, never stale.'
    alternatives_rejected: ['`cat-file -e`, `merge-base --is-ancestor` and `rev-parse` on full ids — existence and ancestry can change when objects are pruned or grafts/shallow change, and together they are 78 cheap calls a page. Refs, HEAD, short ids, `^`/`~`, ranges and `log` stay on the in-memory, state-token memo as before.']
  - decision: '2026-11-16 — storage'
    chose: 'sqlite at `.context/working/git-object-memo.db` (WAL, synchronous=NORMAL), gitignored by the existing `.context/working/*.db` / `*.db-wal` / `*.db-shm` rules. Used only when `git check-ignore` confirms it is ignored in that repo. Each row carries its args (compared on read) and a sha256 of its output (verified on read; a mismatch runs git). A file that is not a database is deleted and started again; a locked/unwritable one turns the memo off for the process. Bound 512 MiB / 100,000 rows, least-recently-used eviction to 80% (last use refreshed at most hourly), checked on a process''s first write and every 256 writes. Entries over 4 MiB are not kept. Non-zero exits are never kept.'
    rationale: 'the brief asked for tmp+rename atomic files, but I may not edit `.gitignore`, and the only gitignored names under `.context/working/` that fit a cache are `*.db`. sqlite transactions give the same atomicity (a reader never sees a half-written entry), handle Watchtower threads plus CLI processes writing concurrently, and evict without rewriting a whole file; a per-file layout would have needed thousands of files under a misleading `*.db` directory name. - **Known limit:** the working set is every committed version of the two big ledgers (79.6 MB today) and grows ~1 MB per review commit (~14/day), so it reaches the 512 MiB bound in roughly a month. After that the LRU will evict versions every cold page needs and the gain degrades toward today''s cost (never toward a wrong answer). Next-step (a) in ## Measurements removes that growth.'
  - decision: '2026-11-16 — slice B''s leftover trigger: kept'
    chose: 'keep `.context/reviews/` in `_GLOBAL_GIT_INPUTS`; a commit touching it still moves the global generation. - **Why it is global:** what the validator reads from git under `.context/reviews/` is not per-task. (1) `load_ledger` walks every committed version of `verdicts.jsonl` and refuses the WHOLE ledger (every task) when any commit modified, deleted or duplicated a row; the same append-only walk (`history_fault`) runs over `review-completions.jsonl` and the acknowledgements file. (2) Which rows count depends on whether they are committed and on the identity of the commit that introduced each row (producer and worker checks), and a completion row is tied to its task only through its dispatch id, so attributing a commit''s added lines to tasks needs the whole cross-ledger link map at that commit, not the commit''s diff alone. A per-task key would have to reproduce all of that exactly, and an under-attribution serves a stale READY. I could not build a temp-repo fixture that drives the full validator to READY (signed dispatch registry, runs, completions, producer identities) within this slice, so there is no equivalence test, and the rule was: no test, no change.'

