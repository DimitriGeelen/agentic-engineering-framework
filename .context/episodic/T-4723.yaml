# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-23 — how to stop hashing every untracked file'
    chose: 'snapshot with `git status -unormal` (a wholly untracked directory is one entry and is never read); the report asks `git status -uall` only for the journal''s paths (`:(top,literal)` pathspecs); hashing is chunked (1 MiB); a file above 64 MiB is recorded as `stat:<size>:<mtime_ns>` instead of by content. A collapsed directory holding ≤ 5,000 files (20,000 in total per snapshot) is expanded file by file, git''s output streamed and killed at the cap — added because t4692 test 19 pins that a pre-existing untracked file inside a wholly untracked `.agentic-framework/`, rewritten with the same bytes, is not listed (a fresh vendored dir is ~2,900 files).'
    rationale: 'keeps the tested semantics where they are — a tracked or individually listed untracked path dirty before and rewritten with the same bytes still compares equal by content (T-4717 "already dirty, unchanged" line; T-4692 "dirty before, untouched"). A journalled file inside a directory that was wholly untracked before has no before-entry, so it is listed — the verdict the old code gave a file that did not exist before; it is journalled, so the upgrade did write it. Work is bounded by the collapsed entry count plus the journal, not by the tree.'
    alternatives_rejected: ['size+mtime for *all* untracked files — still lists and stats ~700 k paths per snapshot and holds them in memory, and an idempotent rewrite of an already-dirty untracked file (same bytes, new mtime) would flip from "unchanged" to "listed", changing T-4717 behaviour.']

