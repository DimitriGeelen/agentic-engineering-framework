# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-23 — how to know which paths the upgrade wrote'
    chose: 'a write journal. `_t4697_wrote` is called at every do_upgrade write site and records paths relative to the target, or a directory such as `.agentic-framework/` for do_vendor and the designer install. The report lists a path only if the journal names it AND its content changed since the start snapshot. A run with no journal lists nothing.'
    rationale: 'content hashes cannot tell who wrote a file. A file another process rewrites during the window is just as "changed" as one the upgrade rewrote. Only a record kept at the write site separates the two. Where a step writes through a helper that returns no paths (generate_claude_code_config, mcp_approve, enforcement baseline), the journal names the files that helper can write. The content check then drops any it did not actually change.'
    alternatives_rejected: ['a before/after diff of git status alone, even with blob hashes (that is the T-4692 design and the bug). An allowlist of framework-owned path prefixes (it still admits concurrent writes inside `.tasks/` or `.context/project/`). - **Observed while testing:** `.context/sidecar/.gitignore` is created during an upgrade run by the sidecar lifecycle (lib/sidecar/lifecycle.py), not by an upgrade step, so it is no longer listed. That is fail-safe and intended: any fw command creates that file.']

