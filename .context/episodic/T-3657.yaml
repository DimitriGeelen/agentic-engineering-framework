# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-01 — where the acknowledgement lives'
    chose: 'a separate append-only file `.context/reviews/acknowledged-refusals.jsonl`, checked against git history with the same `history_fault` walk the completions file uses; only rows committed at HEAD are honoured.'
    rationale: 'verdicts.jsonl rows are validated by one validator (`_row_fault`) shared by record/apply/audit; a second row type there would have to be excluded from every consumer (apply, check-render, satisfying_verdict, list, duplicate-id checks). A separate file is read by `audit` only, so an acknowledgement structurally cannot make a row count.'
    alternatives_rejected: ['a new row type in verdicts.jsonl (touches every reader); editing or deleting the refused rows (breaks append-only, the property the audit protects).']
  - decision: '2026-10-01 — what an acknowledgement binds to, and who may record it'
    chose: 'each ack names the row id, the row''s sha256, the fault class it fails with, and a `fixed_by` task that must be in `.tasks/completed/` at record time and at every audit. If the row now fails with a different class, or the fix task is not completed, the ack is not honoured and the row FAILs. Audit exit 3 = WARN only; never 0. - **Agents may record one** for a refusal caused by a FIXED framework defect: it is the agent''s own bookkeeping, not a verdict and not a gate bypass. It is logged in the ack row (`recorded_by: agent:<git user>` under CLAUDECODE=1, `operator:` otherwise) and visible as WARN in every `fw audit`.'
    alternatives_rejected: ['operator-only (`--i-am-human`): the ack grants nothing — the row still never counts — so gating it on the operator would only keep the push blocked on bookkeeping.']

