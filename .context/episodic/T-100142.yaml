# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-07-04 — deletion trigger: pushed landings only'
    chose: 'delete only when `--push` succeeded AND `merge-base --is-ancestor <branch> origin/<target>` confirms containment; without `--push` the branch is always kept.'
    rationale: '"verified landing" (T-100139 artifact wording) means the work is provably reachable from the canonical target. A local-only merge leaves the branch as the sole holder of the merge commit — deleting it would lose work.'
    alternatives_rejected: ['deleting after zone-2 local FF (local master can still diverge from origin); a `--delete-branch` opt-in (inverts the GO decision — deletion must be the default to close the debris tap).']
  - decision: '2026-07-04 — branch -D after explicit containment check, not -d'
    chose: 're-check containment ourselves, then `git -C <MAIN> branch -D`.'
    rationale: '`-d` judges merged-ness against the *deleting checkout''s* HEAD; MAIN is routinely on a session branch off-master, so `-d` would refuse valid deletions. The is-ancestor check against origin/<target> is the same safety, aimed at the right ref.'
    alternatives_rejected: ['plain `-d` (false refusals from MAIN), plain `-D` without the check (could destroy unmerged work on a push race).']
  - decision: '2026-07-04 — self-removal ordering'
    chose: 'cleanup is the last step of `cmd_run`; worktree removed before branch deletion; all post-removal git calls run with `cwd=` pinned to MAIN.'
    rationale: 'git refuses to delete a checked-out branch, and after our own worktree dies any subprocess inheriting the dead cwd fails ("Unable to read current working directory").'
    alternatives_rejected: ['deleting from within the worktree (impossible); leaving the worktree behind (it IS the debris the GO decision targets).']
