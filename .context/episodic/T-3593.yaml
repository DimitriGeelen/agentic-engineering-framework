# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-09-30 — Option spellings: resolve against git''s own option list, not a denylist (re-review R1)'
    chose: '`lib/tier0_action.py:resolve_long` resolves every long option the way git''s parse-options does (exact match, else a unique prefix), against the list the installed git prints for `git <sub> --git-completion-helper-all`. An unknown or ambiguous option, or a git that cannot print its list, makes the command unmapped. Push options are an **allowlist**: anything not handled explicitly or named in `_PUSH_BENIGN` makes the push unmapped (including `--receive-pack`/`--exec`, which previously had their argument skipped). The text gate matches every prefix of the flagged options (`ab()` in `check-tier0.sh`), reads a quoted single word as the argument the shell passes (`''--no-verify''`, `--no-''verify''`), and lists **every** matching risk, not only the first.'
    rationale: 'round 2 denied the exact string `--no-verify` and let any other long option through, so `--no-verif` reopened R1 one keystroke from the fix. A hand list of abbreviations is the same mistake one level up; a list read from git follows the git that will actually parse the command.'
    alternatives_rejected: ['widening the denylist to known abbreviations (breaks on the next git release or the next option); the reviewer''s regex `--no-v(e(r(i(f(y)?)?)?)?)?` alone (text gate only; the classifier would still silently skip an unknown option).']
  - decision: '2026-09-30 — R2 residue: same-user self-approval routes (documented, partly gated)'
    chose: 'typed forms are now Tier 0 in the text gate: `CLAUDECODE= … fw tier0 approve`, `env … fw tier0 approve` / `env -u CLAUDECODE`, `unset CLAUDECODE; …approve`, `python3 -m tier0_action approve…`, and a direct `tier0_action.approve(` call inside quoted code. `approve()` now defaults `approved_by` to `"unknown"`, so a caller that names nobody is never recorded as `human`. - **Residue, stated:** every agent here runs as the operator''s user. A script (`bash x.sh` that strips `CLAUDECODE` and approves), an edited copy of the module, or a direct write to `.context/working/tier0-action-approvals.json` still produces a record the gate cannot tell from the operator''s. The text gate sees only typed text (T-2742), so it cannot close this; only a credential the agent does not hold (an operator-side signature, or approvals held by a different OS user) can. `CLAUDE.md` §Enforcement Tiers now names the env-strip route next to the file-forgery residual.'
    alternatives_rejected: ['trying to detect human-ness from the process tree inside the module (the same user can fake any ancestry it controls); refusing approval whenever `CLAUDECODE` is absent (breaks the operator''s own terminal).']
  - decision: '2026-09-30 — OBS-568 pulled forward: admitted records expire after 60 s'
    chose: '`ADMIT_TTL = 60` (env `TIER0_ADMIT_TTL`). An `admitted` push approval expires 60 s after admission, independent of the grant TTL.'
    rationale: 'the R1 chain needed an admitted record to live long enough for a second push to consume it. Pre-push follows the typed push within seconds, so 60 s bounds that second-use window (to 60 s, not zero) whatever spelling comes next.'
  - decision: '2026-10-01 — Round 5: the classifier is a strict grammar, not a denylist'
    chose: '`lib/tier0_action.py:classify` maps a command only when it is `(cd PATH &&)* git [-C PATH|-P|--no-pager]* SUB WORD*` or `(cd PATH &&)* rm OPTION* PATH+`, every word `[A-Za-z0-9._/:=@+%,-]+`, no `..` path component. Anything else is unmapped (exact-text approval). Self-approval: any typed command whose dequoted text has the word `tier0` is Tier 0 unless it is a plainly spelled `fw tier0 status|list`. The legacy exact-text path takes its lock with flock(2) from python and skips consumption when the lock cannot be taken.'
    rationale: 'four rounds closed lists of shell spellings and each second-family review found another (`command export`, `''export''`, `git -C /tmp/a\ b`, `sudo … approve`, brace expansion, `$''..''`). A denylist over shell cannot be complete; an allowlist grammar fails toward showing the operator the literal command.'
    alternatives_rejected: ['a fifth denylist round; allowing `~`/`^` mid-word (keeps `HEAD~1` mapped, but the instruction was no `~` anywhere, and the exact-text path covers it); allowing a read-only prefix (`git status &&`) or trailing pipe (the original `| tail -N` motivation) — each reopens "what can a preceding or following segment change". - **Accepted cost:** `| tail -N`, `2>&1`, `HEAD~1`, `rm -rf *`, `git status && …` and quoted arguments now need exact-text approval; a read-only command naming the bare word `tier0` (a grep, a commit message) is blocked.']
  - decision: '2026-10-01 — Round 6: target keys are literal where git/rm are literal'
    chose: 'a LOCAL `git branch -D|-d -f|--delete --force` name is keyed and shown exactly as typed (no `+` or `refs/heads/` stripping; names after `--` are literal). `normalize_ref` stays on the push paths only. An `rm` path keeps a trailing `/` (or `/.`) in its key and text. ANSI-C quoting (`\xHH`, `\NNN`, `\uHHHH`, `\UHHHHHHHH`, `\cX`, simple escapes) is decoded before the tier0 word check, and any `$''` skips the bash fast path.'
    rationale: 'codex R5 HIGH: `-D victim`, `-D +victim`, `-D refs/heads/victim` are three branches to git but shared one key. Codex R5 MEDIUM: `$''tier\x30''` was SAFE. - **Other verbs checked:** `hard-reset`: `repo` is `realpath` of git''s toplevel, `branch` is `symbolic-ref --short HEAD` (one namespace, from git, not from the typed text), `target` is a full commit id from `rev-parse --verify`, so no collision: checked, none. `recursive-delete`: `normpath` collapsed a trailing slash, and `rm -rf link/` (link -> dir) deletes the target''s contents while `rm -rf link` deletes only the link (reproduced in a tmp fixture). Fixed: the slash stays in the key. `//` and `/./` mid-path still collapse (same target). A last `..` (`x/..` with x a symlink) also normalises lexically, but GNU rm refuses a last `.`/`..` component, so it deletes nothing: recorded, not changed.'
    alternatives_rejected: ['treating `link/` and `link` as one key on the grounds that the normal case (a real directory) is the same target: one approval must never cover two different deletions, and the cost of keeping them apart is only an over-block.']

