# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-05-20 — WARN-only, not BLOCK'
    chose: 'Advisory warning to stderr; exit 0 always.'
    rationale: 'Not every heredoc-in-cmd-sub is the dangerous shape — the stable multi-line-clean `<<PYEOF\n...\nPYEOF\n)` form at bin/fw:1911 has been fine for weeks. Blocking would also create chicken-and-egg if someone legitimately needs to MODIFY an existing heredoc to fix something (e.g., the T-1944 extraction itself touched the heredoc on its way out). WARN surfaces the rule without obstructing.'
    alternatives_rejected: ['(a) BLOCK with `FW_ALLOW_HEREDOC_IN_BIN_FW=1` override — too friction-heavy for a rule that''s about *consideration* rather than *prohibition*. (b) BLOCK only when heredoc body >10 lines — adds parsing complexity without clear benefit (the WARN already references the 10-line L-332 threshold in its text).']
  - decision: '2026-05-20 — Detection helper in `lib/heredoc_guard.py`'
    chose: 'Extract detection logic to a python file; bash side stays parse-safe.'
    rationale: 'Own dogfood — discovered during build that the initial inline `python3 - <<''PY'' ... PY` shape inside `$()` consumed the heredoc as stdin instead of the pipe. The bug only surfaced at runtime (bash -n was clean). Fixing it meant applying L-332 to the L-332 guard itself. The recursive self-validation is the strongest possible proof the rule has teeth.'
    alternatives_rejected: ['(a) Inline `python3 -c "..."` — too long, escape-prone (~30 lines). (b) Embedded `awk`/`grep` only — would miss multi-line patterns and lose JSON parsing.']
  - decision: '2026-05-20 — Hook lives in `agents/context/`, not a new `agents/hooks/`'
    chose: 'Drop the file at `agents/context/check-heredoc-cmd-sub.sh`.'
    rationale: 'That''s where the existing check-* hooks live (check-active-task, check-arc-id, check-human-ac-tick, ...) and `fw hook` dispatch auto-discovers everything matching `agents/context/*.sh`. A new directory would need bin/fw plumbing changes for zero benefit.'
    alternatives_rejected: ['`agents/hooks/` — would split the existing hook set across two paths and require dispatch changes.']

