decisions:
  - decision: '2026-09-05 — Port the proof to a drivable substrate rather than wait for G-097'
    chose: 'keep T-3255''s design and move its substrate — agent runs directly in a tmux pane, driver invoked `--transport tmux --session <pane>`.'
    rationale: 'T-3255''s harness cannot run *by construction*, not by defect. It spawns via `termlink spawn --shell`, and T-3277 measured that neither transport reaches a termlink-wrapped agent — `termlink inject` dies at the ink TUI (G-097), and `tmux send-keys` at the outer pane lands on `termlink register`''s stdin. Waiting for G-097 would have parked a proof that was already achievable on a different wire.'
    alternatives_rejected: ['substituting a stub or a shell script for the agent — the task''s own description forbids it, and it is the exact gap T-3255 existed to close. - **Kept honest:** G-097 stays open. A termlink-wrapped agent remains undrivable, and that is a real limit on where the continuous driver can be deployed today.']
  - decision: '2026-09-05 — Two failing assertions were harness artifacts, and both were fixed rather than relaxed'
    alternatives_rejected: ['loosening either assertion to `>= 0`. Both were telling the truth about the harness; the assertions were the only reason either was visible.']
  - decision: '2026-09-05 — The harness reimplements idle-detection instead of sharing the driver''s'
    chose: '`wait_quiet()` in the harness duplicates the two-identical-captures idea the driver uses.'
    rationale: 'the control must be able to tell "idle" from "idle" *independently of the code under test*. Sharing the helper would make the control agree with the driver by construction — which is precisely the T-3254 defect, where the test stub encoded the same assumption as the production bug and 21 green tests covered nothing.'
  - decision: '2026-09-05 — Did not lift the cron pause'
    chose: 'leave `continuous-driver-10m` paused; carry the re-arm to T-3283.'
    rationale: 'the registry command passes no `--transport`, so it would run the G-097-blocked termlink leg and refuse every 10 minutes. And this session runs under `claude daemon run` (G-098) — neither tmux-paned nor TermLink-registered — so the driver can resolve no target at all. Re-arming buys noise, not autonomy.'

