    alternatives_rejected: ['Force-backfill on next-touch (high effort, agents would skip; produces "inception_decisions: []" placeholder noise). Hard cutoff date (arbitrary; introduces a class divide in the corpus). Mandatory on file (would block T-1442/T-1443''s legitimate "captured" filing pattern that pre-dates decisions).']
