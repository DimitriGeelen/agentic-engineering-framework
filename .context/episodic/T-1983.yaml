  - decision: '2026-05-21 — Schema lives in inception task frontmatter (not sidecar)'
    chose: 'New optional frontmatter field `inception_decisions:` on `workflow_type: inception` task files. List of `{id, text, ships_in}` entries. Build children gain optional `unlocks_inception_decision:` (list of `T-XXX:DYY` references). Both fields validated by a PreToolUse hook on Write|Edit (same shape as T-1849 `check-arc-id`).'
    rationale: 'Single source of truth in the task file itself; agents already write frontmatter; one parser; reuses T-1849''s validated hook pattern. No new file class to back up / mirror / migrate.'
    alternatives_rejected: ['Sidecar YAML at `.context/inceptions/T-XXX.yaml` (duplicates content, divergence risk). Frontmatter on `docs/reports/T-XXX-*.md` (report files have no schema convention; agents would forget). Free-form markdown table parsed by regex (T-1864 ate the corpus exactly this way — never parse load-bearing data out of prose).']
  - decision: '2026-05-21 — `ships_in:` is one of {file path, function/symbol name, test name, task-id, literal `deferred`}'
    chose: '`ships_in:` is a string; validator accepts five shapes — (1) `path/to/file.py`, (2) `module.function_name`, (3) `tests/.../test_name.py::test_func`, (4) `T-XXX` (task ID — points at a build child), (5) literal `deferred:T-YYYY` (explicit defer with target). At gate time: shapes 1-3 are verified by file/symbol existence; shape 4 by the target task being `work-completed`; shape 5 by the target task existing in `.tasks/{active,completed}/`.'
    rationale: 'Multiple referent types because decisions land in different artefacts (some are code, some are tests, some are policy YAML, some are explicit defers). Five shapes covers everything T-1443 needed without forcing a single style.'
    alternatives_rejected: ['Force `ships_in: T-XXX` only (too rigid — decisions like "Spike F = 12-pattern catalogue" land as a YAML policy file, not a task). Free-form (loses gate enforceability). Composite YAML (overkill — one field, five validated shapes).']
  - decision: '2026-05-21 — Gate fires in `update-task.sh --status work-completed` (not at inception-decide)'
    chose: 'When an inception task transitions to `work-completed`, `update-task.sh` parses `inception_decisions:` and validates every entry''s `ships_in:`. If any entry''s referent is unreachable (file missing, function not defined, task not work-completed, deferred-to target absent), refuse the transition with a block message naming the failing entry and the override flag. Override: `--skip-inception-scope-trace "rationale"` (Tier-2, logged in `.gate-bypass-log.yaml`).'
    rationale: 'The gate must fire when the inception **closes**, not when it decides — between decide and close, build children are filed and shipped, and the gate''s job is to verify they actually landed. Decide-time validation is too early; cron-time validation is too late (G-066 was post-hoc).'
    alternatives_rejected: ['Gate at `fw inception decide go` (would refuse before any building started — backwards). Gate at `fw audit` (detective; G-066 already proves this latency is unacceptable). Gate at git pre-push (file-scope mismatch — git hook can''t reason about task lifecycle).']
  - decision: '2026-05-21 — Migration: grandfather completed inceptions; gate applies only to populated `inception_decisions:`'
    chose: 'The new frontmatter field is **optional**. Completed inceptions without it (200+ in `.tasks/completed/`) are grandfathered — gate does not retroact. New inceptions filed from the next agent session forward are encouraged (CLAUDE.md text) to populate the field. The gate only fires when the field is **non-empty** — empty/missing = "opt out", logged on close as an info-level note in feedback-stream.'
