  - decision: '2026-10-23 — refusal kept, made an explicit contract'
    chose: 'keep T-4409''s refusal for callers with no known cwd. Make `_FW_PAYLOAD_CWD=<absolute cwd>` the documented opt-in for harness callers (it is the variable the hook already sets, so the harness and the hook take one code path). Print a one-time stderr reason when a git clause is refused only because the cwd is unknown and no payload cwd was given.'
    rationale: 'the hook process''s `$PWD` does not follow the Bash tool''s shell cwd, which persists across calls. "`$PWD` inside PROJECT_ROOT" would therefore not tell us where the shell is. It is a narrower form of the T-4409 red row (`git status`, no payload cwd, hook PWD=/tmp → SAFE). A harness knows its own cwd and can state it in one export.'
    alternatives_rejected: ['(a) fall back to `$PWD` when it resolves inside PROJECT_ROOT: reopens T-4409 for any hook payload missing `cwd` while the hook runs from a project subdirectory. (b) a new public `FW_*` env var: a second name for the same value, plus registry and parity overhead, for no extra safety.']

