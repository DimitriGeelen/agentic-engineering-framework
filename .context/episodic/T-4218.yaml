# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-16 — the rule for an inherited foreign PROJECT_ROOT'
    chose: 'override with a loud stderr warning, not refuse. In bin/fw a leaked root (one carrying `_FW_PATHS_DERIVED_BY`, which only fw process trees export) is replaced by the caller''s project: the cwd''s project if it has one, else a valid `CLAUDE_PROJECT_DIR`. In claude-fw the session''s project is always its launch project, and a different inherited value is replaced with a warning.'
    rationale: 'refusing would break Claude Code hooks, which run with an unrelated cwd, and would turn a recoverable misdirection into a hard stop for every agent on the host. An override is only safe if it is visible, so the warning names both values. The caller''s project is a fact the framework can determine; refusing would not improve on that.'
    alternatives_rejected: ['refuse outright (breaks hooks; no authority for the replacement). A new opt-in `FW_PROJECT_ROOT_OVERRIDE` (unneeded: an explicit `PROJECT_ROOT=… fw` prefix carries no sentinel and is never touched; the explicit cross-project tests and `fw upgrade <dir>` keep working). - **Residual, not fixed here:** a leaked `FRAMEWORK_ROOT` with no leaked root and a cwd in no project is still honoured by bin/fw; claude-fw covers it for sessions it starts. The sentinel is a provenance marker, not forgery-proof (same residual as T-3285).']

