decisions:
  - decision: '2026-10-18 — Where the install offer lives (fw init / install.sh vs the start pre-flight)'
    chose: 'the start pre-flight (`bin/watchtower.sh`) is the only place that prints the install command, and it prints it, never runs it. `fw init` and `install.sh` get no install step in this task.'
    rationale: '(1) PEP 668 means the only non-destructive route on Ubuntu/Mint is apt, which needs sudo; neither `fw init` nor `install.sh` should trigger sudo silently. (2) The pre-flight runs on the one path that actually needs the modules (`fw watchtower start`), so the message reaches the operator when it matters, not at init when Watchtower may never be started. (3) Evidence: `install.sh` and `fw init` install no Python packages today (task description); blocking each module in turn shows only flask, flask_socketio, yaml, markdown2 break `import web.app`, so a single init-time list would either over-install or drift from the code.'
    alternatives_rejected: ['auto `pip install --break-system-packages` (forbidden by ACs; breaks PEP 668 hosts); a `fw init` prompt (adds an interactive step to a non-interactive, consumer-facing command, and `bin/fw` is out of scope here).']

