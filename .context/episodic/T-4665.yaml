# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-22 — which TERMLINK_* names a worker gets from its parent'
    chose: 'exactly three, from a grep of every `TERMLINK_*` the framework reads (lib/ agents/ bin/) and the names the termlink binary reads: - `TERMLINK_RUNTIME_DIR` — where the hub and session registry live; a worker without it can register in `/tmp/termlink-$UID` while the hub listens elsewhere (split-brain, T-3779). - `TERMLINK_RUNTIME_DIR_FALLBACK` — the host''s list of known hub dirs read by `lib/termlink-runtime.sh`; host-level, not agent-level. - `TERMLINK_BIN` — the binary override read by the templated scripts (`lib/templates/scripts/*.sh`); host-level. - **Never forwarded:** `TERMLINK_AGENT_ID`, `TERMLINK_IDENTITY_FILE`, `TERMLINK_IDENTITY_DIR`, `TERMLINK_IDENTITY_NO_CREATE` (identity: sign as the parent), `TERMLINK_SIDECAR_SOCKET`, `TERMLINK_SIDECAR_STATUS_SOCKET`, `TERMLINK_SIDECAR_*` (the parent''s mailbox), `TERMLINK_SESSION`, `TERMLINK_SESSION_ID` (the parent''s session; `termlink spawn` sets the worker''s own in its PTY, and `lib/sidecar_cli.py` resolves the consult agent id from `TERMLINK_SESSION`), `TERMLINK_TASK_GOVERNANCE` (comes from the worker''s own `.mcp.json`), and the framework''s own config names (`TERMLINK_MAX_WORKERS` etc. are read via `fw_config`/`FW_*`, not inherited).'
    alternatives_rejected: ['keeping the prefix with a deny-list of agent-scoped names — the same fail-open shape T-4647 replaced; any new TermLink identity variable would leak by default.']

