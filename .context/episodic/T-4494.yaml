# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-20 — where the restart identity is decided'
    chose: 'fix it once in `lib/sidecar/identity.py` `termlink_env()`. Every sidecar spawn (receiver start, supervisor respawn, `ensure --all`) and every entry-point `apply()` already goes through it. With the switch off, a configured RAIL_IDENTITY_FILE that EXISTS is selected, the same rule as claude-fw (T-4454), with no APPLIED_MARKER (no host-DM transition implied). A missing file is selected only with SIDECAR_RAIL_IDENTITY=1, as before.'
    rationale: '`fw upgrade` does not itself start the receiver. What brings it back is the cron keep-alive or the supervisor, with a clean env, so patching any one shell launcher would leave the others on the host key. The key now depends on config, not on the launch path.'
    alternatives_rejected: ['exporting in `bin/fw sidecar` / the cron line in shell. That covers one door and leaves the python respawns uncovered, which is the T-4454 shape that produced this bug. - **Side effect to know:** a project that has the key file but whose receiver ran on the host key (started from plain `claude`, not claude-fw) now signs as the project key. That is the intent of RAIL_IDENTITY_FILE, but its dm:* address moves. Without APPLIED_MARKER the old host-key rails are not drained during that move.']
  - decision: 'OPEN for the operator — default SIDECAR_RAIL_IDENTITY on when RAIL_IDENTITY_FILE is set?'

