decisions:
  - decision: '2026-11-19 — operator approval under a reviewer-only setting'
    chose: 'an operator approval (`--words`) counts whatever `decision_review` says; the setting only governs whether a reviewer approval counts.'
    rationale: 'the operator is sovereign (Authority Model); a project choosing "reviewer" delegates, it does not lock the operator out.'
    alternatives_rejected: ['strict per-setting routing (operator refused on reviewer-only arcs) — would make the operator unable to unblock their own arc.']
  - decision: '2026-11-19 — reviewer route is open to agents; one dispatch approves one decision'
    chose: '`fw arc approve … --dispatch-id D --outcome green` is not operator-gated (the evidence is the signed review dispatch, read through `verdict_ledger.dispatch_record`); a dispatch already used for one decision is refused for another.'
    rationale: 'gating it on the operator would make the reviewer route pointless; reuse would let one review approve unrelated decisions.'
    alternatives_rejected: ['binding the dispatch''s task to the decision''s task — decided entries often carry no task.']

