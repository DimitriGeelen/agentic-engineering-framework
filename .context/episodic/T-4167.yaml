  - decision: '2026-10-13 — re-derived, not ported'
    chose: 'wrote the guard from the spec in ring20''s message (msg 05d50237, quoted in `.context/sidecar/outbox/09b9e409…json`). I could not read ring20''s `scripts/stale-index-guard.py` (e5496a678) because the project-boundary hook (T-559) blocks reads of other repos. The fixture cases cover their stated repro (`git mv` plus a scratch index).'
    rationale: 'the task says to treat the reference as untrusted input and re-derive it anyway. Reading it would have been a cross-check, not a source.'
    alternatives_rejected: ['dispatching into ring20 to read it. The cost is out of proportion when the spec is already unambiguous.']
  - decision: '2026-10-13 — history walk strategy (cost)'
    chose: '`git log --raw` limited to exact pathspecs when there are ≤16 governed candidates. Above 16, one walk over the `.tasks` and `.context/episodic` prefixes, filtered in Python. - **Why (measured on this repo, 11,420 commits, scratch index):** 1 / 5 / 16 changed governed paths took 0.75s / 0.69s / 0.63s. 2000 paths took 3.39s, and 300 real stale entries took 4.67s (all refused). The first version passed every path as a pathspec: with 2000 paths it did not finish in 4 minutes and was killed. Commits that touch no governed path pay one `diff-index` (~0.1s).'
    alternatives_rejected: ['a depth cap on history. It would bound the cost but miss reverts to old versions.']
  - decision: '2026-10-13 — pairing moves without -M'
    chose: 'an added governed path is also checked against governed paths deleted in the same commit that have the same file name.'
    rationale: '`-M` did not pair small or heavily changed files. The `git mv` stale-entry test failed until this was added, because the change showed up as D+A.'
  - decision: '2026-10-13 — merge resolution'
    chose: 'a staged blob equal to `MERGE_HEAD:<path>` is not flagged, because taking the other side is a deliberate resolution. This is not covered by a test.'

