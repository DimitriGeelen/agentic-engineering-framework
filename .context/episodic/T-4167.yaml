# Key outcomes
outcomes:
  - 'A guard (`agents/git/lib/stale-index-guard.py`) refuses a commit when any staged `.tasks/**` or `.context/episodic/**` blob equals an OLDER committed version of that path (in HEAD''s history) but differs from HEAD''s version; reads the index git is actually committing (honours `GIT_INDEX_FILE`); exits 0 when nothing qualifies'
  - 'The guard is wired into the framework-installed pre-commit hook (`fw git install-hooks`), so it survives reinstall rather than living in a hand-edited block'
  - 'Override `FW_ALLOW_STALE_INDEX=1` lets the commit through and appends a Tier-2 entry to `.context/working/.gate-bypass-log.yaml`; the refusal message names the path, the older commit it matches, and the override'
  - 'Bats suite (fixture repos in BATS_TEST_TMPDIR) covers: revert-to-older refused; fresh edit allowed; new file allowed; deletion allowed; non-governed path ignored; GIT_INDEX_FILE scratch-index path refused; `git mv` rename to older blob refused; override allows + logs — and fails against HEAD (no guard)'
  - 'Cost on a large commit measured and recorded in Decisions (staged-path count, wall time)'

