# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-09-24 — "our key" for DM rails = TermLink identity fingerprint, not a circuit id'
    chose: '`dm.identity_fingerprint()` reads `termlink whoami --json`''s `session.identity_fingerprint` (machine-wide, T-3405) as the key `dm:<a>:<b>` rails are matched against, and surfaces it on `fw sidecar whoami` as `identity_fingerprint` (the AC''s "signing key `fw sidecar whoami` reports").'
    rationale: 'DM rail names are TermLink''s own convention, not ours to choose (unlike `inbox:<circuit-id>` topics, T-3433) — the two segments are literally the two identities `termlink agent contact`/`channel dm` used. Confirmed live: this session''s `identity_fingerprint` is `d1993c2c3ec44c94`, which matches the second segment of the target rail `dm:3bba15e681b3a078:d1993c2c3ec44c94`.'
    alternatives_rejected: ['`circuit.hub_id()` (that is the HUB''s fingerprint, a different value); a project- or agent-scoped circuit id (DM rails are not addressed that way — TermLink does not know our circuit convention).']
  - decision: '2026-09-24 — unread count for `summary()`/`stale()` is a live hub call, not derived from `status.snapshot()`'
    chose: '`dm.summary()` and `dm.stale()` call `termlink channel list --prefix dm:` directly; `sidecar_cli.py:cmd_status` merges the result into the printed/JSON output alongside (not inside) `status_mod.snapshot()`.'
    rationale: 'see Evolution entry above — `status.snapshot()`''s documented invariant is hub-free, and DM rail existence/counts have no durable local record to read instead.'
    alternatives_rejected: ['folding `dm_rails` into `snapshot()` itself (would silently break the documented "never asks the hub" claim for every other caller of `snapshot()`, including `fw_sidecar_ledger_facts`''s ack-ledger read).']
  - decision: '2026-09-24 — meta envelopes (topic_metadata/receipt/reaction/redaction/edit) advance the cursor but are not counted as "posts"'
    chose: '`dm.pending()` reads every envelope from the cursor (so the cursor advances past them, matching what a real drain saw) but excludes meta `msg_type`s from the returned list; `dm._unread_count()`/`dm.stale()` treat the DM rail''s `count`/ `latest_offset` as the ground truth for "how many posts exist" (which includes meta envelopes, since TermLink''s own counters do) but hunt specifically for CONTENT when reporting an age.'
    rationale: 'matches what `termlink channel unread --help` itself documents excluding, and avoids `fw sidecar inbox` printing an empty "post" for a `topic_metadata` banner (every DM rail''s offset 0, observed live on every one of the 11 real rails checked).'
    alternatives_rejected: ['treating every envelope as content (would print junk `topic_metadata` banners as if they were peer messages); excluding meta from the cursor advance too (would leave meta envelopes permanently "unread" and understate `count`-derived totals in `summary()`).']

