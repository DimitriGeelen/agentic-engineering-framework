decisions:
  - decision: '2026-05-17 — `--reason "..."` (not `--justification`)'
    chose: '`--reason` as the required flag name for abandonment text.'
    rationale: '`arc_close --justification` is reserved for the `--demo none` *bypass* path — it justifies *why we are skipping the normal demo requirement*. Abandonment is not a bypass; it''s a normal final-state transition with its own first-class rationale field. Using `--reason` matches the natural language ("reason for abandoning") and avoids implying that abandonment is closure-with-an-excuse.'
    alternatives_rejected: ['`--justification` (overloaded, implies bypass semantics); `--rationale` (matches `fw inception decide` but adds an unrelated cross-vocabulary mapping); bare `<reason>` positional arg (less greppable; harder to extend with future fields).']
  - decision: '2026-05-17 — write `abandoned_at` and `abandonment_reason` as new fields (not in-place edits)'
    chose: 'Append `abandoned_at: <iso>` and `abandonment_reason: "<text>"` to the YAML body if absent; replace if present (idempotent). The arc-create template does NOT pre-create these fields.'
    rationale: 'Two reasons. (1) Most arcs will never be abandoned — pre-creating `abandoned_at: null` on every arc is dead schema for the common case. (2) The presence of these fields is the *signal* "this arc was abandoned" — a downstream reader can `grep -l abandonment_reason: .context/arcs/*.yaml` to enumerate abandoned arcs without parsing status. Parallel to how `closed_at:` is *present-when-closed*, not pre-created.'
    alternatives_rejected: ['Pre-create the fields in `arc_create` (adds noise to every arc); store reason in `decision:` field (overloads it; `decision:` is for `arc_close` outcome).']

