summary: |
  agents/context/lib/safe-commands.sh:371 lists find alongside grep/rg/which/type as an unconditionally-safe base command, on the premise that find is a search tool. find's action predicates make that false: -delete removes files and -exec runs an arbitrary command, and neither is a has_bash_write_pattern match, so nothing downstream catches them. Reproduced live: is_bash_safe_command 'find . -delete' -> SAFE and 'find . -exec rm {} ;' -> SAFE, against the control 'find . -name *.py' -> SAFE (correctly). Found as W2-F6 in the T-3227 arc-012 review and reproduced by the orchestrator. Same shape as T-3222 (curl/wget) and T-2889 (git stash): a base command classified by its usual use rather than by the clause actually being run.

# Key outcomes
outcomes:
  - '**A1 Action predicates closed:** `find` is no longer unconditionally safe — a find invocation containing an action/mutation predicate (`-delete`, `-exec`, `-execdir`, `-ok`, `-okdir`, `-fprint`, `-fprintf`, `-fprint0`, `-fls`) classifies NOT-SAFE via `is_bash_safe_command`'
  - '**A2 Search forms stay safe:** pure-search find (`find . -name ''*.py''`, `-type f`, `-mtime`, `-print`, `-print0` class) still classifies SAFE — the gate must not start blocking the dominant legitimate use'
  - '**A3 Pinned:** the safe-commands suite gains the live-reproduced cases: `find . -delete` NOT-SAFE, `find . -exec rm {} \;` NOT-SAFE, `find . -name ''*.py''` SAFE (control) — red-before/green-after demonstrated in the task'
  - '**A4 No-widening:** full safe-commands test suite green; `bash -n agents/context/lib/safe-commands.sh` clean'

