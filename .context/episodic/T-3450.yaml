# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-09-24 — extraction vs. wrapping fw_prepush_lock_wait_default'
    chose: 'extracted the ledger-parsing awk block out of `fw_prepush_lock_wait_default` into a new shared function `fw_audit_timing_read_structure_seconds` (plus a sibling `fw_audit_timing_last_run_timed_out`), and rewrote `fw_prepush_lock_wait_default` to call it. `fw_handover_push_timeout_default` calls the same reader independently, with its own multiplier/floor/cap/fallback.'
    rationale: 'the AC required reusing "the reader" without writing a second YAML parser. A simpler alternative (call `fw_prepush_lock_wait_default` directly and add a fixed buffer) was tried first and rejected — see below. - **Rejected — `push_timeout = fw_prepush_lock_wait_default(root) + buffer`:** this guarantees dominance trivially (buffer > 0) in the *normal* path, but breaks the AC''s explicit "a timed-out run is ignored rather than trusted" requirement, because `fw_prepush_lock_wait_default`''s own pinned tests (t3421) assert it *does* trust a timed-out ledger''s measured value. Proxying through it would make the push-timeout inherit that same trust, which this task''s AC explicitly asks it not to. Extracting the raw reader let each derivation apply its own trust policy over the same parsed value.'
  - decision: '2026-09-24 — dominance by construction, not by runtime comparison'
    chose: 'push-timeout knobs are each strictly larger than lock-wait''s: multiplier 1.5 (vs 1.25), floor 180 (vs 90), cap 900 (vs 600), fallback 650 (vs 360). Verified by exhaustive check across 8 measured values (10, 100, 150, 268, 480, 600, 700, 1000) plus the timed-out edge — `push > lock` holds in every case, pinned in `tests/unit/t3450_push_timeout_derivation.bats`.'
    rationale: 'the fallback value (650) is deliberately *not* a naive scale-up of lock-wait''s 360 fallback (which would give ~468 following the 1.3x pattern of the other knobs). 650 was chosen specifically to exceed `FW_PREPUSH_LOCK_WAIT_CAP` (600) — the worst case `fw_prepush_lock_wait_default` can ever return — because push''s fallback fires on a timed-out ledger while lock-wait, on that exact same ledger, does NOT fall back (it trusts the measured value regardless, per its own pinned behaviour). Without this, a timed-out ledger with a large measured value would have push fall back to a *smaller* number than the lock wait it must exceed — reproducing the exact ordering bug this task exists to prevent, one level down.'
  - decision: '2026-09-24 — the AC''s own test-filename reference is stale'
    chose: 'treated `tests/unit/t3062_push_timeout_budget.bats` (named in both this task''s AC text and in a pre-existing handover.sh comment) as a stale reference rather than a blocking discrepancy, added the coverage as a new sibling file (`tests/unit/t3450_push_timeout_derivation.bats`) instead.'
    rationale: 'the filename does not exist anywhere in this repo''s history (`git log --all` on the path returns nothing) — it appears to be a copy-paste of a filename that was never actually created when the comment in handover.sh:106 was written. The real pinning file is `tests/unit/handover_push_timeout.bats`, which independently already carried 3 pre-existing failures (stale literal-value assertions from T-1277/T-1341, predating T-3062''s bump of the default to 300) that are unrelated to this task''s change and were left untouched, per scope discipline ("Do not widen it").'
  - decision: '2026-09-24 — stopped at AC4 rather than widening constants'
    chose: 'did not raise the multiplier/floor/cap after a real `fw handover --commit` was killed at the newly-derived 402s.'
    rationale: 'AC4 explicitly instructs this: a kill after the fix means the gate grew again, and the fix for that is trimming the gate (or the measurement pipeline that feeds the derivation), not widening the budget further. A freshly-measured, uncontended `bin/fw audit --section structure` took 325s — the ledger the derivation reads still said 268s (2 days stale, only updated by full unscoped audits). Recorded in ## RCA; candidate follow-ups named there but not implemented, per task scope.'

