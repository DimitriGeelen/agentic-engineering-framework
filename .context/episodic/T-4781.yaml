# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-26 — socket naming rule'
    chose: '`tmux -L fw-agents-<16 hex>`, where the hex is the T-3693 fw-project id (sha256 of the realpath project root, the same walk `_fw_project_tag` and `lib/sidecar/inject.py project_tag()` do). bin/claude-fw `_cfw_tmux_socket` and inject.py `tmux_socket()` derive it independently; a bats case pins them equal. The session name stays `fw-<dir>-<pid>`, so the 055 cockpit and TermLink find it by name; `tmux -L fw-agents-<id> ls` lists it. Started by the wrapper after its T-4636 scope re-exec, so the server lives in the scope of the project''s own first wrap.'
    rationale: 'the id already exists, is stable per root, collision-free in practice, and both sides compute it without config. `-L` keeps the socket in the user''s tmux dir, where `tmux -L` discovery and the doctor scan look.'
    alternatives_rejected: ['`-S <project runtime dir>/tmux.sock` — an unfamiliar path for attach (`tmux -S …`), and per-project runtime dirs differ between consumers; `-L fw-agents-<dirname>` — two projects with the same basename would share again.']
  - decision: '2026-10-26 — item (6), limit TMUX inheritance: NOT done'
    chose: 'keep `$TMUX` in the pane. With one server per project, a bare `tmux kill-server` issued from a pane now ends only that project''s server. - **Why (what needs TMUX in the pane):** (a) `fw termlink dispatch` workers inherit TMUX through the spawn allow-list (lib/spawn-env.sh, agents/termlink/termlink.sh run.sh) and land on the wrapper''s own server — the T-4049 destroy-unattached scoping exists because of exactly that; (b) Claude Code itself reads `$TMUX` for terminal detection (passthrough, key handling); (c) unsetting it does not remove the hazard — a bare `tmux kill-server` without TMUX targets the DEFAULT server, which holds the fleet panes and the operator''s own tmux, so it would move the blast radius, not remove it. (lib/sidecar/inject.py does not need TMUX: it queries named sockets.)'
    alternatives_rejected: ['`env -u TMUX` for claude inside the wrap — see (c). A command-level gate on bare kill-server is the right control and is filed as T-4783.']

