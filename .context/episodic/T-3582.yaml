# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-01 — R9-1: narrow the dirty-tree check per kind, and export only for harness kinds'
    chose: '`_project_config_fault` now covers only what each kind''s pinned launch reads (`verdict_ledger.WORKTREE_CONFIG`). That is nothing for claude, which runs `--setting-sources user --strict-mcp-config`. A marker-file probe on 2026-10-01 showed the user-only launch saw no project CLAUDE.md, agents or commands; the default launch saw all three. It is also nothing for ollama-loop and for the harness kinds, which run in a `git archive` export of the pinned revision. An unknown kind keeps the full round-9 check (fail closed).'
    rationale: 'claude must run in the live checkout: it records and commits its own verdict row. So exporting for all kinds alike would have broken the claude path. For the harness kinds the export is the simplest isolation that holds across all three CLIs. It also lets the antigravity user read the tree.'
    alternatives_rejected: ['a `git archive` export for every kind (breaks claude''s own record/commit). Keeping the round-9 check (blocks ordinary reviews in the shared checkout for a file the launch cannot read).']
  - decision: '2026-10-01 — harness verdicts are recorded by the runtime, not the worker'
    chose: 'codex, opencode and antigravity run read-only and PRINT their verdicts. run.sh then calls `verdict_ledger.py record-for-worker`, authenticated like `complete`. It records each printed verdict under the worker''s identity, with an evidence report that carries the output and its sha256, and commits it before the completion is signed.'
    rationale: 'none of the three can run `fw reviewer verdict record` and `git commit` from a read-only sandbox. Giving them a writable sandbox or `--auto` would let a reviewer write the repo.'
    alternatives_rejected: ['a writable codex sandbox (`workspace-write`) or `opencode --auto`, which let the reviewer modify files.']
  - decision: '2026-10-01 — antigravity launched with the absolute binary'
    chose: '`sudo -n -u dimitri-mint-dev -H <registry binary> -p … --mode plan --sandbox`.'
    rationale: 'the approved form with bare `agy` fails (`sudo: agy: command not found`), because sudo''s secure_path does not include ~/.local/bin. Same user, same flags, same binary.'
