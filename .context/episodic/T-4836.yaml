# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-27 — which pin keys are delivered'
    chose: 'an explicit key list, `vendored_path validator_path` (bin/fw do_vendor loop; `_DESIGNER_PIN_PATH_KEYS` + `_designer_pin_path` in lib/upgrade.sh). File names always come from the pin, and superseded siblings are pruned by the pinned name''s stem (`<stem>-*.<ext>`), so no file name is hard-coded.'
    rationale: 'adding a new pinned file means adding one word to the list, and nothing the pin names on 832''s side (source_*, protocol) can be copied by accident.'
    alternatives_rejected: ['every `^[a-z_]+_path:` key (would silently pick up any future key that is not meant to be delivered); a validator-only copy of the build block (two carve-outs to keep in step).']
  - decision: '2026-10-27 — loader: first copy present wins, mismatch refused'
    chose: '`_load_validator` checks the first existing file out of PROJECT_ROOT/validator_path and FRAMEWORK_ROOT/validator_path. A sha256 mismatch on that file is 503, never a fall-through to the other copy.'
    rationale: 'a stale or tampered installed copy should fail loudly (Reliability); `fw upgrade` re-installs, so a current consumer''s two copies agree.'
    alternatives_rejected: ['"first copy that verifies" (it would hide a corrupt installed copy behind the vendored one).']
  - decision: '2026-10-27 — validator problems fail `fw designer install`'
    chose: 'absent vendored validator → rc 5, mismatch → rc 1, after the build has installed; a pin without validator_path is skipped with rc 0.'
    rationale: 'the AC asks for the build''s refusal semantics; init and upgrade print the install output, so the operator sees which file is missing.'

