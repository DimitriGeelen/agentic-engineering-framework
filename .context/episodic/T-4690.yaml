# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-23 — where the footprint is computed'
    chose: 'predict in pre-commit and write into the staged episodic. Post-commit stays as the fallback, for the predicted ids plus the ids in the message.'
    rationale: 'pre-commit is the last hook whose index changes land in the commit. Measured: a `git add` in prepare-commit-msg or commit-msg stays staged but is not committed. Pre-commit cannot see the message, so it predicts from the staged set. A close is an *added* episodic, or a modified one together with an added `.tasks/completed/T-XXX-*.md`. A commit that closes a task is expected to say `T-XXX:`. A wrong guess is corrected by post-commit the old way, never kept.'
    alternatives_rejected: ['amending in post-commit (rewrites commits; forbidden). Moving the counters out of the tracked episodic (every reader of `metrics:` would have to change). Reading the message from the parent''s argv in pre-commit (`/proc`, not portable, misses `-F` and the editor).']
  - decision: '2026-10-23 — feedback-stream.yaml'
    chose: 'keep it tracked (T-4231''s call) and carry it in the close commit. When pre-commit predicts a close, it stages the stream before computing the footprint.'
    rationale: 'it is a record, not runtime state. Its `auto_tick:<task>:<ac>:<digest>` entries are the T-1985 sovereignty rail that stops the reviewer re-ticking a criterion a human unticked; ignoring the file would lose that across clones. It is append-only, so committing other writers'' appended events along with it is harmless (`lib/integrate.py` already merges it as a union of documents).'
    alternatives_rejected: ['ignoring it with a migration (loses the rail). A batch-committing job like T-4676''s sweeps (still dirty after a close until the job runs, and adds a cron leg). Reviewer writes outside a close (cron audits, ad-hoc `fw reviewer`) still leave the stream modified until the next close or handover commit carries it. - **Observed, not fixed here:** about 51 of about 318 uncommitted stream events in the live repo name synthetic ids T-99xx. Test runs write reviewer events into the live stream, which is a test-isolation bug. It is reported to the parent for registration.']

