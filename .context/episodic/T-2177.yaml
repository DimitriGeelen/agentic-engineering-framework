  - '`detect_skip_as_pass` suppresses findings when the same line carries an output assertion (`| grep`, `&& grep`, `| test`, `&& test`, `| cmp`, `&& cmp`, `| diff`, `&& diff`, `| jq`, `&& jq`, `| awk`, `| sed`). Rationale: a `--dry-run` followed by an assertion is simulation-with-check, not skip-as-pass. Empirical FP: T-2072 line 9 `out=$(bin/fw pickup promote-deferred --dry-run 2>&1); echo "$?" | grep -q "^0$"`. **Shipped:** `_OUTPUT_ASSERTION_RE` in `lib/reviewer/static_scan.py:639-641`; T-2072 fresh-scan no longer fires skip-as-pass.'
  - '`detect_skip_as_pass` suppresses findings when the matched token appears inside single or double quotes (textual argument to grep/awk/sed/etc., not a CLI flag). Pattern lifted from existing `_GREP_LITERAL_RE` in swallowed-errors (L-264-(a)) — same shape adapted for skip tokens. Empirical FP: T-1516 line 2 `grep -E ''manual fix.*--skip-sovereignty|deserves RCA''`. **Shipped:** `_QUOTED_SUBSTR_RE` strip-then-search at `lib/reviewer/static_scan.py:632-634`; T-1516 fresh-scan moves FAIL→PASS.'
  - 'All existing true positives preserved: bare `pytest --collect-only`, `make test SKIP=true`, `pytest.mark.skip(...)`, `@unittest.skip(...)`, `--xfail`, plain `--skip` flag without assertion or quoting. **Verified:** all 4 pre-existing skip-as-pass tests pass; 4 new positive tests cover bare flags / collect-only / pytest.mark.skip / dry-run-with-devnull-only.'
  - 'Unit tests in `tests/unit/test_reviewer_static_scan.py` cover each new suppression heuristic (positive: still fires on bare skip; negative: suppressed on assertion / quoted) AND each preserved TP — minimum 6 new test cases. **Shipped:** 9 new tests (5 negative for new suppression, 4 positive for TP regression guard). Full suite: 95 passed.'
  - 'Fresh re-scan of T-1516 and T-2072 (`bin/fw reviewer T-XXX --no-write --json`) shows skip-as-pass no longer fires on those lines (FAIL→PASS or FAIL→CONCERN with no `skip-as-pass` in findings). **Verified:** T-1516 FAIL→PASS (only finding cleared); T-2072 FAIL→CONCERN (skip-as-pass cleared, mock-only-integration remains, unrelated).'
  - 'Regression sweep: 50 randomly-sampled cached-PASS tasks re-scanned — zero now flag skip-as-pass. Additionally: 7 of 8 Cluster 1 tasks dropped skip-as-pass (T-1514, T-1516, T-1734, T-1738, T-1903, T-2072, T-2124); T-1594 retained — its `bin/fw mirror sync --dry-run --quiet` has no output assertion so the detector correctly preserves it as a real skip-as-pass (author needs to add an assertion, not detector to relax further).'
