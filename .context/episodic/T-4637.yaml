  detect fragile process placement (doctor/audit WARN on non-lingering session scopes) and VANISHED dispatch workers (fw termlink status/vanished). drop duplicated placement block in audit.sh (hunk landed twice: T-4634's commit carried it from the shared tree, then 180d12d08 applied it again)

# Key outcomes
outcomes:
  - '`lib/process_placement.py` classifies a pid from `/proc/<pid>/cgroup` as fragile when it sits in `user-<uid>.slice/session-*.scope` and that uid has no linger file; lingering users, service/scope units outside session scopes, and unreadable pids are not fragile. Proc root and linger dir are overridable (fixtures, no systemd changes).'
  - 'It finds claude-fw, Watchtower (pid file), the TermLink hub and tmux servers; `fw doctor` prints one `[host]` WARN per fragile process naming `loginctl enable-linger <user>` and the scope fix (T-4636); `fw audit` emits the same as WARN.'
  - 'A dispatch worker with no `exit_code`, no live run.sh/worker process and output (result.jsonl, else the dir) unchanged for `FW_TERMLINK_VANISHED_MINUTES` (default 10; not in the config registry, see Decisions) is reported `VANISHED` by `fw termlink status`; `fw termlink vanished [--minutes N]` lists them and exits 1 when any exist, 0 otherwise.'
  - 'Regression tests: pytest for the placement classifier against fixture /proc trees; bats for status/vanished against a fixture dispatch dir (vanished, fresh, finished, live). Both fail without the fix and pass with it.'

