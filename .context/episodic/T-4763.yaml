  - decision: '2026-10-26 — where to relax the tokenise refusal'
    chose: 'keep `_substitutions`'' over-approximate body list for the write scan, so every body it finds that tokenises is still scanned for writes, including bodies inside single quotes such as `bash -c ''…$(…)…''`. Only the "does not tokenise" refusal for those bodies is moved to the quote-aware lexer (`executed_texts`) whenever the lexer parses the command. That lexer pass now refuses a real body that does not tokenise, where it used to skip it silently. If the lexer fails, the old behaviour stays.'
    rationale: 'this is the narrowest change that removes the false positive. No scanned text is dropped: the regex pass and the lexer pass both still run, and the lexer pass can only add refusals.'
    alternatives_rejected: ['(a) replacing `_substitutions` with the lexer''s spans would stop scanning single-quoted bodies, which narrows a security gate. (b) Making `_substitutions` skip single quotes by itself would duplicate the lexer''s quoting rules in a second place.']

