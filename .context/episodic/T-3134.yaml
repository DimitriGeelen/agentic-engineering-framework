    chose: 'every "must not contain" assertion is `[[ "$output" != *x* ]]`.'
    rationale: 'bash exempts from errexit any command whose return value is inverted with `!`, so a non-final `! echo "$output" | grep -q x` inside a bats test can never fail it. This file''s first draft used that form, and test 3 was GREEN against the unfixed extractor while the prose it asserted absent was demonstrably in the output. Proven with a three-line bats fixture: non-final `! true` passes, final `! true` fails, non-final `[[ a != a ]]` fails.'

