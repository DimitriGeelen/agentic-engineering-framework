# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-09-18 — what a duplicate delivery returns'
    chose: 'the original record plus its ledger position (the caller gets the answer it would have got the first time), AND a `duplicate_delivery` refusal appended with `side_effect: false` naming the original — visible, not silent.'
    rationale: '§7.4 says every loser of compare-and-append gets an immutable refusal record; §13 #14 wants hub redelivery operator-visible. Returning the original alone would make a redelivery storm invisible; refusing alone would make a legitimate at-least-once transport look broken to its caller.'
    alternatives_rejected: ['(a) silent idempotent success — hides transport faults; (b) refusal only, no original returned — a resumed runner (§13 #9) needs the prior attempt''s outcome to continue, and would have to do a second lookup.']
  - decision: '2026-09-18 — conflicting result for one attempt'
    chose: '`stale_position`, with `detail` naming both payload hashes and the position of the consumed one.'
    rationale: 'a second, different result for the same `attempt_id` is a compare-and-append conflict against the position at which the first was consumed — the frozen enum''s `stale_position` is that exact meaning. It is not `duplicate_delivery` (the payloads differ) and inventing a code breaks the v1 freeze.'
    alternatives_rejected: ['`duplicate_delivery` with a "conflicting" flag — the schema has no such flag and the semantics differ (a duplicate is harmless, a conflict is the event an operator must see first).']
  - decision: '2026-09-18 — `decision_refs` on an accepted reference'
    chose: 'append-only; the single mutable field after acceptance. Removal is `direct_state_mutation`.'
    rationale: 'the schema carries `decision_refs` on the evidence object, and the human gate that reviews accepted evidence (§2.5 step 5) happens *after* acceptance by construction; a fully frozen object would leave that decision with nowhere to attach except a reverse index.'
    alternatives_rejected: ['fully immutable after acceptance with decisions pointing at evidence instead — cleaner, but contradicts the frozen schema''s shape; a v2 question.']

