# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-26 — which hook carries the stale line'
    chose: 'the receiver prompt hook, `lib/sidecar/hooks.py prompt` (wired as `fw hook sidecar-receiver-adapter`).'
    rationale: 'the doorbell is typed by the receiver''s injector (`inject.py`) and names receiver message ids; only that hook can resolve them against the receiver store and ledger. The AC''s name `fw hook sidecar-inbox` is the hub-topic surface (`agents/context/sidecar-inbox.sh`), which never sees receiver ids.'
    alternatives_rejected: ['adding it to sidecar-inbox.sh — it would have to re-implement receiver lookups in a second place.']
  - decision: '2026-10-26 — both candidates, not one'
    chose: 'candidate (1) (hook detects handled ids, says so with the ledger time) AND (2) (the line carries `typed <UTC minute>`).'
    rationale: '(1) is what saves the turn; (2) costs one token-group and lets a human or agent see a replay at a glance. (2) alone would still need the agent to go and check.'
    alternatives_rejected: ['dropping the replayed prompt — a hook cannot rewrite the prompt, and a turn on a stale line that says "already handled" is cheap.']
  - decision: '2026-10-26 — what counts as "handled" and which timestamp'
    chose: 'handled = handed over, dropped, or in `seen.withheld` (answered / shown as often as allowed). Time = latest HANDED_OVER row in the receiver ledger for those ids, else the latest ledger row for them.'
    rationale: '`seen.withheld` is the one predicate the hook and injector already share (T-3872); a shown-not-yet-confirmed message is withheld too and is as stale to the agent. Short ids that resolve to no stored message are not named (unknown is not handled).'

