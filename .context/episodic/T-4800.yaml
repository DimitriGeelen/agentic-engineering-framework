decisions:
  - decision: '2026-10-27 — how a vector says "A2 must not exist" on the closed route'
    chose: 'a variant-level `then.final_equivalent` (replaces `final` on a declared route) where `A2: null` means the attempt must not exist; runner and checker both enforce it.'
    rationale: 'the runner only checks the attempts a final lists, so omitting A2 would let a backend that answers dispatch_closed but still mints A2 pass.'
    alternatives_rejected: ['omitting A2 from the equivalent final (does not assert closure); a new `absent_attempts:` then key (a second mechanism next to final, for one fact).']
  - decision: '2026-10-27 — where dispatch_closed may appear in vectors'
    chose: 'check_vectors refuses `fence_reject: dispatch_closed` in any plain `expect` (including any_of); only `expect_equivalent` may name it.'
    rationale: 'closure is optional (§4.7). If a plain expect ever named it, a hub that keeps dispatches open would be non-conformant by construction.'
    alternatives_rejected: ['allowing it in a plain `any_of` with T1 (this would accept dispatch_closed from a backend that never declared the route, and the AC forbids that).']
  - decision: '2026-10-27 — CC-15 structure'
    chose: 'split CC-15 so its final allocate sits in a single variant, `allocate-after-resolve`. The shared steps keep the cas_mismatch allocate and the three resolves.'
    rationale: 'equivalent alternates are per variant by T-4796 design, and CC-15 had none.'
    alternatives_rejected: ['allowing vector-level expect_equivalent (T-4796 refuses that on purpose, because a vector-level alternate is either inert or shared by every route).']

