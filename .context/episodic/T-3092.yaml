# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-08-20 — local and remote are judged independently, neither suppresses the other'
    chose: 'Report `remote-unlanded origin/X` on its own evidence even when local `X` is landed and reported `merged-undeleted`.'
    rationale: 'That combination IS the bug. `t2416-fw-safe-mode-hook-timing` was landed locally and 204 commits unlanded remotely; the scan showed only the local half, so the ref read as deletable while holding two test files, five research artifacts and six unread `.pickup/` messages that exist nowhere else. Suppressing one verdict with the other reproduces the failure with extra steps.'
    alternatives_rejected: ['Deduplicating by branch name. It looks tidier and it is exactly what hid the strand.']
  - decision: '2026-08-20 — the current branch''s upstream is excluded'
    chose: 'Skip the remote ref that the current checkout tracks.'
    rationale: 'It is not a strand — it is where you are standing, and `fw_branch_divergence` already reports it in detail for the handover. On this repo it would emit a permanent finding for `origin/t2539-staging` (354 ahead) on every doctor run. A rail that always fires on your own working branch is the noise that trains people to skip the section — which is how `behind-threshold` reached 1761 unread.'
    alternatives_rejected: ['Reporting everything. Honest but self-defeating; the value of this rail is that its lines are all actionable.']
  - decision: '2026-08-20 — mutation results, including one that revealed my own inert test'
  - decision: '2026-08-20 — truncation had to change or the fix would not have shipped'
    chose: '`fw_branch_hygiene_head` — one line per distinct class first, then fill to the cap.'
    rationale: '`fw doctor` capped output with `head -12`, and emission order is local → worktree → remote. This repo has 19 findings of which 12 are local, so **0 of 4 `remote-unlanded` lines survived the cap**. Verified before and after. The scan would have been "fixed" while the operator''s view was byte-identical.'
    alternatives_rejected: ['Raising the cap. It defers the same failure to the next busy repo, and the cap exists because 19 lines of WARN is already at the edge of readable. - **Known limit, stated rather than hidden:** the representative is the *first* line of its class, not the worst — `origin/t2416 ahead=204` is still behind `origin/learning/precompact-cleanup ahead=1` in the shown set. Coverage is guaranteed; ranking is not. The "… N more" hint therefore names a command that prints the full list, and that command was run to confirm it works before being written into the output.']

