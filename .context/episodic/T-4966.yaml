  - decision: '2026-11-01 — scope: corruption, not commit attribution'
    chose: 'serialize every ledger and register append with every verdict commit (one re-entrant lock). This removes the torn-line risk. A negative control without the lock committed a torn completions line in 1 of 3 runs, and `history_fault` then refused the whole file. - **Not addressed, deliberately:** which commit carries a register row. ring20-dashboard (msg b6334f86) measured 22 of 68 register rows in another task''s verdict commit when judges run in parallel, and completion rows carried into the next task''s commit even when serial. The introducing-commit checks apply only to verdicts.jsonl rows, which are appended and committed together under the lock, so they always land in their own commit. Register rows are verified by signature (dispatches, runs) and append-only history (completions), never by the commit that carried them. So the attribution is cosmetic.'
