    chose: "Python `lib/pi_worker.py` using `subprocess.Popen` with `bufsize=1` (line-buffered) and explicit `\n` line splitting (NOT `readline`)."
    rationale: "pi's docs explicitly call out Node `readline` as non-protocol-compliant because it splits on `U+2028`/`U+2029` which appear inside JSON strings. Python's default file iterator is `\n`-only, but we need to be defensive — strip trailing `\r` and never assume universal newlines."
