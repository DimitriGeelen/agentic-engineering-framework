# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-08-15 — where concurrency protection lives'
    chose: 'own it inside `reindex_incremental()` — advisory flock, per-process scratch name, inode identity check before the swap'
    rationale: 'AC4 said "flock, as the other audit crons do", which put the guard on the cron line. That serialises cron against cron and nothing else. The first real run was destroyed inside 25 minutes by a non-cron actor, with `/proc/<pid>/fd/3` reading `(deleted)` while the process kept embedding.'
    alternatives_rejected: ['leaving it to callers — a guarantee every caller must remember to wrap is not a guarantee']
  - decision: '2026-08-15 — checkpoint granularity'
    chose: 'flush every ~512 accumulated chunks, on file boundaries'
    rationale: 'measured 1.9 chunks/s against the live embed host, 394,230 chunks in the corpus — a ~29-58h bootstrap. Non-resumable, an hourly cron can never finish it: every firing restarts from zero and the canary stays `unknown` forever while each run looks correct. Committing per group makes progress durable so successive firings chip away. Bounding by chunks rather than files keeps the interval between durable points predictable (a 40-file group measured ~15 min).'
    alternatives_rejected: ['checkpointing mid-file — file_state is what a resumed run trusts to skip work, so a file marked done without its rows would be skipped forever and the gap would be invisible']

