  - decision: '2026-10-26 — where a span is allowed to cross a line'
    chose: 'match code spans per block (a run of lines between blank lines and block starts: list item, heading, blockquote, table row, fence, `---`; inside frontmatter, a top-level YAML key). The bash reader strips the whole file in one pass and indexes the result by line number.'
    rationale: 'this is CommonMark''s rule (a span may wrap inside a paragraph but not past one), and a folded scalar is one paragraph. Treating each list item as its own block means a stray backtick in one AC cannot hide a bare stub in the next.'
    alternatives_rejected: ['(a) joining the whole file, which lets one stray backtick swallow everything up to the next backtick, including real stubs; (b) special-casing only `description: >`, which misses the body-paragraph shape; (c) keeping the candidate-lines-only pipe, which has no paragraph context, because the Updates and fence gaps are removed from it.']

