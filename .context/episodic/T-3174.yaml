decisions:
  - decision: '2026-09-03 — AC5 remedy: graduated env-var bypass (a), not a new transition edge (b) or FW_SAFE_MODE (c)'
    chose: 'a new, narrowly-scoped Tier-2-logged escape hatch, `FW_ALLOW_PARTIAL_COMPLETE_EDIT=1`, checked inside the existing `work-completed)` case branch in `check-active-task.sh`. It authorises exactly one thing — the next tool call, on the currently-focused partial-complete task — and writes an auditable entry to `.context/working/.gate-bypass-log.yaml` (task, flag, caller, and file-or-command). Same shape as the T-1890 focus-drift bypass (`FW_SWITCH_FOCUS=1`): env-var form because it must also work for `git commit`, whose parser rejects unrecognised flags outright.'
    rationale: 'it is the minimal change that closes the actual deadlock (an agent that needs one more EDIT — not a commit, T-3179 already solved that — on a task the reviewer or human sent back) without touching the status state machine, without widening any existing exemption''s blast radius, and without disabling gates unrelated to this one task. - **Rejected — (b) add `work-completed → started-work` to `status-transitions.yaml`:** this is what the block message used to (wrongly) imply already worked. Adding the edge would make `fw work-on T-XXX` on the SAME task succeed, but `update-task.sh`''s transition to `started-work` also flips `owner` back and clears `date_finished` — semantically re-opening the task, not authorising a single edit. That is a bigger behavioural change than the bug warrants: partial-complete is a real, intentional state (P-013 steers every render-touching build task there by design) and silently permitting a full status rollback from it would let an agent erase the "this needs human review" signal the state exists to preserve, not just fix the deadlock. The env-var escape authorises the EDIT without touching `status:`/`owner:` at all. - **Rejected — (c) tell the agent to write closure artefacts before the status flips:** measured and disproved in `## Context` — the artefacts this task exists to unblock are written by `update-task.sh` in-process (`decisions.yaml`, `feedback-stream.yaml`, the task file itself) at the moment `--status work-completed` runs, and the PreToolUse hook only gates subsequent tool calls, not a script''s own writes. Those writes were never blocked. What was blocked is everything AFTER — the `git commit` (T-3179) and any correction edit (AC5, this decision) — and (c) reaches neither. - **Not `FW_SAFE_MODE=1`:** it disables the ENTIRE task gate for every command against every task for the rest of the session, not just the one edit on the one partial-complete task. The AC explicitly rules this out; the new mechanism is scoped to the `work-completed)` branch only and stops applying the instant the command completes.'

