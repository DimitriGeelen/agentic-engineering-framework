  - decision: '2026-06-07 — Separate verb over flag-on-existing-verb'
    chose: '`fw consumer-recover <host> [<project-path>]` as a sibling verb to `fw upgrade`'
    rationale: 'clean mental separation — `fw upgrade` is "this fw, this consumer"; `fw consumer-recover` is "this fw, remote-bootstrap-then-upgrade *that* consumer". The two have different transport, different cleanup, different idempotency rules.'
    alternatives_rejected: ['`fw upgrade --recover --host HOST --project PATH` — would muddy `lib/upgrade.sh`''s 1562 LOC and the T-1542 guard which exists precisely to refuse the bare-from-consumer case the wrapper has to perform.']
  - decision: '2026-06-07 — SSH default with TermLink as opt-in upgrade'
    chose: 'SSH is the default transport. TermLink is selected when `--via termlink` is passed OR `termlink remote list` resolves the host.'
    rationale: 'SSH is the universal floor (key auth, no dependency on TermLink hub liveness). TermLink is the richer option (observability, replay via the bus) but its absence shouldn''t block recovery — recovery is the moment you most need a transport that always works.'
    alternatives_rejected: ['TermLink-only — would refuse to recover hosts without TermLink listeners, defeating the wrapper''s purpose. SSH-only — would lose the bus-envelope reply path that this session demonstrated as a clean evidence channel.']
  - decision: '2026-06-07 — Dry-run is the default; `--apply` opts in to execute'
    chose: 'Wrapper prints the recipe (with concrete substituted values) by default; only `--apply` (or `--execute`) actually runs the SSH/TermLink commands.'
    rationale: 'matches `fw upgrade --dry-run` precedent (safety-by-default for mutating verbs) and turns the wrapper into a teaching artifact — the operator gets a runbook line they can paste, audit, or share before the irreversible step.'
    alternatives_rejected: ['execute-by-default with `--dry-run` opt-out — inverts the safety polarity for a verb that operates on a remote host; one typo on `--host` could re-vendor the wrong consumer.']

