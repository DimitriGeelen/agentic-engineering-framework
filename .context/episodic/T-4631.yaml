# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-22 — --ext-diff / --textconv: trust configured drivers; refuse help -w'
    chose: 'keep `--ext-diff` and `--textconv` admitted on diff/log/show/cat-file; refuse `git help -w` / `--web`. - **Why (evidence):** measured in a scratch repo on git 2.43.0 with a marker-writing script: plain `git diff` RAN `diff.external` with no flag; plain `git show`, plain `git diff HEAD~1` and plain `git log -p -1` each RAN a textconv driver set by `.gitattributes` + `diff.<x>.textconv`; only `git log -p` without `--ext-diff` did not run `diff.external`. So refusing the flags would leave the same program running from `git diff` / `git show`; the only real control is over the config, and the allowlist already refuses every command-line channel that sets it (`-c`, `GIT_CONFIG_*`, `GIT_EXTERNAL_DIFF`, a repository outside PROJECT_ROOT via -C/--git-dir/GIT_DIR). `help -w` is different: it starts a browser whatever the config says, an action with no read value.'
    alternatives_rejected: ['refusing the flags (cosmetic, per the measurement); refusing diff/show/log outright (would gate the commonest read commands in exactly the null-focus states the allowlist exists for). - **Residual (not closed here, for the parent to register):** the Write/Edit gate exempts `PROJECT_ROOT/.git/*` (`agents/context/check-active-task.sh:572`), so with no active task a tool write to `.git/config` can name a diff driver, textconv or `core.fsmonitor` that a later allowlisted `git diff` / `git status` runs. That is a gate-exemption gap, independent of these flags.']

