# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-09-22 — `paths:` lives in subsystems.yaml, not in a new rules file'
    chose: 'Add a `paths:` list to each subsystem in `.fabric/subsystems.yaml` and route by longest-matching pattern.'
    rationale: 'It makes the vocabulary and the routing one operator-editable file, so a subsystem cannot be routed to unless it is declared. Longest-match means declaration order carries no meaning and `tests/playwright/*` beats `tests/*` without anyone having to keep the file sorted.'
    alternatives_rejected: ['A separate `.fabric/subsystem-rules.yaml` (register.sh already looks for one and it has never existed here) — a second file to keep in step with the first. Also rejected: extending the hard-coded `case` block, which is the thing that produced 564 unknowns.']
  - decision: '2026-09-22 — the purpose crosses python→bash base64-encoded'
    chose: '`describe.py --emit-shell` prints `FW_PURPOSE_B64=<base64>` and `register.sh` decodes it, then escapes for a YAML double-quoted scalar.'
    rationale: 'A docstring containing `"`, `$`, a backtick or a backslash is ordinary, and the card has to stay parseable YAML. Every shell-quoting scheme eventually mangles one of those; base64 has no such edge. Pinned by a fixture whose docstring contains all four.'
    alternatives_rejected: ['`eval` of a quoted assignment (an arbitrary docstring reaching `eval` is an injection surface); printing raw and quoting in bash (the case this would get wrong is the case that matters).']
  - decision: '2026-09-22 — `--describe` defaults ON'
    chose: 'On by default, `--no-describe` to opt out.'
    rationale: 'The pass cannot overwrite anything a human wrote, so there is no failure mode to opt into; and the placeholders are the entire problem, so a default-off flag would have left the 792 exactly where they were, behind one more thing nobody runs.'
    alternatives_rejected: ['Default off with `--describe` opt-in — the shape that produced the situation this task exists to fix.']
  - decision: '2026-09-22 — enrich does not write `purpose_source: none` on a refusal'
    chose: '`register.sh` writes `purpose_source: none` on a refusal (the card is being created, so every field is being written anyway); the enrich pass writes nothing at all when it derives nothing.'
    rationale: 'Keeps the pass idempotent and its diff honest — a run that changed nothing touches no file. A card with no derived sentence has no provenance to record.'
    alternatives_rejected: ['Writing `none` from enrich too, for symmetry: it would dirty 832 cards to record an absence already visible in the `TODO` purpose.']
  - decision: '2026-09-22 — rationale that must outlive an enrich run goes in a key'
    chose: 'Move `# T-1754 — by-design orphan, no framework imports` from a trailing YAML comment into `standalone_reason:`.'
    rationale: '`save_card` round-trips through `yaml.dump`, which drops comments. Restoring the comment would have restored something the next describe run deletes again — a fix that looks like a fix for exactly one run.'
    alternatives_rejected: ['Teaching `save_card` to preserve comments (ruamel.yaml round-trip mode) — a dependency and a rewrite of the card I/O for one line of prose in the whole corpus.']
  - decision: '2026-09-22 — the under-populated scan is its own module'
    chose: '`agents/fabric/lib/underpopulated.py`, shared by `drift`, `audit` and `doctor`; JSON flattening in `lib/fabric_doctor_facts.py`, shared by the last two.'
    rationale: 'The scan needs `describe.py`''s placeholder predicates, and a heredoc inside `$()` has no `__file__` to import relative to — besides being the canonical bin/fw self-lockout shape (L-332/L-408, the reason `lib/cron_dry_run.py` exists). Sharing the helper is also what keeps the audit and doctor wordings from drifting apart.'
    alternatives_rejected: ['Duplicating the counting logic in each of the three surfaces — three places for the definition of "under-populated" to diverge.']

