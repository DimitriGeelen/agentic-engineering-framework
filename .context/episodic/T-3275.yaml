# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-09-04 — confirm on the directive''s TEXT, not on "the pane changed"'
    chose: 'delivery is confirmed only when a whitespace-stripped 32-char prefix of the directive appears in the post-inject pane capture. Fail closed: if it never appears, refuse.'
    rationale: 'change-detection is the cheaper check and was the obvious first instinct, but it cannot separate delivery from a pane redrawing itself. A spinner, clock or progress line changes the capture without any input having landed, so a change-based guard reports success on an undelivered tick — reintroducing the exact false green G-101 exists to remove. The asymmetry decides it: a wrong refusal costs ONE tick and announces itself in the ledger; a wrong success costs every tick after it and announces nothing. C3 is the regression test — it passes a change-based guard and fails a text-based one, which is why it exists.'
    alternatives_rejected: ['(a) change-detection alone, for the reason above. (b) Requiring the *whole* directive to appear — a TUI wraps long input and the capture is tailed to 4000 bytes, so a long directive would produce false refusals. (c) Accepting either signal (text OR change) — that is change-detection with extra steps, since the weaker condition always decides.']
  - decision: '2026-09-04 — strip ALL whitespace from both sides of the comparison'
    chose: '`tr -d ''[:space:]''` on both needle and haystack before matching.'
    rationale: 'a TUI wrapping input can insert a newline mid-word (`backl\nog`), which defeats a matcher that merely collapses whitespace runs. Stripping whitespace entirely makes the needle wrap-immune. C6 pins it.'
    alternatives_rejected: ['collapsing runs to single spaces (`tr -s`) — fails the mid-word wrap, which is the common case for a long directive in a narrow pane.']
  - decision: '2026-09-04 — `case` on a captured variable, never a pipe into `grep -q`'
    chose: 'capture the squashed pane into a variable and match with `case`.'
    rationale: 'the script runs under `set -uo pipefail`. An early-exiting `grep -q` SIGPIPEs its upstream and the pipeline returns 141 (L-387), so the guard would manufacture false refusals through its own plumbing — a bug in the same family as the one it is fixing.'
  - decision: '2026-09-04 — T-3254''s stub was modelling the bug as its success case'
    chose: 'fix `_stub_termlink` in `tests/unit/t3254_driver_refusals.bats` so an injecting transport also writes the text into the pane the stub serves.'
    rationale: 'its `quiet` mode returned a constant pane, so its C2 ("an injection is recorded") was exercising a transport that accepts and delivers nothing — the G-097 shape — and calling it success. That is why the pre-existing suite could never have caught G-097, and it is the more interesting half of this finding: the fixture encoded the same assumption the production code did. Both were fixed here.'
    alternatives_rejected: ['special-casing the new guard to tolerate a constant pane. That would have kept the suite green by teaching the guard to accept the exact input it exists to reject.']

