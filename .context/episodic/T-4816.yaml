  tick guard honours git's bare -- (setup_revisions cuts argv there): words after it are pathspecs, not a possible --output; -L/--decorate-refs value still fails closed; regression bats; vendor synced

# Key outcomes
outcomes:
  - 'A failing bats case first: feeding the guard (agents/context/check-human-ac-tick.*) the Bash payload `git log --oneline -1 -- "$f"` (f a .tasks path) is refused with "an expanded argument may be --output"'
  - 'After a bare `--` in a git command, operands are treated as pathspecs: an expansion there can no longer become `--output`, so the command passes. An unresolvable expansion BEFORE `--` (e.g. `git show --stat $c`, `git diff $c~1 HEAD`) is still refused, and so is a real `--output` to a .tasks path'
  - 'New tests in tests/unit/t4816_tick_guard_dashdash.bats; the existing tick-guard tests (t3695* and siblings) stay green; vendor in sync'

