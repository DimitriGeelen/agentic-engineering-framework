# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-27 — which `--` ends the options'
    chose: 'the first literal `--` word ends the scan, unless the word before it is `-L` (or a short cluster ending in L) or `--decorate-refs[-exclude]`, the cmd_log_init parse_options options that take a separate value and would eat `--` before setup_revisions sees it.'
    rationale: 'this matches git''s own argv handling. The exception keeps `git log -L -- $o` failing closed.'
    alternatives_rejected: ['honouring every `--` (a value-taking option could consume it and `--output` would follow); stopping only when nothing after `--` starts with `-` (still refuses the field idiom whenever `$f` is unresolved).']

