# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-23 — where estimator writes go'
    chose: '(a) the cron sweeps commit their own writes: one commit per sweep, subject `T-1923:` (bvp sweep) / `T-1935:` (cost sweep), only the files that sweep wrote, via `git commit -- <paths>` so other workers'' staged files stay out. Files that were dirty when the sweep started are skipped (not written). Manual (non-`--cron`) runs are unchanged: they write and leave committing to the operator.'
    rationale: 'smallest change; every reader of proposals (`fw bvp`, Watchtower, auto-promote, arc readiness) keeps reading frontmatter as today. The skip-dirty rule also stops the sweep writing into a file someone is editing.'
    alternatives_rejected: ['(b) a side store (`.context/bvp/proposals.jsonl`): it moves the dirt, it does not remove it (the store still needs committing), and every proposal reader would have to change. Not clearly simpler. - **Accepted costs:** a file that stays dirty for days is not re-scored until it is committed. A daily commit touching most active task files adds history churn. If both sweeps write the same file in the same minute, the first commit can carry the other''s write; the second then finds the file clean and skips it, so nothing is lost or committed twice.']

