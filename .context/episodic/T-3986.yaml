decisions:
  - decision: '2026-10-08 — how a codex seat gets a writable temp dir'
    chose: '`codex exec -s workspace-write` in the disposable `git archive` export, `--add-dir $WDIR/tmp` + `TMPDIR=$WDIR/tmp`, `exclude_slash_tmp=true`, network off; the export is fingerprinted before and after, and a changed export exits the seat non-zero (no green of it counts).'
    rationale: 'codex 0.153 has no mode that keeps the working root read-only while one extra dir is writable — `workspace-write` always makes the cwd writable. The export is a throwaway copy (never the project tree), so the only risk of writing it is a seat altering what it reviews, which the fingerprint catches.'
    alternatives_rejected: ['cwd = scratch dir with the export elsewhere (the seat reviews by relative paths, would mis-locate files); `danger-full-access` (no sandbox at all).']
  - decision: '2026-10-08 — panel quorum when a seat could not evaluate'
    chose: 'not-evaluated seats are excluded; the panel needs ≥2 evaluating seats of distinct vendors (`MIN_EVALUATING_SEATS`). A single-seat run with a not-evaluated seat never closes. With no not-evaluated seat the original rule (every seat green, `required_vendors` distinct) is unchanged.'
    rationale: 'the operator''s ruling — a criterion closes only on seats that evaluated it — and this task''s own AC (≥2 at rung 5).'
    alternatives_rejected: ['keeping 3-of-3 (one sandbox limit would still block every rung-5 render criterion — the 832 symptom); 1 evaluating seat (no independence left at rung 5).']
  - decision: '2026-10-08 — what "reassign" means'
    chose: '`fw reviewer judge` (now `judge_with_reassign`) re-judges a not-evaluated criterion in a NEW run that seats no worker kind which could not evaluate it, up to `MAX_REASSIGN`=2 times; if it is still not evaluated, or the new run cannot seat a panel, the result says `OPERATOR: …` with the reasons.'
    rationale: 'a registered run pins its seats (T-3580 round 6), so adding a seat mid-run would weaken the binding; a new run keeps every existing guarantee.'
    alternatives_rejected: ['spare seats registered with every run (changes the run contract for every review).']

