# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-11-18 — one writer: lib/render_task.py, validation in lib/task-create-rules.sh'
    chose: 'lift create-task''s three inline writers (inception template, default template, inline heredoc fallback) verbatim into `lib/render_task.py` (`write-one` for create-task, `write-batch` for create-batch); lift the name/type/horizon/owner/recursion checks into `lib/task-create-rules.sh` (functions return 1 instead of exiting, messages byte-identical). Every file is written to `<tasks>/.writing/<pid>-<rand>.<name>` and hard-linked into `active/`: link(2) is exclusive and atomic, so a kill leaves only complete files. Pinned by goldens written by the pre-change create-task (commit 7ef993ddc): `tests/fixtures/t5221/golden/` (default, refactor+start, inception, inline fallback; frozen templates in `tests/fixtures/t5221/templates/`, generator `gen.sh`).'
    rationale: 'one writer of task files, the same rule as one allocator. Shell rules stay shell so create-task''s messages and exit codes do not move.'
    alternatives_rejected: ['re-implementing validation in Python for the batch (two rule sets that drift); a plain `open(path, ''w'')` in the batch (a kill leaves a half file).']
  - decision: '2026-11-18 — create-batch: arc membership and what runs once'
    chose: 'spec keys name, description, type, owner (required), horizon, tags, related, arc_id. `arc_id` is the only addition over create-task and adds one `arc_id:` line after `related_tasks:` (T-1849 membership); entries without it are byte-identical to create-task. Refused: inception type, keys start/status/focus/origin/recommendation/rationale/id, flags --start/--origin. Once per batch: library loading, the lock and the union-scan check (one `fw_id_allocate N`), template reads, one python start for rendering, one ledger append of the created rows (`fw_id_ledger_created` now takes several ids). Max 100 entries (FW_ID_BLOCK_MAX).'
    rationale: 'create-task has no per-task side effects a batch needs (origin, recommendation block and --start focus are all refused), so the per-call cost was process start-up and the scan.'
    alternatives_rejected: ['arc membership by `arc:<slug>` tag (legacy form, T-1850 migrates away from it).']
  - decision: '2026-11-18 — template arc format (fw arc instantiate)'
    chose: 'a YAML file, `.context/arcs/templates/<name>.yaml` or any path (arc readers glob `arcs/*.yaml`, so the subdirectory is never read as an arc): ```yaml template: municipality-scan # informational params: {municipality: null, region: west} # or a list (all required); null = required arc: id: "scan-{municipality}" # the arc slug; a fixed name from a parameter is fine name: "Municipality scan: {municipality}" description: "..." headline_mechanic: "An analyst runs the scan for {municipality} and sees ..." start: true # optional: created in-progress anchor: 1 # optional: 1-based task index -> anchor_task tasks: # create-batch entries (same keys, same rules; no arc_id) - {name: "Collect sources for {municipality}", description: "...", type: build, owner: agent, horizon: next, tags: [scan, "{region}"]} ``` `{name}` placeholders in any string or list item; `{{`/`}}` are literal braces. An undeclared placeholder, a missing required parameter and an unknown `--param` are all errors, listed together. Order: expand and validate everything (arc id free, headline mechanic, every task via `create-batch --dry-run --new-arc`) → `arc_create` → one `create-batch` (purpose `arc:<slug>`) → `anchor_task`. If no task got written the arc file is removed again. Fixture: `tests/fixtures/t5221/municipality-scan.yaml` (13 tasks).'
    rationale: 'smallest shape that covers 1409''s class-file + template-arc case; arcs and tasks still go through their one writer each.'
    alternatives_rejected: ['`create-batch --arc-spec` (operator answer (2) in T-5212 chose `fw arc instantiate`); Python `str.format` (any brace in a description would break).']
  - decision: '2026-11-18 — measured'
