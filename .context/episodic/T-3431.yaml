# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-09-22 — `--quiet` forces `--describe-only` semantics rather than literally running edges too'
    chose: '`enrich.py --quiet` internally sets `args.describe_only = True` regardless of the flags passed, skipping the forward/reverse edge-computation phase entirely, and prints exactly one line: `Fabric: N cards · T TODO purpose · U unknown subsystem · E no edges · R refused this run (bin/fw fabric drift for ids)`. The hook and `fw resume status` inject this line verbatim.'
    rationale: 'Measured live: `--describe-only` (no edges) is ~3.3s on the full 1,323-card corpus; `--describe` with the edge pass is 13.1s — over the 10s default `FW_FABRIC_DESCRIBE_TIMEOUT`. The nightly T-3430 cron already only ever runs `--describe-only` for the same reason ("the nightly sweep has no business recomputing the dependency graph"). Session start inherits that same boundary rather than inventing a different one. The AC''s literal invocation (`enrich --describe --quiet`) is honoured at the call-site; `--quiet` is what narrows the actual work performed.'
    alternatives_rejected: ['(a) A separate raw-text pre-filter that skips YAML-parsing non-placeholder cards before `build_index()` — unnecessary once edges are already out of scope, since `apply_describe()` only does real file I/O on placeholder cards; the ~3.3s floor is `yaml.safe_load` over 1,323 files, which is inherent to any full-corpus fabric scan (paid identically by `fw doctor`/`fw audit`/`fw fabric drift` today) and did not need re-solving here. (b) A background/`nohup` hook invocation with a cached-summary read — the ground truth text allowed this as a fallback if the foreground path couldn''t be made fast enough, but 3.3s comfortably fits inside the 10s budget so the simpler foreground call was kept.']
  - decision: '2026-09-22 — `fw resume status` reads the cache file rather than re-running the scan'
    chose: '`resume.sh:cmd_status` reads `.context/working/.fabric-describe.last` (the same cache file the hook writes) instead of invoking `fw fabric enrich --describe --quiet` itself.'
    rationale: '`resume status` is documented as a "routine check" callers may run repeatedly in one session (CLAUDE.md recommends `resume quick` over `resume status` for that reason); paying the ~3.3s scan cost on every invocation is unnecessary when the SessionStart hook already refreshes the cache once per session. The line is only as stale as the last session-start/resume/compact event, which is the same freshness bound the additionalContext line has.'
    alternatives_rejected: ['Re-running the live scan inside `cmd_status` — correct but slower for no accuracy gain in the common case, and duplicates work the hook already did moments earlier.']

