  - decision: '2026-06-14 — Arming the guard in the framework repo (which had no .framework.yaml)'
    chose: 'Create `.framework.yaml` at the framework root with `PROTECT_MASTER: 1` (UPPERCASE key).'
    rationale: 'The framework repo is not an `fw init`''d consumer — it ran on env-vars + defaults and had no config file. The guard reads persistence via `fw_config "PROTECT_MASTER"` (it must apply to *every* commit, so an env var won''t do — the deployed hook runs in git''s env, not ours). `bin/fw` self-detects the framework via `FRAMEWORK.md + agents/` (bin/fw:88) before any `.framework.yaml` read, and the file carries no `framework_path:`, so it does not disturb path resolution. `test_project_root_discovery.py` explicitly tolerates a marker at FRAMEWORK_ROOT (asserts `result == FRAMEWORK_ROOT`, never an ancestor) — re-run green (7 passed).'
    alternatives_rejected: ['(a) `fw init` the framework repo — that treats the framework as a consumer of itself, wrong model; (b) special-case the guard to default-ON inside the framework repo — breaks the consumer-safe default-off contract and is fragile.']
  - decision: '2026-06-14 — fw_config key case is UPPERCASE (latent silent-OFF bug caught)'
    chose: 'Store `PROTECT_MASTER:` (uppercase) in `.framework.yaml`; Verification greps `^PROTECT_MASTER:` (uppercase).'
    rationale: '`fw_config "KEY"` greps `^KEY:` case-sensitively and `_config_set` writes the key verbatim; the live convention (PORT, etc.) is uppercase. A lowercase `protect_master:` would never be read → guard silently OFF, while a lowercase Verification grep would still *pass* (matching the lowercase file) — proxy diverged from reality (T-1828 class). Caught by checking `fw config get PROTECT_MASTER` returned empty before trusting it.'
