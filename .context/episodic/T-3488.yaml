  - decision: 'D1 — 2026-09-26 — port `median == min` faithfully; reject the "large tie at the median" generalisation'
    chose: 'The identical predicate to `lib/bvp.sh`: withhold when `median(norms) == min(norms)` and the task sits at the median. No divergence, despite AC #2 explicitly permitting one.'
    rationale: 'The harmful condition is **having nothing below you**, not "being tied with many others". A task at the distribution''s floor labelled *high value* is self-contradictory; a task at the maximum labelled *high value* is the strongest case there is. `median == min` captures exactly the first and excludes exactly the second. - **Rejected — "withhold whenever a large mass ties at the median":** this was the first design, and measurement killed it. This repo''s live corpus has 24 of 29 costed tasks (83%) tied at `NORM 0.40` = median = **max**. Under the wider rule all 24 would be withheld and ranked behind the corpus''s five *lowest* scorers — it would invert the ordering it was meant to protect. It would also break T-3485''s own pinned admission control, which asserts a non-degenerate at-median tie (scores 1,2,2,4) legitimately stays `hv`. - **Rejected — `>=` → `>`:** already rejected under T-3485 with a pinned test; it moves the tied mass from `hv` to `lv` without making anything distinguishable. - **Consequence stated plainly:** the guard is **inert on this repo today** (`median 0.40 != min 0.04`). This task repairs a latent defect here and an active one downstream. That is not a reason to skip it — the resolver is the autonomous selection path, and a latent inversion there is exactly the thing you fix before it fires.'
  - decision: 'D2 — 2026-09-26 — a withheld task ranks LAST; it is never skipped and never errors'
    chose: '`_quadrant = "v-thin"`, `_quadrant_rank = _NO_BVP_RANK` — the same ordering bucket as a task carrying no BVP signal at all, i.e. fall back to FIFO. The task stays fully eligible for dispatch and keeps its measured `bvp_norm` / `bvp_cost` for observability.'
    rationale: 'Ranking it last is *provably* correct in every case this branch can fire, not merely a reasonable default: the guard only fires when `median == min`, so a task at the median is at the floor and nothing in the corpus is below it. And withholding a **verdict** must not erase a **measurement** — `fw resolver explain` has to be able to show the score that produced the withholding. - **Rejected — skip or error:** a selection path that refuses to return a task because its value is unclear turns a ranking problem into an availability problem. The corpus would go empty rather than un-ordered. - **Rejected — a fifth ranked quadrant between `lv-hc` and no-data:** that invents a new ordering claim out of the same absence of signal. Pinned against by `test_withheld_tasks_report_v_thin_and_rank_as_no_bvp`.'
  - decision: 'D3 — 2026-09-26 — AC #8 amended, in the open, rather than passed or silently dropped'
