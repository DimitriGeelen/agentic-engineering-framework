# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-23 — what counts as "managed by systemd"'
    chose: 'managed when EITHER (1) the triple-file pid''s cgroup ends in a `*.service` that is not the caller''s own unit AND that unit is a Watchtower unit (name contains `watchtower`, or its unit file''s ExecStart runs watchtower.sh / `fw serve` / web.app), OR (2) a unit file in the unit dirs (/etc, /run, /usr/lib, /lib systemd/system and ~/.config/systemd/user) has an ExecStart running a Watchtower and names this project''s root as a whole path in ExecStart or WorkingDirectory. Start/restart refuse with exit 5 and `systemctl <verb> <unit>`; ensure prints one line and logs it.'
    rationale: 'rule (2) is the one that covers the restart window: the managed process is dead, so there is no cgroup to read. The "Watchtower unit" clause in (1) is needed because a pre-T-4706 server (or one started with FW_AGENT_SCOPE=0 / no systemd) still sits in its launcher''s unit: cron.service, agentic-fleet-cockpit.service. Without it, such a server would read as systemd-managed forever and every restart would be refused. "Not the caller''s own unit" lets a unit whose own ExecStart runs `watchtower.sh start` start it.'
    alternatives_rejected: ['a bare "any *.service cgroup that is not ours" (the false positive above); `systemctl show -p MainPID` (wrong with ring20''s access-log wrapper, where MainPID is the wrapper, and it needs a live systemctl in tests); checking `systemctl is-enabled` for rule (2) (a disabled leftover unit file also suppresses ensure. The cost is visible: ensure logs `skip: managed by systemd unit X` every run). - **Not changed:** `stop` still stops a managed pid. systemd then leaves it down (a clean SIGTERM exit is not on-failure). Out of scope here.']
  - decision: '2026-10-23 — WATCHTOWER_ENSURE as a config key, and seeding'
    chose: 'registry key `WATCHTOWER_ENSURE` (default 1) in lib/config.sh and web/blueprints/config.py. ensure reads env `FW_WATCHTOWER_ENSURE` first, then `.framework.yaml` directly, because post-compact-resume.sh sources the lib without lib/config.sh. - **Seeding to consumers:** CAN now be seeded, and that is a separate decision. The two blockers ring20 raised are closed: a systemd-managed Watchtower is detected and left alone, and a project can opt out persistently with `fw config set WATCHTOWER_ENSURE 0`. One residual: a project whose Watchtower is run by a supervisor other than systemd (supervisord, docker restart policy, a tmux loop) is not detected and must opt out with the key. Nothing filed here, per scope.'

