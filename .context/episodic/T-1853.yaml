# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-05-17 — server-side query-param filter (`?status=...`) vs client-side hide/show'
    chose: 'Server-side filter. Each tab is a plain `<a href="/arcs?status=X">` — the request returns only the matching arcs.'
    rationale: 'Watchtower has a session-cookie + SSR-only architecture; client-side JS state is intentionally rare. Server-side filter is grep-able in router code, debuggable from curl, and shareable via URL (the operator can bookmark `/arcs?status=closed`). Counter badges still reflect the full state count, not the filtered count.'
    alternatives_rejected: ['Client-side hide/show via JS — would require Alpine/HTMX or an inline script, both alien to this codebase. Plus client-side filtering hides the URL-as-state pattern operators have come to expect on `/tasks`.']
  - decision: '2026-05-17 — synthetic "all" tab as the 5th label'
    chose: 'Add an `all` tab at the right end of the strip — pass through `_filter_arcs` unchanged.'
    rationale: 'A 4-state lifecycle without an "all" escape hatch hides the corpus-wide view. Adding `all` is one extra label in a list (`_LIFECYCLE_STATES + ("all",)`) and one extra entry in `_state_counts` — trivial cost, big UX win for "show me everything regardless of state."'
    alternatives_rejected: ['Default to "in-progress" only, hide all-view behind a "more" affordance — adds clicks for a non-edge use case.']
  - decision: '2026-05-17 — first-1KB regex scan instead of yaml.safe_load per task'
    chose: '`head = fh.read(1024)` + line-regex extraction of `id:`, `arc_id:`, `tags:` from task frontmatter. No yaml-parse for the batched scan.'
    rationale: 'Task frontmatter is *guaranteed* to live in the first ~512 bytes by template convention. Yaml parse over 1841 files cost ~10s; regex over the same files costs ~30ms. The regex doesn''t validate YAML — but we don''t need validation in a presentation-layer task-count, only field extraction. If a task frontmatter is malformed it doesn''t show up under any arc — which is correct degraded behaviour.'
    alternatives_rejected: ['ijson / streaming yaml-parser (over-engineered for frontmatter); read-once full-file + cache (memory bloat for 1841 markdown files); precompute index at watchtower startup (staleness within the same process).']
  - decision: '2026-05-17 — sort order: in-progress → draft → closed → abandoned'
    chose: '`status_rank = {"in-progress": 0, "draft": 1, "closed": 2, "abandoned": 3}`'
    rationale: 'Operator scanning the "all" tab sees active work first, then unstarted work (draft), then archived (closed/abandoned). Matches the order on the filter strip — predictable cognitive flow.'
    alternatives_rejected: ['Alphabetical (`abandoned < closed < draft < in-progress` — wrong-end-first); recency-only (loses lifecycle grouping).']

