# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-11-19 — how fw doctor learns what a running Watchtower skipped'
    chose: 'Watchtower writes a load report (`.context/working/watchtower-extensions.json`: loaded, skipped with reason) at start; `lib/extensions.py web-status` turns it into rows for `fw doctor`, and `audit` includes the same rows. The report is written only when the register has a page or nav entry (or a report already exists), so projects without extensions get no new file.'
    rationale: 'doctor is another process; a skipped page is a fact about the running server, and re-importing project code inside doctor would run it a second time, in a different environment.'
    alternatives_rejected: ['importing the pages again from doctor (runs project code in the health check, can disagree with the server); log-file grep (the log rotates and has no structure).']
  - decision: '2026-11-19 — existing web tests: what "stay green" was measured against'
  - decision: '2026-11-19 — static files of a project page'
    chose: 'a blueprint''s own `static_folder` is used as written; one that sets none and has `static/` beside its module gets it at `/ext/<blueprint name>/static/`.'
    rationale: 'without a `url_prefix` Flask would put the blueprint''s static route on `/static`, where the framework''s route wins and the project file is unreachable.'
    alternatives_rejected: ['adding the project folder to the app''s static lookup (a project file could then answer for a missing framework asset).']

