decisions:
    chose: "In `learning.sh`, pass the escaped string through environment variable (`L_ESC=...`) and read it inside awk via `ENVIRON[\"L_ESC\"]`, rather than `-v learning=...`."
    rationale: "awk's `-v var=value` flag interprets backslash escape sequences in the value before assignment, so `\\backslash` collapses to `\backslash` and `\\"quote\\"` to `\"quote\"` — undoing the YAML escape. ENVIRON skips that interpretation and passes the raw string. Tested empirically: round-trip mismatch was masked by this exact behavior."
    alternatives_rejected: ["Restructure the awk pipeline to a python helper (more invasive; also changes file-rewrite semantics); double-escape (\\\\\\\\) before passing to -v (fragile, hard to reason about)."]

