decisions:
  - decision: '2026-10-19 — make the scan fast instead of narrowing it'
    chose: 'keep scanning every staged byte and every new path; remove the bash overhead (stream the diff through a temp file, grep the file per pattern; classify all new paths in one pass with no per-path forks).'
    rationale: 'measurement showed the regex work itself is < 1 s; the 100 s was pure variable/fork overhead. Fixing that keeps the scan''s coverage identical (no new trust assumption) and speeds up every large commit, not only the bootstrap.'
    alternatives_rejected: ['(a) skip `.agentic-framework/` files byte-identical to the vendored source — needs a trusted reference copy and hashing, adds a trust assumption ("framework bytes were scanned upstream"), and a tampered or locally edited vendored file would need special handling; (b) scope the bootstrap scan to project-owned paths — a blanket path exemption is exactly the weakening the task forbids, and would also exempt a secret dropped into `.agentic-framework/` by hand.']
  - decision: '2026-10-19 — run the catalogue greps under LC_ALL=C'
    chose: '`LC_ALL=C grep -E` for the content patterns only.'
    rationale: 'every catalogue regex is ASCII; GNU grep''s multibyte matching made one pattern cost 8.4 s of 9.6 s. Under C a non-ASCII byte is just a byte, so negated classes like `[^[:space:]@]+` match at least as much as before, and invalid UTF-8 no longer flips grep into "binary file matches" (which hid the hit line). Accepted edge: `[[:space:]]` no longer matches Unicode spaces (e.g. U+2003) inside the AWS secret pattern''s `key = value` gap — not a shape real credentials files use.'
    alternatives_rejected: ['dropping or rewriting the Azure PAT regex — that changes coverage.']

