decisions:
  - decision: '2026-11-19 — `fw cron install` pending the operator'
  - decision: '2026-11-19 — cron runs `fw arc wake-sweep`, not `python3 lib/arc_wake.py sweep`'
    chose: 'a `fw arc wake-sweep` verb wrapping `lib/arc_wake.py sweep`.'
    rationale: 'consumer projects have no `lib/` at the root (vendored under `.agentic-framework/`); `fw` resolves the path in both.'
    alternatives_rejected: ['a raw `python3 lib/...` cron command (framework-repo only).']
  - decision: '2026-11-19 — what counts toward the limit, and deadline dedupe'
    chose: '`sent`, `dispatch-refused` and `error` count toward `owner.wake_limit`; `refused-limit` and `skipped` (FW_ARC_WAKE=0 / test run) do not. A deadline is used up by any ledger row with its key except `skipped`, so a deadline refused by the limit is not retried the next day (the operator was told).'
    rationale: 'a failing channel must not let an arc wake endlessly; a switched-off run must not burn a deadline.'
    alternatives_rejected: ['retrying a limit-refused deadline each day (re-notifies every day for one stale step).']
  - decision: '2026-11-19 — operator notice over the limit: both channels'
    chose: 'one `fw_notify` push per arc per UTC day (recorded as `operator_notified` on the first `refused-limit` row) AND a live `fw operator pending` section "Arcs at their daily wake limit", read from today''s ledger rows.'
    rationale: 'fw_notify is opt-in and may be off; the pending list is the live operator surface (T-4095) and needs no state of its own.'

