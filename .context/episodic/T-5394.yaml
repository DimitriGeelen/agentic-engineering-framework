# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-11-24 — TermLink: per-tool classes, not a blanket exemption'
    chose: '050''s per-tool TermLink egress list (remote_*, file_send, dispatch, exec/inject/interact/run/send/spawn, broadcasts, emit, request, kv_set, channel/agent post/reply/quote/edit/ask/contact), plus hub_export_secret and poll_start; every other termlink tool local.'
    rationale: 'hubs can sit on other hosts (ring20), so a send through TermLink can leave the host.'
    alternatives_rejected: ['050''s first blanket `mcp__termlink__` exemption (too wide); gating every termlink tool (blocks reads for no gain).']
  - decision: '2026-11-24 — Project policy can only tighten'
    chose: '`.context/project/mcp-egress.yaml` may add `egress` rules; `local` rules there are ignored and WARNed by the audit.'
    rationale: 'the file is agent-writable; an agent that could write `local` could ungate itself.'
    alternatives_rejected: ['full project overrides (self-ungating); no project file at all (consumers'' own servers, e.g. claude-artifacts variants, could not be gated without a framework release).']
  - decision: '2026-11-24 — Approval ledger is gitignored, per host'
    chose: '`.context/working/mcp-egress-approvals.jsonl` + `mcp-egress-uses.jsonl`, gitignored; approvals guarded by the Write/Edit/Bash operator-records guard.'
    rationale: 'approvals are short-lived (TTL, single use) and host-specific; committing them would dirty the tree on every approval.'
    alternatives_rejected: ['a committed ledger (noise, and a commit is not what makes it operator-only).']

