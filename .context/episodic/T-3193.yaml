# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-08-27 — which invariant wins when the release branch has already advanced'
    chose: 'HOLD THE RELEASE OPEN. Keep the local tag, create no GitHub Release, exit non-zero, and leave the pushed release branch exactly where it is.'
    rationale: 'by the time the tag push fails, `master` has been pushed and consumers may already have fetched it. Retracting it means a force-push to the install surface — Tier 0, destructive, and it breaks anyone who pulled in the window. The resulting state, "master advanced, tag pending", is untidy, honest and recoverable by re-running the command. The alternative state, "release published, tag missing", is tidy, false, and is the bug. - **Rejected — roll master back:** it is what the *branch-push* guard does one block earlier, which is why it looks consistent. It is not: that guard fires when the branch reached NO remote, so there is nothing published to retract. This one fires after a successful publish. Same-looking situations, opposite safe actions. Pinned by the test "the already-pushed release branch is NOT rolled back", and mutation M3 (force-push the old sha back) reddens it.'
  - decision: '2026-08-27 — AC4, and the half of it that cannot be fixed here'

