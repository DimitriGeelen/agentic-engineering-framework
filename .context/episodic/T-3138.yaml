  - decision: '2026-08-25 — the filed count was wrong, and correcting it was the work'
    chose: 'report 99 dead across 62 files, not the filed 106 across 66.'
    rationale: 'the first draft implemented AC2''s literal wording — "a line whose first token is `!` and which is NOT the last statement". Reviewing the flagged sites before converting them showed seven the rule mis-classified. Four are `! cmd || { ...; return 1; }`: the `!` exempts its own pipeline, but that pipeline is not the last command of the `||` list, so the guard branch IS checked and the assertion fires. Three are line-continued statements whose `!` line is not the last PHYSICAL line but is the last LOGICAL one.'
    alternatives_rejected: ['converting all 106 as filed. Two of the seven would have been broken by the conversion rather than fixed, and the other five would have been rewritten for no reason — churn presented as remediation.']
  - decision: '2026-08-25 — wired into `fw test invariants`, not `fw test lint`'
    chose: '`tests/lint/bats-dead-negation.bats`, collected by `fw test invariants` (and by `fw test all`).'
    rationale: '`fw test lint` is shellcheck, by deliberate design — T-2697''s own comment in `bin/fw` records that `tests/lint/` was globbed by no runner for months precisely because the obvious verb was taken, and named the new verb `invariants` "so the collision cannot recur". Wiring a second meaning into `lint` would re-create the condition that comment exists to prevent.'
    alternatives_rejected: ['editing the `lint)` branch of `bin/fw` as AC3 words it. It would also have meant touching a file carrying another task''s uncommitted edits.']
  - decision: '2026-08-25 — `if X; then false; fi` as the universal conversion'
    chose: '`[[ a != b ]]` where the negation fits inside one test command (23 sites), `if X; then false; fi` everywhere else (76 sites).'
    rationale: 'errexit is suppressed only in an `if` CONDITION; the branch body is checked normally. That makes it safe for the shapes `[[ ]]` cannot hold — pipelines, env-var prefixes, redirects. Verified by fixture, not by reasoning.'
    alternatives_rejected: ['`! X || false`, which also fires (case E in the mechanism fixture) but reads as a puzzle. The measurement is kept in the fixture anyway so the next reader does not have to redo it to find out why.']

