decisions:
  - decision: '2026-10-22 — reply classifier edge cases'
    chose: '`not-fixed` on strong negatives anywhere in the reply (not fixed, still broken/fails, regression, reopen, is broken); weak counter-signals (still, however, except, "but ... not") veto `confirmed` only in the reply''s FIRST PARAGRAPH, giving `other`. Affirmation must be in the opening sentence.'
    rationale: 'real #86 says "the gate still bites" in paragraph 2 and #88 says "Separate, still open" in paragraph 2; a whole-text veto would block both genuine confirmations. A negative like "Still broken" in any paragraph still blocks.'
    alternatives_rejected: ['whole-text veto on every counter-signal (blocks #86/#88); ignoring counter-signals (closes issues on mixed replies). - **Partial checks (#93):** classify `confirmed`; the close comment quotes the opening sentence and any later sentence naming what was not checked ("only", "have not ..."). - **Settled replies:** a reply is settled by a `closed` row naming it, a closed ledger stage on the issue, or sync seeing the issue no longer open (`reply-settled` row). `needs-decision` rows keep it listed.']

