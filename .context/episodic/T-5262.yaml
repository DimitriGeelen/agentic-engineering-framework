# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-11-20 — how an exemption is proven'
    chose: 'a live startup probe (no credential, then a wrong random credential; both must answer 401/403), run last in create_app; probe requests pass csrf_protect via a per-startup secret in a WSGI environ key that no client header can set, compared with hmac.compare_digest and deleted after startup.'
    rationale: 'ring20 asked for the framework to check the endpoint really enforces its auth; the wrong-credential probe is what catches a header-presence-only check (ring20''s current one).'
    alternatives_rejected: ['trusting the declared auth plus the named test alone (proves nothing at runtime); a static code scan (cannot judge arbitrary auth code). - **Accepted cost:** a probe really calls the endpoint, so a presence-only endpoint acts once on the wrong-credential request at startup — which is how it is caught. Endpoints with no state-changing method are refused (nothing to exempt). A register entry changed after its probe gives WARN "changed since it was checked". `fw doctor` shows these rows as WARN (it reads web-status, INFO/WARN only); `fw audit` keeps FAIL.']

