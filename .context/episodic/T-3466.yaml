  - decision: '2026-09-25 — F-15: `VAR=$(cmd)` recognizer scoped to the terminal-assignment shape only'
    chose: 'recognize and delegate ONLY when the entire (post-trim) segment matches `^[A-Za-z_][A-Za-z0-9_]*=\$\(.*\)[[:space:]]*$` — i.e. the whole statement is one assignment from a substitution, nothing else on the line.'
