# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-19 — where to fix'
    chose: 'fix FRAMEWORK_ROOT resolution at the source, both ends: `bin/fw` drops an inherited FRAMEWORK_ROOT that resolves to `<its own repo>/.agentic-framework` when its own tree is a framework repo (the existing `resolve_framework` T-1346-B1 rule then picks the repo); `bin/claude-fw` checks the framework-repo case before the vendored case so it stops exporting the wrong value.'
    rationale: 'the wrong value is FRAMEWORK_ROOT itself; every consumer of it (generate, doctor''s compare, sourced lib/ and agents/) is wrong the same way, so patching generator and doctor would leave every other subsystem running from the vendored copy. The guard is narrow: it fires only when the vendored copy belongs to the repo bin/fw lives in. That never happens in a consumer (there bin/fw *is* the vendored copy, and its own tree has no `.agentic-framework`), nor in the T-2099 upgrade handoff (temp-clone root) or the upgrade doctor leg (consumer''s own vendored binary + root).'
    alternatives_rejected: ['teaching the cron generator and doctor that the repo''s vendored copy means the repo — treats two symptoms and leaves lib/ and agents/ sourced from the vendored copy for every other command. Fixing claude-fw alone — sessions already running with the leaked value, and any other exporter, would still hit it.']

