# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-19 — in place for small deltas, copy kept for large ones'
    chose: '`index_one` keeps its lock-skip behaviour. The in-place reindex holds the same lock, so its concurrency argument is unchanged.'
    rationale: 'the copy-based tests pin OBS-258: a 120-file run must park and resume across kills. An in-place run that dies is rolled back, so for a large run the in-place mode would discard hours of work. Small runs (3-14 files in the reported fleet) lose nothing on a rollback.'
    alternatives_rejected: ['always in place — breaks OBS-258 resume (`test_a_partial_run_parks_its_work_instead_of_discarding_it`). Keep the copy and only trim it — a copy is still a full index write. - **Chose rollback journal, not WAL:** with WAL a `copy2` of the live file misses frames still in `-wal`, and a swap would leave a stale `-wal` beside the new file, so WAL would have to be handled in the copy path too. Default journal keeps readers on the old snapshot until commit and sqlite rolls back a killed run. A 64 MB page cache (`PRAGMA cache_size`) keeps a normal run from spilling dirty pages into the live file, since a spill takes the exclusive lock readers wait on.']

