completed: "2026-03-24T07:34:08Z"
workflow_type: build

summary: |
  Emergency fix — updated budget-gate and checkpoint thresholds from 1M to 200K window after Anthropic's silent context reduction.

what_happened: |
  Anthropic reduced the Claude Code context window from 1M to ~200K without notice.
  The framework's budget-gate thresholds (600K/800K/900K) never fired, causing sessions
  to hit the real limit and get force-compacted with no warning, destroying working context.
  Fixed by updating CONTEXT_WINDOW default to 200000 and thresholds to 75%/85%/95%
  (150K/170K/190K) in both budget-gate.sh and checkpoint.sh, plus updating CLAUDE.md.

key_decisions: []

patterns_observed:
  - "External provider changes can silently break framework safety mechanisms — thresholds should be relative (percentages) not absolute, and the context window size should be configurable via env var."

