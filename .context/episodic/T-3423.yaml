# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-09-22 — what of `.context/sidecar/` is tracked'
    chose: 'ignore the runtime state (outbox message files, the append-only ack ledger, inbox cursors, worker prompts); track only the e2e verdict records `.context/sidecar/e2e/<run>.json`.'
    rationale: 'the runtime files are per-host, grow on every consult, and would turn every `fw sidecar send` into an uncommitted change; the verdict records are the evidence that the channel worked on a given day, and the close gate of this task reads them (≥2 PASS records, all six hops).'
    alternatives_rejected: ['tracking everything (noise on every send; the ledger is append-only and would conflict across sessions); tracking nothing (the live proof would live only in scrollback — the exact state this slice exists to end).']
  - decision: '2026-09-22 — ambient hops are informative, not blocking'
    chose: 'under `--ambient`, only H1 (ledger), H2 (hub has our message) and H6 (worker exited with DONE) decide the verdict; H3–H5 fold into `A1`.'
    rationale: 'whether an un-instructed model reads its inbox is a property of the model and the stanza, not of the transport. Letting it fail the transport verdict would make the check flap on model behaviour and hide real transport regressions behind it.'
    alternatives_rejected: ['one blocking rule for both modes (conflates two questions); no ambient mode at all (the un-instructed answer is the arc''s headline mechanic — it must be measurable, just separately).']

