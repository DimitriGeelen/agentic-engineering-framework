decisions:
  - decision: '2026-08-20 — Call the library, do not mirror it'
    chose: '`audit.sh` sources `lib/branch-hygiene.sh` and calls `fw_branch_hygiene` / `fw_branch_hygiene_head`. Zero classification logic in audit; the only place audit reads a class token is the `grep -q ''^diverged-fork ''` that routes the remedy.'
    rationale: 'the precedent this slice follows (`bin/fw doctor` → audit cron drift, T-1771/T-1942/T-1943) mirrored doctor''s logic instead of calling it, and that second copy is the L-399 producer/consumer split — one side gets fixed, the other silently doesn''t. Branch hygiene has a single library entry point, so there is no excuse for a copy.'
    alternatives_rejected: ['re-implementing the scan inline for "audit independence". The independence is illusory: two copies of a predicate do not cross-check each other, they diverge.']
  - decision: '2026-08-20 — A check that could not run must not report as clean'
    chose: 'three distinct non-finding outcomes, not one. Linked worktree → INFO skip; no master lineage → INFO skip; genuinely tidy repo → PASS.'
    rationale: '`fw_branch_hygiene` is silent in all three cases, so at the call site they are indistinguishable. `bin/fw doctor` collapses the last two and prints "Branch hygiene clean" on a repo it never judged. That is the false-green class this framework has hit repeatedly (T-2732''s port-3000 verification lines, OBS-185, the fabric coverage expander at audit.sh:1791) — a silent instrument reporting as a silent result.'
    alternatives_rejected: ['mirroring doctor''s two-state form for parity. Parity with a defect is not parity worth having; the divergence is documented here instead, and doctor''s own version is a candidate follow-up rather than a blocker for this slice.']
  - decision: '2026-08-20 — WARN, never FAIL; INFO for worktrees'
    chose: 'the block can reach `warn`, `pass` and `info`, and cannot reach `fail` on any input. Audit''s exit code is therefore 1 (warnings) on a repo whose only issue is stale branches, never 2.'
    rationale: 'T-3093 explicitly ruled out a blocking gate and per-strand auto-filing. Both act on a signal whose false-positive rate was fixed only one slice ago (T-3094 moved the trigger from behind-count to recency), and both are far harder to walk back than a WARN. The linked-worktree INFO follows the content-vs-environment classification from L-486 / T-2437: a worktree derives a different branch set, so every finding there is a worktree artefact, not content drift.'
    alternatives_rejected: ['FAIL on `diverged-fork` specifically, on the grounds that T-100194''s fork cost 100+ conflicts. Tempting and wrong: the fork class is the newest and least-measured of the six, and a FAIL blocks pushes. It gets a distinct *remedy string* instead, which carries the same information at zero blast radius.']
