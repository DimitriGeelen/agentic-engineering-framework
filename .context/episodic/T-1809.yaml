# Decisions (from task file Decisions section)
decisions:
  - decision: "2026-05-13 — RE-DISPATCH block sits above the risk-policy preamble"
    chose: "Order is `[RE-DISPATCH] → [RISK POLICY] → body` when both are present. The Worker's eyes land on the operator's answer first."
    rationale: "The answer is to a question the Worker itself asked. The risk-policy preamble is generic governance shared by every dispatch on this workflow. Specific-just-asked beats generic-always-true."
    alternatives_rejected: ["Order `[RISK POLICY] → [RE-DISPATCH] → body` — would force the Worker to re-read the pause protocol before seeing the answer to its own question. Order `body → [RE-DISPATCH] → [RISK POLICY]` (appended) — top-of-prompt is the highest-attention position."]
  - decision: "2026-05-13 — pause_resolution carried via resolve()/assemble_prompt kwarg, not in workflow yaml"
    chose: "New optional kwargs `retry_of_dispatch_id` + `pause_resolution` on `resolve()` and `assemble_prompt()`. The workflow yaml stays unchanged."
    rationale: "Pause resolution is a per-dispatch instance fact, not a per-workflow contract. Putting it in workflow yaml would conflate the two and force schema changes the linter has no use for."
    alternatives_rejected: ["$PAUSE_RESOLUTION as a substitutable variable in the prompt template — would require every prompt template to know about pause and explicitly include `$PAUSE_RESOLUTION`. Centralizing in the Resolver lets every workflow get pause support for free."]
  - decision: "2026-05-13 — `--apply` flag NOT added; resolve always writes (except --dry-run)"
    chose: "`fw pause resolve` always writes a new dispatch row unless `--dry-run`. No `--apply` two-phase option."
    rationale: "Operators already had to type the answer; making them confirm with `--apply` adds friction for the common case (their answer IS the apply). Use `--dry-run` to preview."
    alternatives_rejected: ["Two-phase `resolve` (preview) + `apply` — slow, redundant given dry-run."]

