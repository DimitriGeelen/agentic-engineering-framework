# Key outcomes
outcomes:
  - "`lib/resolver.py:resolve()` accepts new optional kwargs `retry_of_dispatch_id: Optional[str]` and `pause_resolution: Optional[Dict[str, str]]` (with keys `question`, `answer`). When `pause_resolution` is set, `assemble_prompt` prepends a \"RE-DISPATCH — operator answered your pause\" block to the rendered output, BEFORE any risk-policy preamble. The block includes the original question, the operator's answer, and a directive to proceed with the answer as authoritative."
  - "`lib/resolver.py:capture_dispatch()` already accepts `extra` — `resolve()` threads `retry_of_dispatch_id` into `extra` so the new dispatches.jsonl row carries the link."
  - "`lib/pause_resolve.py` (new) exposes `resolve_pause(dispatch_id, answer, *, dry_run=False) -> Tuple[envelope, row]`. Reads the paused dispatch row from dispatches.jsonl, extracts task_id + task_type + original question (from terminal_event), calls `resolver.resolve()` with the retry/resolution fields populated, returns the new envelope+row."
  - "Error path: `resolve_pause` raises `PauseResolveError` (subclass of ValueError) when (a) dispatch_id not found, (b) the dispatch's outcome is not `paused`, (c) the dispatch is already resolved (a later row already has `retry_of_dispatch_id` matching)."
  - "CLI: `fw pause resolve <dispatch_id> --answer \"...\" [--dry-run]` calls `resolve_pause`. Prints the new dispatch_id + retry_of_dispatch_id link. With `--dry-run`, builds the envelope but does not write to dispatches.jsonl."
  - "CLI: `fw pause list` shows paused dispatches awaiting resolution (CLI parity with the Watchtower panel from T-1808; reuses `lib/dispatch_pause.list_paused_dispatches`)."
  - "Unit test (`tests/unit/test_pause_resolve.py`): happy path — synthetic paused row → `resolve_pause` returns new envelope with prepended RE-DISPATCH block; dispatches.jsonl gains a new row with `retry_of_dispatch_id` set; the new row's prompt block includes the answer text."
  - "Unit test: error paths — unknown dispatch_id → PauseResolveError; non-paused dispatch → PauseResolveError; already-resolved → PauseResolveError."
  - "Unit test (`tests/unit/test_resolver.py`): `assemble_prompt` with `pause_resolution` set → output starts with \"[RE-DISPATCH — operator answered your pause]\" block; block contains both question and answer text verbatim; risk-policy preamble (when `allow_pause: true`) still appears AFTER the re-dispatch block."
  - "Unit test: `assemble_prompt` with `pause_resolution=None` → no re-dispatch block (no regression on existing dispatches)."

