decisions:
  - decision: '2026-10-24 — where the "mention, not instance" strip rule lives'
    chose: 'a single implementation, `strip_quoted_spans()` in `lib/ac_placeholder.py`. `is_placeholder_item` applies it, and `lib/task-audit.sh` calls it once per file via `python3 lib/ac_placeholder.py --strip` (stdin to stdout, line-preserving). It falls back to the old single-backtick sed only when python3 is absent. The bash *pattern* regex stays as it is (case-sensitive, pinned by the existing parity test), so detection is not widened or narrowed apart from the quoting fix.'
    rationale: 'sharing the rule means the two readers cannot drift on quoting. One python spawn per audited file is cheap, and `audit_task_placeholders` runs at review/decide time, not inside a PreToolUse hook. That keeps intact the latency argument the module docstring makes for not folding the hook reader in.'
    alternatives_rejected: ['(a) a second strip implementation in bash/sed. sed -E has no backreference-with-lookaround for n-backtick runs, and lib/ has no perl, so it would mean a hand-rolled bash scanner kept in parity by tests only. (b) Moving the whole bash audit to Python. That widens bash to case-insensitive matching, a behaviour change beyond this bug.']

