decisions:
  - decision: '2026-09-07 — serialize refuses elided project values'
    chose: '`serialize()` raises `AddressError` when the project value contains the `…` elision marker, in addition to never producing the elided form itself.'
    rationale: 'Elision is lossy (D3 sub-rule) — a display string re-entering the wire would re-collapse two projects into one correspondent, the exact bug arc-020 exists to kill. Refusing at the serializer makes the display/wire boundary structural, not conventional.'
    alternatives_rejected: ['Passing the value through opaquely (grammar says "value opaque") — a real path containing `…` is pathological, and the false-negative risk (silent identity collapse) outweighs the false-positive one.']
  - decision: '2026-09-07 — segment order: parse any, serialize canonical'
    chose: '`parse()` accepts label=value segments in any order (labels are self-typing); `serialize()` always emits canonical order (host, hub, project, session, @agent). Round-trip is exact for canonical wire strings — all charter examples are canonical.'
    rationale: 'D3''s `segment*` grammar doesn''t mandate order, and sparse/query forms rely on self-typing labels; a single canonical emission keeps wire strings comparable as identity keys.'
    alternatives_rejected: ['Preserving input order through round-trip — would make two token-orderings of the same tuple serialize to different strings, breaking address-as-identity-key comparison.']

