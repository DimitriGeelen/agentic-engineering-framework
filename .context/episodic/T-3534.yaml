# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-09-28 — where identity lives, and how a fork differs from an instance'
    chose: 'an immutable id in `.framework.yaml`, minted once at `fw init`. Instances of a project (clones, checkouts, deployments) **share it by design**. Forking to a new project is a **separate verb**, sovereignty-gated. - **Operator ruling, verbatim:** *"Sometimes we also want to have different instances of a project and we definitely want the same id, right? Only if you fork it, then it should be a separate process. So I think to make that a separate verb makes perfect sense."* - **Why a verb and not `fw init --new-identity`:** a flag on `init` puts re-identification on the same code path as routine setup, where it is one typo away from firing. A separate verb makes the intent explicit at the call site and gives the `$CLAUDECODE=1` refusal somewhere to live. The framework has this shape already — `fw arc close` and `fw inception decide` are agent-refused for the same reason: they are decisions, not operations. - **Rejected — derive identity from the git remote URL:** fails on a fact about this repo, which has two remotes (OneDev `origin` plus a GitHub mirror), so there is no non-arbitrary answer to which is the identity. A remote migration would also change identity, which is the single thing identity must never do. Excludes local-only and non-git projects entirely. - **Rejected — make TermLink''s `project=` tag authoritative:** makes a core governance property depend on an explicitly optional tool (CLAUDE.md requires graceful degradation when TermLink is absent), and TermLink is deliberately machine-wide, the inverse of the per-project isolation this is meant to establish. Directive 4 violation.'
  - decision: '2026-09-28 — the id IS slot 3 of the five-part address (operator)'
    chose: '`project=<project-id>` replaces `project=<path>` in the V9 address. This task does not create a parallel identity concept — it supplies the stable token the ratified scheme was already reaching for. - **What it already is:** `host / hub / project / session / agent`, ratified twice (T-3287 D1–D7 GO 2026-09-07; D-599 on T-3433 2026-09-22) and BUILT — arc-020''s seven slices are all `work-completed`: `lib/aef_address.py` (V9 library with `climb()`/`ladder()`), `lib/aef_circuit.py`, `lib/aef_resolve.py`, plus election, governor, repo-source and provision audit. - **Why the path was always the weak slot, from the code itself:** `lib/aef_address.py` carries `elide_path()` for display, refuses the elided form in `serialize()`, and comments that otherwise *"the wire would re-collapse two projects into one correspondent"*. That entire mechanism exists because slot 3 is a path. An id makes display and wire the same string — nothing to elide, nothing to collapse — and stops every address leaking filesystem layout to every other host on the circuit. - **Why the instance case is safe:** two instances of one project on one host share the project id and are separated by the `session` token, which is what that slot is for. The operator made this point explicitly, and it is why sharing the id across instances costs nothing. - **Agent near-miss, recorded because it is the point:** this task was filed proposing a project identity with no reference to the five-part address at all. Had it been built as filed, the repo would have gained a SECOND project-identity notion beside a ratified, shipped one — the same five-readers-of-one-predicate defect that cost a day on arc membership, and that `lib/ac_placeholder.py` was written this morning to stop repeating. The operator caught it; no check would have.'

