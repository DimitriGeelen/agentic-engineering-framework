# Key outcomes
outcomes:
  - 'A failing bats case first: the guard refuses `bin/fw sidecar send --to x --body ''see: git log --oneline -1 -- "$f" in .tasks/active''`, because it tokenises the quoted body as commands (the bare single-quoted form already passed at HEAD; the bug reproduces with the apostrophe idioms, `$''…''` and escaped backticks in double quotes, which is what t4817 tests 1–3 pin; they fail on the pre-fix scanner)'
  - 'The guard tokenises at shell level first (respecting single and double quotes), so a quoted argument is data, never a command. A real write to a .tasks path in the same command line is still refused, and the T-2742 boundary (scripts and runtime-built paths out of scope) is unchanged'
