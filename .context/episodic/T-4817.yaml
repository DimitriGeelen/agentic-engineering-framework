# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-27 — how to decide a --body value is data'
    chose: 'lex the value word with the existing lexer (`_lex_spans`) and blank everything except the substitutions bash runs (delimiters kept). When such a substitution is kept, the "command names a guarded path" signal is still read from the unblanked command, so T-4499''s refusal of `--body "\`git log --output=$F\` .tasks/…"` stands.'
    rationale: 'the word''s meaning is set by the shell''s quoting rules, and the lexer already implements them. Any shape-based rule misses some quoting form, which is what happened to T-4499''s bare-`''…''` rule. Keeping the mention signal for live substitutions means no existing refusal gets weaker.'
    alternatives_rejected: ['(a) widen the shape match to more quote idioms: same class of bug, just with a longer list. (b) add `--body-file` to `fw sidecar send`: that is a workaround the sender must know about, and `fw sidecar` is outside this lane. (c) treat the whole word as data, double quotes included: bash really runs `$(…)` and unescaped backticks there, and the T-4499 tests pin that.']

