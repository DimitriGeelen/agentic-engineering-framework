# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-09-22 — `verb_for` takes the failure class, not just the rung'
    chose: '`verb_for(rung, *, posted=True)`. The single-argument call the AC names returns the escalation mapping (repost, repost, nudge×3, operator×3, deadletter); `posted=False` returns `repost` on every rung.'
    rationale: 'D-600 defines two classes with different verbs, but the AC specifies a one-argument signature. A keyword with the AC''s mapping as its default satisfies both: the documented call is exactly what the AC says, and the second class is expressible without a parallel function.'
    alternatives_rejected: ['deciding the class inside the sweep and never telling the library — that puts half the ruling in a consumer, where the next consumer has to rederive it.']
  - decision: '2026-09-22 — `rung` looks backward, `next_retry_at` looks forward'
    chose: 'the row''s `rung` names the rung THIS attempt was made on; the next rung is derived (`rung_for(attempts)`) rather than stored.'
    rationale: 'the first cut stored the NEXT rung, which made the row read as a lie in forensics ("attempt 2, rung 1" when attempt 2 was on rung 0) and gave two places to disagree about where a message is going. One stored fact, one derived.'
    alternatives_rejected: ['storing both. Two fields that must agree are two fields that can''t.']
  - decision: '2026-09-22 — the sweep reads replies with a peek, never a drain'
    chose: 'reply detection walks our own inbox topic from cursor 0 and never writes the cursor; one hub read per sweep, results cached as a conversation set.'
    rationale: '`fw sidecar inbox` owns that cursor. A cron job that consumed an agent''s unread consults in order to decide whether to retry would be worse than the bug.'
    alternatives_rejected: ['a per-message `channel subscribe --conversation-id` (one hub call per open row — 27 calls on the live ledger''s first tick).']
  - decision: '2026-09-22 — pickup keeps its own dedupe; the gap is filed, not patched'
    chose: 'record pickup''s existing SHA256 + 7-day-cooldown dedupe and file OBS-472 for the cooldown-vs-ladder-span mismatch.'
    rationale: 'pickup is not a ladder producer today, so there is no live defect; and widening the cooldown changes what pickup *means* (a concern re-raised after a week is currently a new signal, deliberately). That is the operator''s call.'
    alternatives_rejected: ['adding a second id-keyed seen-set beside the hash one — two dedupe mechanisms on one path drift, and neither owner knows which fired.']
  - decision: '2026-09-22 — the ladder does not adopt pre-T-3434 deliveries'
    chose: 'a row with no `attempts` field in a posted state is closed; the same row still `STORED` joins at rung 0.'
    rationale: 'measured, not theorised — the first live sweep claimed 27 of 34 rows. Escalating conversations that finished weeks ago is noise the operator pays for. A never-delivered row is the opposite case: that is what the ladder is for.'
    alternatives_rejected: ['an age cap (picks an arbitrary number and still adopts recent history); a ledger migration (rewrites an append-only file).']

