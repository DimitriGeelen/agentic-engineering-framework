# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-15 — single-instance guard: process table, not a lock file'
    chose: '`lifecycle.live_receiver_pids(agent)` reads `/proc/*/cmdline` for live `http_server.py --agent <id>` processes from ANY framework copy. `http_server.serve`, `_start_receiver` and the `receiver start` path all refuse while one exists (exit 3 / rc 1).'
    rationale: 'the 055 duplicate was a vendored copy (old code) plus AEF''s copy. An old copy cannot be made to honour a new lock file, but its process is always visible. The triple file is per project and was overwritten by whichever started last, so it could not see the other either.'
    alternatives_rejected: ['`flock` on a lock file under the project `.context/sidecar` (the old copy ignores it); the host registry `<agent>.json` (stale after a crash, and written only by a receiver that got past bind); killing the other process (process cleanup on other projects is the operator''s call, per the task). - **Known limit:** two starts that race can both see each other and both refuse. That fails closed (no duplicate); the next ensure cron succeeds. Linux `/proc` only.']
  - decision: '2026-10-15 — launcher rule: vendored first, then own bin/fw with FRAMEWORK.md'
    chose: '`watcher.project_launcher(root)`: `<root>/.agentic-framework/bin/fw` if present, else `<root>/bin/fw` when `FRAMEWORK.md` is also present, else None. None is reported ("not started"), never started with AEF code. The child env drops `FRAMEWORK_ROOT`.'
    alternatives_rejected: ['keep running AEF''s `sidecar_cli.py` with `PROJECT_ROOT` set (the bug itself: AEF code ran in every project).']
  - decision: '2026-10-15 — ensure keeps the receiver config''s inject value'
    chose: '`_ensure_no_inject(cfg)`: when `receiver/config.json` exists it is the setting in force; the enabled file''s flag decides only when no config exists yet.'
    alternatives_rejected: ['rewriting config from the enabled file (what ensure did): any enabled-file value that disagrees with the operator''s `--no-inject` flips it. I could not reproduce how 050''s config became `inject:false` from code reading alone; the test pins that ensure does not change it.']

