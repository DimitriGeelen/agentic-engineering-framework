# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-17 — which words the read pass judges'
    chose: 'Judge a dequoted word as a path only when it is absolute, `~`/`$HOME`-led, the value of an `--opt=VALUE` option, or relative with a `..` component (resolved against the cd-tracked cwd). Use normpath, not realpath.'
    rationale: 'A quoted message is one word that does not start with `/`, so commit messages and echo prose stay SAFE. A relative word with no `..` stays under the cwd, so sed scripts and regexes cost nothing. normpath keeps Pattern 4''s name-based judgement and does not newly block in-project symlinks that point outside.'
    alternatives_rejected: ['(a) Dropping `_strip_quoted` from Pattern 4. That would re-open every T-1361 false positive on prose. (b) Blocking any command that contains a `$(...)`. The bodies are scanned as commands instead, which is just as conservative for paths and far less noisy. Accepted cost: a word that IS an outside path now blocks even when quoted as data (`echo "/root/x"`), the same as its unquoted spelling always did.']

