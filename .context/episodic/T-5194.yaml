# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-11-16 — independent review (AMBER) and what changed'
  - decision: '2026-11-16 — what counts as "a line that concerns a task"'
    chose: 'a line names every `T-NNNN` in it AND every task another ledger line ties to one of its ids (`id`/`dispatch_id`/`run_id`/`verdict_id`). Global (invalidates all): lines naming no task, torn or unterminated lines, a row id repeated within a file, and any non-append change to a file (prefix hash mismatch) or a file that disappears. If the files move while being read, or the stamp does not match the files, the key falls back to the whole stamp (pre-T-5194 behaviour).'
    rationale: 'verdict_ledger looks completions up by dispatch id, not task id, and refuses the WHOLE ledger on a duplicated, modified or deleted row — so those cannot be attributed to one task. Over-attribution only costs a recompute; under-attribution could serve a stale READY.'
    alternatives_rejected: ['regex-only attribution (`"T-NNNN"`, as `_recent_ledger_task_ids` uses) — misses a completion row tied to a task only through its dispatch id.']

