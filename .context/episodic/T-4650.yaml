# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-22 — how a glob is admitted for sed'
    chose: 'opt-in `option_words(globs=True)` returning kind `G` only for a glob word whose first character is a literal other than `-` (so no expansion can be an option). sed refuses a G as the script or as an -e/--expression value, and admits G FILE operands only when every script line is print-only (`ADDR[,ADDR]p`, ADDR = N, `$` or `/re/`) and no operand is a bare sed command letter (w W e r R), so `sed -n 1p d/*.md w out` stays refused.'
    rationale: 'a leading wildcard (`sed -n 1p *.md`) can expand to a file named `-i` and GNU sed permutes options, so that form stays refused; the reported shapes (`docs/T-037-*.md`, `.tasks/completed/T-166-*.md`) all begin with a literal.'
    alternatives_rejected: ['dropping the glob refusal in option_words globally (it also feeds find/curl/git/sort/uniq checks where a glob may sit in an option or output position).']
  - decision: '2026-10-22 — glob-in-FILE for cat/head/tail/grep/wc'
    chose: 'no change. Measured before the fix: `cat docs/*.md`, `head -5 docs/*.md`, `tail -3 docs/T-?.md`, `grep -n foo docs/*.md`, `wc -l docs/*.md` already return safe — those arms never call option_words. sort/uniq stay refused with globs (sort -o and uniq''s second operand are output positions; out of this task''s scope).'
    rationale: 'the over-block was specific to the sed (and sort/uniq) option-word checks.'
  - decision: '2026-10-22 — adb not added'
    chose: 'do NOT allowlist adb (`adb devices -l`, `adb shell pm list packages` suggested by the reporter).'
    rationale: '`adb shell` runs an arbitrary command on the device, and other adb verbs (install, push, reboot, root, uninstall) change device state; a verb-scoped split would have to parse the remote shell command line, which the gate cannot prove read-only. Under a task the gate does not block it anyway.'
    alternatives_rejected: ['allowlisting `adb devices` alone — low value, and adds a tool family to the list that invites widening.']

