# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-28 — where the timeout record comes from'
    chose: 'the watchdog (a separate subshell, never the interrupted process) writes the record from a marker the body rewrites at each `section_mark` (`.context/audits/.audit-inflight.<body pid>`: name + start SECONDS, one printf). Order: write `.fired` + record, TERM, up to 5 s grace (`_FW_AUDIT_KILL_GRACE`), then STOP the body, KILL its whole descendant tree and the body, wait (bounded 10 s), re-assert the record. Every later writer (`_audit_write_timing_yaml`, `_audit_record_section_run`) reads `.fired` and cannot write `timed_out: false` for the killed run/section. Tmp files are pid-suffixed so the two writers never share one. The holder maps a KILLed body (137 + `.fired`) to 124 and removes the marker however the body exits; the body''s EXIT trap is left unchanged (t3298 pins it).'
    rationale: 'no rewording of the trap fixes the bash 5.2 parser bug (Context); only a writer outside the interrupted process does. The marker costs one small file write per section (~28 per full run).'
    alternatives_rejected: ['a trap function (only lowers the rate, per Context); killing the process group (the body shares its group with the holder and the caller).']
  - decision: '2026-10-28 — timeouts outside any section'
    chose: 'when no section is in flight, the watchdog records `killed_in_section: "(startup)"` (before the first section) or `"(summary)"` (after the last), in `last_run:` only, never in `section_runs:`.'
    rationale: 'the first post-fix stress loop still failed 3/80 the same way (`[ -f "$TIMING_FILE" ]`). Measured: at load avg ~83 the first section starts 3.0–4.1 s after launch, so t3127''s 3 s ceiling fired before any section, and neither writer had a section to name. The task''s need is that a timed-out audit *always* leaves its record.'
    alternatives_rejected: ['raising t3127''s ceiling (hides the gap; the record would still be missing for a real startup timeout).']
  - decision: '2026-10-28 — stress evidence (AC3)'

