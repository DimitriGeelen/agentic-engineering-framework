  - 'Regression test (tests/unit/t3918_terminator_handover.bats or a new t4032 file) with a stub claude child: a fresh signal while the flag says busy does NOT kill within the grace; flag idle after the signal -> killed (after handover); never idle -> killed at the ceiling. The not-killed-while-busy case fails on the pre-fix wrapper.'
