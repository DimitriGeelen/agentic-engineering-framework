    chose: 'keep the text, wrap it in a `<span class="file-ref-dead|ambiguous|unserved" title="…">` (wavy underline, ✗ / ? suffix, help cursor), CSS in a new web/static/css/file-refs.css linked from base.html and the standalone review.html.'
    rationale: 'the operator''s complaint is refs that look fine and aren''t; a titled span says why (not found / N candidates / outside the viewer allowlist) without inventing a link.'
    alternatives_rejected: ['linking dead refs to /file anyway (a 404 click is worse than a visible mark); marking inside `<pre>` code blocks (pasted logs would drown in marks — only live links are added there).']
  - decision: '2026-09-30 — line anchors on /file'
    chose: 'Pygments `HtmlFormatter(linespans="L")` rewritten to `id="LNNN"`, with CSS counters for line numbers and a `:target` highlight.'
    rationale: 'Pygments splits multi-line tokens per line itself; splitting highlight.js output would break spans across lines. Its `<pre>` has no `<code>`, so highlight.js leaves it alone.'
    alternatives_rejected: ['client-side JS wrapping after highlight.js (fragile, anchor unavailable until JS runs). Markdown files are rendered as Markdown and have no line anchors — `x.md:NN` links land at the top of the document.']
