# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-09-22 — the address is hub-anchored; the host rides in metadata'
    chose: 'topic addresses start at the hub (`<hub>/<project>[/…]`). The host appears only in the `//`-marked full form used for `metadata.from_circuit`.'
    rationale: 'a topic is an object on a hub, and the one peer we actually consult (010-termlink) is on a different host on the same hub. An address containing our fqdn is underivable by them and asserts a level we do not have.'
    alternatives_rejected: ['host-first 5-segment addresses (`//` unnecessary, ladder literal) — they make the durable role address underivable by a peer, which is the one job that address has. Also rejected: dropping the host from the model entirely — it is a real level and `parse_circuit` must be able to report it.']
  - decision: '2026-09-22 — `//` marks the host rather than a label or a segment count'
    chose: 'RFC 3986 authority marker; `parse_circuit` keys on it.'
    rationale: 'the forms are positional and two of them are three segments (`host/hub/project` vs `hub/project/agent`), so counting cannot disambiguate.'
    alternatives_rejected: ['T-3287''s V9 `label=value::` grammar — correct, and heavier than this seam needs; the ruling''s concrete forms are slash-separated. Also rejected: always emitting five segments with blanks — that invents levels.']
  - decision: '2026-09-22 — `session == agent` collapses to the 3-form'
    chose: 'emit `<hub>/<project>/<agent>` when the session key and the agent id are the same string (every dispatched worker).'
    rationale: 'it makes sender-derived and receiver-derived addresses identical, with no shared state. Proven live in run `f12fa93d`.'
    alternatives_rejected: ['emitting the name twice (honest, but a peer holding the worker''s name cannot reproduce it); changing the stanza to mint a separate session id (AC4 requires the stanza unchanged, and a second naming scheme is the thing T-3407 removed).']
  - decision: '2026-09-22 — a bare `--to` is classified by `is_project_id`, with an override'
    chose: 'three signals (it is us / a sibling project dir with `.framework.yaml` / the fleet''s `NNN-Name` numbering), plus `fw sidecar send --level project|agent` to override, plus verbatim use of any `--to` containing `/`.'
    rationale: 'the peer projects we address are not local directories (`010-termlink` is at `/opt/termlink` on another host), so a filesystem lookup alone cannot classify them; the numbering convention covers the fleet and no agent name in this corpus matches it.'
    alternatives_rejected: ['a live `termlink list` lookup (makes `topic_for` impure, slow and untestable); requiring an explicit flag always (breaks every existing caller, including the e2e harness).']
  - decision: '2026-09-22 — the binding vendor check is scoped to this task''s files'
    chose: '`## Verification` asserts that each of the six sidecar files is byte-identical to its vendored copy, rather than running the global `bin/fw vendor self --check`.'
    rationale: 'the global check also covers `lib/bus.sh` and `lib/dispatch.sh`, which the concurrent T-3434 worker holds uncommitted; the self-vendor guard withholds them by design ("withholding uncommitted file(s) not named by this caller"), so the global check reports DRIFT for another task''s in-flight work. A line whose colour depends on a second task''s working tree is exactly the mutable-corpus anchor T-3326 forbids. The global check was still run by hand and its state is reported in the handback.'
    alternatives_rejected: ['`FW_VENDOR_ALL=1` (ships another task''s unfinished work to consumers under my commit — the precise hazard the guard exists to stop); waiting on T-3434 (couples two independent closes).']

