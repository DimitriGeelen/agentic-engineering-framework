# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-27 — how to stop set from rewriting other lines'
    chose: 'edit flat (top-level) keys line by line: replace the key line plus its continuation lines (indented, blank, or top-level `- ` items; trailing blank/comment lines left in place), or append one line. The value is rendered with `yaml.safe_dump({key: value})` so quoting is correct. Dotted keys keep the ruamel round-trip.'
    rationale: 'every key `fw config set` writes in practice is flat; a line edit is the only way to promise byte-identical other lines. safe_dump quotes only what needs it, and the result reads back through both the grep reader in `lib/config.sh` and `yaml.safe_load`.'
    alternatives_rejected: ['tuning ruamel (it cannot round-trip a wrapped plain scalar); rewriting nested keys line-wise too (needs a YAML-aware editor; the nested path is rare and was not reported).']
  - decision: '2026-10-27 — parent review: heal-on-write is gone (accepted; reader fix is T-4849)'
    chose: 'keep the line-wise edit (832''s need: set changes only its own key) and fix the reader instead, as its own task, so a folded value reads correctly however it got there. The parent also updated `tests/unit/t3735_config_set_no_fold.bats` test 2, which asserted the fallback dumper''s warning on a flat key: it now drives the fallback through a dotted key and still checks the long value on a flat set.'
  - decision: '2026-10-27 — inline comment on the replaced key line'
    chose: 'drop it; the whole key line is replaced.'
    rationale: 'the grep reader in `lib/config.sh` `_fw_config_file_val` does not strip `# comment`, so a kept comment would be read as part of the value (`3009 # c`). Replacing the line means `fw_config` reads what was set.'

