# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-08-29 — two modes, because the question has a cheap half and an honest half'
    chose: 'a static shape scan cheap enough for `fw test lint`, plus a `--tap` mode that reports what a real run actually skipped.'
    rationale: 'the honest answer to "is this skip dangerous" is empirical — does its guard hold on the host the suite ships on — and that needs a run. But a check that needs a full bats run will not survive on the lint pass, and one that never runs protects nothing. The static half catches the shapes that cannot be anything but blind; the empirical half catches the rest when a run happens.'
    alternatives_rejected: ['static only (cannot see a guard hidden in a helper); TAP only (nothing would run it by default, which is the failure being fixed).']
  - decision: '2026-08-29 — flag two shapes, not ten'
    chose: 'UNCONDITIONAL and STANDING only. Everything else — 223 of 223 call sites after the fix — is left alone by the static mode.'
    rationale: 'most skips in this corpus are correct. A detector that reddens an absent optional dependency gets suppressed wholesale, and then it protects nothing at all. Six of the seventeen test legs exist to hold that line.'
    alternatives_rejected: ['classifying by the skip''s REASON TEXT in static mode. It is prose, it is gameable, and it would have flagged legitimate skips whose author worded them tersely. Reason text IS used in `--tap` mode, where the guard is not available — and there it is deliberately generous, because mislabelling a missing dependency as a defect is the expensive error.']
  - decision: '2026-08-29 — fix the one finding rather than ship a lint that fails'
    chose: 'repair `lib_preflight.bats:76` in this task, using T-3213''s pattern (deny with a path that does not exist, which `[ -w ]` reports false for root).'
    rationale: 'wiring a detector into `fw test lint` while it reports a finding trains everyone to read that section as noise on its first day.'
    alternatives_rejected: ['an allowlist entry for it. The finding was real and the fix was four lines; suppressing it would have been the first entry in exactly the mechanism that makes such tools useless.']

