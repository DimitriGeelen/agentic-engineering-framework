decisions:
  - decision: '2026-10-26 — which discarded roots get the note, and how hooks stay silent'
    chose: 'note only when the inherited root is not a project (missing dir under a hook context, or a dir with no `.framework.yaml`/`.tasks`) and is not the home directory; skip it entirely under `fw hook NAME`. No new env/config key.'
    rationale: 'the `$HOME` (and passwd-home) case is T-2391''s daemon poison, carried by every tmux-spawned shell; a note there would print on every command. Hooks run on every tool call and their stderr is surfaced to the agent, so a note there is noise, and the session''s root is already `CLAUDE_PROJECT_DIR`. The note is printed before any re-exec, and the re-exec inherits the resolved (valid) root, so it cannot repeat.'
    alternatives_rejected: ['a `FW_*` quiet switch (a new config key needs registry + Watchtower config parity for a case no caller has asked for); noting the `$HOME` case too (spam).']

