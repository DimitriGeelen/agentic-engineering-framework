# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-09-22 — A handler always outranks a declarative spec'
    chose: 'dispatch order handler → alias → spec → unscored, so a hand-written handler wins whenever both exist for the same driver.'
    rationale: 'a handler is the richer mechanism (it can read arbitrary structure); a policy-file edit must not be able to silently displace framework code. The losing case is loud rather than silent — `--explain` says which source scored.'
    alternatives_rejected: ['spec-wins (a policy edit becomes a code override with no review); error-on-both (punishes a project for documenting an axis the framework already handles).']
  - decision: '2026-09-22 — The worked example ships inert, under a comment'
    chose: '`policy/value-drivers.yaml` carries `F-EXAMPLE` commented out, and the copyable spec lives in `policy/driver-scoring-example.yaml`.'
    rationale: 'every currently-active free driver already has a handler, so by the decision above a live spec attached to one would never fire — shipping it live would be a worked example that demonstrably does nothing. The AC explicitly allows "a new example under a comment".'
    alternatives_rejected: ['attaching a spec to F-RECALL (inert for the same reason, but misleadingly live-looking).']
  - decision: '2026-09-22 — `strip_template` defaults to true'
    chose: 'template stripping on by default; opt out per spec.'
    rationale: 'the 1409-sprind trap is the expensive failure and it is silent — a keyword drawn from template prose matches the whole corpus uniformly and ranks nothing, while looking like a working driver. Measured here: "committed fixture" scores 4 unstripped and 0 stripped on a task that only contains it as template guidance.'
    alternatives_rejected: ['default false (fails open into the exact trap the spec names).']
  - decision: '2026-09-22 — `--validate-scoring` exits 2, not 1, on an invalid spec'
    chose: 'exit 2 for a spec that parses but fails validation.'
    rationale: 'keeps "file missing/unreadable" (1) distinct from "file is not a valid spec" (2), so a Verification line can tell an authoring error from a typo''d path.'
  - decision: '2026-09-22 — the design report is not fabric-registered'
    chose: 'fabric cards for `lib/bvp-scorability.sh`, `policy/driver-scoring-example.yaml` and the test file; none for `docs/reports/T-3428-declarative-scoring.md`.'
    rationale: 'report registration is the clear exception in this corpus — 17 of 728 files under `docs/reports/` carry a card, and no recent sibling (T-3427, T-3426, T-3398, T-3203) registered one. Following the convention beats following the literal word "new files".'

