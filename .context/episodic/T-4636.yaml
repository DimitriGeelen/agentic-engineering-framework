# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-22 — where to put the scope'
    chose: 'scope the launcher (claude-fw re-execs itself; `termlink spawn` runs under the prefix), so a tmux server they START is born in agentic.slice and every claude/worker under it follows.'
    rationale: 'the tmux server is the parent of every pty; a worker moved alone into a scope still dies of SIGHUP when its server is killed.'
    alternatives_rejected: ['scoping only run.sh inside the pane (SIGHUP from the dead server still kills it); moving an existing server''s pid between cgroups (writes to cgroup.procs, fragile).']

