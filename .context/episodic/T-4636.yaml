# Key outcomes
outcomes:
  - '`lib/agent-scope.sh` provides `fw_agent_scope_prefix`: on a host where `systemd-run --scope --slice=agentic.slice` works it yields that prefix; a process launched through it reports a cgroup under `/agentic.slice/` and not in any `session-*.scope` (real systemd test on this host)'
  - 'Fallback: with systemd absent, systemd-run refusing, or `FW_AGENT_SCOPE=0`, the prefix is empty, the launch proceeds unchanged, and the fallback reason is logged once (stderr + `.context/working/agent-scope.log`), silent on the next call for the same reason'
