  - '`bin/claude-fw` re-execs itself once through the prefix before the tmux wrap (so a tmux server it starts, and claude, live in agentic.slice); a re-exec at the restart boundary does not re-scope'
  - '`fw termlink spawn` (and so `fw termlink dispatch`) runs `termlink spawn` through the prefix, so a tmux server it starts lives in agentic.slice'
  - 'Regression bats `tests/unit/t4636_agent_scope.bats` green; existing claude-fw and termlink spawn tests still green'

