# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-01 — how to make the nightly fit its budget'
    chose: 'every test file is its own job in a parallel pool (`xargs -P`, default nproc/2 capped at 12 = 12 here), each with its own `timeout` (default 900s). Files go longest-first using the previous report''s `file_durations`. The two-leg reserve split (T-3359) is kept. - **Why (measured):** serial bats time on the live run adds up to **16,646s** (sum of per-file durations, host load 33–77 on 24 cores). The old single `bats tests/unit` process had a 5,400s cap and reached 3,599 of 6,118 bats tests (59%). Sharding by hand would not close a 3× gap, and a per-file cap alone leaves serial time far over budget. Distribution: 484 files <10s, 159 <60s, 34 <180s, 16 ≥180s. The top two (`audit.bats`, `t2332_bvp_propose_queue.bats`) hit the 900s cap and are named as timed out. pytest: 1,486s serial, and its slowest file is `test_orchestrator_status_terminal_events.py` at 307s.'
    alternatives_rejected: ['raising FW_UNIT_SUITE_TIMEOUT (OBS-392 already rejected it; 16.6ks serial doesn''t fit a nightly), and a serial per-file runner (fixes attribution, not duration). - **Wall time:** before = >7,200s budget, never completed (23/23 nightlies bats_rc=124; last run killed after the bats leg''s 5,400s cap, total 5,797s with 59% of bats reached). After = **2,180s**, complete: 939 of 941 files, 9,775 tests, 2 files named as per-file timeouts. That is 30% of the 7,200s budget, measured under heavy contention from concurrent workers.']
  - decision: '2026-10-01 — a recorded failure from a partial run is a verdict'
    chose: 'FAIL on every recorded failure, whether or not the run completed. WARN "COULD NOT DETERMINE" only when nothing was recorded red and part of the corpus did not run. The line names "N of M file(s) ran" and the per-file timeouts.'
    rationale: 'measured, `timeout 3 bats --tap` on a file whose second test sleeps prints `ok 1` and nothing for the killed test. A timeout kill leaves no `not ok` line, so OBS-392''s "casualty list" premise did not hold. The one exception is a runner that kills bats processes one by one, which makes bats'' formatter print `not ok` for the in-flight test. The signal trap therefore stops the pool through each `timeout` wrapper instead, and a pinned test asserts this.'
    alternatives_rejected: ['re-running every red file in isolation to confirm it. Measured: 19 of 20 sampled new bats reds are also red alone. Re-running the pytest leg with the same 12-way parallel shape reproduces only the 2 known reds, so parallelism did not produce false reds.']
  - decision: '2026-10-01 — two latent blind spots closed on the way'
