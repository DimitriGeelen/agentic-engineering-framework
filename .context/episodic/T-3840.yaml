# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-04 — where the one ledger lives, and the re-surface bound'
    chose: 'a new `shown` table in the existing `.context/sidecar/inbox-state.json`, owned by `lib/sidecar/seen.py`, written under a flock by both the receiver hook and `fw sidecar inbox`. Every row is keyed under every id the message has: the receiver file id, the envelope `client_msg_id`/`msg_id`, and the base of each (`-nudge-N` stripped). Sender is never part of the key, so "unknown"/rescued mail is covered. "Answered" is derived only from what WE sent: receipts-sent REPLIED rows, outbox `in_reply_to`, and direct-ledger `in_reply_to`. - **Safety bound (stated):** never-shown mail always surfaces. A message shown once may surface ONE more time, and only when that showing is not proof of delivery: it was a non-draining `--peek`, or the finalizer''s last outcome for it is `HANDOVER_UNCONFIRMED` (hook killed, output discarded). After two showings it is never surfaced by the hook or the inbox again. It stays in the waiting register (`fw sidecar waiting`) and its escalation path. Answered mail is never surfaced, whatever its count. - **Frame cap:** the hook frame is held to 8000 chars, under the measured ~10 KB persist limit. Messages that do not fit are not marked shown; they surface at the next prompt, urgent first, then oldest first. One oversized message is always shown, with its body shortened to fit.'
    rationale: 'the inbox''s `seen` list is drained by the watcher, so it records transport progress, not delivery to the agent. Reusing it would have hidden every watcher-ingested message from the hook.'
    alternatives_rejected: ['(a) reusing `seen` as-is — wrong semantics, see above; (b) a second state file — that would recreate the two-ledger split this task removes; (c) following the `<persisted-output>` file path as HANDED_OVER evidence — the model only received the preview, so that would certify mail it never read. - **Test change:** `test_attachment_from_an_earlier_attempt_does_not_certify_a_later_one` now records the `HANDOVER_UNCONFIRMED` event that, in production, is what declares an attempt lost. Removing the marker alone no longer licenses a re-surface.']

