decisions:
  - decision: '2026-08-26 — ordering against T-3172 and T-3176'
    chose: 'land T-3172 first (dialect membership), then T-3176 (unset reporting class), then this task (dialect *reachability*). All three edit the same `unknown_auth` reporting region and the same `AUTHORITY_*` constants.'
    rationale: 'the three answer different questions and must not be conflated. T-3172 changes WHICH values are in the dialect; T-3176 adds a class that is deliberately NOT in the dialect; this task changes WHETHER the dialect is consulted at all. Landing reachability first would have made the check reachable while still holding the wrong set — a lane laned `external` would have been loudly accused on more surfaces, not fewer. Each of the three has fixture assertions the other two must not revert; `test_lifted_check_does_not_disturb_the_t3172_external_case` pins that explicitly.'
    alternatives_rejected: ['one combined fix. It would have produced a single diff in which the wrong-owner defect, the wording defect and the reachability defect were indistinguishable, and no mutation could have isolated any of them.']
  - decision: '2026-08-26 — the lifted check fires ONLY on genuinely out-of-vocabulary values'
    chose: 'dialect-valid values and the `none` unset sentinel stay silent on a lane with no task nodes. Only a value in no vocabulary at all is reported there.'
    rationale: 'the two existing messages both explain something that HAPPENED — an owner fallback, or a dropped node. On a lane that emitted nothing there is no fallback to explain, so firing would say nothing and would fire on essentially every untouched events-only lane. That is the always-fires noise (L-527) the T-2717 split was built to remove, and rebuilding it here would have undone that work sideways.'
    alternatives_rejected: ['reporting every lane whose authority is not in `AUTHORITY_OWNER`. Mutation-tested: 7 tests go red, including three that predate this task.']

