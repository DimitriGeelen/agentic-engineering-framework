# Summary (auto-generated from git commit messages)
summary: |
  Inbound correction from 001-CashWeb-Lightspeed-Ecwid-integration (2026-08-26, follow-up to their G-055 / our G-091). They narrowed their own repro and withdrew a prediction; measuring the narrowed form at HEAD surfaced a DISTINCT defect they did not claim. tools/bpmn_to_tasks.py collects lane-authority folds INSIDE the task-node loop, which continues at :424 on every node whose tag is not in TASK_TAGS (:51 = userTask/serviceTask/scriptTask). unknown_auth is populated at :481, downstream of that guard, and the dialect WARNs at :501-521 are emitted from unknown_auth alone. Consequence: a lane whose flowNodeRefs are all events or gateways never reaches the check, so its <aef:laneMeta authority> is never read and never validated. This is not only the external case (T-3172) - it swallows GENUINE typos. Measured at HEAD on a two-lane fixture whose second lane holds only intermediateCatchEvents: authority="external" -> rc 0, zero warnings; the same fixture with authority="overlrd" (an unambiguous misspelling, in no vocabulary) -> rc 0, zero warnings. The typo-suspecting else-branch that exists precisely to catch that value is unreachable. Distinct from T-3172, which fixes WHICH values the dialect contains; this fixes WHETHER the dialect is consulted at all.

