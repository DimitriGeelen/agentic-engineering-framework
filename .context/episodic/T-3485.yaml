# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-09-26 — value-axis equality mechanism'
    chose: 'withhold a verdict (`QUAD_VALUE_WITHHELD = ''v-thin''`) for tasks whose `bvp_norm` equals a *degenerate* median, where degenerate is defined as `median(bvp_vals) == min(bvp_vals)`. Mathematically this can only be true when at least `ceil(n/2)` values are tied at the floor, so the guard fires exactly on the shape the reported symptom describes and is provably inert otherwise. Implemented as an added `degenerate=False` kwarg on `quadrant()` (backward compatible — every existing call site not touched by this task keeps prior behaviour byte-for-byte) plus a one-line `value_axis_degenerate()` helper and an observability NOTE mirroring the existing cost-unknown disclosure block (T-3068''s pattern), so a shrinking hv-lc count reads as "withheld", not "vanished".'
    rationale: 'the prompt''s own framing is correct — the real question is not which side of the boundary ties fall on, it is whether a median sitting on a mass of ties can support a verdict at all. Withholding answers that question honestly. It also composes cleanly with the two required negative controls: a task AT the degenerate median is excluded from hv (Direction 1); a task clearly ABOVE the degenerate median is untouched by the guard and still reads hv normally (Direction 2, since the guard only fires on `bvp_norm == bvp_median`, not on the whole `<=`/`>=` split). - **Rejected — naive `bvp_norm >= bvp_median` → `bvp_norm > bvp_median`:** on the exact measured shape (median 0.00, 13/25 at 0.00) this only moves the same tied mass from `hv` to `lv` — nothing becomes newly distinguishable, the verdict for the tied mass is still invented, just on the other side. `tests/unit/test_bvp_quadrant_value_axis.py::test_naive_flip_to_strict_greater_would_fail_admission` demonstrates directly that `>` would ALSO wrongly exclude a genuine, non-degenerate at-median tie (D1 scores 1,2,2,4 — the two 2s legitimately belong in hv under inclusive comparison; only a *degenerate* median disqualifies a tie, not every tie). - **Rejected — extending an existing `basis_ok`/`QUAD_WITHHELD` guard, as the dispatch prompt suggested:** verified by grep across `lib/bvp.sh`, `web/blueprints/bvp.py`, and `.context/concerns.yaml` — no `basis_ok`, `QUAD_WITHHELD`, or `G-002` symbol exists anywhere in this repository. The prompt''s code sample ("this same function already knows how to say ''I cannot judge this''") does not match `quadrant()` as it actually reads (confirmed both by direct read and by the fact the described line number, "around line 303", is ~40 lines off from the real function at line 265). The *concept* (a withheld-verdict return distinct from ''-'') was worth keeping; the claim that it already existed was not — this is filed fresh as `QUAD_VALUE_WITHHELD`, not an extension. - **Rejected — a hard "zero value is never hv" floor rule (the prompt''s alternative suggestion):** narrower than the actual defect. The measured degeneracy is about the MEDIAN collapsing onto the floor, not about the literal value 0. A corpus where 60% of tasks tie at a nonzero floor (e.g. every task scored exactly 1) manufactures the identical problem and a zero-only floor rule would miss it entirely. The chosen mechanism (compare median to floor, not value to zero) generalises correctly; the floor-only rule does not.'
  - decision: '2026-09-26 — cost-axis and `lib/resolver.py` scope boundary'
    chose: 'do not touch `cost <= cost_median` (same equality shape, `lib/bvp.sh`) or `lib/resolver.py`''s independent duplicate of the value-axis defect. Both reported below (## Recommendation), neither fixed here.'
    rationale: 'explicit dispatch-prompt scope boundary — "Report, do not fix: the cost axis" — and `lib/resolver.py` was never named in the authorization at all. Widening scope on a narrowly-authorized repair is the exact failure mode the prompt is structured to prevent (the requesting agent declined to make this change itself specifically because it decides how agents'' own work is ranked).'

