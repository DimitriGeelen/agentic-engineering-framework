summary: |
  fw focus' exits with 'Unknown command: focus / Run fw help for usage' (bin/fw:8411). The real verb is 'fw context focus'. CLAUDE.md, the handover template and the session-start protocol all say 'Set focus: fw context focus T-XXX', so 'fw focus' is the obvious shortening and a new user or agent reaches for it immediately. The unknown-command handler prints no suggestion, so the reader has no path from the wrong guess to the right verb short of reading all of fw help. Reported live by the operator from a fresh install alongside the work-on failure. Fix: route 'fw focus' to 'fw context focus', and/or emit a nearest-verb suggestion on unknown commands.

# Key outcomes
outcomes:
  - '`fw focus T-XXX` sets focus, with behaviour identical to `fw context focus T-XXX` (same output, same exit code, same focus.yaml result)'
  - '`fw focus` with no argument does not silently succeed — it reports current focus or prints usage, never a false-success'
  - 'The alias routes through the existing `context` dispatch rather than duplicating focus logic, so the two verbs cannot drift'
  - '`fw help` lists `focus` so the verb is discoverable without already knowing it'
  - 'A bats test pins the alias, including a negative control proving the assertion can fail'
