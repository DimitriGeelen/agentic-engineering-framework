# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-05-16 — explicit `fw arc start` verb vs. `arc_create --start` flag'
    chose: 'Separate verb `fw arc start <id>` for the draft → in-progress transition.'
    rationale: 'The lifecycle becomes explicit and uniform with the other transition verbs (`close`, future `abandon`). A `--start` flag on `create` would short-circuit the draft state into a one-line shortcut — useful, but it hides the new lifecycle from operators and undermines the "draft state forces a pause" benefit (the human/agent now has a beat to confirm the headline_mechanic before declaring the arc active). The verb is also greppable across the codebase and trivially extends with future transition-time policy.'
    alternatives_rejected: ['`arc_create --start`: hides lifecycle, undermines the draft pause. Could be added later as a convenience flag if friction is real (Human [REVIEW] AC tests this).']
  - decision: '2026-05-16 — `_arc_require_status` over inline checks'
    chose: 'Single reusable helper `_arc_require_status <id> <verb> <expected...>`.'
    rationale: 'Three transition verbs (start, close, future abandon) all need the same "is the arc in the expected state?" check. Single helper means: (a) one place to update the error text when T-1854 adds the abandon transition; (b) one place to add future state-transition policy (e.g. logging, hooks); (c) uniform UX — the operator sees the same "allowed transitions" cheat-sheet no matter which verb refused.'
    alternatives_rejected: ['Inline `if [ "$status" != "in-progress" ]; then ...; fi` in each verb — duplicates the cheat-sheet, drifts under future edits.']
  - decision: '2026-05-16 — Python in-place `re.sub` for status flip'
    chose: '`python3 - "$file" <<PY ... re.sub ...` heredoc, in-place rewrite.'
    rationale: 'Single-line surgical edit on a known field; preserves all other YAML structure including comments, blank lines, ordering. Mirrors existing patterns in arc_tag (line ~534) and the T-1850 migration script.'
    alternatives_rejected: ['`yq` / `python3 yaml.safe_load + dump` — would round-trip the entire YAML, potentially reformatting unrelated fields and breaking any operator who has hand-edited the file. Also rejected: `sed -i` — escape complexity on the `status:` line is brittle across platforms.']

