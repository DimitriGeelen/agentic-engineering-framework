  - decision: '2026-10-27 — where the version is captured, and what "version" means for ollama-loop'
    chose: 'record in run.sh at launch time (stderr line + jq update of meta.json keys `worker_bin` / `worker_version`), writing `--version` output to a file rather than a pipe; for ollama-loop the "version" is the interpreter''s `python3 --version` plus the loop script''s sha256 prefix, passed to the helper as an override.'
