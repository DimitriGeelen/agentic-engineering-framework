decisions:
  - decision: '2026-10-25 — how to tell an AEF-written build from a user''s file'
    chose: 'byte-identity (`cmp -s`) against the same-named build in the upgrade source''s `vendor/designer/`, plus untracked in the consumer''s git. That directory is tracked in the framework repo and keeps every released build, and both upgrade paths (in-repo `fw upgrade <dir>`, and a consumer''s clone of upstream) run with FRAMEWORK_ROOT on a full checkout.'
    rationale: 'it covers builds already on disk today (050''s 0.25.0 predates any journal), it needs no new vendored file, and when it cannot prove a match it keeps the file. If a build is ever removed from the framework repo, its copies are listed instead of deleted.'
    alternatives_rejected: ['(a) A write journal or stamp: it only knows about files written after it ships, so it would never clear the existing leftovers. (b) A new shipped sha256 manifest of every published build: one more vendored policy file to keep in step with every re-pin, for the same answer byte comparison gives. (c) Prune everything except the pin: this deletes tracked files and user files, which the task forbids.']

