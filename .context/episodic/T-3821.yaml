# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-04 — who writes VERSION'
    chose: 'both legs. (1) `fw release` is the only writer of a **tracked** VERSION: the pre-push hook skips a tracked VERSION and says so, and still stamps an **untracked** (generated) one, which is what T-648 was for. (2) `release_reconcile_version` treats "already equal to HEAD''s committed content" as success, and the release grades HEAD''s committed VERSION rather than the working tree.'
    rationale: 'consumers read the **committed** VERSION on master (`fw upgrade`). `fw version` in a git checkout derives the same `<major.minor>.<commits>` string from `git describe` (bin/fw `_derive_version`) and never reads the file. Vendored copies get VERSION written from `$FW_VERSION` at vendor time (bin/fw `do_vendor`). So stamping the tracked file served no reader. It only made the tree disagree with the commit, and once committed it was the non-monotonic counter T-3242 forbids. Leg 2 is needed because installed hooks are copies: every existing clone (and consumer) keeps stamping until `fw git install-hooks` is re-run.'
    alternatives_rejected: ['hook-only (installed hooks stay old, so attempt 2 recurs until every clone reinstalls); release-only (the tree stays dirty after every push and a sweeping commit can still commit the counter); removing the stamp entirely (T-1253 Path 3: a regression for projects that keep VERSION untracked and generated). - **Not changed:** `fw version sync` (lib/version.sh), a manual third writer, is already floored at the latest tag (T-3242).']

