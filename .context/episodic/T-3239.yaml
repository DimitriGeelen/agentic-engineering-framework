  - '**M2 evidenced positively end to end:** crossing the budget threshold writes `.restart-requested`, generates a handover, and the ensuing restart advances `current_iteration` with the directive re-injected. **MET by E8** — real `claude` 2.1.245 under real `bin/claude-fw`, threshold crossed at ~52,805 tokens, `budget-gate` writes the signal, the wrapper commits a handover, restarts, and re-injects the directive; ledger records `event=iterate reason=restart tokens=52655`. 6/6 assertions, reproduced 3/3 consecutive runs. *(Was UNMET through E7. The blocker was never the mechanism: `post-compact-resume.sh:82-90` seeds `.budget-status` with `ok/0` at SessionStart and `budget-gate.sh:247` serves that seed for 90s without opening the transcript, so E7''s ~32-second session was blind by construction for its whole life. Three further blockers — recheck interval, the Tier-1 task gate, and three defects in my own harness — are documented in REPORT.md §E8.)*'
  - '**Control leg for both:** the same steps run **disarmed** produce `decision=stop` at the first turn and no `.restart-requested`. This is what separates "the loop fired" from "the loop never ran and nothing noticed" (L-555).'
  - '**Every brake is exercised or explicitly reported unexercised**, by name, from the driver''s own table: halt-file, `stop_hook_active`, `continuous-mode-disabled`, `max_iterations-reached`, `max_tasks-reached`, `expired-at`, tier-ceiling. An unexercised brake is listed as such rather than implied to work.'
  - '**Arc focus holds** across an M2 restart. **MET by E6** (4/4) — the real `agents/context/post-compact-resume.sh` run through the real `bin/fw hook` dispatcher emits `## Current Arc: continuous-run` alongside the focus task, iteration counter and tier ceiling in the SessionStart payload, and `current_iteration` advances 4 → 5. The restarted session is fresh by construction (T-3166 empties `CLAUDE_ARGS`), so that payload is the entire boundary, and it is captured verbatim in `evidence/E6-payload-verbatim.txt`. The T-3236 interaction stands and is filed there, not here: closing a task clears focus, so a loop that closes a task mid-run enters the next iteration with no focus.'
  - 'Wire-level artefacts are committed under `docs/reports/T-3239-*/` and are re-readable by someone who did not run them (raw logs + transcript, not just prose).'
  - 'Every link found broken is diagnosed to a root cause and either fixed in this task or filed as its own task; the demo report states which links are proven and which are not. *(Fixed here: the false `fw continuous arm` bounds line. Filed: T-3240, T-3241, T-3242.)*'
