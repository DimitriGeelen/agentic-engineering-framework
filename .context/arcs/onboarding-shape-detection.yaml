proposed_scoped_drivers:  # uncapped persistence (D7-reframe). Estimator may write here freely.
  # Proposed by agent 2026-08-02 per CLAUDE.md §Arc-Scoped Driver Suggestion Workflow (T-1925),
  # step 3. Anchor body (T-2718) read in full first, per D-5 timing. Approval is the operator's:
  #   http://192.168.10.107:3001/arcs/onboarding-shape-detection
  # Recommending TWO, not three — a third candidate was drafted and discarded rather than shipped
  # to look thorough (R5: manufacturing drivers is worse than proposing fewer).
  - name: unknown-input-safety
    rationale: "Distinguishes from D2 (reliability): D2 is about not failing silently on inputs we
      handle; this scores what the framework does with inputs it does NOT recognise. F-10 is
      precisely a non-recognition path that resolved to a confident wrong answer instead of a
      harmless one. Scores whether each change makes unrecognised input degrade toward the cheap
      side of the cost asymmetry (mild noise) or the expensive side (a gate the user cannot clear).
      No global driver measures behaviour-on-the-unknown; D2 presumes the case is known."
    weight_suggestion: 6
    source: agent
    ts: 2026-08-02T00:40:00Z
  - name: first-run-recoverability
    rationale: "Distinguishes from D3 (usability): D3 is joy-to-use across the whole lifecycle for
      someone who already has context. This scores the narrower and harsher case of a user in their
      first five minutes with zero framework knowledge, where the operative question is not 'is this
      pleasant' but 'can they get themselves unstuck without reading source'. F-10's damage came
      entirely from irrecoverability — the deadlock needed knowledge of fw onboarding skip that the
      blocked user had no path to. Weighted below unknown-input-safety because it is the consequence,
      not the cause."
    weight_suggestion: 4
    source: agent
    ts: 2026-08-02T00:40:00Z
