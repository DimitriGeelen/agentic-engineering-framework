bvp_scores: {}
scoped_drivers:              # max 3, weight ≤6 each (M2). Approved by fw arc approve-driver (T-1926).
  - name: unknown-input-safety
    weight: 4
    approved_at: '2026-08-02T05:42:57Z'
    rationale: 'Distinguishes from D2 (reliability): D2 is about not failing silently
      on inputs we handle; this scores what the framework does with inputs it does
      NOT recognise. F-10 is precisely a non-recognition path that resolved to a confident
      wrong answer instead of a harmless one. Scores whether each change makes unrecognised
      input degrade toward the cheap side of the cost asymmetry (mild noise) or the
      expensive side (a gate the user cannot clear). No global driver measures behaviour-on-the-unknown;
      D2 presumes the case is known.'
  - name: first-run-recoverability
    weight: 4
    approved_at: '2026-08-02T05:43:10Z'
    rationale: "Distinguishes from D3 (usability): D3 is joy-to-use across the whole
      lifecycle for someone who already has context. This scores the narrower and
      harsher case of a user in their first five minutes with zero framework knowledge,
      where the operative question is not 'is this pleasant' but 'can they get themselves
      unstuck without reading source'. F-10's damage came entirely from irrecoverability
      — the deadlock needed knowledge of fw onboarding skip that the blocked user
      had no path to. Weighted below unknown-input-safety because it is the consequence,
      not the cause."
