id: arc-015
slug: onboarding-shape-detection
name: "Onboarding: fw init detects project shape by enumeration, not manifest allowlist"
description: "T-2715 GO item 2. Fixes F-10 (re-reproduced 2026-08-02 under T-2718:
  9 synthetic projects, 4 of 8 real-code ones seeded greenfield; the earlier 6-of-7
  figure was fixture-specific, the CLASS reproduces but the ratio does not). Fix shape
  ratified with 832 (rail 376): enumerate what IS there and decide, NOT a longer manifest
  list — lengthening the list reproduces the same property with a later failure date.
  Includes the fresh-project harness that would have caught it: tests/unit/greenfield_seed_audit_prototype.bats
  (T-2703, currently RED, unwired)."
status: in-progress
anchor_task: T-2718
headline_mechanic: "A developer runs fw init inside an existing .NET, Ruby, PHP, Make
  or Gradle project and watches it report what it actually found in the directory,
  state the project shape it inferred from that, and seed a task set they can start
  working immediately — instead of being handed a greenfield inception task that requires
  a decision the agent cannot record and that blocks every other edit"
