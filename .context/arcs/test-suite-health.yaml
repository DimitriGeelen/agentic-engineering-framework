id: arc-026
slug: test-suite-health
name: "Test-suite health: a fast, hermetic push gate and a trustworthy nightly suite"
description: "Refactor the test set the way the code base is refactored: measure first,
  split into a fast hermetic tier that gates every push and a slow nightly tier, one
  shared fixture helper, lints for the defect classes that keep recurring (live-state
  anchors, leaked env/config, load-only timing), and prune by evidence. Every step
  proves its tests still fail on the bug they were written for."
status: in-progress
anchor_task: T-4376
# close_task: T-XXX  # T-3843: the arc's close-out task. Its ## Recommendation (CLOSE|KEEP-OPEN,
#                    # Rationale, Evidence) is the close recommendation on /arcs/<slug>/close and
#                    # gates fw arc review; anchor_task is the fallback when unset.
headline_mechanic: "agent pushes a framework change → the pre-push gate runs only
  the hermetic fast tier and returns a determined verdict in under 10 minutes with
  no file timing out → operator reads one line in the push output and never has to
  baseline a load-only red to unblock a release"
