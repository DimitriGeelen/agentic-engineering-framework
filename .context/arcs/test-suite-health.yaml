      ts: '2026-10-19T11:57:24Z'
      reviewer_id: static-v1
  - name: fault-detection-fidelity
    weight: 3
    approved_at: '2026-10-19T11:57:26Z'
    approved_by: reviewer:static-v1
    rationale: 'A refactored, merged or pruned test still fails on the bug it was
      written for, proven by a recorded red run on the pre-fix code. Distinguishes
      from D1 (Antifragility), which is about the system getting stronger from failures;
      this is the opposite risk specific to a test refactor: the suite quietly getting
      WEAKER while turning green and faster. Without it, speed and determinacy can
      be bought by deleting coverage, and no other driver would notice.'
    reviewer:
      verdict: pass
