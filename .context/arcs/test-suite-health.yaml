scoped_drivers:              # max 3, weight ≤6 each (M2). Approved by fw arc approve-driver (T-1926).
  - name: verdict-determinacy
    weight: 3
    approved_at: '2026-10-19T11:57:24Z'
    approved_by: reviewer:static-v1
    rationale: "Every test in the push gate returns a determined verdict: no file
      timeout, no red that appears only under parallel load, no assertion on live
      repo or host state. Distinguishes from D2 (Reliability), which asks whether
      the framework's own runtime behaviour is predictable and has no silent failures;
      this asks whether the TEST VERDICT is a function of the code under test. A load-only
      red is not a framework failure at all, yet it blocks releases and trains the
      operator to baseline reds (2026-10-19: two extra suite runs and a baseline step
      for one push)."
    reviewer:
      verdict: pass
      checks:
