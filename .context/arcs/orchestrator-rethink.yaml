# ── Arc story (T-3563) — purpose, objective and context, derived from the anchor inception and
#    externally reviewed. headline_mechanic above is the separate, testable demo claim (G-062).
purpose: Make the framework use outcome-informed model routing in everyday operation, under explicit human
  policy and regression protection, so shipped infrastructure delivers observable orchestration.
objective: Ordinary framework workloads select models using recorded outcomes; the 13 identified routing-policy
  parameters have explicit human dispositions, including deferrals; and routing, cache and governance
  contracts have regression protection.
supports: []
success_criteria:
- id: SC-1
  criterion: A framework dispatch given only --task-type (no --model) resolves its model from route_cache,
    and the outcome is written back.
  evidence: 'docs/reports/orchestrator-rethink-demo/README.md — meta-01-*.json show resolution_source:
    route_cache; cache-02→cache-03 deltas show write-back'
- id: SC-2
  criterion: Each of the 13 silently-defaulted routing-policy constants has an explicit recorded ruling
    rather than a code-author default.
  evidence: .tasks/completed/T-1642-arc-a--orchestrator-routing-policy-consu.md §Recommendation records
    GO and a table of 13 proposed defaults, each named as a separate decision still to be recorded in
    decisions.yaml. The cited material does not establish a human disposition and rationale per parameter;
    those records must be linked before this criterion passes.
- id: SC-3
  criterion: G-061's minimum defenses are evidenced — MCP task_id audit, an approved fallback-order regression
    test, governance-frame golden fixture, task-type tag validator and the Watchtower /orchestrator page.
  evidence: .context/project/concerns.yaml#G-061 records partial mitigation — four of the five minimum
    defenses shipped (T-1646, T-1648, T-1649, T-1647); the fallback-chain order test remains deferred
    pending the policy consultation. T-1650's route_cache schema test is additional protection, not a
    substitute for the missing one.
- id: SC-4
  criterion: At least one autonomous workload — not agent-run verification — dispatches through the orchestrator
    over a sustained period.
  evidence: .context/project/concerns.yaml#G-064 — status closed 2026-06-10, 481 dispatches / 290 cron
    firings, escalation-triage live since 2026-05-14
