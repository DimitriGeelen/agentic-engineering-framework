# ── Arc story (T-3563) — purpose, objective and context, derived from the anchor inception and
#    externally reviewed. headline_mechanic above is the separate, testable demo claim (G-062).
purpose: Make the README's five-minute walkthrough true for a person with no agent, and keep it true with
  a by-hand persona test.
objective: 'The documented first-run path is independently usable without an agent: promised behaviour
  matches a plain shell, blockers have actionable remedies, and by-hand regressions remain visible independently
  of agent-assisted success.'
supports: []
success_criteria:
- id: SC-1
  criterion: No step in the README's five-minute block promises a refusal that cannot fire in a plain
    shell.
  evidence: tests/integration/readme_five_minute_by_hand.bats test 2; README.md step 2 now reads 'Try
    to commit without a task' (git-level, fires for both personas).
- id: SC-2
  criterion: The by-hand path has an executable scenario that runs commands extracted from README.md and
    is picked up by a runner that runs today.
  evidence: Partially established — five_minute_block() at tests/integration/readme_five_minute_by_hand.bats:47
    extracts the fenced block for text assertions, but the two behavioural tests execute separately authored
    commands. Runner inclusion is recorded in T-2719 as a `bats --count tests/integration/` delta of 532−528=4;
    execution of the extracted walkthrough remains unproven.
- id: SC-3
  criterion: That scenario goes red when the documented path regresses — proven by mutation, not by having
    only ever passed.
  evidence: T-2719's evidence table records that restoring the old edit-refusal wording turns test 2 red
    and restoring the correction turns it green (L-530). That verifies the wording guard; no cited mutation
    demonstrates detection of a broken executable walkthrough step.
- id: SC-4
  criterion: Blocks on the documented by-hand path are cleared or have remedies the reader can execute;
    other discovered defects are recorded against owning tasks.
  evidence: T-2816 and T-2817 fixed; T-2815 filed to arc-017; OBS-170 closed by T-2883; OBS-171 recorded
    open.
- id: SC-5
  criterion: A live by-hand run on a clean machine is captured as the arc's demo artefact — the mechanic
    firing, not the suite going green.
  evidence: '`demo_evidence:` in .context/arcs/readme-first-run.yaml is non-null and traceable to that
    run; currently null.'
non_goals:
- Redesign the seeded onboarding task set — that is arc-017 (T-2815).
- Change the T-532 onboarding enforcement gate; T-2719 found the block itself correct.
- Make the edit-time task gate reach a human's terminal — it is a Claude Code PreToolUse hook on agent
  tool calls and cannot.
- Set a git identity for the operator; T-2883's scope was detect-and-tell only.
