id: arc-012
slug: continuous-run
name: "Continuous-run: agent-driven compact-resume loop with bounded-autonomy ceiling"
description: "Closes the compact-resume loop so a long-running agent self-compacts
  and self-resumes at context-budget boundaries, bounded by tier/blast-radius ceiling,
  run-length cap, and discard manifest. Sibling of orchestrator-rethink."
status: in-progress
anchor_task: T-2158
headline_mechanic: "agent crosses the context-budget threshold without operator relay
  -> checkpoint.sh fires self-trigger -> handover + resume via claude-fw -> operator
  observes multi-cycle continuous session whose iteration counter, directive, and
  bounded tier-ceiling are visible in fw resume status"
demo_evidence: docs/reports/T-3239-continuous-loop-demo/REPORT.md  # T-3239: substrate proven (11/11 brakes, resume advances+re-injects, arc+ceiling cross the restart boundary). M2 headline mechanic DEMONSTRATED live end-to-end (E8, 6/6, 3/3 runs: threshold->signal->handover committed->restart->directive re-injected). M1 still caps at one continuation (T-3240), and the M2 trip needs three non-default dials to fire on a short session (T-3241; E7 is the live negative). Arc stays OPEN per ACD — the headline sentence bundles M1+M2 and only M2 ships.
created: 2026-06-13T08:49:13Z
closed_at:
decision:
# T-1918 (arc-006, value-prioritisation): BVP scoring fields. Semantics in
# docs/reports/T-1915-bvp-inception.md §4 (D7-reframe) and §7 (M2).
bvp_scores: {}
scoped_drivers:              # max 3, weight ≤6 each (M2). Approved by fw arc approve-driver (T-1926).
  - name: Discard fidelity
    weight: 4
    approved_at: '2026-06-13T09:11:18Z'
    rationale: "R1: rewards lossless-where-possible and reviewable-where-lossy compactionover
      aggressive context shedding. Distinct from D1-D4 (D4 = no providerlock-in; this
      is no operator-review lock-in) and distinct from F-AUTONOMY(autonomy-enabling
      work vs. quality of a specific audit artefact).R2: weight 4 — secondary to the
      loop's existence (S4 firm verdict)."
  - name: Loop closure (conditional)
    weight: 3
    approved_at: '2026-06-13T09:11:25Z'
    rationale: 'R1: rewards closing the compact->resume->run loop vs leaving one half
      open.Adjacent to F-AUTONOMY L3 ("closes a feedback loop so signal reaches ACTIONwithout
      human relay") — if F-AUTONOMY captures this dimension at globalscope, this scoped
      driver becomes redundant.R2: weight 3 — propose only if operator wants the arc-scoped
      axis in addition.Likely to be withdrawn after F-AUTONOMY activation settles.'
proposed_scoped_drivers: []  # Per T-2158 §S4 spike critique: 1 firm + 1 conditional + 1 reject.

# ── Arc story (T-3563) — purpose, objective and context, derived from the anchor inception and
#    externally reviewed. headline_mechanic above is the separate, testable demo claim (G-062).
purpose: Let a long-running agent cross context-budget boundaries unattended — self-compact, self-resume,
  keep working — while staying inside operator-set safety bounds.
objective: An armed session continues its own work across budget boundaries with no operator relay, bounded
  by tier ceiling, iteration and task caps, expiry and a halt file, with every lossy discard enumerated
  for review afterwards.
supports: []
success_criteria:
- id: SC-1
  criterion: Crossing the budget threshold on a real session drives handover, restart and directive re-injection,
    reproducibly.
  evidence: docs/reports/T-3239-continuous-loop-demo/evidence/E8-livefire-budget-restart.txt (6/6, 3/3
    consecutive runs)
- id: SC-2
  criterion: Every brake stops the loop by name — halt file, platform guard, disabled, terminated, max_tasks,
    max_iterations, expiry, unreadable state.
  evidence: docs/reports/T-3239-continuous-loop-demo/evidence/E1-brake-truth-table.txt (11/11, asserts
    stdout shape not log line)
- id: SC-3
  criterion: A session that stops early without tripping the budget gauge can be carried forward without
    an operator, via an externally-driven turn rather than the in-session loop.
  evidence: 'T-3254 (work-completed) ships the cron-injects-a-turn path; T-3257 live-fire proves it drives
    a real agent to completion (9/9, twice). Not yet armed in production: continuous-driver-10m is deliberately
    left PAUSED (D-546), and re-arming it is T-3283 (captured, horizon later, blocked on G-097/G-098).'
- id: SC-4
  criterion: Arc, focus task, iteration counter and tier ceiling survive the restart boundary and are
    visible to the operator.
  evidence: docs/reports/T-3239-continuous-loop-demo/REPORT.md#e6--the-arc-focus-crosses-the-boundary-44;
    `fw resume status`
- id: SC-5
  criterion: The budget gauge never reports a healthy session when it could not measure one.
  evidence: docs/reports/T-3239-continuous-loop-demo/evidence/E3-budget-selftrigger.txt (reproduction);
    T-3241 closed 2026-09-05
non_goals:
- Removing or weakening any Tier 0 / consequential-action human gate.
- Truly unbounded autonomous operation — no ceiling, no run-length cap.
- Adding a new global scoring driver; F-AUTONOMY lives in policy/value-drivers.yaml.
- Orchestrator model routing — that is the sibling arc orchestrator-rethink.
context:
