    at every budget boundary.'
  source: docs/reports/T-2158-continuous-run.md#problem-statement
- point: T-111 already shipped the data-preservation half; this arc adds self-triggering, bounded-autonomy
    machinery and a discard audit.
  source: docs/reports/T-2158-continuous-run.md#prior-art-finding-surfaced-by-briefing-engine
- point: 'The headline sentence bundles two mechanisms that fail independently: in-session Stop-hook continuation
    (M1) and budget restart (M2).'
  source: docs/reports/T-3239-continuous-loop-demo/REPORT.md#the-distinction-everything-else-depends-on-l-652
- point: 'L-652: the wrapper''s auto-restart is gated on its own flag, not on continuous-mode, so ledger
    events can prove the pre-arc substrate.'
  source: .context/project/learnings.yaml#L-652
- point: 'Sovereignty narrows rather than disappears: Tier 0 stays gated post-resume; only the compaction
    checkpoint is surrendered.'
  source: docs/reports/T-2158-continuous-run.md#spike-findings-s1-s6-conducted-2026-06-13
- point: The halt file is the only brake, and writing it needs shell access on the host — no brake from
    a phone.
  source: .tasks/active/T-3200-the-continuous-run-halt-has-no-watchtowe.md
