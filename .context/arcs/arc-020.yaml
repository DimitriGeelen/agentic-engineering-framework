id: arc-020
slug: arc-020
name: "Cross-agent identity & self-healing circuits"
description: "OBJECTIVE: give every agent a durable, addressable identity and give
  the connection between two agents the ability to heal itself — so 'who is this'
  is unambiguous and 'reach them again' is a designed, recoverable operation, not
  an accident of whatever crypto fingerprint termlink happens to resolve. Kills the
  cohort-fingerprint collapse (G-105/T-3286). GOALS G1-G5 and the slice-to-goal map
  are in the charter: docs/reports/T-3287-identity-taxonomy-circuit-model.md. Design
  ratified there (D1-D5): 5-level taxonomy, V9 address grammar, three-state circuit
  lifecycle, regressive resolution/provisioning ladder."
status: in-progress
anchor_task: T-3287
headline_mechanic: "A worker addresses a peer agent by its durable name; distinct
  co-resident agents stay distinct correspondents on the operator's TermLink thread
  instead of collapsing into one fingerprint, and a dropped circuit self-heals — the
  peer's message still lands after the framework re-provisions an equivalent instance
  under the same durable name."
demo_evidence:
created: 2026-09-07T00:06:13Z
closed_at:
decision:
# T-1918 (arc-006, value-prioritisation): BVP scoring fields. Semantics in
# docs/reports/T-1915-bvp-inception.md §4 (D7-reframe) and §7 (M2).
bvp_scores: {}
scoped_drivers:              # max 3, weight ≤6 each (M2). Approved by fw arc approve-driver (T-1926).
  - name: identity-fidelity
    weight: 4
    approved_at: '2026-09-07T12:33:20Z'
    rationale: "The name→actor mapping is injective and stable across instance death:
      two distinct actors NEVER collapse to one correspondent, and a durable name
      always re-resolves to the right identity. Distinguishes from D2/Reliability
      (silent-failure + observability), which says nothing about whether identity
      is injective or survives re-provisioning. This is the arc's reason to exist
      — a slice that strengthens name↔actor injectivity scores here even if it touches
      no general-reliability surface."
    # T-3547: the MECHANISM. Approved 2026-09-07 with a weight and a rationale and
    # nothing that could score it, so `fw audit` and `fw doctor` WARNed for three
    # weeks that this "cannot be scored, so it contributes nothing to any ranking
    # while its weight and rubric read as a live axis". Schema + semantics:
    # policy/value-drivers.yaml §DECLARATIVE SCORING SPECS (T-3428).
    #
    # Level design — what each level asks:
    #   1  does this go anywhere near identity or addressing?
    #   3  does it touch a NAMING or RESOLUTION surface — the machinery that turns
    #      a name into an actor?
    #   5  does it change INJECTIVITY or SURVIVAL — whether two actors can collapse
    #      to one, or whether a name still resolves after the instance that minted
    #      it died?
    #
    # L5 keys on the vocabulary of collapse and re-resolution rather than identity
    # generally, which every address-adjacent task in this arc carries. Measured
    # over all 14 arc members: L1×5, L3×8, L5×1 (T-3309).
    scoring:
      kind: signals
      strip_template: true
      levels:
        1:
          keywords: ["identity", "addressable", "whoami", "correspondent"]
        3:
          keywords: ["circuit id", "five-part address", "rail identity",
                     "identity fingerprint", "project id", "address slot",
                     "topic_for_circuit", "hub fingerprint"]
          paths: ["lib/aef_address.py", "lib/aef_resolve.py", "lib/aef_circuit.py",
                  "lib/sidecar/circuit.py", "lib/project_identity.sh",
                  "lib/aef_election.py", "lib/aef_governor.py"]
        5:
          keywords: ["injective", "re-resolve", "identity collision",
                     "collapse to one", "same fingerprint", "shared fingerprint",
                     "per-project key", "survives re-provisioning",
                     "name↔actor", "two distinct actors"]
  - name: provisioning-safety
    weight: 4
    approved_at: '2026-09-07T12:34:06Z'
    rationale: Blast-radius containment of pre-authorized, 
      additive-but-consequential auto-provisioning (idempotency, load-adaptive 
      admission, path/fleet gate, integrity-verify). Distinguishes from D1/D2 
      because it governs a SUCCESSFUL-but-WRONG action — a typo'd address 
      provisioning a hub — a failure class only this arc introduces by 
      pre-authorizing infra self-heal. Most framework work never provisions
      infrastructure, so this axis is meaningful only here.
    # T-3547: the MECHANISM. Same three-week WARN as its sibling above.
    #
    # THE POLARITY TRAP, which the level split exists to avoid: provisioning work
    # is not automatically good on this axis. The driver prices a SUCCESSFUL-but-
    # WRONG action — a typo'd address provisioning a hub. So expanding what can be
    # auto-created is a 3, and BOUNDING it is a 5; L5 keys on containment
    # vocabulary (idempotency, admission control, integrity-verify, fleet/path
    # gate) and never on provisioning vocabulary.
    #
    # `election` and `governor` are PATHS here, not keywords. As keywords they
    # lifted 10 of the arc's 14 members to level 3 — every task whose body merely
    # mentions those slices as context, which is most of them — and a driver that
    # gives 71% of its own arc one score orders nothing. Restricted to the files
    # that implement them, the level means "touched the provisioning path" rather
    # than "talked about it". Measured after the change: L0×1, L1×6, L3×6, L5×1.
    scoring:
      kind: signals
      strip_template: true
      levels:
        1:
          keywords: ["provision", "hub", "fleet", "self-heal", "bootstrap"]
        3:
          keywords: ["auto-provision", "pre-authorized", "claim-based election",
                     "repo-source", "provision-audit", "admission"]
          paths: ["lib/aef_election.py", "lib/aef_governor.py",
                  "lib/aef_repo_source.py", "lib/aef_provision_audit.py"]
        5:
          keywords: ["idempotenc", "load-adaptive", "admission control",
                     "integrity-verify", "integrity verification", "fleet gate",
                     "path gate", "blast-radius containment",
                     "successful but wrong", "provisioning the wrong"]
proposed_scoped_drivers: []  # T-1925 agent proposals (2 of a possible 2 — a third would be manufactured, R5)
