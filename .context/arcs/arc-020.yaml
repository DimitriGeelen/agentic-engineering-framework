id: arc-020
slug: arc-020
name: "Cross-agent identity & self-healing circuits"
description: "OBJECTIVE: give every agent a durable, addressable identity and give the connection between two agents the ability to heal itself — so 'who is this' is unambiguous and 'reach them again' is a designed, recoverable operation, not an accident of whatever crypto fingerprint termlink happens to resolve. Kills the cohort-fingerprint collapse (G-105/T-3286). GOALS G1-G5 and the slice-to-goal map are in the charter: docs/reports/T-3287-identity-taxonomy-circuit-model.md. Design ratified there (D1-D5): 5-level taxonomy, V9 address grammar, three-state circuit lifecycle, regressive resolution/provisioning ladder."
status: in-progress
anchor_task: T-3287
headline_mechanic: "A worker addresses a peer agent by its durable name; distinct co-resident agents\
  \ stay distinct correspondents on the operator's TermLink thread instead of collapsing\
  \ into one fingerprint, and a dropped circuit self-heals \u2014 the peer's message\
  \ still lands after the framework re-provisions an equivalent instance under the\
  \ same durable name."
