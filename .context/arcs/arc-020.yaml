proposed_scoped_drivers:     # T-1925 agent proposals (2 of a possible 2 — a third would be manufactured, R5)
  - name: identity-fidelity
    rationale: >-
      The name→actor mapping is injective and stable across instance death: two distinct
      actors NEVER collapse to one correspondent, and a durable name always re-resolves to
      the right identity. Distinguishes from D2/Reliability (silent-failure + observability),
      which says nothing about whether identity is injective or survives re-provisioning.
      This is the arc's reason to exist — a slice that strengthens name↔actor injectivity
      scores here even if it touches no general-reliability surface.
    source: agent
    ts: '2026-09-07T00:35:00Z'
  - name: provisioning-safety
    rationale: >-
      Blast-radius containment of pre-authorized, additive-but-consequential auto-provisioning
      (idempotency, load-adaptive admission, path/fleet gate, integrity-verify). Distinguishes
      from D1/D2 because it governs a SUCCESSFUL-but-WRONG action — a typo'd address provisioning
      a hub — a failure class only this arc introduces by pre-authorizing infra self-heal. Most
      framework work never provisions infrastructure, so this axis is meaningful only here.
    source: agent
    ts: '2026-09-07T00:35:00Z'
