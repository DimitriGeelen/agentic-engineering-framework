# Cron Registry — Structured source of truth for scheduled jobs (T-448)
# Read by web/blueprints/cron.py and fw cron generate.
# Editable by humans, controllable via Watchtower web UI.
#
# Each job has: id, name, schedule, command, source_file, origin_task, status, description
# status: active | paused
# description: auto-generated by Ollama or manually set

jobs:
  - id: reviewer-audit-daily
    name: "Reviewer Layer-3 audit (daily Pass B)"
    schedule: "37 4 * * *"
    command: "fw reviewer audit"
    source_file: agentic-reviewer.crontab
    origin_task: T-1447
    status: active
    description: "Daily Pass-B re-scan of all completed tasks against current anti-pattern catalogue + Layer-1 escalation patterns. Antifragile (no caching). Output: .context/audits/reviewer/YYYY-MM-DD.yaml. Per T-1443 v1.2 staged rollout."

  - id: structural-30m
    name: "Structural audits (30 min)"
    schedule: "*/30 * * * *"
    command: "flock -n /var/lock/agentic-cron-structural-30m.lock -c 'fw audit --section structure,compliance,quality,discovery --cron'"
    source_file: agentic-audit.crontab
    origin_task: T-184
    status: active
    description: "Checks task quality, project structure integrity, compliance, and discovery patterns every 30 minutes."

  - id: traceability-hourly
    name: "Git traceability + episodic (hourly)"
    schedule: "0 * * * *"
    command: "flock -n /var/lock/agentic-cron-traceability-hourly.lock -c 'fw audit --section traceability,episodic,discovery-trends --cron'"
    source_file: agentic-audit.crontab
    origin_task: T-184
    status: active
    description: "Verifies git commit traceability, episodic memory completeness, and discovers trends hourly."

  - id: observations-6h
    name: "Observations + gaps (6 hourly)"
    schedule: "0 */6 * * *"
    command: "flock -n /var/lock/agentic-cron-observations-6h.lock -c 'fw audit --section observations,gaps --cron'"
    source_file: agentic-audit.crontab
    origin_task: T-184
    status: active
    description: "Reviews observation inbox and gaps register every 6 hours."

  - id: oe-fast-30m
    name: "OE fast checks (30 min)"
    schedule: "15,45 * * * *"
    command: "flock -n /var/lock/agentic-cron-oe-fast-30m.lock -c 'fw audit --section oe-fast,oe-research --cron'"
    source_file: agentic-audit.crontab
    origin_task: T-196
    status: active
    description: "Operational effectiveness fast checks and research controls every 30 minutes (offset from structural)."

  - id: oe-hourly
    name: "OE hourly checks"
    schedule: "30 * * * *"
    command: "flock -n /var/lock/agentic-cron-oe-hourly.lock -c 'fw audit --section oe-hourly --cron'"
    source_file: agentic-audit.crontab
    origin_task: T-196
    status: active
    description: "Operational effectiveness hourly control checks (CTL-008, CTL-020)."

  - id: oe-daily
    name: "OE daily checks"
    schedule: "0 7 * * *"
    command: "flock -n /var/lock/agentic-cron-oe-daily.lock -c 'fw audit --section oe-daily --cron'"
    source_file: agentic-audit.crontab
    origin_task: T-196
    status: active
    description: "Daily operational effectiveness audit covering most controls at 7am."

  - id: oe-weekly
    name: "OE weekly checks"
    schedule: "0 9 * * 1"
    command: "flock -n /var/lock/agentic-cron-oe-weekly.lock -c 'fw audit --section oe-weekly --cron'"
    source_file: agentic-audit.crontab
    origin_task: T-196
    status: active
    description: "Weekly operational effectiveness audit (CTL-016) on Monday at 9am."

  - id: full-daily
    name: "Full audit (daily)"
    schedule: "0 8 * * *"
    command: "flock -n /var/lock/agentic-cron-full-daily.lock -c 'fw audit --cron'"
    source_file: agentic-audit.crontab
    origin_task: T-184
    status: active
    description: "Complete audit of all sections, runs daily at 8am."

  - id: docs-daily
    name: "Component docs regeneration (daily)"
    schedule: "15 8 * * *"
    command: "fw docs --all"
    source_file: agentic-audit.crontab
    origin_task: T-387
    status: active
    description: "Regenerates component reference documentation daily at 8:15am."

  - id: retention-daily
    name: "Cron audit file retention (daily)"
    schedule: "0 9 * * *"
    command: "python3 -c \"import os,datetime; cutoff=str(datetime.date.today()-datetime.timedelta(days=7)); d='.context/audits/cron'; [os.remove(os.path.join(d,f)) for f in os.listdir(d) if f.endswith('.yaml') and len(f)>=15 and f[4]=='-' and f[:10]<cutoff]\""
    source_file: agentic-audit.crontab
    origin_task: T-658
    status: active
    description: "Prunes cron audit files older than 7 days using filename date (not mtime which gets reset by git)."

  - id: pickup-process
    name: "Pickup inbox processor (1 min)"
    schedule: "* * * * *"
    command: "flock -n /var/lock/agentic-cron-pickup-process.lock -c 'fw pickup process'"
    source_file: agentic-audit.crontab
    origin_task: T-778
    status: active
    description: "Scans pickup inbox for cross-project proposals, validates, dedup-checks, and creates inception tasks. Runs once per minute (T-1270 adjustment — removed sleep 30 twice-per-min trick)."

  - id: release-weekly
    name: "Weekly release tagging (Monday 10:00)"
    schedule: "0 10 * * 1"
    command: "fw release tag-and-release"
    source_file: agentic-audit.crontab
    origin_task: T-1256
    status: active
    description: "Cuts a new patch-level tag (vX.Y.Z+1), pushes to all remotes with --follow-tags, and creates a GitHub Release with auto-generated notes. Idempotent — skips if no commits since last tag. Offset from OE weekly (Monday 09:00) to avoid collision."

  - id: liveness-1m
    name: "TermLink hub + Claude + Watchtower liveness (1 min)"
    schedule: "* * * * *"
    command: "/opt/999-Agentic-Engineering-Framework/agents/monitor/liveness-check.sh"
    source_file: agentic-audit.crontab
    origin_task: T-1269
    status: active
    description: "Pings TermLink hub, counts Claude Code processes, and checks Watchtower every minute. Appends to .context/monitors/liveness.jsonl + writes latest snapshot YAML."

  - id: liveness-boot
    name: "Liveness check on startup"
    schedule: "@reboot"
    command: "LIVENESS_BOOT_MARKER=1 /opt/999-Agentic-Engineering-Framework/agents/monitor/liveness-check.sh"
    source_file: agentic-audit.crontab
    origin_task: T-1269
    status: active
    description: "Runs liveness-check once at boot with boot_marker=1 so the log records a service-start datapoint."

  - id: pending-remind-daily
    name: "Pending-updates reminder (daily)"
    schedule: "0 10 * * *"
    command: "NTFY_ENABLED=true /opt/999-Agentic-Engineering-Framework/bin/fw pending remind"
    source_file: agentic-audit.crontab
    origin_task: T-1399
    status: paused
    description: "Pings human at 10:00 daily for pending-updates entries (blocked cross-project or cross-machine actions) older than 24h. Paused by default — activate via Watchtower /cron once a ntfy channel is configured."

  - id: mirror-sync-15m
    name: "Mirror cascade auto-recovery (15 min)"
    schedule: "*/15 * * * *"
    command: "flock -n /var/lock/agentic-cron-mirror-sync-15m.lock -c 'fw mirror sync --quiet'"
    source_file: agentic-audit.crontab
    origin_task: T-1594
    status: active
    description: "T-1591 Prevention #3 — every 15 min, push lagging mirror remotes (e.g. github) up to origin's HEAD when fast-forward safe. Diverged state is logged but never auto-recovered. Closes the gap exposed by T-1591 (OneDev mirror lag) without requiring OneDev API access."

  - id: escalation-drift-daily
    name: "Escalation drift scan (G-019 Layer B v1)"
    schedule: "23 5 * * *"
    command: "python3 tools/escalation-scan-v0.py"
    source_file: agentic-audit.crontab
    origin_task: T-1555
    status: active
    description: "Daily scan of completed tasks for symptom-fix candidates: bug-class without ## RCA (H1), repeated learning-IDs across 3+ tasks in 30 days (H2), bug-class without RCA AND no learning capture (H3). Writes machine-readable summary to .context/working/escalation-drift-LATEST.yaml + human-readable report to docs/reports/T-1549-escalation-scan-v0.md. Antifragile (no caching). Surfaces drift after Layer A (T-1550 RCA gate) baseline."

  - id: escalation-scan-v0-5
    name: "Escalation drift LLM augmentation (T-1727 — v0.5 runs after v0; idempotent over 7d)"
    schedule: "33 5 * * *"
    command: "python3 tools/escalation-scan-v0.5.py --window-days 30 --limit 200"
    source_file: agentic-audit.crontab
    origin_task: T-1727
    status: active
    description: "LLM-augmented escalation scan (T-1727). Routes via fw resolver dispatch (workflow=escalation-triage, worker_kind=ollama-loop) — second autonomous consumer of orchestrator substrate, primary closure-gauge for G-064. Runs at 5:33 UTC daily, 10 min after v0 (5:23 UTC). Idempotent over 7-day window: re-running within 7d skips already-scanned tasks. T-1750's tools/g064-readiness.py reads dispatches.jsonl filtered to this cron's window."

  # Peer-consult subscriber (T-1818) entry deferred: framework-side cron
  # registration will land in a small follow-up task alongside TermLink
  # T-1636's deployment, since `fw audit schedule install` writes /etc/cron.d/
  # (Tier 0). Until that joint deployment, the `fw peer subscribe` CLI verb
  # exists and is invocable on-demand, but no scheduled invocations happen.

  - id: bvp-auto-promote-hourly
    name: "BVP auto-promote pass (hourly; off by default)"
    schedule: "47 * * * *"
    command: "flock -n /var/lock/agentic-cron-bvp-auto-promote.lock -c 'fw bvp auto-promote'"
    source_file: agentic-audit.crontab
    origin_task: T-1932
    status: active
    description: "T-1932 (arc-006 BVP slice 14b). Hourly auto-promote pass — when policy/value-drivers.yaml auto_promote.enabled is false (the ship default), the verb prints a no-op message and exits 0; no side effects. When enabled by the human via `fw bvp auto-promote --enable --rationale ...` (§ACD-gated, D8), the pass scans captured tasks meeting bvp_norm ≥ bvp_norm_min AND cost ≤ cost_max, respects max_concurrent, and promotes captured → started-work with full R4 metadata logged to .context/bvp-auto-promote-log.yaml. Always safe to invoke; the policy flag is the only authority signal."

  - id: watchtower-rss-5m
    name: "Watchtower RSS observation (5 min, T-1611-B)"
    schedule: "*/5 * * * *"
    command: "/opt/999-Agentic-Engineering-Framework/agents/monitor/watchtower-rss-sample.sh"
    source_file: agentic-audit.crontab
    origin_task: T-1615
    status: active
    description: "T-1611-B passive observation. Samples Watchtower PID's RSS/VSZ/CPU/etime every 5 min. Distinguishes memory-leak re-saturation from request-rate queueing — if RSS climbs monotonically over many hours, T-1612's threaded=True fix is incomplete and T-1611-C (gunicorn swap) reopens. Outputs: .context/monitors/watchtower-rss.jsonl (10080-line retention) + watchtower-rss-latest.yaml."

  - id: bvp-estimator-sweep-15m
    name: "BVP estimator sweep (15 min, T-1923)"
    schedule: "*/15 * * * *"
    command: "flock -n /var/lock/agentic-cron-bvp-estimator-sweep.lock -c 'fw bvp estimate sweep --cron'"
    source_file: agentic-audit.crontab
    origin_task: T-1923
    status: active
    description: "T-1923 (arc-006 BVP slice 7b). Periodic sweep over active tasks (status ∈ {started-work, captured}) where bvp_scores: is empty AND (bvp_scores_proposed: older than 24h OR unscored: true was flagged by the SLA-fallback path). Heuristic engine takes ~10ms per task so the full sweep is sub-second; flock prevents overlap. M3 v2-delta skips writes when proposal hasn't changed materially. Pairs with fw resume's with-sla 10s hard cap (T-1923 AC#3/AC#4) — resume never blocks on the estimator; the sweep mops up any tasks the sync path flagged."

  - id: bvp-cost-estimator-sweep-15m
    name: "BVP cost-estimator sweep (15 min, T-1935)"
    schedule: "*/15 * * * *"
    command: "flock -n /var/lock/agentic-cron-bvp-cost-estimator-sweep.lock -c 'fw bvp estimate-cost sweep --cron'"
    source_file: agentic-audit.crontab
    origin_task: T-1935
    status: active
    description: "T-1935 (arc-006 BVP slice 7c). Parallel sweep to bvp-estimator-sweep-15m but for cost_estimate (the F8 x-axis). Same scope (started-work / captured, cost_estimate empty, proposed stale or unscored). Sovereignty: writes only to cost_estimate_proposed:, never to cost_estimate:. Heuristic: blast_radius from `components:` count, tier from tags/workflow_type lookup, effort from body length + AC count. R3 deterministic (10-run delta=0)."

  - id: inception-retrofit-rec-hourly
    name: "Inception Recommendation retrofit (hourly, T-2204 Slice D)"
    schedule: "19 * * * *"
    command: "flock -n /var/lock/agentic-cron-inception-retrofit-rec.lock -c 'fw inception retrofit-recommendations --apply'"
    source_file: agentic-audit.crontab
    origin_task: T-2208
    status: active
    description: "T-2204 Slice D — preventive backstop for the recommendation-completeness gate. Producer surfaces (T-2205 Write/Edit hook, T-2207 create-task.sh CLI, T-1716 do_inception_start) catch agent-initiated inception filings, and T-2206 emit_review/batch refuses agent handoff of empty-Recommendation inceptions. This cron catches the remaining paths the producer gates cannot reach: direct YAML writes that bypass tools, post-hoc `fw task update --workflow-type inception` flips, and the window before an operator wires the T-2205 hook into .claude/settings.json. Calls `fw inception retrofit-recommendations --apply` (lib/inception.sh do_inception_retrofit_recommendations, T-1716 Stream C) — idempotent and side-effect-free on already-clean state; injects DEFER stubs with self-retrofit attribution when an active inception's ## Recommendation block is empty or template-only AND no `**Recommendation:**` line exists."

  - id: resolver-loop-autonomous
    name: "Autonomous dispatch loop (PAUSED — operator enables)"
    schedule: "11,41 * * * *"
    command: "flock -n /var/lock/agentic-cron-resolver-loop.lock -c 'fw resolver loop --dispatch --max 1 --cooldown-min 30'"
    source_file: agentic-orchestrator.crontab
    origin_task: T-2491
    status: paused
    description: "T-2491 — bounded autonomous dispatch. Each tick picks at most ONE eligible task (agent-owned, scoped, non-inception, not in-flight, not focused, not in cooldown) and fires it through resolve+spawn. Registered PAUSED by design: wiring is agent initiative, turning unattended dispatch live is the operator's explicit act (`fw cron resume resolver-loop-autonomous`). --cooldown-min 30 prevents re-dispatching a non-advancing task every tick; --max 1 caps per-tick fan-out so dispatches.jsonl in-flight exclusion naturally rate-limits."
