# T-2521: pinned Workflow Designer build — the AEF↔832 integration contract.
#
# 832-Workflow-designer is the single source of truth (SoT). AEF vendors a
# RELEASED single-file build artifact — never 832 source — and never edits the
# vendored copy in place. Improvements route upstream to 832 (see protocol).
#
# Bump procedure (phase-1): 832 cuts a release → delivers the artifact into AEF
# (cross-project boundary means AEF cannot pull it; 832 pushes it, T-559) →
# operator/agent updates this pin → `fw designer sync --from <delivered>` verifies
# the delivered artifact's sha256 against `sha256:` below and installs it, rejecting
# (non-zero exit) on any mismatch. The pin is the reproducibility anchor.

version: "0.2.0"
sha256: "e301986b993baf58d5ed29ed25436d94b08ed2be910c6781b0f4b906c25c153a"
bytes: 395178

source_repo: "832-Workflow-designer"
source_artifact: "dist/aef-workflow-designer-0.2.0.html"
source_tag: "designer-v0.2.0"
source_manifest: "dist/MANIFEST.yaml"                 # 832 side
protocol: "docs/aef-designer-integration-protocol.md" # 832 side (pull → sha256-verify → pin → serve)

# Where the verified build lands inside AEF (tracked, served by the blueprint).
# 0.2.0 = 0.1.0 + T-177: emits horizon/workflowType/owner via aef:meta on task-like nodes.
vendored_path: "vendor/designer/aef-workflow-designer-0.2.0.html"

# CDN-fonts caveat (AC6): the build links Google Fonts. Diagramming + import/export
# function OFFLINE via system-font fallback, but a locked-down deployment will make
# (failing) font requests on load. "Self-contained single-file" is true for FUNCTION,
# not for NETWORK. Full offline is a separate 832-side task.
cdn_fonts: true
notes: "self-contained single-file editor; links Google Fonts CDN (offline fallback ok)"
