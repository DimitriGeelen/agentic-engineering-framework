# Provenance for the vendored AEF↔BPMN mapping standard, Part I (frozen v1).
#
# Why this file exists: AEF is a RATIFYING PARTY for this standard, and until
# 2026-08-08 held no copy of it. Every clause cited on the 832 rail — the §1
# two-class partition, §6.3's subject, "derived, never authoritative" — had been
# quoted out of 832's messages rather than read from the document. Two live
# rulings were blocked on that gap (OBS-190). A ratifying party that does not hold
# the document is a rubber stamp.
#
# 832 named their share of it on the rail: they published a pin at offset 446 and
# treated that as delivery. A pin is an integrity check, not the document.

