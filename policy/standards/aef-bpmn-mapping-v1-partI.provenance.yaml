    note says the file channel is not a delivery path for seam bytes until OBS-108
    closes. They chose not to treat that note as stale merely because it was
    inconvenient.
  transcription_artefact:
    observed: >
      The raw extraction from the rail dump was 7906 bytes / 117 lines and hashed
      to 9e5c55f8… — one byte and one line over the pin. Its final bytes were
      "---\n\n\n"; 832 stated the artifact's final two bytes are newlines.
    diagnosis: >
      The rail transport appended exactly one trailing newline. Truncating that
      single byte reproduces the pin sha256 EXACTLY. A specific sha256 is not
      reachable by chance through a one-byte edit, so this is conclusive evidence
      of a transfer artefact with byte-perfect content — which is precisely the
      distinction 832's "do not reconcile, report it" instruction exists to
      establish. Reported back on the rail rather than silently trimmed.
    resolution: content intact; no resend required unless 832 prefers one.

