# Review and dispatch backend registry (T-3583, T-3586)
# Single source of truth for which review harnesses exist, their cost class
# (internal vs paid) and whether a use needs operator approval first.
#
# Read by (lib/review_cost.py is the only parser):
#   - fw review cost log / report     (cost ledger, .context/costs/reviews.jsonl)
#   - fw review propose / approve     (paid-approval workflow)
#   - fw audit                        (weekly cost by backend/class, paid-without-approval WARN)
#   - PreToolUse hook check-paid-backend (blocks a paid call with no approved proposal)
#
# OPERATOR-OWNED AND EXTENSIBLE. The ladder will be expanded by the operator.
# Adding a backend is a data edit — no code names a backend except the pin below.
#   bin/fw review backend add --id X --name "..." --class internal [--match REGEX]...
#     An agent may add an INTERNAL backend (logged to .context/costs/registry-changes.jsonl).
#     Adding a PAID backend is an operator action (--i-am-human).
#   bin/fw review backend set --id X --class ... --approval-required ... --i-am-human
#     Changing class or approval_required is an operator action; agents are refused.
#   openrouter is PINNED paid + approval_required (operator 2026-09-30: "OpenRouter is
#   always paid"). A registry that reclassifies it does not load at all.
#
# Fields: id, name, harness_class, cost_class (internal|paid), approval_required,
# cost_estimate_method, description, and optional match: — regexes tried against a
# Bash command by the hook, case-sensitive (default: the id as a whole word). A paid backend must
# have approval_required: true.
#
# Optional worker_kind + vendor (T-3580 round 5): the ONE kind→vendor mapping. `worker_kind` is a
# `fw termlink dispatch --worker-kind` value; `vendor` is who runs it. The dispatcher prints it
# (`fw termlink worker-kinds --vendors`) and the verdict ledger derives every review dispatch's
# vendor from it, so a panel counts vendors this file names, never free text. One kind, one vendor.
#
# Optional model + binary (T-3580 round 8, T-3582): the ONE model and the ONE absolute binary a
# review worker of that kind is launched with. The dispatcher reads both AS COMMITTED at the
# reviewed revision; a caller cannot choose either. Without `binary:` the dispatcher resolves the
# kind's binary itself (claude: PATH at dispatch; ollama-loop: tools/ollama-tool-loop.py).
# codex, opencode and antigravity are "harness" kinds: their runtime runs them read-only in a
# `git archive` export of the reviewed revision and records their printed verdict on their behalf
# (docs/harnesses.md).
#
# credential (T-3766): WHERE the backend's credential lives — never the value (a value-looking
# string is refused). `source: env-file` + `env:` (the variable a runner expects) + optional
# `files:` (ordered KEY=VALUE files to read it from); `source: cli-login` or `none` + `note:`
# when the CLI authenticates itself. Resolve with `bin/fw review credential <id> --check`
# (masked) or `--exec -- <cmd>`. The resolver reads the credential blocks as COMMITTED at HEAD.
# Never ask the operator for a credential this registry names.

backends:
  - id: claude-code
    name: "Claude Code Subscription"
    harness_class: subscription
    cost_class: internal
    approval_required: false
    cost_estimate_method: unmetered
    description: "Claude Code session with subscription harness"
    worker_kind: claude
    vendor: anthropic
    credential:
      source: cli-login
      note: "Claude Code's own login (claude /login; OAuth state in ~/.claude) — the CLI authenticates itself"
    match:
      - '\bclaude\s+(-p|--print)\b'
      - '--worker-kind[= ]claude\b'

  - id: codex
    name: "OpenAI Codex (GPT-4 turbo with code interpreter)"
    harness_class: subscription
    cost_class: internal
    approval_required: false
    cost_estimate_method: unmetered
    description: "Codex review via subscription account (ChatGPT login, ~/.codex/auth.json)"
    worker_kind: codex
    vendor: openai
    credential:
      source: cli-login
      note: "codex login with the ChatGPT account (~/.codex/auth.json) — the CLI authenticates itself"
    model: gpt-6-astra
    binary: /root/.nvm/versions/node/v22.22.1/bin/codex
    match:
      - '(^|[;&|]\s*|/)codex\s'
      - '--worker-kind[= ]codex\b'

  - id: opencode
    name: "Z.ai Coding Plan (opencode)"
    harness_class: subscription
    cost_class: internal
    approval_required: false
    cost_estimate_method: unmetered
    description: "Z.ai opencode via subscription coding plan"
    worker_kind: opencode
    vendor: zai
    credential:
      source: cli-login
      note: "opencode auth login with the Z.ai coding plan (opencode's own auth store) — the CLI authenticates itself"
    model: zai-coding-plan/glm-5.2
    binary: /root/.opencode/bin/opencode
    match:
      - '(^|[;&|]\s*|/)opencode\s'
      - '--worker-kind[= ]opencode\b'

  - id: local-gpu
    name: "Local GPU (operator's machine)"
    harness_class: local
    cost_class: internal
    approval_required: false
    cost_estimate_method: zero
    description: "Review run on the operator's local hardware"
    worker_kind: ollama-loop
    vendor: ollama-local
    credential:
      source: none
      note: "local Ollama on the operator's hardware — no credential"

  - id: openrouter
    name: "OpenRouter (pay-per-use)"
    harness_class: pay_per_use
    cost_class: paid
    approval_required: true
    cost_estimate_method: tokens_estimated
    description: "OpenRouter API for on-demand model access; requires approval per request"
    credential:
      source: env-file
      env: OPENROUTER_API_KEY
      files:
        - /root/.litellm-openrouter.env
    match:
      - 'https?://([a-z0-9-]+\.)*openrouter\.ai'
      - '(^|[;&|]\s*|/)openrouter\s'
      - '\$\{?OPENROUTER_API_KEY'
      - '\breview\s+credential\s+openrouter\b.*--exec\b'

  - id: antigravity
    name: "Google Antigravity (agy CLI)"
    harness_class: "subscription"
    cost_class: "internal"
    approval_required: false
    cost_estimate_method: "unmetered"
    description: "Antigravity 1.1.15 CLI on the operator's Google account; runs as user dimitri-mint-dev via sudo -n -u dimitri-mint-dev -H <binary> -p ... --mode plan --sandbox (operator approved 2026-09-30; the absolute path is needed because sudo's secure_path does not include ~/.local/bin). Spare panel seat (after claude, codex, opencode in registry order)."
    worker_kind: antigravity
    vendor: google
    credential:
      source: cli-login
      note: "agy CLI signed in to the operator's Google account as user dimitri-mint-dev — the CLI authenticates itself"
    binary: /home/dimitri-mint-dev/.local/bin/agy
    match:
      - "\\bagy\\b"
      - '--worker-kind[= ]antigravity\b'

