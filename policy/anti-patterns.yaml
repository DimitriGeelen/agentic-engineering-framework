# Anti-pattern catalogue for the reviewer agent (T-1443 v1.0)
#
# Severity is split into two axes per L-261 (severity-axis conflation):
#   detection_confidence  — how reliably we can detect the pattern
#                           values: deterministic | heuristic | semantic
#   lie_severity          — if the pattern fires, how badly does the evidence lie
#                           values: complete | severe | partial | narrow | staleness
#
# Action urgency / risk / blast-radius are extrinsic (task-level) and
# combined via policy/action-matrix.yaml in later versions (v1.2+).
#
# v1.0 scope: 4 seed patterns. v3+ expands to 12 categories via mining
# external test-smell literature, internal corpus, and peer-agent dispatch.
#
# Schema version: 1
# Source: T-1443 inception + spikes A/D/F/G/I

schema_version: 2
catalogue_version: "v1.3-seed"
policy_origin: T-1443

patterns:
  - id: tautology
    name: "Tautological verification"
    detection_confidence: deterministic
    lie_severity: severe
    detector_ref: "lib.reviewer.static_scan:detect_tautology"
    description: >
      Verification command that proves nothing because it asserts what it just did.
      Examples: `echo "tests pass" && true`, `[ 1 -eq 1 ]`, `true`, `: # ok`.
      The command exits 0 unconditionally; no real check happens.
    examples_positive:
      - "true"
      - "echo 'all good' && true"
      - "[ 1 = 1 ]"
      - ": # placeholder"
    examples_negative:
      - "bin/fw test unit"
      - "test -f required-file.txt"
      - "grep -q 'expected' output.txt"

  - id: empty-body
    name: "Empty acceptance-criterion body"
    detection_confidence: deterministic
    lie_severity: severe
    detector_ref: "lib.reviewer.static_scan:detect_empty_body"
    description: >
      Acceptance criterion with no real content — placeholder text like
      "[First criterion]", "TODO", "...", or empty after stripping markers.
      A checked AC with empty body is a checkbox-only completion.
    examples_positive:
      - "[ ] [First criterion]"
      - "[x] TODO"
      - "[x] ..."
      - "[x] tbd"
    examples_negative:
      - "[x] lib/reviewer/static_scan.py exists with 4 anti-pattern detectors"

  - id: swallowed-errors
    name: "Errors swallowed or hooks bypassed"
    detection_confidence: deterministic
    lie_severity: severe
    detector_ref: "lib.reviewer.static_scan:detect_swallowed_errors"
    description: >
      Verification or commit chain that suppresses error signals. Includes
      `--no-verify` on commit/push, `2>/dev/null || true` on critical commands,
      `set +e` without re-arming, and `|| true` after the only assertion.
      Indicates real failures may have been hidden.
    examples_positive:
      - "git commit --no-verify -m '...'"
      - "bin/fw test unit 2>/dev/null || true"
      - "make test || true"
    examples_negative:
      - "bin/fw test unit"
      - "git commit -m 'T-1445: ...'"
      - "command || (echo 'failed' && exit 1)"

  - id: output-spoofing
    name: "Output-spoofing success markers"
    detection_confidence: heuristic
    lie_severity: partial
    detector_ref: "lib.reviewer.static_scan:detect_output_spoofing"
    description: >
      Evidence relies on echoed strings like "TESTS PASS" without an
      assertion that those strings actually came from a real test runner.
      Pattern: a line that prints success text followed by no exit-status check.
      Heuristic — the false-positive rate is non-trivial; v1.0 raises CONCERN
      not FAIL on this pattern alone.

      v1.1: widened token set (TESTS PASSED, BUILD SUCCESSFUL, VERIFIED, GREEN).
    examples_positive:
      - "echo 'TESTS PASS' >> evidence.txt"
      - "printf 'BUILD OK\\n' && exit 0"
      - "echo 'VERIFIED' >> log"
    examples_negative:
      - "bin/fw test unit | tee /tmp/test.log; grep -q 'PASS' /tmp/test.log"
      - "test \"$(./run-tests.sh)\" = 'OK'"

  - id: empty-output-success
    name: "Exit-code-only verification with discarded output"
    detection_confidence: heuristic
    lie_severity: partial
    detector_ref: "lib.reviewer.static_scan:detect_empty_output_success"
    description: >
      Verification line that redirects output to /dev/null and relies solely
      on the exit code. Many commands return 0 even when no real work is done
      (compilers without input, idempotent operations, etc.). Asserting on
      output content is the antifragile alternative.
      Exempt: `grep -q`, `test`, `[ ]` — these are designed for silent assertion.
    examples_positive:
      - "bin/fw doctor > /dev/null"
      - "make build > /dev/null 2>&1"
    examples_negative:
      - "grep -q 'expected' file.txt"
      - "test -f required.json"

  - id: skip-as-pass
    name: "Skipped/collected tests treated as pass"
    detection_confidence: deterministic
    lie_severity: severe
    detector_ref: "lib.reviewer.static_scan:detect_skip_as_pass"
    description: >
      Verification command runs in collect-only or skip-mode, exiting 0 without
      executing the underlying assertion. `pytest --collect-only`, `make test
      SKIP=true`, `xfail`-decorated tests, etc. The runner reports success
      but the test never ran.
    examples_positive:
      - "pytest --collect-only tests/"
      - "make test SKIP=true"
      - "pytest -m 'not slow' --xfail tests/"
    examples_negative:
      - "pytest tests/unit/"
      - "bin/fw test integration"

  - id: mock-only-integration
    name: "Integration AC verified only by unit tests"
    detection_confidence: heuristic
    lie_severity: partial
    detector_ref: "lib.reviewer.static_scan:detect_mock_only_integration"
    description: >
      AC promises integration / e2e / cross-process behavior, but verification
      commands only reference `tests/unit/` paths. Unit tests cannot cover
      integration claims by definition.
      Heuristic — does not cover semantic mock detection (the harder case).
    examples_positive:
      - "AC: 'integration tested' + Verification: pytest tests/unit/test_x.py"
    examples_negative:
      - "AC: 'integration tested' + Verification: pytest tests/integration/"
      - "AC: 'unit test exists' + Verification: pytest tests/unit/"

  - id: human-ac-mechanical-signal
    name: "[REVIEW] Human AC has mechanical Expected clause (should be [REVIEWER])"
    detection_confidence: heuristic
    lie_severity: partial
    detector_ref: "lib.reviewer.static_scan:detect_human_ac_mechanical_signal"
    description: >
      A `[REVIEW]`-prefixed Human acceptance criterion whose `**Expected:**` clause
      contains mechanical signals (grep/wc/exit-code/file-exists/curl/HTTP status)
      AND no taste signals (feels/reads/cleanly/tone/voice/intuitive/rhythm)
      AND no strategic markers in the body (decide/approve/authorize/sign-off).

      Such ACs should be `[REVIEWER]` (Agent AC + `## Verification` with reviewer
      command) instead — the reviewer agent or shell can verify them deterministically.

      Origin: T-1878 inception found 13% mis-class rate on partial-completes (412:7
      `[REVIEW]:[REVIEWER]` adoption gap). T-1894 manually re-classed 4 such ACs
      across arc-grooming partial-completes; this detector is the structural catch
      that fires at task close so the next round doesn't need a manual sweep.

      Override: `fw reviewer override add T-XXX --pattern human-ac-mechanical-signal
      --ac N --reason "..." --ttl 90` suppresses the finding (T-1443 v1.4).
    examples_positive:
      # I/O-checking dialect (T-1896 original):
      - "[REVIEW] Confirm endpoint returns 200 — Expected: `curl -sf URL` exits 0"
      - "[REVIEW] Check log file — Expected: `grep -q ERROR /var/log/app.log` returns 1"
      # Conformance-checking dialect (T-1897 widening):
      - "[REVIEW] Confirm block message complete — Expected: message names the missing deliverable and points at inception override flag"
      - "[REVIEW] Confirm focus-drift block — Expected: message shows current focus task and contains the --switch-focus override flag"
      - "[REVIEW] Confirm closure side-effect — Expected: audit log row appended to .context/audits/foo.jsonl"
    examples_negative:
      - "[REVIEW] Dashboard reads cleanly — Expected: layout feels intuitive"
      - "[REVIEW] Decide whether to close arc — Expected: arc transitions to closed"
      - "[REVIEW] Banner reads as obvious supersedes note — Expected: voice + framing tells a fresh reader"
      # Gate 2b (T-1897): taste in AC LINE suppresses even if Expected has mechanical signals:
      - "[REVIEW] Reviewer finding wording reads usefully — Expected: Finding text names the AC by index (taste 'reads' in header wins)"

  - id: reviewer-prose-mismatch
    name: "[REVIEWER] Human AC has prose-quality Expected (should be [REVIEW] or paired)"
    detection_confidence: heuristic
    lie_severity: partial
    detector_ref: "lib.reviewer.static_scan:detect_reviewer_prose_mismatch"
    description: >
      A `[REVIEWER]`-prefixed Human acceptance criterion whose body or
      `**Expected:**` clause contains taste / prose-quality vocabulary
      (reads/tone/rhythm/intuitive/cleanly/voice/cohesive/...).

      `[REVIEWER]` means "verifiable by `fw reviewer T-XXX` static scan", but
      the reviewer has zero detectors for natural-language prose quality —
      its 9 detectors operate on YAML/shell structural patterns only.

      When such ACs are filed as `[REVIEWER]`, the reviewer silently ignores
      them (no detector fires) and reports verdict on OTHER ACs. The Overall
      status looks identical at the surface whether the scanner had something
      to say or stayed silent — false-success class (worse than acknowledged
      failure per the design-dialogue antifragility principle).

      Such ACs should be `[REVIEW]` (genuine human-taste judgment) OR kept as
      `[REVIEWER]` only when paired with an explicit `[REVIEW]` AC covering
      the prose dimension. The `[REVIEWER]` prefix is necessary-but-not-
      sufficient on prose-quality ACs.

      Origin: T-1947 (L-409). Surfaced via T-1811's own AC#1 `[REVIEWER]
      Updated CLAUDE.md section reads clearly` — the reviewer reported
      CONCERN on Agent AC#3 but silently passed over the prose AC.

      Override: `fw reviewer override add T-XXX --pattern reviewer-prose-mismatch
      --ac N --reason "..." --ttl 90` when the AC is genuinely paired with a
      `[REVIEW]` sibling (T-1443 v1.4).
    examples_positive:
      - "[REVIEWER] Updated section reads clearly — Expected: Reviewer returns PASS"
      - "[REVIEWER] Form renders cleanly inside review page rhythm — Expected: panel layout reads intuitively"
      - "[REVIEWER] Document reads accurately — Expected: matches shipped implementation tone"
    examples_negative:
      - "[REVIEWER] Block message names both bypass mechanisms — Expected: message contains '--switch-focus' and 'FW_SWITCH_FOCUS=1'"
      - "[REVIEW] Dashboard reads cleanly — Expected: layout feels intuitive (prefix is [REVIEW], not [REVIEWER])"
      - "[REVIEWER] Reviewer PASS — Expected: `bin/fw reviewer T-XXX 2>&1 | grep -q 'Overall:.*PASS'`"

  - id: l387-sigpipe-risk
    name: "L-387 SIGPIPE-prone pipe to terminal grep -q"
    detection_confidence: heuristic
    lie_severity: partial
    detector_ref: "lib.reviewer.static_scan:detect_l387_sigpipe_risk"
    description: >
      Verification command of the shape `<streaming-cmd> [...] | grep -q[E]? "..."`.
      Under `set -eo pipefail` (the regime P-011 runs verification in), `grep -q`
      exits 0 on first match and closes stdin; the upstream streaming command
      (`bin/fw doctor`, `bin/fw audit`, `bats`, `find`, `ls *`, brace-pipelines)
      receives SIGPIPE while still writing → exits 141. pipefail propagates 141
      → P-011 records the verification as failed even though the pattern was
      present. Verification block lies: green output reads "PATTERN matched" but
      the gate refuses close. Captured 7+ times (T-1716, T-1838, T-1862, T-1863,
      T-2008, T-1701, T-1707) across two sessions before being detected; spike
      report at docs/reports/T-2057-l-387-detector-spike.md.

      Safe form (~26 existing tasks): capture upstream first, then grep the
      capture — `out=$(cmd 2>&1); echo "$out" | grep -q "PATTERN"` or
      `cmd > /tmp/.out 2>&1; grep -q "PATTERN" /tmp/.out`.

      Heuristic — false-positive class is `echo "$..."| grep -q` and
      `printf "..."| grep -q` (finite, bounded upstream, no SIGPIPE risk).
      The detector exempts those shapes explicitly.
    examples_positive:
      - 'bin/fw doctor 2>&1 | grep -q "All checks passed"'
      - 'bats tests/unit/test_x.bats | grep -q "ok 5"'
      - 'find .tasks/active -name "T-*.md" | grep -q "T-2059"'
      - '{ bin/fw audit 2>&1; } | grep -qE "(FAIL|WARN)"'
      - 'bin/fw doctor 2>&1 | grep -cE "FAIL" | grep -q "^0$"'
    examples_negative:
      - 'out=$(bin/fw doctor 2>&1); echo "$out" | grep -q "OK"'
      - 'bin/fw doctor 2>&1 > /tmp/d; grep -q "OK" /tmp/d'
      - 'echo "yes" | grep -q "yes"'
      - 'printf "ok\n" | grep -q "ok"'

  - id: AC-verify-mismatch
    name: "Checked AC names a file path the verification never touches"
    detection_confidence: heuristic
    lie_severity: narrow
    detector_ref: "lib.reviewer.static_scan:detect_ac_verify_mismatch"
    description: >
      A checked Agent AC mentions a specific source file path with a code
      extension (.py, .sh, .yaml, etc.), but no verification line references
      that path. Suggests the AC was ticked without mechanical proof of the
      file's existence/correctness.
      Conservative — only fires when path is explicitly named in AC body and
      not in any non-comment verification line. False-positive risk: aspirational
      paths in long AC narratives.
    examples_positive:
      - "AC: 'lib/x/foo.py exists' (checked) + Verification: no reference to lib/x/foo.py"
    examples_negative:
      - "AC: 'lib/x/foo.py exists' (checked) + Verification: 'test -f lib/x/foo.py'"

# Verdict thresholds (v1.0):
#   any pattern with lie_severity in {complete, severe} fires → FAIL
#   any pattern with lie_severity in {partial, narrow}        → CONCERN
#   any pattern with lie_severity = staleness                 → CONCERN
#   no patterns fire                                          → PASS
#
# v1.1+ adds task-level risk/blast-radius modulation via action-matrix.yaml.
verdict_thresholds:
  fail_on_severities: [complete, severe]
  concern_on_severities: [partial, narrow, staleness]
  pass_when_no_findings: true
