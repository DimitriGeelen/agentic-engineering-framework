- id: T-3294
  name: 'Gate catch-22 under agent control: T-2188 check-inception-schema validates the file ON DISK,
    not the proposed edit. It ALLOWED the workflow_type build->inception transition that created the invalid
    state, then blocked every subsequent Write/Edit — including the edit that adds the target_blast_radius/voi_score
    fields it demands. Its documented bypass FW_ALLOW_INCEPTION_SCHEMA_DRIFT=1 is an env prefix, which
    the Write/Edit tool surface cannot carry (T-1890/L-399 producer-consumer parity: bypass exists for
    Bash only). Compounded by G-020 blocking ''fw task update T-XXX --type inception'' — the exact command
    G-020''s own block message recommends as the unblock. Hit live in T-3025 filing; escaped only by work-on
    + a shell-side python rewrite with the env prefix. Two independent gates each recommending a remedy
    they themselves refuse.'
  description: Promoted from observation OBS-273
- id: T-3297
  name: 'PRE-PUSH AUDIT GATE CAN DEADLOCK AGAINST CRON AUDIT PILEUP, WITH NO TIER-2 ESCAPE. The gate (T-2930/OBS-221,
    agents/git/lib/hooks.sh:915) correctly BLOCKS on exit 75 (lock contention) rather than false-passing
    — that reasoning is sound and should stay. What has gone stale is its premise: the block message says
    ''usually the daily cron audit — it finishes within a minute or two''. Observed 2026-08-16: THREE
    concurrent 999-framework audits (PIDs 250439, 251163, 365610) all running ''audit.sh --section structure,compliance,quality,discovery
    --cron'', ages 3:45/3:45/2:47, plus 2 more from 050-email-archive — 5-7 audit.sh across the host.
    structural-30m fires every 30 min; if a run exceeds that, runs stack and the lock is effectively never
    free. The pre-push gate runs ''--section structure'', the SAME section the cron holds, so it contends
    every time. Net effect: 5 commits could not be pushed for 15+ min, and the ONLY documented escape
    is Tier 0 ''git push --no-verify''. A gate whose wait-it-out advice no longer holds and whose only
    bypass is Tier 0 pushes agents toward Tier 0 for a routine push. Sibling to OBS-304 (full audit >10
    min, no partial output) — same root (audit runtime), different consequence (there: unusable as an
    AC; here: push path unreliable). Candidate fixes: cron overlap guard (skip if lock held), a Tier-2
    env bypass for contention-only exit 75 distinct from the Tier-0 --no-verify, or bounded lock wait
    in the gate itself.'
  description: Promoted from observation OBS-305
- id: T-3299
  name: 'G-020 scope gate blocks BOTH escape routes its own block message prescribes — an agent focused
    on a placeholder-AC build task can be wedged. Measured 2026-08-29 (T-3216 run, focus landed on auto-created
    T-3215/T-3216). The message names: (1) ''Edit the task file: replace the [First …] placeholder ACs
    with real ACs'' (literal placeholder token elided here so the review-gate''s placeholder scan does
    not match this quotation); (2) ''bin/fw task update T-XXX --type inception''. Route (2) is refused
    by check-active-task itself — not on the read-only allowlist (agents/context/lib/safe-commands.sh),
    so the gate quotes the remedy back verbatim while refusing it. Route (1) is refused for every SHELL
    form (heredoc, sed -i, any redirect all match the write-pattern regex); it survives only via a Write/Edit
    TOOL call, which is not routed through the same regex. So an agent whose only write surface is bash
    has no legal move at all. I escaped only by using the Edit tool. Also blocked in the same state: ''fw
    task update --horizon later'', ''fw push'', and plain reads that merely contain sed/awk/2>/dev/null
    — the write-pattern regex is matching read commands (sibling of T-2410, already filed, but the deadlock
    is distinct from the false-positive class). Fix direction, cheapest first: allowlist the gate''s own
    two prescribed remedies in safe-commands.sh so the block message is reachable from the blocked state.
    Structural lesson worth a rail: a block message is an executable contract — for every gate that prints
    a remedy, run that remedy verbatim WHILE the gate is firing, not from a clean shell. Ours was written
    by someone who was not blocked at the time. Sibling to L-399/T-1890 producer-consumer parity, one
    notch worse: there the bypass existed and was rejected downstream; here the gate rejects it itself.
    Second trigger in the same run: an automated process created T-3215 in started-work with template
    ACs and TOOK FOCUS from the session twice, which is how the session entered the wedged state at all
    — that focus-stealing is worth its own look.'
  description: Promoted from observation OBS-353
- id: T-3300
  name: 'tests/unit/ac_counter_sed_range_one_line_comment.bats:34 asserts an EXACT count — grep -c of
    the ''>''-tolerant comment-strip regex in agents/task-create/update-task.sh must equal 2. There are
    now 3 (lines 138, 163, 1590), all correct uses of the tolerant form, so the suite is RED for adding
    a third correct site. Measured identical (3) at HEAD and in the working tree, so it predates T-3235''s
    edit. The assertion is testing the wrong property: what T-2554 cares about is that NO occurrence uses
    the broken ''<!--[^>]*-->'' form and that the tolerant form is present — a floor, not an equality.
    An exact count turns every legitimate new call site into a false red, and a false red in a suite the
    daily audit does not run (audit covers tests/lint only, not tests/unit) is a red nobody sees. Fix
    shape: replace -eq 2 with -ge 2 and keep the existing zero-occurrences-of-the-broken-form assertion
    as the real invariant.'
  description: Promoted from observation OBS-359
- id: T-3302
  name: 'STRUCTURAL: nothing runs tests/unit on a schedule, so reds there are invisible until someone
    happens to run an adjacent suite. Measured today while landing T-3235: TWO independent pre-existing
    failures surfaced by accident — ac_counter_sed_range_one_line_comment (OBS-359, brittle exact-count
    assertion) and inception_decide_emit_review_post_move (separate note). Both predate today''s edits;
    neither was reported by anything. The daily audit''s ''Invariant suite green'' line covers tests/lint
    ONLY (104 invariants, agents/audit + bin/fw glob tests/lint/*.bats), and its green reads to an agent
    like the test corpus is green. Same family as T-2697 (tests/lint itself was globbed by no runner for
    months while ''fw test lint'' ran shellcheck and reassured) and as peer 832''s T-654 BUG 2 (a detector
    with no delivery) and their OBS-333 (a 13-minute bridge suite nothing schedules). The failure mode
    is not ''tests fail'' — it is ''a green line that answers a narrower question than the one the reader
    is asking''. Candidate fix: a scheduled tests/unit run whose result is surfaced the way the invariant
    suite is, plus an audit line that states WHICH corpus it examined rather than the bare word ''suite''.'
  description: Promoted from observation OBS-361
- id: T-3303
  name: 'CORRECTION to OBS-362 and OBS-363 — root cause found, and it is neither suite. The harness reported
    three background commands as ''killed'', but the kill did not reach their children: bats process TREES
    kept running against the LIVE repo for ~40 minutes afterwards (PIDs 3155301/3155304/3155345/3155346
    for a 68-suite tests/unit run, 3483957+ for a tests/lint run), still appending to /tmp/.t3235adj.out
    and still executing update_task.bats. That orphan is what rewrote .context/working/focus.yaml to ''current_task:
    T-001'' — twice, including once immediately after I had restored it, which is why it looked like the
    suite I had just run. It also explains the phantom measurement: a file I created with 32 tests read
    back at 75 lines containing ''ok 379'', because two writers were interleaving into it, and grep -c
    returned nothing because the file was being rewritten under the read. OBS-363''s ''update_task.bats
    does not complete at 280s'' is now suspect for the same reason — the timing was taken while an orphan
    was running the same suite concurrently against the same live tree; re-measure on a quiet host before
    treating it as a property of the suite. Terminated with pkill -TERM -f bats-core; 0 remain. THE CLASS:
    a background test run that outlives its supervisor is indistinguishable, from inside the session,
    from the session''s own state changes — the agent attributes the damage to whatever it did most recently.
    Two guards worth having: assert no bats process is already running before starting one, and check
    for orphaned bats trees the way fw termlink cleanup checks for orphaned dispatches (T-577, exact same
    shape: the supervisor deregisters, the process does not die).'
  description: Promoted from observation OBS-364
- id: T-3305
  name: 'T-3179''''s partial-complete commit allowance does not recognise ''''bin/fw git commit'''' -
    only bare ''''git commit''''. Measured on T-3251: with the task at work-completed and focus on it,
    ''''bin/fw git commit -m ...'''' was blocked three times (multi-line message, single-line message,
    with and without an env prefix), each time with a block message whose own second line says: "Note:
    ''''git commit'''' IS allowed here (T-3179) - a partial-complete task may always checkpoint its own
    verified work under its own ID." Bare ''''git commit -m ...'''' succeeded immediately with the same
    staged content. The allowance exists and works; it just does not cover the framework''''s own canonical
    commit verb, which CLAUDE.md''''s Quick Reference lists first (''''fw git commit -m T-XXX: ...'''').
    In this state the block message is actively misleading: it names the allowance, says to run the commit
    bare, and the agent re-runs the fw-prefixed form because that IS the bare form of the documented verb.
    Cost: three blocked attempts and a workaround that bypasses the fw wrapper''''s own pre-commit path.
    Fix shape: add the ''''bin/fw git commit'''' / ''''fw git commit'''' prefixes to the same allowance
    in agents/context/lib/safe-commands.sh (or wherever the T-3179 exemption matches), pinned by a test
    exercising BOTH spellings under a work-completed focus - the single-spelling test is what let this
    ship.'
  description: Promoted from observation OBS-366
- id: T-3306
  name: 'Close-gate self-reentry deadlock: ''fw task update T-1719 --status work-completed'' hung 3h+
    because its P-011 verification runs t1719_happiness_signal.bats, which itself invokes ''fw task update
    T-1719 --happiness N'' on the SAME task mid-close. Direct suite run passes 37/37 in minutes; only
    under the close gate does it wedge (parent update-task.sh holds the task''s close context). Sibling
    of OBS-363/365 (update_task bats hangs). Class fix candidates: verification runs with FW_TASK_UPDATE_NO_REENTRY
    guard, or bats that mutate the task-under-close use a fixture task id, or gate detects self-referential
    verification lines. Killed tree at 15:5xZ, exit 144, T-1719 still active/started-work, no corruption
    observed.'
  description: Promoted from observation OBS-372
- id: T-3318
  name: 'fw mirror status reports ''github: in sync'' while github/master was 404 commits behind origin/master.
    It compares origin''s HEAD (which points at the checked-out branch, t2539-staging) against github''s
    same-named branch and says NOTHING about master — then renders a green line. ''fw mirror sync'' has
    the same scope: it synced t2539-staging only and reported ''synced 9cf2eb6f4 -> 398bf5385'' as success.
    Exactly the T-3105 class: a check that does not state the ref set it compared, so ''in sync'' and
    ''looked at one branch'' render identically. Fix shape: name the refs compared and their count, per
    the R5 rule in docs/design/task-corpus-concurrency-model.md.'
  description: Promoted from observation OBS-337
- id: T-3319
  name: 'fw bvp --include-proposed --quadrant hv-lc returns a degenerate ranking: the top 10 tasks all
    score BVP=108, NORM=0.40, COST=3.6 — identical to three significant figures. A ranking whose entries
    are indistinguishable cannot order work, which is its only purpose. Two compounding causes: (1) 120/147
    tasks (82%) have no measurable cost because components: is unresolved (T-3068), so quadrant thresholds
    are computed over 27 tasks and applied to 147; (2) the v1 heuristic estimator appears to assign the
    same driver scores to any build task with similar AC/line counts, so proposed scores carry almost
    no per-task information. Same family as the T-3105 false-green class: the output looks like signal
    and is not. Relevant now that the standing directive is to prioritise HV/LC and HV/HC from this ranking.'
  description: Promoted from observation OBS-338
- id: T-3324
  name: 'fw doctor spends ~79s of every run on ''bats --count tests/unit/'' (606 files, 5161 tests) to
    print a cosmetic count on the ''Test infrastructure'' line (bin/fw:1931). doctor --quick does not
    skip it — check 9 has no _doctor_quick_skip guard. Measured 2026-09-05 during T-3281: ''fw doctor
    --quick'' exceeded a 120s timeout having reached only check 8. doctor is invoked by hooks, cron and
    pre-push paths, so the cost is paid constantly and it makes doctor unusable inside test suites. Candidate
    fixes: guard check 9 with _doctor_quick_skip, cache the count, or replace with a cheap ''ls tests/unit/*.bats
    | wc -l'' file count.'
  description: Promoted from observation OBS-368
- id: T-3326
  name: 'Stale-verification class: P-011 lines and unit tests anchored to MUTABLE CORPUS STATE rot as
    the corpus moves, blocking closes for reasons unrelated to the code under test. Two instances measured
    in one close-out sweep (2026-09-06): (1) T-2969 verification line 3 greps ''fw audit --section structure''
    for the ''readme-first-run is draft with all 2 constituent'' line — that arc moved draft->in-progress
    since authoring, so the warning legitimately vanished and the close is blocked by corpus drift; (2)
    T-2871''s tests/unit/test_aef_meta_census.py pins exact census counts (56 carriers, 102 state hits)
    from the August measurement — corpus grew to 74/138, tests red, close blocked; the assertion cannot
    distinguish ''measurement method broke'' from ''corpus changed''. Fix shape per instance: anchor tests
    to committed FIXTURE corpora (hermetic), or pin the invariant/property rather than the live count;
    verification lines should not grep live-audit output for specific corpus entities. Sibling of the
    false-green/false-red family (T-1828, T-3105): a check whose subject can drift under it measures the
    drift, not the code.'
  description: Promoted from observation OBS-377
- id: T-3329
  name: 'Running the bats suite against the live repo rewrites .context/working/focus.yaml (observed:
    reset to T-001 repeatedly during a 62-file run), which makes the focus-drift gate block every write
