# Template arc for T-5221 tests: one municipality scan, 13 tasks (the shape 1409 runs).
template: municipality-scan
params:
  municipality: null
  region: west
arc:
  id: "scan-{municipality}"
  name: "Municipality scan: {municipality}"
  description: "Scan of {municipality} ({region}) from the municipality class file."
  headline_mechanic: "An analyst runs the scan for {municipality} and sees the published report with every source checked."
  start: true
  anchor: 1
tasks:
  - name: "Collect source documents for {municipality}"
    description: "Step 1 of the {municipality} scan. Literal braces: {{not-a-param}}."
    type: build
    owner: agent
    horizon: now
    tags: [scan, "{region}"]
  - name: "Index council minutes for {municipality}"
    description: "Step 2 of the {municipality} scan. Literal braces: {{not-a-param}}."
    type: build
    owner: agent
    horizon: next
    tags: [scan, "{region}"]
  - name: "Extract budget lines for {municipality}"
    description: "Step 3 of the {municipality} scan. Literal braces: {{not-a-param}}."
    type: build
    owner: agent
    horizon: next
    tags: [scan, "{region}"]
  - name: "Map service contracts for {municipality}"
    description: "Step 4 of the {municipality} scan. Literal braces: {{not-a-param}}."
    type: build
    owner: agent
    horizon: next
    tags: [scan, "{region}"]
  - name: "Classify zoning decisions for {municipality}"
    description: "Step 5 of the {municipality} scan. Literal braces: {{not-a-param}}."
    type: build
    owner: agent
    horizon: next
    tags: [scan, "{region}"]
  - name: "Cross-check registry entries for {municipality}"
    description: "Step 6 of the {municipality} scan. Literal braces: {{not-a-param}}."
    type: build
    owner: agent
    horizon: next
    tags: [scan, "{region}"]
  - name: "Score data completeness for {municipality}"
    description: "Step 7 of the {municipality} scan. Literal braces: {{not-a-param}}."
    type: build
    owner: agent
    horizon: next
    tags: [scan, "{region}"]
  - name: "Draft findings summary for {municipality}"
    description: "Step 8 of the {municipality} scan. Literal braces: {{not-a-param}}."
    type: build
    owner: agent
    horizon: next
    tags: [scan, "{region}"]
  - name: "Review findings with analyst for {municipality}"
    description: "Step 9 of the {municipality} scan. Literal braces: {{not-a-param}}."
    type: test
    owner: agent
    horizon: next
    tags: [scan, "{region}"]
  - name: "Publish municipality report for {municipality}"
    description: "Step 10 of the {municipality} scan. Literal braces: {{not-a-param}}."
    type: build
    owner: agent
    horizon: next
    tags: [scan, "{region}"]
  - name: "Archive raw captures for {municipality}"
    description: "Step 11 of the {municipality} scan. Literal braces: {{not-a-param}}."
    type: build
    owner: agent
    horizon: next
    tags: [scan, "{region}"]
  - name: "Update class file for {municipality}"
    description: "Step 12 of the {municipality} scan. Literal braces: {{not-a-param}}."
    type: build
    owner: agent
    horizon: next
    tags: [scan, "{region}"]
  - name: "Close out the scan for {municipality}"
    description: "Step 13 of the {municipality} scan. Literal braces: {{not-a-param}}."
    type: build
    owner: agent
    horizon: next
    tags: [scan, "{region}"]
