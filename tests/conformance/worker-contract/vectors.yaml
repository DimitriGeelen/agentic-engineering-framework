# Shared dispatched-worker contract: conformance vectors.
#
# Data only. One entry per conformance case of §9 of the shared worker contract
# ("Shared dispatched-worker contract — transition table and conformance spec",
# v0.3.3, contract_version wc/0.3). Every backend that claims conformance (hub,
# local, any external backend per §6.6) runs these vectors through its own adapter.
# Ownership and how to contribute: README.md beside this file.
#
# Reading a vector
#   given   records and worker-dir evidence that exist before the first step. A
#           backend's adapter seeds them into its own store; symbols (n1, c1, E1)
#           are placeholders the adapter maps to real values.
#   steps   backend calls in order. Each names an `op` from `vocabulary.ops`, the
#           `writer`, the attempt and its proof, and an `expect`.
#   then    the admissible end state. `admissible_histories` lists state sequences
#           of the attempt's `history` starting at the state it had in `given`; the
#           run passes if the actual sequence equals one of them (§9: "an
#           implementation that reaches the same final record by a listed shorter
#           path passes").
#   variants  independent branches of one case. Each variant runs from `given`
#           (shallow-merged with its own `given`), then the shared `steps`, then
#           its own `steps`, and is judged by its own `then`.
#
# Time is injected, never slept (§9). Times are integer seconds since t0, or a
# parameter name with an optional offset (`G`, `deadline_running+1`). Parameter
# values are the backend's own (§2 per-backend parameters).
#
# Applicability (§6.6, N2 rule): `subject: transition` cases test a §3 row and are
# never n/a; a backend lacking the capability the case is phrased in runs it with
# its own equivalent (`equivalent`). Only `subject: capability` cases whose subject
# is the answer channel, registry_epoch or caller-chosen ids may be n/a.

schema: wc-conformance/1
contract_version: wc/0.3
spec: shared-worker-contract-transitions v0.3.3

vocabulary:
  states: [dispatched, running, done, lost, unknown]
  outcomes: [succeeded, failed, refused, handback-malformed, paused]
  transitions: [T1, T2, T3, T3b, T-RECLAIM, T4, T5, T6, T6b, T7a, T7b, T7c, T7d, T8]
  writers: [hub, supervisor, reconciler, operator, worker, dispatcher, consumer]
  fence_reasons: [stale_attempt, bad_nonce, bad_credential, stale_gen, cas_mismatch, forbidden_transition, done_conflict]
  errors: [id_taken, malformed_id]
  refusals:
    not_finished_work: a consumer (review verdict, pass-rate, landing) refuses a paused or attested done (§3.3)
    agent_session: operator resolve refused from an agent session without a recorded override (T7d speed bump)
    not_available: operator resolve is not offered as a remote call (T7d, no signed operator identity)
    backend_fixed: a write addressed to a backend other than the record's (§6.4, no mid-flight switch)
  capabilities:
    registry_epoch: hub-level registry_epoch and the two-sweep-at-one-epoch evidence (I7, §3.4)
    answer_channel: per-attempt questions/answers with read-markers (§5)
    caller_chosen_ids: caller may choose a well-formed unused D-<ulid> (§4.1)
    supervisor_gen: fencing by supervisor_gen plus the per-write lock (§3.2, §6.2)
    lease: fencing by an exclusive single-writer lease (§3.2, §6.6)
    real_worker: the case must run against a real agent worker, not a mock (CC-11)
  ops:
    create: new dispatch plus attempt 1 (T1); args dispatch_id (optional), dispatcher, retry_of_dispatch_id (optional)
    allocate: next attempt of an existing dispatch (T1)
    start: supervisor confirms the agent child started (T2)
    complete: completion write with evidence; the backend takes T3, T3b, T5, T7b or answers T8 from the attempt's state (§3.3 fence is per attempt)
    reclaim: restarted supervisor claims supervisor_gen+1, or takes the lease over (T-RECLAIM)
    confirm_end: the sweep writer confirms the attempt's end by the backend's own evidence (hub two sweeps at the last-seen epoch then G; hubless independent probe, evidence read first) and acts on it; G elapses inside the op. Precondition (hub) - the attempt has a seen_alive_epoch in given; an attempt never seen alive leaves only through the deadlines (T6b/T6), never T4 (§3.4)
    sweep: one sweep with an explicit observation (alive or absent) at an explicit registry epoch
    probe_undecided: the sweep cannot confirm or refute the end (partition, worker on another hub, reused pid)
    hub_restart: the authority restarts; registry_epoch is bumped where it exists
    advance: the injected clock moves forward by `by`
    kill_supervisor: the supervisor dies; nothing is written
    stop: the backend stops the attempt (deadline, revocation, operator request); args cause, exit_status_captured
    partition: the worker host loses contact with the authority
    heal: the partition heals
    resolve: operator resolve of an unknown attempt (T7d); args as, reason, outcome, material, session (operator|agent), via (host_cli|remote)
    append_question: worker appends a question (worker-permitted field)
    append_answer: dispatcher appends an answer with a deadline (§5.3)
    ask_wait: worker's bounded blocking wait for answers (§5.4)
    ack_answer: worker marks an answer applied
    dispatcher_lost: the dispatcher session disappears
    adopt: dispatcher ownership moves to a named successor session (§4.6)
    hold_lock: another holder keeps the record's write lock (or lease) for `seconds`
    concurrent: args.count copies of args.step issued at once
    wait: consumer waits on the attempt with a bound (worker wait); returns its state
    consume: an evaluation-layer consumer names (dispatch, attempt, result)
    inspect: read-only check of an operator-visible surface (queue, notices, topics)

vectors:
  - id: CC-01
    title: Completion racing session end
    spec_refs: ["§3.3 T4", "§3.3 T5", "§3.3 precedence", "§9 CC-01"]
    applicability:
      subject: transition
      rows: [T3, T4, T5]
      requires: []
      n_a_allowed: false
      equivalent: a hubless backend confirms the end with its independent probe (§3.2)
    given:
      dispatch: {dispatch_id: D-01JAAAAAAAAAAAAAAAAAAAAA01, backend: under_test}
      attempts:
        - {attempt: 1, state: running, nonce: n1, credential: c1, supervisor_gen: 1, seen_alive_epoch: E1}
      evidence:
        E1: {attempt: 1, nonce: n1, exit_code: 0, handback: {status: complete, attempt: 1, nonce: n1}, signed: true, persisted_at: 10}
      clock: 20
    steps:
      - op: confirm_end
        writer: hub
        attempt: 1
        expect: {any_of: [{accepted: T4}, {accepted: T3}]}
      - op: complete
        writer: supervisor
        attempt: 1
        nonce: n1
        credential: c1
        evidence: E1
        expect: {any_of: [{accepted: T5}, {response: T8}]}
    then:
      final:
        A1: {state: done, outcome: succeeded}
      admissible_histories:
        A1: [[running, lost, done], [running, done]]

  - id: CC-02
    title: Same race, opposite order
    spec_refs: ["§3.3 T3", "§3.3 forbidden", "§9 CC-02"]
    applicability:
      subject: transition
      rows: [T3, T4]
      requires: []
      n_a_allowed: false
    given:
      dispatch: {dispatch_id: D-01JAAAAAAAAAAAAAAAAAAAAA02, backend: under_test}
      attempts:
        - {attempt: 1, state: running, nonce: n1, credential: c1, supervisor_gen: 1, seen_alive_epoch: E1}
      evidence:
        E1: {attempt: 1, nonce: n1, exit_code: 0, handback: {status: complete, attempt: 1, nonce: n1}, signed: true, persisted_at: 10}
      clock: 20
    steps:
      - op: complete
        writer: supervisor
        attempt: 1
        nonce: n1
        credential: c1
        evidence: E1
        expect: {accepted: T3}
      - op: confirm_end
        writer: hub
        attempt: 1
        expect: {fence_reject: forbidden_transition}
    then:
      final:
        A1: {state: done, outcome: succeeded}
      admissible_histories:
        A1: [[running, done]]

  - id: CC-03
    title: Supervisor crash before commit
    spec_refs: ["§3.3 T3", "§3.3 T4", "§3.3 T5", "§6.5", "§9 CC-03"]
    applicability:
      subject: transition
      rows: [T3, T4, T5]
      requires: []
      n_a_allowed: false
    given:
      dispatch: {dispatch_id: D-01JAAAAAAAAAAAAAAAAAAAAA03, backend: under_test}
      attempts:
        - {attempt: 1, state: running, nonce: n1, credential: c1, supervisor_gen: 1, seen_alive_epoch: E1}
      clock: 20
    steps:
      - op: kill_supervisor
        attempt: 1
        expect: {ok: true}
    then: {judged_by: variants}
    variants:
      - name: evidence-present
        given:
          evidence:
            E1: {attempt: 1, nonce: n1, exit_code: 0, handback: {status: complete, attempt: 1, nonce: n1}, signed: true, persisted_at: 10}
        steps:
          - op: confirm_end
            writer: hub
            attempt: 1
            expect: {any_of: [{accepted: T4}, {accepted: T3}]}
          - op: complete
            writer: reconciler
            attempt: 1
            nonce: n1
            credential: c1
            evidence: E1
            expect: {any_of: [{accepted: T5}, {response: T8}]}
        then:
          final:
            A1: {state: done, outcome: succeeded}
          admissible_histories:
            A1: [[running, lost, done], [running, done]]
      - name: no-evidence
        given:
          evidence: {}
        steps:
          - op: confirm_end
            writer: hub
            attempt: 1
            expect: {accepted: T4}
        then:
          final:
            A1: {state: lost, outcome: null}
          admissible_histories:
            A1: [[running, lost]]

  - id: CC-04
    title: Supervisor crash after commit
    spec_refs: ["§3.3 T8", "§3.2 writers", "§9 CC-04"]
    applicability:
      subject: transition
      rows: [T8]
      requires: []
      n_a_allowed: false
    given:
      dispatch: {dispatch_id: D-01JAAAAAAAAAAAAAAAAAAAAA04, backend: under_test}
      attempts:
        - {attempt: 1, state: done, outcome: succeeded, nonce: n1, credential: c1, supervisor_gen: 1, evidence: E1}
      evidence:
        E1: {attempt: 1, nonce: n1, exit_code: 0, handback: {status: complete, attempt: 1, nonce: n1}, signed: true, persisted_at: 10}
      clock: 20
    steps:
      - op: complete
        writer: supervisor
        attempt: 1
        nonce: n1
        credential: c1
        evidence: E1
        expect: {response: T8}
      - op: complete
        writer: reconciler
        attempt: 1
        nonce: n1
        credential: c1
        evidence: E1
        expect: {response: T8}
    then:
      final:
        A1: {state: done, outcome: succeeded}
      history_unchanged: [A1]
      admissible_histories:
        A1: [[done]]

  - id: CC-05
    title: Duplicate finalisation
    spec_refs: ["§3.3 T8", "§3.3 forbidden done_conflict", "§9 CC-05"]
    applicability:
      subject: transition
      rows: [T8]
      requires: []
      n_a_allowed: false
    given:
      dispatch: {dispatch_id: D-01JAAAAAAAAAAAAAAAAAAAAA05, backend: under_test}
      attempts:
        - {attempt: 1, state: done, outcome: succeeded, nonce: n1, credential: c1, supervisor_gen: 1, evidence: E1}
      evidence:
        E1: {attempt: 1, nonce: n1, exit_code: 0, handback: {status: complete, attempt: 1, nonce: n1}, signed: true, persisted_at: 10}
        E2: {attempt: 1, nonce: n1, exit_code: 1, handback: {status: failed, attempt: 1, nonce: n1}, signed: true, persisted_at: 11}
      clock: 20
    steps: []
    then: {judged_by: variants}
    variants:
      - name: same-evidence
        steps:
          - op: complete
            writer: supervisor
            attempt: 1
            nonce: n1
            credential: c1
            evidence: E1
            expect: {response: T8}
        then:
          final:
            A1: {state: done, outcome: succeeded}
          history_unchanged: [A1]
          admissible_histories:
            A1: [[done]]
      - name: different-evidence
        steps:
          - op: complete
            writer: supervisor
            attempt: 1
            nonce: n1
            credential: c1
            evidence: E2
            expect: {fence_reject: done_conflict, notices: 1}
        then:
          final:
            A1: {state: done, outcome: succeeded}
          record_unchanged: true
          operator_notices: 1
          admissible_histories:
            A1: [[done]]

  - id: CC-06
    title: Retry while the old worker survives
    spec_refs: ["§4.3", "§3.3 T1", "§3.3 fence_reject", "§9 CC-06"]
    applicability:
      subject: transition
      rows: [T1, T4, T-RECLAIM]
      requires: []
      n_a_allowed: false
    given:
      dispatch: {dispatch_id: D-01JAAAAAAAAAAAAAAAAAAAAA06, backend: under_test}
      attempts:
        - {attempt: 1, state: running, nonce: n1, credential: c1, supervisor_gen: 1, seen_alive_epoch: E1}
      evidence: {}
      clock: 20
    steps:
      - op: allocate
        writer: dispatcher
        expect: {fence_reject: cas_mismatch}
      - op: confirm_end
        writer: hub
        attempt: 1
        expect: {accepted: T4}
      - op: allocate
        writer: dispatcher
        expect: {accepted: T1, values: {attempt: 2, fresh_nonce: true}, bind: {nonce: n2, credential: c2}}
      - op: reclaim
        writer: supervisor
        attempt: 1
        nonce: n1
        credential: c1
        supervisor_gen: 2
        expect: {fence_reject: stale_attempt}
      - op: append_question
        writer: worker
        attempt: 1
        nonce: n1
        args: {question_id: q1, body: late question}
        expect: {fence_reject: stale_attempt}
    then:
      final:
        A1: {state: lost, outcome: null}
        A2: {state: dispatched, outcome: null, questions: 0}
      attempt_count: 2
      admissible_histories:
        A1: [[running, lost]]
        A2: [[dispatched]]

  - id: CC-07
    title: Stale-attempt write rejected
    spec_refs: ["§3.3 fence_reject per attempt", "§3.3 T5", "§4.3", "§9 CC-07"]
    applicability:
      subject: transition
      rows: [T3, T5]
      requires: []
      n_a_allowed: false
    given:
      dispatch: {dispatch_id: D-01JAAAAAAAAAAAAAAAAAAAAA07, backend: under_test}
      attempts:
        - {attempt: 1, state: lost, nonce: n1, credential: c1, supervisor_gen: 1, lost_at: 100}
        - {attempt: 2, state: running, nonce: n2, credential: c2, supervisor_gen: 1}
      evidence:
        E1: {attempt: 1, nonce: n1, exit_code: 0, handback: {status: complete, attempt: 1, nonce: n1}, signed: true, persisted_at: 90}
      clock: 200
    steps:
      - op: complete
        writer: supervisor
        attempt: 2
        nonce: n1
        credential: c1
        evidence: E1
        expect: {fence_reject: bad_nonce}
      - op: complete
        writer: supervisor
        attempt: 1
        nonce: n1
        credential: c1
        evidence: E1
        expect: {accepted: T5}
    then:
      final:
        A1: {state: done, outcome: succeeded}
        A2: {state: running, outcome: null}
      fields_unchanged: [A2]
      admissible_histories:
        A1: [[lost, done]]
        A2: [[running]]

  - id: CC-08
    title: Hub restart
    spec_refs: ["§3.4", "§3.3 T6", "§3.3 T7a", "I7", "§9 CC-08"]
    spec_note: >
      CC-08's absent branch says two absent sweeps at the new epoch then G give lost, while §3.4 and CC-17 say an
      attempt not seen alive at the current epoch is acted on by deadlines only. The absent branch therefore admits
      both outcomes until the spec text is reconciled; CC-17 pins the §3.4 reading.
    applicability:
      subject: transition
      rows: [T4, T6, T7a]
      requires: []
      n_a_allowed: false
      equivalent: a backend without a hub restarts its own authority/sweep writer and confirms with its probe (§6.6 N2)
    given:
      dispatch: {dispatch_id: D-01JAAAAAAAAAAAAAAAAAAAAA08, backend: under_test}
      attempts:
        - {attempt: 1, state: running, nonce: n1, credential: c1, supervisor_gen: 1, seen_alive_epoch: E1}
      evidence: {}
      clock: 20
    steps:
      - op: hub_restart
        expect: {ok: true}
    then: {judged_by: variants}
    variants:
      - name: alive-after-restart
        steps:
          - op: sweep
            writer: hub
            attempt: 1
            args: {observe: alive, epoch: E2}
            expect: {no_transition: true}
        then:
          final:
            A1: {state: running, outcome: null}
          admissible_histories:
            A1: [[running]]
      - name: absent-after-restart
        steps:
          - op: sweep
            writer: hub
            attempt: 1
            args: {observe: absent, epoch: E2}
            expect: {no_transition: true}
          - op: sweep
            writer: hub
            attempt: 1
            args: {observe: absent, epoch: E2}
            expect: {no_transition: true}
          - op: advance
            args: {by: G}
            expect: {any_of: [{accepted: T4}, {no_transition: true}]}
          - op: advance
            args: {by: deadline_running}
            expect: {any_of: [{accepted: T6, notices: 1}, {no_transition: true}]}
        then:
          final:
            A1: {state: {any_of: [lost, unknown]}, outcome: null}
          admissible_histories:
            A1: [[running, lost], [running, unknown]]
      - name: undecidable-then-alive
        steps:
          - op: probe_undecided
            writer: hub
            attempt: 1
            expect: {no_transition: true}
          - op: advance
            args: {by: deadline_running+1}
            expect: {accepted: T6, notices: 1}
          - op: wait
            writer: consumer
            attempt: 1
            args: {bound: 1}
            expect: {ok: true, values: {state: unknown}}
          - op: sweep
            writer: hub
            attempt: 1
            args: {observe: alive, epoch: E2}
            expect: {accepted: T7a}
        then:
          final:
            A1: {state: running, outcome: null}
          operator_notices: 1
          admissible_histories:
            A1: [[running, unknown, running]]

  - id: CC-09
    title: Partition
    spec_refs: ["§3.3 T5", "§3.3 T7b", "§6.4", "§9 CC-09"]
    applicability:
      subject: transition
      rows: [T5, T6, T7b]
      requires: []
      n_a_allowed: false
      equivalent: a backend without a hub loses contact with the worker host by its own means (§6.6 N2)
    given:
      dispatch: {dispatch_id: D-01JAAAAAAAAAAAAAAAAAAAAA09, backend: under_test}
      attempts:
        - {attempt: 1, state: running, nonce: n1, credential: c1, supervisor_gen: 1, seen_alive_epoch: E1}
      evidence:
        E1: {attempt: 1, nonce: n1, exit_code: 0, handback: {status: complete, attempt: 1, nonce: n1}, signed: true, persisted_at: 50}
      clock: 20
    steps:
      - op: partition
        expect: {ok: true}
      - op: complete
        writer: supervisor
        attempt: 1
        nonce: n1
        credential: c1
        evidence: E1
        args: {backend: other}
        expect: {refused: backend_fixed}
    then: {judged_by: variants}
    variants:
      - name: via-unknown
        steps:
          - op: probe_undecided
            writer: hub
            attempt: 1
            expect: {no_transition: true}
          - op: advance
            args: {by: deadline_running+1}
            expect: {accepted: T6, notices: 1}
          - op: heal
            expect: {ok: true}
          - op: complete
            writer: reconciler
            attempt: 1
            nonce: n1
            credential: c1
            evidence: E1
            expect: {accepted: T7b}
        then:
          final:
            A1: {state: done, outcome: succeeded}
          admissible_histories:
            A1: [[running, unknown, done]]
      - name: via-lost
        steps:
          - op: advance
            args: {by: 60}
            expect: {ok: true}
          - op: confirm_end
            writer: hub
            attempt: 1
            expect: {accepted: T4}
          - op: heal
            expect: {ok: true}
          - op: complete
            writer: reconciler
            attempt: 1
            nonce: n1
            credential: c1
            evidence: E1
            expect: {accepted: T5}
        then:
          final:
            A1: {state: done, outcome: succeeded}
          admissible_histories:
            A1: [[running, lost, done]]

  - id: CC-10
    title: Parent-session loss
    spec_refs: ["§4.6", "§5.1", "§5.2", "§9 CC-10"]
    applicability:
      subject: transition
      rows: [T3]
      requires: []
      n_a_allowed: false
    given:
      dispatch: {dispatch_id: D-01JAAAAAAAAAAAAAAAAAAAAA10, backend: under_test, dispatcher_session: S-parent}
      attempts:
        - {attempt: 1, state: running, nonce: n1, credential: c1, supervisor_gen: 1}
      evidence:
        E1: {attempt: 1, nonce: n1, exit_code: 0, handback: {status: complete, attempt: 1, nonce: n1}, signed: true, persisted_at: 30}
      clock: 20
    steps:
      - op: dispatcher_lost
        expect: {ok: true}
      - op: append_question
        writer: worker
        attempt: 1
        nonce: n1
        args: {question_id: q1, body: which branch}
        expect: {ok: true}
      - op: inspect
        args: {surface: operator_queue}
        expect: {ok: true, values: {contains_question: q1}}
      - op: complete
        writer: supervisor
        attempt: 1
        nonce: n1
        credential: c1
        evidence: E1
        expect: {accepted: T3}
      - op: adopt
        writer: operator
        args: {to: S-successor}
        expect: {ok: true}
      - op: inspect
        args: {surface: worker_topics}
        expect: {ok: true, values: {count: 0}}
    then:
      final:
        A1: {state: done, outcome: succeeded, questions: 1}
      dispatcher_session: S-successor
      admissible_histories:
        A1: [[running, done]]

  - id: CC-11
    title: Answer delivered and acked
    spec_refs: ["§5.3", "§5.4", "§5.6", "§9 CC-11"]
    applicability:
      subject: capability
      rows: []
      requires: [answer_channel, real_worker]
      n_a_allowed: true
    given:
      dispatch: {dispatch_id: D-01JAAAAAAAAAAAAAAAAAAAAA11, backend: under_test}
      attempts:
        - {attempt: 1, state: running, nonce: n1, credential: c1, supervisor_gen: 1}
      evidence: {}
      clock: 20
    steps:
      - op: append_question
        writer: worker
        attempt: 1
        nonce: n1
        args: {question_id: q1, body: which branch}
        expect: {ok: true}
      - op: ask_wait
        writer: worker
        attempt: 1
        nonce: n1
        args: {wait: 600, background: true}
        expect: {ok: true}
      - op: append_answer
        writer: dispatcher
        attempt: 1
        args: {cmd_id: c1-answer, question_id: q1, body: use main, deadline: 600}
        expect: {ok: true}
      - op: ask_wait
        writer: worker
        attempt: 1
        nonce: n1
        args: {collect: true}
        expect: {ok: true, values: {answers: [c1-answer], answer_state: received}}
      - op: ack_answer
        writer: worker
        attempt: 1
        nonce: n1
        args: {cmd_id: c1-answer}
        expect: {ok: true}
      - op: ask_wait
        writer: worker
        attempt: 1
        nonce: n1
        args: {wait: 0}
        expect: {ok: true, values: {answers: []}}
    then:
      final:
        A1: {state: running, outcome: null, answers: {c1-answer: applied}}
      answer_state_sequence:
        c1-answer: [stored, received, applied]
      admissible_histories:
        A1: [[running]]

  - id: CC-12
    title: Answer TTL expiry bounces
    spec_refs: ["§5.5", "§9 CC-12"]
    applicability:
      subject: capability
      rows: []
      requires: [answer_channel]
      n_a_allowed: true
    given:
      dispatch: {dispatch_id: D-01JAAAAAAAAAAAAAAAAAAAAA12, backend: under_test}
      attempts:
        - {attempt: 1, state: running, nonce: n1, credential: c1, supervisor_gen: 1}
      evidence:
        E1: {attempt: 1, nonce: n1, exit_code: 0, handback: {status: complete, attempt: 1, nonce: n1}, signed: true, persisted_at: 30}
      clock: 20
    steps:
      - op: append_question
        writer: worker
        attempt: 1
        nonce: n1
        args: {question_id: q1, body: retry or stop}
        expect: {ok: true}
      - op: append_answer
        writer: dispatcher
        attempt: 1
