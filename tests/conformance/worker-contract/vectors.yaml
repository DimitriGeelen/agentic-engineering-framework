  - id: CC-26
    title: Withdraw from dispatched (v0.3.4)
    spec_refs: ["§3.3 T3w", "§3.2 submitter", "§5.5", "§9 CC-26"]
    applicability:
      subject: transition
      rows: [T3w, T1]
      requires: []
      n_a_allowed: false
    given:
      dispatch: {dispatch_id: D-01JAAAAAAAAAAAAAAAAAAAAA26, backend: under_test}
      attempts:
        - {attempt: 1, state: dispatched, nonce: n1, credential: c1, supervisor_gen: 1}
      evidence: {}
      clock: 20
    steps: []
    then: {judged_by: variants}
    variants:
      - name: withdraw
        steps:
          - op: withdraw
            writer: submitter
            attempt: 1
            nonce: n1
            credential: c1
            supervisor_gen: 1
            args: {actor: a, reason: superseded by D2}
            expect: {accepted: T3w, notices: 0}
        then:
          final:
            # evidence_digest = sha256("superseded by D2", UTF-8)
            A1: {state: done, outcome: withdrawn, exit_code: null, result_kind: none, attested: false,
                 evidence_digest: 8ca243126e2fb57133532a71450fad6c48d76d1ee930a575ccd493903eb87a23,
                 last_actor: a, last_reason: superseded by D2}
          operator_notices: 0
