    title: Local backend parity
    spec_refs: ["§6.1", "§6.2", "§4.2", "§9 CC-13"]
    applicability:
      subject: transition
      rows: [T3, T8]
      requires: []
      n_a_allowed: false
      # hub: partly missing. Concurrent-writer variants pass; [lock-timeout-fails-closed] needs op:hold_lock, and the lock is SQLite IMMEDIATE with no hook. lease is not offered, so its variants are not run.
    given:
      dispatch: {dispatch_id: D-01JAAAAAAAAAAAAAAAAAAAAA13, backend: under_test}
      attempts:
        - {attempt: 1, state: running, nonce: n1, credential: c1, supervisor_gen: 1}
      evidence:
        E1: {attempt: 1, nonce: n1, exit_code: 0, handback: {commission: D-01JAAAAAAAAAAAAAAAAAAAAA13, status: complete, attempt: 1, nonce: n1}, signed: true, persisted_at: 10}
      clock: 20
