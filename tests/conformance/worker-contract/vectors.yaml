        steps:
          - op: hold_lock
            args: {seconds: lock_timeout+5}
            expect: {ok: true}
          - op: complete
            writer: supervisor
            attempt: 1
            nonce: n1
            credential: c1
            evidence: E1
            expect: {fence_reject: cas_mismatch}
        then:
          final:
            A1: {state: running, outcome: null}
          record_unchanged: true
          admissible_histories:
            A1: [[running]]
      - name: eight-writers-lease
        requires: [lease]
        steps:
          - op: concurrent
            args:
              count: 8
              step:
                op: complete
                writer: supervisor
                attempt: 1
                nonce: n1
                credential: c1
                evidence: E1
            expect:
              exactly_one: {accepted: T3}
              rest_any_of: [{fence_reject: stale_gen}, {fence_reject: cas_mismatch}, {response: T8}]
        then:
          final:
            A1: {state: done, outcome: succeeded}
          admissible_histories:
            A1: [[running, done]]
      - name: lease-timeout-fails-closed
        requires: [lease]
        steps:
          - op: hold_lock
            args: {seconds: lease_bound+5}
            expect: {ok: true}
          - op: complete
            writer: supervisor
            attempt: 1
            nonce: n1
            credential: c1
            evidence: E1
            expect: {any_of: [{fence_reject: stale_gen}, {fence_reject: cas_mismatch}]}
        then:
          final:
            A1: {state: running, outcome: null}
          record_unchanged: true
          admissible_histories:
            A1: [[running]]
    parity:
      cases: [CC-01, CC-02, CC-03, CC-04, CC-05, CC-06, CC-07, CC-08, CC-09, CC-10, CC-11, CC-12]
      rule: identical final records and identical history on every backend, modulo timestamps

