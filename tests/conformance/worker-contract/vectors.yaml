        steps:
          - op: concurrent
            args:
              count: 8
              step:
                op: complete
                writer: supervisor
                attempt: 1
                nonce: n1
                credential: c1
                evidence: E1
            expect:
              exactly_one: {accepted: T3}
              rest_any_of: [{fence_reject: cas_mismatch}, {response: T8}]
        then:
