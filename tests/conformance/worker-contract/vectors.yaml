      - name: without-credential
        steps:
          - op: withdraw
            writer: submitter
            attempt: 1
            nonce: n1
            credential: c-wrong
            supervisor_gen: 1
            args: {actor: a, reason: superseded by D2}
            expect: {fence_reject: bad_credential}
        then:
          final: {A1: {state: dispatched, outcome: null}}
          record_unchanged: true
      - name: sweep-writer
        # the sweep writer never withdraws (§3.2); the spec fixes the refusal, not its reason
        steps:
          - op: withdraw
            writer: hub
            attempt: 1
            nonce: n1
            credential: c1
            supervisor_gen: 1
            args: {actor: sweep, reason: superseded by D2}
            expect: {any_of: [{fence_reject: bad_credential}, {fence_reject: forbidden_transition}]}
        then:
          final: {A1: {state: dispatched, outcome: null}}
          record_unchanged: true
      - name: consumers-refuse
        steps:
          - {op: withdraw, writer: submitter, attempt: 1, nonce: n1, credential: c1, supervisor_gen: 1, args: {actor: a, reason: superseded by D2}, expect: {accepted: T3w}}
          - {op: consume, writer: consumer, attempt: 1, args: {consumer: review}, expect: {refused: not_finished_work}}
          - {op: consume, writer: consumer, attempt: 1, args: {consumer: pass-rate}, expect: {refused: not_finished_work}}
          - {op: consume, writer: consumer, attempt: 1, args: {consumer: landing}, expect: {refused: not_finished_work}}
        then:
          final: {A1: {state: done, outcome: withdrawn}}
          admissible_histories: {A1: [[dispatched, done]]}
      - name: allocate-after-withdraw
        # same route as CC-15 allocate-after-resolve (T-4800): withdrawn is terminal, so a later T1 may allocate A2
        equivalent: a backend that closes a dispatch once its last attempt is terminal (§4.7) answers the allocate fence_reject(dispatch_closed) and no A2 exists
        steps:
          - {op: withdraw, writer: submitter, attempt: 1, nonce: n1, credential: c1, supervisor_gen: 1, args: {actor: a, reason: superseded by D2}, expect: {accepted: T3w}}
          - op: allocate
            writer: dispatcher
            expect: {accepted: T1, bind: {nonce: n2, credential: c2}}
            expect_equivalent: {fence_reject: dispatch_closed}
        then:
          final:
            A1: {state: done, outcome: withdrawn}
            A2: {state: dispatched, outcome: null}
          final_equivalent:
            A1: {state: done, outcome: withdrawn}
            A2: null
          admissible_histories:
            A1: [[dispatched, done]]
            A2: [[dispatched]]
          admissible_histories_equivalent:
            A1: [[dispatched, done]]
      - name: answer-channel
        # the withdrawal bounces the un-acked answer (§5.5). No question: no worker exists before T2 (§3.3),
        # so the only answer a dispatched attempt can hold names no question_id. Deadline = clock + ANSWER_TTL
