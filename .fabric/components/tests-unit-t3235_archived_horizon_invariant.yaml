purpose: 'Pins that a task file under .tasks/completed/ carries horizon: null whichever branch archived it. Two branches move
  a task there and their entry conditions are exact complements, so the null-ing written at the first site (T-2163, widened
  T-2300 after eight CTL-030 instances) could never reach the partial-complete recheck branch. The sharp end is fw task archive-eligible,
  which re-invokes --status work-completed and therefore drives exclusively through the branch that was unfixed. Every leg
  asserts WHICH branch ran before asserting the outcome, because the obvious fixture leaves status started-work and never
  enters the recheck branch at all — a rig that checks only the outcome goes green against the wrong path. A control pins
  the deliberate case the fix must NOT break: a partial-complete that stays in active/ keeps its stored horizon, which is
  why the post-condition keys on location, not status. The mutation control removes the post-condition from a live-derived
  copy and needs a symlink farm, since update-task.sh derives FRAMEWORK_ROOT from its own location and a dead subject reads
  exactly like a regressed one. Reported by peer 832-Workflow-designer (their T-654 BUG 1); confirmed in-tree first.

  '
