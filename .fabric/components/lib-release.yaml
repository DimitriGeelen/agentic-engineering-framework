id: lib/release.sh
name: release
type: script
subsystem: framework-core
location: lib/release.sh
tags:
- release
- tagging
- github
- cron
purpose: Release tagging + GitHub Release automation (T-1256). Cuts a new annotated tag based on latest v* (patch-bumping
  by default), pushes to all remotes, and creates a GitHub Release via gh CLI. Idempotent — no-op when HEAD == latest tag.
  Entrypoint for `fw release` subcommand and weekly cron job release-weekly.
depends_on:
- target: bin/fw
  type: called_by
- target: gh
  type: calls
- target: git
  type: calls
depended_by:
- target: .context/cron-registry.yaml
  type: triggers
- target: bin/fw
  type: called_by
