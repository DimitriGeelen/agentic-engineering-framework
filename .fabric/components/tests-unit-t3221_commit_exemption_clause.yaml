purpose: 'Pins the commit-checkpoint exemption in the Bash task gate. Both exemption branches (T-2054 null-focus, T-3179 partial-complete)
  once admitted any command whose raw text CONTAINED "git commit" — so a trailing `; rm -rf` rode through, a `| tee` write
  the gate had already flagged was admitted anyway, and an unknown binary passed because a quoted argument said the words.
  This suite probes the SHIPPED hook through its real stdin JSON contract rather than re-implementing the predicate, and carries
  two controls that decide whether a green run means anything: a mutation control that rebuilds the pre-fix hook from live
  source (so reverting the fix reddens the suite), and a 16-command no-widening sweep asserting the fixed hook admits nothing
  the pre-fix one blocked.

  '
