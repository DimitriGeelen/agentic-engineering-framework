purpose: "Canonical shell helper for arc-membership scans (T-1880 / T-NEW-15).\nConsolidates the union-of-`arc_id:`-frontmatter\
  \ + legacy `arc:<slug>`-tag\nscan that previously lived inline in three shell consumers:\nlib/arc.sh, agents/handover/handover.sh,\
  \ lib/evolution_log.sh.\nCompanion to lib/arc_membership.py (which serves the Python/Flask side).\n\nPublic API (PROJECT_ROOT\
  \ must be set):\n  arc_tasks_with_arc_id <slug>   → T-IDs whose `arc_id:` matches slug\n  arc_tasks_with_tag <tag>     \
  \  → T-IDs whose `tags:` includes tag\n\nOrigin: silent-corpus #1 (T-1874/75/76/77) and #2 (T-1879) — captured as\nL-397.\
  \ Each inline consumer had to be migrated independently after the\nT-1850 tags-to-arc_id storage migration; consolidation\
  \ prevents the next\nstorage-format migration from leaking through nine sites again.\n"
