purpose: 'One-way bridge from shell pickup to T-1155 channel bus. Invoked by pickup_process_one (lib/pickup.sh) after an envelope
  moves to processed/. Mirrors the envelope to ''framework:pickup'' topic so online bus subscribers observe pickups alongside
  shell consumers. Non-fatal (exits 0 on any error); capability-probing (prefers termlink channel post; falls back to event
  broadcast; silent no-op if neither present). T-1165/T-1214 GO Option B: federate, don''t converge.'
