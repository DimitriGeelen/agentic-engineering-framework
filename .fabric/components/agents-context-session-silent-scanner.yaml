id: agents/context/session-silent-scanner.sh
name: session-silent-scanner
type: script
subsystem: context-fabric
location: agents/context/session-silent-scanner.sh
tags: [cron, handover, recovery, T-1212, G-016]
purpose: "Silent-session scanner — S3 antifragility fallback for SessionEnd.
  Cron-invoked every 15 min. Walks $HOME/.claude/projects/*/<session>.jsonl,
  finds sessions older than SESSION_SILENT_THRESHOLD_MIN (default 30) whose
  session_id does NOT appear under .context/handovers/. For matches runs
  `fw handover` with RECOVERED=1. Closes SessionEnd gap (/exit skips hook,
  API 500 kills before hook fires). T-1222 cap prevents commit storms."
depends_on:
  - target: agents/handover/handover.sh
    type: calls
  - target: .context/handovers/
    type: reads
  - target: .context/working/.session-silent-scanner.log
    type: writes
depended_by:
  - target: /etc/cron.d/agentic-framework
    type: scheduled_by
  - target: agents/context/tests/session-silent-scanner-stub-test.sh
    type: called_by
last_verified: 2026-04-24
last_enriched: '2026-04-24'
created_by: T-1212
