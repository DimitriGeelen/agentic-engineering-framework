id: tests/unit/t3222_fetch_writes_file.bats
name: t3222_fetch_writes_file
type: script
subsystem: testing
location: tests/unit/t3222_fetch_writes_file.bats
tags: [gate, regression, mutation-control, no-widening, task-gate, allowlist, T-3222]

purpose: >
  Pins that curl and wget are admitted by the Bash safe-list only when they do
  not write a file. Both sat in the list unconditionally, so `curl -o FILE` and
  `wget -O FILE` — which write with no shell redirect, and are therefore
  invisible to has_bash_write_pattern — ran with no active task. Covers 22
  spellings in both directions, including the stdout forms (`-o -`, `-O -`)
  that must stay safe and the framework's own documented verification idiom
  `curl -sf "$(bin/fw watchtower url)/page"`. Two legs carry the design
  decision: one asserts a commit whose MESSAGE mentions `curl -o` is still
  admitted (why the check is clause-scoped rather than in the whole-string
  write scanner), and one asserts a commit chained to a fetch-write is now
  refused with no change to the T-3221 commit predicate. Mutation control
  restores the unconditional arm from live source; a no-widening sweep asserts
  the fix admits nothing the pre-fix version blocked.

