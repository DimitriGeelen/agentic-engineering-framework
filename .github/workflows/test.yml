name: Test

on:
  push:
    branches: [bleeding-edge, master]
  pull_request:
    branches: [bleeding-edge, master]

jobs:
  # T-5045: the required check for every pull request. Fast and deterministic on a
  # bare runner: the structural invariant tests, plus the test files the pull request
  # itself adds or changes (a contributor brings a test that fails before the change
  # and passes after it). The full-suite jobs below stay as information only: many of
  # their tests depend on a configured framework host and cannot pass here.
  pr-checks:
    name: PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install pyyaml pytest
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"

      - name: Structural invariants (tests/lint)
        run: bats tests/lint/

      - name: Tests added or changed by this change
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            case "$base" in ''|0000000000000000000000000000000000000000) base="HEAD~1" ;; esac
          fi
          changed=$(git diff --name-only --diff-filter=AM "$base"...HEAD -- tests/ || true)
          bats_files=$(printf '%s\n' "$changed" | grep -E '^tests/(unit|integration)/.*\.bats$' || true)
          py_files=$(printf '%s\n' "$changed" | grep -E '^tests/unit/(test_.*|.*_test)\.py$' || true)
          if [ -z "$bats_files$py_files" ]; then
            echo "No test files added or changed."
            exit 0
          fi
          rc=0
          if [ -n "$bats_files" ]; then echo "$bats_files" | xargs bats || rc=1; fi
          if [ -n "$py_files" ]; then echo "$py_files" | xargs python3 -m pytest -q || rc=1; fi
          exit $rc

  bats:
    name: Bash Tests (bats-core)
    runs-on: ubuntu-latest
    # T-5045: information only (see pr-checks). Many tests here need a configured
    # framework host; the full suite has known, baselined reds.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Type check TypeScript
        run: |
          if [ -d lib/ts/src ] && find lib/ts/src -name '*.ts' -not -name '*.d.ts' | grep -q .; then
            cd lib/ts
            npm ci
            npx tsc --noEmit
          else
            echo "No TypeScript sources — skipping type check"
          fi

      - name: Install bats-core
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local

      - name: Run tests
        run: bats tests/integration/ tests/unit/

  pytest-unit:
    name: Pytest Unit Tests (tests/unit/*.py)
    runs-on: ubuntu-latest
    # T-2745: tests/unit/ also holds 174 pytest files (2306 tests) that no
    # runner ever collected. Wired here for visibility. Non-blocking
    # (continue-on-error) because ~30 of the 2306 are pre-existing failures
    # under active triage (T-2746 through T-2754, see
    # docs/reports/T-2744-unit-suite-triage.md) — same rationale as the
    # FW_TEST_PYTEST opt-in gate on `fw test all` (OBS-293): a red required
    # check trains people to ignore it, which defeats the point of wiring it.
    # Remove continue-on-error once the triaged failures are fixed.
    continue-on-error: true
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          pip install pytest flask markupsafe pyyaml
          if [ -f web/requirements.txt ]; then
            pip install -r web/requirements.txt
          fi

      - name: Run pytest tests/unit/
        run: python3 -m pytest tests/unit/ -v

  e2e:
    name: E2E Tests (Tier A)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-termlink-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-termlink-

      - name: Install TermLink
        run: |
          if ! command -v termlink >/dev/null 2>&1; then
            git clone --depth 1 https://github.com/DimitriGeelen/termlink.git /tmp/termlink
            cargo install --path /tmp/termlink/crates/termlink-cli
          fi
          termlink --version

      - name: Set up framework
        run: |
          # Install git hooks (commit-msg hook needed for tests)
          chmod +x bin/fw agents/git/git.sh
          ./agents/git/git.sh install-hooks || true
          # Make fw available
          export PATH="$PWD/bin:$PATH"
          fw version

      - name: Run E2E Tier A tests
        run: |
          export PATH="$PWD/bin:$HOME/.cargo/bin:$PATH"
          bash tests/e2e/runner.sh --tier a

  playwright:
    name: Playwright UI Tests (Tier 3)
    runs-on: ubuntu-latest
    # T-5045: information only (see pr-checks); needs a running Watchtower.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          pip install pyyaml flask markupsafe pytest playwright
          if [ -f web/requirements.txt ]; then
            pip install -r web/requirements.txt
          fi

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run Playwright tests
        run: |
          export PATH="$PWD/bin:$PATH"
          python3 -m pytest tests/playwright/ -v
