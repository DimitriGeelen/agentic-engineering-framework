name: Test

on:
  push:
    branches: [bleeding-edge, master]
  pull_request:
    branches: [bleeding-edge, master]

# T-5382: a GitHub runner has no semantic-recall index (never built, no reindex cron).
# lib/vector_index_health.py correctly FAILs a missing index on a host that has recall,
# which made `fw doctor` exit 2 here and turned 7 doctor/audit bats tests red. The
# runner is a host without recall, so it says so through the sanctioned opt-out
# (T-3862: one SKIP "not configured on this host"); the check itself stays strict.
env:
  FW_SEMANTIC_RECALL: "0"

jobs:
  # T-5045: the required check for every pull request. Fast and deterministic on a
  # bare runner: the structural invariant tests, plus the test files the pull request
  # itself adds or changes (a contributor brings a test that fails before the change
  # and passes after it). The full-suite jobs below stay as information only: many of
  # their tests depend on a configured framework host and cannot pass here.
  pr-checks:
    name: PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install pyyaml pytest pillow  # T-5363: lib/vote_checker.py and its tests import PIL
          # T-5382: a changed test file runs here; some import the web stack (jinja2 via
          # flask), which the bats and pytest jobs already install the same way.
          if [ -f web/requirements.txt ]; then
            pip install -r web/requirements.txt
          fi
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"

      # T-5009 (R-14): the checks live in one script, shared with the isolated test host.
      - name: PR checks (tests/lint, then tests added or changed by this change)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            case "$base" in ''|0000000000000000000000000000000000000000) base="HEAD~1" ;; esac
          fi
          bash agents/testhost/pr-checks.sh "$base"

  bats:
    name: Bash Tests (bats-core)
    runs-on: ubuntu-latest
    # T-5045: information only (see pr-checks). Many tests here need a configured
    # framework host; the full suite has known, baselined reds.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # T-5153: some cases read git history (same as pytest-unit)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        # T-5153: the bats suite drives the web app, the EWCR contract checker and the
        # playwright helpers; with pyyaml alone 21 cases failed on "No module named 'flask'",
        # 5 on ruamel, and the contract checker on jsonschema.
        run: |
          pip install pyyaml pytest jsonschema playwright beautifulsoup4 pillow
          if [ -f web/requirements.txt ]; then
            pip install -r web/requirements.txt
          fi

      - name: Git identity and framework hooks
        # T-5153: tests copy .git/hooks/pre-push (22 cases failed on "cannot stat") and some
        # need a commit identity.
        run: |
          git config --global user.email "ci@aef.local"
          git config --global user.name "AEF CI"
          bin/fw git install-hooks || echo "install-hooks failed (non-fatal; tests that need hooks will say so)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Type check TypeScript
        run: |
          if [ -d lib/ts/src ] && find lib/ts/src -name '*.ts' -not -name '*.d.ts' | grep -q .; then
            cd lib/ts
            npm ci
            npx tsc --noEmit
          else
            echo "No TypeScript sources — skipping type check"
          fi

      - name: Install bats-core
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local

      - name: Run tests
        # T-5363: every run reported all tests (1..10652, "ok 10652") and then bats never
        # exited, so the job was cancelled at the 6 h limit: a test leaves a background
        # process holding bats' output pipe. Once the TAP plan is complete, give bats 60 s,
        # then print the leftover processes (names the leaking test) and stop it.
        # The exit status is the test result, not the hang.
        timeout-minutes: 240
        run: |
          out="$RUNNER_TEMP/bats.tap"
          : > "$out"
          setsid bats --tap tests/integration/ tests/unit/ > "$out" 2>&1 &
          pid=$!
          tail -n +1 -f "$out" & tailpid=$!
          plan=""; leaked=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 20
            [ -n "$plan" ] || plan=$(grep -m1 -oE '^1\.\.[0-9]+' "$out" | cut -d. -f3)
            if [ -n "$plan" ] && grep -qE "^(not )?ok $plan( |$)" "$out"; then
              sleep 60
              kill -0 "$pid" 2>/dev/null || break
              leaked=1
              echo "::warning::all $plan bats tests reported but bats did not exit: a test left a background process holding its output. Leftover processes:"
              ps -eo pid,ppid,pgid,sid,etime,args --forest
              kill -TERM -- "-$pid" 2>/dev/null || true
              break
            fi
          done
          rc=0; wait "$pid" || rc=$?
          sleep 1; kill "$tailpid" 2>/dev/null || true
          if [ "$leaked" = 1 ]; then
            if grep -q '^not ok ' "$out"; then rc=1; else rc=0; fi
          fi
          echo "bats: $(grep -c '^not ok ' "$out" || true) failed of ${plan:-?}; exit $rc"
          exit "$rc"

  pytest-unit:
    name: Pytest Unit Tests (tests/unit/*.py)
    runs-on: ubuntu-latest
    # T-2745: tests/unit/ also holds 174 pytest files (2306 tests) that no
    # runner ever collected. Wired here for visibility. Non-blocking
    # (continue-on-error) because ~30 of the 2306 are pre-existing failures
    # under active triage (T-2746 through T-2754, see
    # docs/reports/T-2744-unit-suite-triage.md) — same rationale as the
    # FW_TEST_PYTEST opt-in gate on `fw test all` (OBS-293): a red required
    # check trains people to ignore it, which defeats the point of wiring it.
    # Remove continue-on-error once the triaged failures are fixed.
    continue-on-error: true
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # T-5153: tests read git history (template hashes over every committed version,
          # testhost runs against HEAD~1); a depth-1 clone made 5 of them fail on CI only.
          fetch-depth: 0

      - name: Git identity and bats
        # T-5153: testhost tests commit in fixture repos and run a bats lint phase
        # (rc 127 = bats not found on CI).
        run: |
          git config --global user.email "ci@aef.local"
          git config --global user.name "AEF CI"
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          # T-5153: playwright (python package only, no browser) and bs4 are imported at
          # collection by tests/unit/test_playwright_server_adoption.py and friends.
          pip install pytest flask markupsafe pyyaml playwright beautifulsoup4 pillow  # T-5363: PIL
          if [ -f web/requirements.txt ]; then
            pip install -r web/requirements.txt
          fi

      - name: Run pytest tests/unit/
        run: python3 -m pytest tests/unit/ -v

  e2e:
    name: E2E Tests (Tier A)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-termlink-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-termlink-

      - name: Install TermLink
        run: |
          if ! command -v termlink >/dev/null 2>&1; then
            git clone --depth 1 https://github.com/DimitriGeelen/termlink.git /tmp/termlink
            cargo install --path /tmp/termlink/crates/termlink-cli
          fi
          termlink --version

      - name: Set up framework
        run: |
          # Install git hooks (commit-msg hook needed for tests)
          chmod +x bin/fw agents/git/git.sh
          ./agents/git/git.sh install-hooks || true
          # Make fw available
          export PATH="$PWD/bin:$PATH"
          fw version

      - name: Run E2E Tier A tests
        run: |
          export PATH="$PWD/bin:$HOME/.cargo/bin:$PATH"
          bash tests/e2e/runner.sh --tier a

  playwright:
    name: Playwright UI Tests (Tier 3)
    runs-on: ubuntu-latest
    # T-5045: information only (see pr-checks); needs a running Watchtower.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          # T-5153: bs4 is imported at collection by tests/playwright/test_review_htmx_target_inheritance.py
          pip install pyyaml flask markupsafe pytest playwright beautifulsoup4 pillow
          if [ -f web/requirements.txt ]; then
            pip install -r web/requirements.txt
          fi

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run Playwright tests
        run: |
          export PATH="$PWD/bin:$PATH"
          python3 -m pytest tests/playwright/ -v
