# Watchtower CI/CD buildspec (LXC deployment model)
# Migrated from Swarm/Docker to LXC in T-289 (see T-279 through T-284)
#
# Architecture:
#   LXC 170 (192.168.10.170) runs two systemd services:
#     - watchtower      :5050  (prod, /opt/watchtower-prod, tagged releases)
#     - watchtower-dev  :5051  (dev, /opt/watchtower-dev, master branch)
#
# Dev auto-updates via systemd timer every 5 min (T-283) -- no CI needed.
# Prod LXC deploy job REMOVED 2026-10-04 (ring20 T-2216, operator request):
#   deployment to the ring20 LXC estate is superfluous; no v* tag pipeline remains.
# GitHub mirror pushes on every branch update and tag creation (T-292).
#
# IMPORTANT: version MUST be 37 (OneDev internal migration level)
# IMPORTANT: ASCII-only comments (no UTF-8 arrows or dashes)
#
# PREREQUISITE (GitHub mirror): Job secret 'github-push-token' must contain a GitHub PAT
#   with Contents:Read+Write permission scoped to DimitriGeelen/agentic-engineering-framework
version: 37
jobs:
  # =========================================================================
  # GITHUB MIRROR (all branches + tags) - T-292
  # =========================================================================
  - name: Push to GitHub Mirror
    jobExecutor: server-docker
    steps:
      - !PushRepository
        name: Push to GitHub
        remoteUrl: https://github.com/DimitriGeelen/agentic-engineering-framework.git
        userName: DimitriGeelen
        passwordSecret: github-push-token
        force: true
        condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
    triggers:
      - !BranchUpdateTrigger
        branches: '**'
      - !TagCreateTrigger
        tags: '**'
    retryCondition: never
    maxRetries: 3
    retryDelay: 30
    timeout: 300
