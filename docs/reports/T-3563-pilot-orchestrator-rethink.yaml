# T-3563 pilot draft — arc 'orchestrator-rethink'. Drafted 2026-09-29 by an isolated Claude Opus 5 worker (Read/Grep/Glob only) from the arc and its anchor inception. NOT yet applied to .context/arcs/orchestrator-rethink.yaml; pending external review.
purpose: >-
  Re-opened the T-1061 orchestrator substrate after it was declared shipped while nothing
  used it and no routing policy was ever asked.
objective: >-
  The framework's own dispatches pick their model from recorded outcome history during
  ordinary autonomous operation; every routing constant carries a human ruling; and the
  routing, cache and governance contracts are pinned by tests.
supports: []
success_criteria:
  - id: SC-1
    criterion: "A framework dispatch given only --task-type (no --model) resolves its model from route_cache, and the outcome is written back."
    evidence: "docs/reports/orchestrator-rethink-demo/README.md — meta-01-*.json show resolution_source: route_cache; cache-02→cache-03 deltas show write-back"
  - id: SC-2
    criterion: "Each of the 13 silently-defaulted routing-policy constants has an explicit recorded ruling rather than a code-author default."
    evidence: ".tasks/completed/T-1642-arc-a--orchestrator-routing-policy-consu.md §Recommendation — 13-parameter table with proposed defaults for human override"
  - id: SC-3
    criterion: "Drift defenses exist for the routing/governance contracts so a new tool or constant change cannot skip governance silently."
    evidence: ".context/project/concerns.yaml#G-061 closure_criteria and partial_mitigation (MCP task_id audit, frame-0x8 golden, tag lint, route_cache schema, /orchestrator page)"
  - id: SC-4
    criterion: "At least one autonomous workload — not agent-run verification — dispatches through the orchestrator over a sustained period."
    evidence: ".context/project/concerns.yaml#G-064 — status closed 2026-06-10, 481 dispatches / 290 cron firings, escalation-triage live since 2026-05-14"
non_goals:
  - "Cost-aware / cost-weighted model selection — deferred to T-1637, kept horizon:later."
  - "Solving the sub-agent /tmp/ bypass (G-015); T-1645 reframes the claim instead."
  - "Parallel-execution architecture — opened as the sibling arc parallel-execution-aef via T-2303."
  - "Agent-side closure of this arc; the closure verdict is the operator's."
context:
  - point: "T-1061 was called shipped on cargo tests and line-number reads; the user replied that nothing orchestrated and routing rules were never consulted."
    source: ".tasks/completed/T-1641-t-1061-orchestrator-arc-reconsideration-.md#problem-statement"
  - point: "A 10-worker TermLink investigation found the substrate behaviourally real but operationally dormant — zero framework call-sites passed task_type or --model."
    source: "docs/reports/T-1641-orchestrator-arc-reconsideration.md#findings"
  - point: "Thirteen routing-policy parameters — fallback chain, promotion/failure thresholds, cache TTL, confidence, taxonomy — were defaulted by code authors, never asked."
    source: "docs/reports/T-1641-orchestrator-arc-reconsideration.md#findings"
  - point: "The demo proved read path, write path and failure path on the wire, but every cache row came from synthetic verification dispatches."
    source: "docs/reports/orchestrator-rethink-demo/README.md#closure-status"
  - point: "That absence of real consumers was registered as G-064 and later closed once cron-driven escalation triage supplied autonomous dispatch volume."
    source: ".context/project/concerns.yaml#G-064"
  - point: "The same 'shipped before substrate-verified' signature appeared in three arcs in five weeks, making this arc the pattern's test case."
    source: ".context/project/decisions.yaml#D-058"
