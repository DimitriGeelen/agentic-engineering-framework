# T-5189 — sidecar mapping, NOT part of the frozen contracts v2 set (not in MANIFEST.yaml).
# Human-readable twin: validator-refusal-mapping.md. Checked by tests/unit/test_t5189_validator_refusal_mapping.py.
mapping: 'EWCR shared contract 3 (validation/refusal): designer validator codes -> runtime refusal reason_codes'
task: T-5189
relation: 'A validator finding is design-time and is never a refusal record. "prevents" means: the finding flags a defect in the map which, if shipped, would be a cause of that runtime refusal; fixing the
  finding removes that cause.'
sources:
  refusal_schema:
    path: docs/research/executable-workflow/contracts/v2/refusal.schema.json
    sha256: c4148a34b54ed8bf3e3cb7c75b79aba5cb6c0923b9ca28406cb9329d7c9cb857
  validator:
    path: vendor/designer/validate-workflow-0.43.0.py
    version: 0.43.0
    sha256: 08ac44430d1a72625b5a7fb5e443b573fecdf06b2bb9bd03b3ed4e3919eb225e
reason_codes:
  unratified_procedure:
    refuses: instance creation from a procedure no human has ratified
    prevented_by:
    - E-WORKFLOW-KIND
    - E-XML-WORKFLOW-KIND
    runtime_only: false
    why: '§13 #1 (architecture-c9070637.md:911). Only the kind marker is design-time: a map whose kind is invalid or undeclared cannot be told apart from documentation, so the runtime must treat it as not
      a ratifiable procedure. A valid executable map is still unratified until a human ratifies it; that refusal stays runtime-only.'
    inferred: false
  unresolved_reference:
    refuses: a reference that does not resolve (action, profile, node, field, compensation) before dispatch
    prevented_by:
    - E-EDGE-DANGLING
    - E-NODE-LANE
    - E-SCOPEOF-DANGLING
    - E-UID-DUP
    - E-XML-FLOW-DANGLING
    - E-XML-ID-DUP
    - E-XML-IO-PREFIX-UNDECLARED
    - E-XML-LANEREF-DANGLING
    - E-XML-UID-DUP
    - W-XML-GW-DEFAULT-NOT-OWN
    - W-XML-IO-FIELD-UNKNOWN
    - W-XML-IO-MATCH-UNRESOLVED
    runtime_only: false
    why: '§13 #2 (architecture-c9070637.md:912); evidence-and-idempotency.md:164 (compensation on a node that declares none). The validator catches dangling or ambiguous references inside the map and against
      the field catalog. It does not check action or capability-profile references, the main subject of §13 #2; those stay runtime-only.'
    inferred: false
  human_gate_skipped:
    refuses: an actor passing a human gate without an admitted human envelope
    prevented_by:
    - E-AUTHORITY
    - E-INCEPTION-NOT-SOVEREIGN
    - E-META-AUTHORITY
    - E-NODE-LANE
    - E-XML-AUTHORITY
    - E-XML-LANE-AUTHORING-DEFAULT
    - E-XML-META-AUTHORITY
    - E-XML-NODE-UNASSIGNED
    - W-LANE-NO-OWNER
    - W-TYPE-LANE-MISMATCH
    - W-XML-LANE-NO-AUTHORITY
    runtime_only: false
    why: '§13 #3 (architecture-c9070637.md:913); task-lifecycle-contract.md:102. A step with no derivable authority must be treated as gated, so an agent completing it is refused; the authority findings
      remove that cause. An agent deliberately passing a correctly declared gate is runtime-only.'
    inferred: false
  scope_mismatch:
    refuses: work outside the pinned repository/worktree, or a bound task no longer in active/
    prevented_by: []
    runtime_only: true
    why: '§13 #4 (architecture-c9070637.md:914); task-lifecycle-contract.md:35-38; accepted-scenarios.md:47. The map has no repository, worktree or task binding to check.'
    inferred: false
  missing_typed_input:
    refuses: advancement when a declared typed input is absent, whatever the worker claims
    prevented_by:
    - E-XML-IO-EXPECT-CONTRADICTS
    - E-XML-IO-MATCH-MISSING
    - W-IO-INPUT
    - W-XML-IO-FIELD-ENTITY
    - W-XML-IO-INCOMPLETE
    runtime_only: false
    why: '§13 #5 (architecture-c9070637.md:915). W-IO-INPUT finds a required input with no upstream producer; the io findings find inputs that are untyped, sourceless, of another object or unsatisfiable.
      A worker that simply fails to produce a declared output is runtime-only.'
    inferred: false
  unmeasured_component_scope:
    refuses: treating unmeasured component scope as zero impact
    prevented_by: []
    runtime_only: true
    why: '§13 #6 (architecture-c9070637.md:916). The validator has no component-scope model; aef.constituents is composite-node metadata, not a Component Fabric measurement.'
    inferred: false
  duplicate_delivery:
    refuses: a second delivery of an already-consumed attempt or result
    prevented_by: []
    runtime_only: true
    why: '§13 #7 (architecture-c9070637.md:917); evidence-and-idempotency.md:127,152. Delivery is a runtime event; a map cannot contain it.'
    inferred: false
  capability_unsupported:
    refuses: a step the bound provider cannot perform (no silent substitution)
    prevented_by:
    - E-NODE-TYPE
    - E-XML-NODE-TYPE
    runtime_only: false
    why: '§13 #8 (architecture-c9070637.md:918). Only the node-type vocabulary is design-time: an element no executor knows can never be performed. Provider capability itself is resolved at binding time
      and is runtime-only.'
    inferred: false
  direct_state_mutation:
    refuses: state changed outside an admitted envelope (agent edit, Watchtower write, deadline replay)
    prevented_by: []
    runtime_only: true
    why: '§13 #11, #17, #20 (architecture-c9070637.md:921,927,930); refusal-threat-matrix.md ZA-3, ZA-5. A map describes no state writes.'
    inferred: false
  ambiguous_identity:
    refuses: a request carrying only shared host identity
    prevented_by: []
    runtime_only: true
    why: '§13 #12 (architecture-c9070637.md:922). Requester identity exists only at run time.'
    inferred: false
  task_hash_drift:
    refuses: advancement after the bound task changed between gates or during an attempt
    prevented_by: []
    runtime_only: true
    why: '§13 #13 (architecture-c9070637.md:923); accepted-scenarios.md:46 (N-1). The task binding and its hash exist only at run time.'
    inferred: false
  policy_or_capability_drift:
    refuses: an attempt whose policy or capability changed since ratification
    prevented_by: []
    runtime_only: true
    why: '§13 #15 (architecture-c9070637.md:925). Drift is a difference between two runtime moments; one map has no second moment.'
    inferred: false
  bypass_input:
    refuses: an env flag or --force-equivalent presented to cross the runner boundary
    prevented_by: []
    runtime_only: true
    why: '§13 #16 (architecture-c9070637.md:926); task-lifecycle-contract.md:106. Inputs are presented at run time.'
    inferred: false
  cancellation_in_effect:
    refuses: advancement after the instance or bound task was cancelled
    prevented_by: []
    runtime_only: true
    why: '§13 #18 (architecture-c9070637.md:928); accepted-scenarios.md:45 (N-1). Cancellation is a runtime event.'
    inferred: false
  stale_position:
    refuses: a proposal made against a ledger position that is no longer the head (the loser of a race)
    prevented_by: []
    runtime_only: true
    why: '§13 #19 (architecture-c9070637.md:929); evidence-and-idempotency.md:95,144. A ledger race (a non-head position, or two payloads for one attempt). Two actors can produce it on a fully conditioned
      gateway too, so no design-time finding prevents it (832 review, msg afe9ff0c, T-5191).'
    inferred: false
  command_substitution:
    refuses: an action that escapes its registered argv to a shell string
    prevented_by: []
    runtime_only: true
    why: '§13 #4, #16 (architecture-c9070637.md:914,926); refusal-threat-matrix.md CL-6, MS-5. The validator does not read script contracts or arguments.'
    inferred: false
  deadline_expired:
    refuses: advancement after a recorded deadline passed
    prevented_by: []
    runtime_only: true
    why: '§13 #17 (architecture-c9070637.md:927). Deadlines are ledgered runtime events; the map declares none the validator checks.'
    inferred: false
  privilege_exceeds_profile:
    refuses: a resolved secret binding that can do more than the node's capability profile allows
    prevented_by: []
    runtime_only: true
    why: N-2 (accepted-scenarios.md:86). Bindings resolve at run time; the validator reads no capability profile or binding.
    inferred: false
