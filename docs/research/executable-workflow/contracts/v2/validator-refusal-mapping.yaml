  W-TYPE-LANE-MISMATCH:
    rule: the node type implies a performer the lane's authority contradicts (lane wins)
    prevents:
    - human_gate_skipped
    design_only: false
    inferred: false
    note: 'The lane wins and the type is presentational (O-1). Prevented direction: a serviceTask/scriptTask in a human lane, where the runtime holds a gate the type hides, so an agent completing it is refused
      human_gate_skipped. The other direction (a userTask in an agent lane) leaves no gate to hold, so nothing is refused: that half is design-only, the author''s intended gate is silently absent. A plain
      task has no implied performer and never fires this (832 review, msg afe9ff0c, T-5191).'
