# Framework repository persistent config.
#
# The framework repo normally runs on FW_* env vars + hardcoded defaults (it is
# the framework, not an `fw init`'d consumer — bin/fw self-detects it via
# FRAMEWORK.md + agents/ before any .framework.yaml read, so this file does NOT
# affect framework-path resolution). This file holds the few settings that must
# persist across sessions for THIS repo and are NOT vendored to consumers.
#
# PROTECT_MASTER (T-2396, inception T-2394 G1): arm the master-as-merge-only
# pre-commit guard (agents/git/lib/master-guard.sh). Key is UPPERCASE — that is
# the fw_config file convention (callers pass uppercase, fw_config greps the key
# verbatim; a lowercase key here would never be read → guard silently OFF).
# Consumers stay off by default (no PROTECT_MASTER in their .framework.yaml = 0).
# Inert until the guard is also deployed via `fw git install-hooks`.
PROTECT_MASTER: 1
# project_name (T-3067) — LOWERCASE ON PURPOSE. Every other key here is uppercase
# because fw_config greps the key verbatim (see header). This one is not read by
# fw_config at all: `termlink agent post|reply` resolve the poster's project from
# `.framework.yaml::project_name`, lowercase, and finding nothing they post to
# agent-chat-arc with no `from_project` — which is why AEF was absent from
# `agent stats` project grouping while co-resident projects were not. Do not
# "correct" the case to match its neighbours; that silently un-attributes this
# project again, and the symptom is an absence, which nothing prompts you to look
# for.
project_name: 999-Agentic-Engineering-Framework
INCEPTION_COMMIT_LIMIT: 15
NTFY_URL: https://ntfy-ring20.docker.ring20.geelenandcompany.com
RAIL_IDENTITY_FILE: .context/rail-identity.key
